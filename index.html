<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>HCMA2 - TEACHING</title>
<meta name="description" content="Nền tảng hỗ trợ giảng dạy và tương tác với học viên theo thời gian thực." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23155e75%22/><text x=%2250%22 y=%2266%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22>H</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
/* ============================================================
   HCMA2 - TEACHING — Stylesheet
   ============================================================ */
:root{
  --brand:#155e75; --brand-dark:#0e4a5c; --brand-light:#e8f4f7;
  --accent:#0891b2; --ok:#16a34a; --warn:#ca8a04; --danger:#dc2626;
  --bg:#f6f8f9; --card:#ffffff; --text:#1f2937; --text-mute:#6b7280;
  --border:#e5e7eb; --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; line-height:1.5; font-size:15px;
}
#app{min-height:100vh;}
h1,h2,h3,h4{margin:0 0 8px; font-weight:700; line-height:1.3;}
p{margin:0 0 10px;}
a{color:var(--accent);}
button, input, select, textarea{font-family:inherit; font-size:inherit;}
.hidden{display:none !important;}
.container{max-width:1180px; margin:0 auto; padding:0 16px;}
.narrow{max-width:480px;}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 18px; border-radius:10px; border:1px solid transparent;
  background:var(--brand); color:#fff; font-weight:600; cursor:pointer;
  min-height:44px; transition:filter .15s, transform .05s; text-decoration:none;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-sm{padding:7px 12px; min-height:34px; font-size:13px; border-radius:8px;}
.btn-lg{padding:15px 26px; font-size:16px; min-height:52px; border-radius:12px;}
.btn-outline{background:#fff; color:var(--brand); border-color:var(--brand);}
.btn-ghost{background:transparent; color:var(--text); border-color:var(--border);}
.btn-danger{background:var(--danger);}
.btn-warn{background:var(--warn);}
.btn-ok{background:var(--ok);}
.btn-block{width:100%;}
.btn-icon{padding:8px; min-width:40px;}
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:3px solid #93c5fd; outline-offset:2px;
}

/* Cards / layout */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px;}
.card + .card{margin-top:14px;}
.grid{display:grid; gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

/* Forms */
label{display:block; font-weight:600; font-size:13px; margin-bottom:5px; color:#374151;}
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date],
select, textarea{
  width:100%; padding:11px 12px; border:1.5px solid var(--border); border-radius:9px;
  background:#fff; color:var(--text); min-height:44px;
}
textarea{min-height:88px; resize:vertical;}
.field{margin-bottom:14px;}
.hint{font-size:12.5px; color:var(--text-mute); margin-top:4px;}
.error-text{font-size:13px; color:var(--danger); margin-top:6px;}

/* Topbar */
.topbar{
  background:var(--brand); color:#fff; padding:0 16px; height:60px;
  display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:40;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.topbar .brand{font-weight:800; font-size:17px; letter-spacing:.3px; display:flex; align-items:center; gap:8px;}
.topbar .brand small{font-weight:500; opacity:.85; font-size:11px;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.topbar select, .topbar .who{color:#fff;}
.who{font-size:13px; opacity:.9;}
.hamburger{display:none; background:transparent; border:none; color:#fff; font-size:22px; cursor:pointer;}

/* Shell with sidebar */
.shell{display:flex; min-height:calc(100vh - 60px);}
.sidebar{
  width:230px; background:#fff; border-right:1px solid var(--border); padding:14px 10px; flex-shrink:0;
}
.sidebar button.navlink{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none;
  padding:11px 12px; border-radius:9px; cursor:pointer; color:var(--text); font-weight:600; font-size:14px; margin-bottom:2px;
}
.sidebar button.navlink:hover{background:var(--brand-light);}
.sidebar button.navlink.active{background:var(--brand); color:#fff;}
.main{flex:1; padding:20px; min-width:0;}
@media(max-width:820px){
  .sidebar{position:fixed; left:-250px; top:60px; bottom:0; z-index:50; transition:left .2s; box-shadow:2px 0 10px rgba(0,0,0,.15); overflow:auto;}
  .sidebar.open{left:0;}
  .hamburger{display:block;}
  .main{padding:14px;}
}

/* Tables */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th,td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:middle;}
th{color:var(--text-mute); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.4px;}
tr:hover td{background:#fafbfc;}
.table-wrap{overflow-x:auto;}

/* Badges */
.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700;}
.badge-green{background:#dcfce7; color:#166534;}
.badge-yellow{background:#fef9c3; color:#854d0e;}
.badge-red{background:#fee2e2; color:#991b1b;}
.badge-gray{background:#f1f5f9; color:#475569;}
.badge-blue{background:#dbeafe; color:#1e40af;}

/* Stat tiles */
.stat{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
.stat .num{font-size:30px; font-weight:800; color:var(--brand);}
.stat .lbl{font-size:13px; color:var(--text-mute); font-weight:600; margin-top:2px;}

/* Toast */
#toast-root{position:fixed; top:16px; right:16px; z-index:999; display:flex; flex-direction:column; gap:8px; max-width:340px;}
.toast{background:#1f2937; color:#fff; padding:12px 16px; border-radius:10px; box-shadow:0 6px 16px rgba(0,0,0,.25); font-size:13.5px; animation:slidein .18s ease-out;}
.toast.ok{background:#166534;} .toast.err{background:#991b1b;} .toast.warn{background:#92400e;}
@keyframes slidein{from{transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;}}

/* Loading */
.spinner{width:22px; height:22px; border:3px solid rgba(0,0,0,.12); border-top-color:var(--brand); border-radius:50%; animation:spin .7s linear infinite; display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.center-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:24px; text-align:center;}

/* Auth screens */
.auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,var(--brand),#0891b2); padding:20px;}
.auth-card{background:#fff; border-radius:16px; width:100%; max-width:420px; padding:32px 28px; box-shadow:0 20px 50px rgba(0,0,0,.25);}
.auth-logo{text-align:center; margin-bottom:18px;}
.auth-logo .t1{font-size:22px; font-weight:800; color:var(--brand);}
.auth-logo .t2{font-size:12px; color:var(--text-mute); letter-spacing:1px; text-transform:uppercase;}
.tabbar{display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:18px;}
.tabbar button{flex:1; padding:10px; border:none; background:#f8fafc; cursor:pointer; font-weight:700; color:var(--text-mute);}
.tabbar button.active{background:var(--brand); color:#fff;}

/* Wizard */
.wizard-steps{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px;}
.wizard-steps .step{padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700; background:#f1f5f9; color:var(--text-mute);}
.wizard-steps .step.active{background:var(--brand); color:#fff;}
.wizard-steps .step.done{background:var(--ok); color:#fff;}
.wizard-nav{display:flex; justify-content:space-between; margin-top:20px; gap:10px;}
.option-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.option-row input[type=text]{flex:1;}
.type-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.type-card{border:2px solid var(--border); border-radius:12px; padding:14px; cursor:pointer; text-align:center;}
.type-card:hover{border-color:var(--accent);}
.type-card.active{border-color:var(--brand); background:var(--brand-light);}
.type-card .ic{font-size:26px; margin-bottom:6px;}
.type-card .nm{font-weight:700; font-size:13px;}
.library-source-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.library-picker-toolbar{display:grid;grid-template-columns:1fr 180px 190px;gap:10px;margin:12px 0;}
.library-picker-list{display:grid;gap:10px;max-height:52vh;overflow:auto;padding-right:4px;}
.library-picker-item{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1.5px solid var(--border);border-radius:12px;padding:12px;background:#fff;}
.library-picker-item:hover{border-color:#94a3b8;}
.library-picker-item input{width:20px;height:20px;margin-top:3px;}
.library-picker-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px;}
.library-picker-question{font-weight:700;line-height:1.4;}
.library-save-row{border:1px dashed #cbd5e1;border-radius:10px;padding:10px 12px;background:#f8fafc;}
@media(max-width:700px){.library-picker-toolbar{grid-template-columns:1fr;}}


/* Live control */
.live-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
@media(max-width:900px){.live-grid{grid-template-columns:1fr;}}
.qcount{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0;}
.qcount button{border:1.5px solid var(--border); background:#fff; border-radius:8px; padding:6px 10px; cursor:pointer; font-weight:700; font-size:12.5px;}
.qcount button.active{background:var(--brand); color:#fff; border-color:var(--brand);}
.qcount button.answered::after{content:" ✓";}

/* Student view */
.student-shell{min-height:100vh; background:var(--brand); display:flex; flex-direction:column;}
.student-top{color:#fff; text-align:center; padding:18px 16px 8px;}
.student-top .logo{font-weight:800; font-size:15px; letter-spacing:1px;}
.student-card{background:#fff; border-radius:20px 20px 0 0; flex:1; padding:22px 18px 40px; margin-top:10px;}
.opt-btn{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:15px 16px; margin-bottom:10px;
  border:2px solid var(--border); border-radius:12px; background:#fff; cursor:pointer; font-size:15px; font-weight:600;
}
.opt-btn .mark{width:22px; height:22px; border-radius:50%; border:2px solid #cbd5e1; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;}
.opt-btn.selected{border-color:var(--brand); background:var(--brand-light);}
.opt-btn.selected .mark{background:var(--brand); border-color:var(--brand);}
.opt-btn.correct{border-color:var(--ok); background:#f0fdf4;}
.opt-btn.wrong{border-color:var(--danger); background:#fef2f2;}
.timer-pill{display:inline-flex; align-items:center; gap:6px; background:#fff2; color:#fff; border-radius:999px; padding:6px 14px; font-weight:700; font-size:13px;}

/* Presentation */
.pres-shell{background:#0b2530; color:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center;}
.pres-shell .qtext{font-size:clamp(22px,4vw,40px); font-weight:800; max-width:1000px; margin-bottom:20px;}
.pres-shell .meta{opacity:.75; margin-bottom:26px; font-size:15px;}
.pres-grid{display:flex; gap:40px; align-items:center; flex-wrap:wrap; justify-content:center;}
.pres-chart-wrap{width:min(760px,90vw); background:#fff; border-radius:16px; padding:20px;}
.pres-qr-wrap{background:#fff; border-radius:16px; padding:18px; text-align:center;}
.pres-qr-wrap.clickable{cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;}
.pres-qr-wrap.clickable:hover{transform:translateY(-2px); box-shadow:0 10px 28px rgba(0,0,0,.2);}
.pres-qr-wrap.clickable:focus-visible{outline:3px solid #93c5fd; outline-offset:4px;}
.pres-qr-hint{font-size:12px; color:#64748b; margin-top:8px; font-weight:700;}
.pres-qr-popup{
  position:fixed; inset:0; z-index:9999; background:rgba(2,12,18,.88);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.pres-qr-popup-card{
  width:min(92vw,760px); background:#fff; border-radius:24px; padding:28px;
  text-align:center; box-shadow:0 24px 70px rgba(0,0,0,.45); position:relative;
}
.pres-qr-popup-close{
  position:absolute; top:14px; right:14px; width:48px; height:48px; border-radius:50%;
  border:none; background:#0f172a; color:#fff; font-size:26px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.pres-qr-popup-close:focus-visible{outline:3px solid #93c5fd; outline-offset:3px;}
.pres-qr-popup-title{font-size:clamp(22px,3vw,34px); font-weight:800; color:#0f172a; margin:4px 54px 10px;}
.pres-qr-popup-sub{font-size:16px; color:#475569; margin-bottom:18px;}
#presQrBig{display:flex; justify-content:center; align-items:center;}
#presQrBig img,#presQrBig canvas{width:min(68vw,560px)!important; height:min(68vw,560px)!important; max-width:560px; max-height:560px;}
.pres-qr-popup-code{font-size:clamp(24px,4vw,40px); font-weight:900; color:#0f172a; letter-spacing:2px; margin-top:14px;}
.pres-open-wall{
  width:min(980px,78vw); display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px; align-content:start;
}
.pres-open-card{
  background:#fff; color:#0f172a; border-radius:14px; padding:16px 18px;
  text-align:left; font-size:clamp(16px,1.5vw,22px); line-height:1.45;
  box-shadow:0 4px 14px rgba(0,0,0,.12); overflow-wrap:anywhere;
}
.pres-open-card .num{font-size:12px;color:#64748b;font-weight:800;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.pres-open-empty{
  width:min(820px,76vw); padding:30px; border:1px dashed rgba(255,255,255,.35);
  border-radius:16px; color:rgba(255,255,255,.75); font-size:20px;
}
@media(max-width:900px){
  .pres-open-wall{grid-template-columns:1fr;width:min(760px,88vw);}
}
.report-contact-print{display:none;}

@media(max-width:600px){
  .pres-qr-popup{padding:12px;}
  .pres-qr-popup-card{padding:22px 14px 18px;}
  .pres-qr-popup-close{top:8px;right:8px;width:44px;height:44px;}
  #presQrBig img,#presQrBig canvas{width:min(82vw,440px)!important;height:min(82vw,440px)!important;}
}


/* Misc */
.flex{display:flex; align-items:center;}
.flex-between{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.gap-8{gap:8px;} .gap-12{gap:12px;}
.mt-8{margin-top:8px;} .mt-14{margin-top:14px;} .mt-20{margin-top:20px;}
.mut{color:var(--text-mute);}
.small{font-size:12.5px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.chip{display:inline-block; padding:4px 10px; border-radius:999px; background:#f1f5f9; font-size:12px; font-weight:700; margin-right:6px;}
.empty-state{text-align:center; padding:50px 20px; color:var(--text-mute);}
.empty-state .ic{font-size:40px; margin-bottom:10px;}
.modal-backdrop{position:fixed; inset:0; background:rgba(15,23,32,.55); display:flex; align-items:center; justify-content:center; z-index:200; padding:16px;}
.modal{background:#fff; border-radius:16px; padding:24px; max-width:520px; width:100%; max-height:90vh; overflow:auto;}
.modal-lg{max-width:820px;}
/* Charts / reports */
.chart-box{position:relative; width:100%; height:320px; min-height:240px;}
.chart-box.chart-box-sm{height:240px;}
.chart-box.chart-box-lg{height:380px;}
.chart-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.chart-summary .metric{background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:12.5px;}
.chart-summary .metric b{color:var(--brand);}
.report-question{break-inside:avoid;page-break-inside:avoid;}
.report-chart-wrap{position:relative;width:100%;height:300px;margin-top:10px;}
.report-open-answer{padding:9px 12px;margin:6px 0;border:1px solid var(--border);border-radius:9px;background:#fafbfc;}
@media(max-width:600px){
  .chart-box,.chart-box-lg{height:280px;}
  .report-chart-wrap{height:260px;}
}
@media print{
  @page{size:A4 portrait;margin:12mm;}
  .no-print,.topbar,.sidebar{display:none !important;}
  html,body{background:#fff !important;font-size:11pt;}
  .shell{display:block !important;min-height:0 !important;}
  .main{padding:0 !important;}
  .card{box-shadow:none !important;border:1px solid #d1d5db !important;border-radius:8px !important;padding:12px !important;margin:0 0 10px !important;}
  .report-question{break-inside:avoid !important;page-break-inside:avoid !important;}
  .report-chart-wrap{height:245px !important;max-height:245px !important;}
  .report-chart-wrap canvas{width:100% !important;height:245px !important;max-height:245px !important;}
  .chart-summary{margin-top:6px !important;}
  .chart-summary .metric{padding:4px 7px !important;font-size:9.5pt !important;}
  .report-open-answer{padding:6px 8px !important;margin:4px 0 !important;}
}

/* Footer liên hệ / góp ý */
.site-footer{
  border-top:1px solid var(--border); background:#fff; color:var(--text-mute);
  padding:16px; text-align:center; font-size:13px; line-height:1.55;
}
.site-footer-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;}
.site-footer .zalo-contact{display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--brand); font-weight:700;}
.site-footer .zalo-contact img{width:42px; height:42px; object-fit:contain; border-radius:10px; display:block; cursor:pointer;}
.site-footer .contact-email{color:var(--brand); font-weight:700; text-decoration:none;}
.site-footer a:hover{text-decoration:underline;}
@media(max-width:600px){
  .site-footer{padding:14px 12px; font-size:12.5px;}
  .site-footer-inner{gap:7px;}
  .site-footer .zalo-contact{width:100%; justify-content:center; flex-wrap:wrap;}
}
@media print{
  .site-footer{display:none !important;}
  .report-contact-print{
    display:flex !important; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
    border-top:1px solid #d1d5db; margin-top:8px; padding-top:7px; font-size:9.5pt; color:#4b5563;
    break-inside:avoid; page-break-inside:avoid;
  }
  .report-contact-print a{color:#155e75;text-decoration:none;font-weight:700;}
}


/* ---------------- QR VĨNH VIỄN MODULE ---------------- */
.qr-manager-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.qr-create-grid{display:grid;grid-template-columns:1fr 220px;gap:12px}
.qr-list{display:grid;gap:12px;margin-top:14px}
.qr-item{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:start;border:1px solid var(--border);border-radius:14px;padding:14px;background:#fff}
.qr-thumb{background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px;cursor:pointer;width:86px;height:86px}
.qr-thumb img{width:72px;height:72px;display:block}
.qr-code{font-weight:800;color:var(--brand);letter-spacing:.03em}
.qr-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.qr-target{word-break:break-all;font-size:13px;background:#f8fafc;border:1px solid var(--border);padding:8px 10px;border-radius:8px}
.qr-edit-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.qr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qr-owner{font-size:12px;color:var(--muted)}
.qr-result{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}
.qr-result img{width:160px;height:160px;background:#fff;border-radius:10px;padding:8px;border:1px solid var(--border);cursor:pointer}
#qrBigOverlay{position:fixed;inset:0;background:rgba(2,6,23,.92);z-index:9999;display:none;align-items:center;justify-content:center;padding:24px}
#qrBigOverlay.show{display:flex}
#qrBigOverlay .qr-big-box{text-align:center;color:#fff;max-width:760px}
#qrBigOverlay img{width:min(72vw,620px);height:min(72vw,620px);background:#fff;padding:18px;border-radius:18px}
#qrBigOverlay .qr-big-link{margin-top:12px;word-break:break-all;font-size:13px;color:#e2e8f0}
@media(max-width:700px){.qr-create-grid{grid-template-columns:1fr}.qr-item{grid-template-columns:1fr}.qr-thumb{width:86px}.qr-result{grid-template-columns:1fr}.qr-edit-row{grid-template-columns:1fr}}


/* ================= THẢO LUẬN NHÓM ================= */
.group-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.group-live-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:16px}
.group-panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;min-height:170px;box-shadow:0 3px 12px #0000000a}
.group-panel h4{margin:0 0 4px;font-size:16px}
.group-topic{font-size:13px;color:var(--primary);font-weight:700;margin-bottom:8px}
.group-note{background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:9px 10px;margin:7px 0;white-space:pre-wrap;word-break:break-word}
.group-media{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.group-media img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #e2e8f0;cursor:pointer}
.group-file{display:block;padding:7px 9px;border-radius:8px;background:#f8fafc;border:1px solid #e2e8f0;margin-top:6px;word-break:break-all}
.group-qr-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;display:inline-block;text-align:center}
.group-qr-box img{width:170px;height:170px;display:block;cursor:pointer}
.group-timer{font-size:38px;font-weight:900;letter-spacing:1px}
.group-timer.done{color:#dc2626}
.group-student-wrap{max-width:760px;margin:0 auto;padding:24px 16px}
.group-student-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-top:14px}
.group-upload-preview{max-width:220px;max-height:160px;border-radius:8px;margin-top:8px}
.group-admin-owner{font-size:12px;color:#64748b}
@media(max-width:700px){.group-live-grid{grid-template-columns:1fr}.group-timer{font-size:30px}}
.group-panel{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.group-panel:hover{transform:translateY(-2px);box-shadow:0 8px 24px #00000018}
.group-panel::after{content:"Bấm để phóng to";display:block;text-align:right;font-size:10px;color:#94a3b8;margin-top:8px}
.group-panel-popup{position:fixed;inset:0;background:rgba(2,6,23,.96);z-index:10020;display:flex;align-items:center;justify-content:center;padding:28px}
.group-panel-popup.hidden{display:none!important}
.group-panel-popup-inner{width:min(1100px,94vw);max-height:88vh;overflow:auto;background:#fff;border-radius:18px;padding:30px;box-shadow:0 30px 80px #0008}
.group-panel-popup-inner h2{font-size:34px;margin:0 0 6px}
.group-panel-popup-inner .group-topic{font-size:19px;margin-bottom:18px}
.group-panel-popup-inner .group-note{font-size:22px;line-height:1.55;padding:15px 17px;margin:11px 0}
.group-panel-popup-inner .group-media img{width:150px;height:150px}
.group-panel-popup-inner .group-file{font-size:18px;padding:11px 13px}
.group-popup-close{position:fixed;right:26px;bottom:24px;z-index:10021}
.group-timer-float{position:fixed;top:14px;right:16px;z-index:10010;background:#0f2942;color:#fff;border:2px solid #d9a441;border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 8px 24px #0005;text-align:center;min-width:118px}
.group-timer-float .lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.78;margin-bottom:2px}
.group-timer-float .clock{font-size:28px;font-weight:900;letter-spacing:1px;line-height:1}
.group-timer-float.done{border-color:#ef4444}
.group-timer-float.done .clock{color:#fecaca}
.group-timer-popup{position:fixed;inset:0;background:#081526;z-index:10030;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
.group-timer-popup.hidden{display:none!important}
.group-timer-popup .big-clock{font-size:min(28vw,230px);font-weight:900;letter-spacing:5px;line-height:1}
.group-timer-popup .big-label{font-size:min(6vw,46px);font-weight:800;margin-top:15px;color:#fbbf24}
.group-timer-popup.done .big-clock,.group-timer-popup.done .big-label{color:#ef4444}
.group-timer-popup .close-timer{position:absolute;bottom:28px;right:28px}
@media(max-width:700px){
  .group-timer-float{top:10px;right:10px;min-width:100px;padding:7px 10px}
  .group-timer-float .clock{font-size:23px}
  .group-panel-popup{padding:14px}
  .group-panel-popup-inner{padding:20px}
  .group-panel-popup-inner h2{font-size:28px}
  .group-panel-popup-inner .group-note{font-size:18px}
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(ts){
  try{
    const d = ts && ts.toDate ? ts.toDate() : (ts instanceof Date ? ts : (ts ? new Date(ts) : null));
    if(!d) return "—";
    return d.toLocaleString("vi-VN", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
  }catch(e){ return "—"; }
}
function fmtDateShort(ts){
  try{
    const d = ts && ts.toDate ? ts.toDate() : (ts instanceof Date ? ts : (ts?new Date(ts):null));
    if(!d) return "—";
    return d.toLocaleDateString("vi-VN");
  }catch(e){ return "—"; }
}
function genToken(len){
  len = len || 28;
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  let out = "";
  for(let i=0;i<len;i++) out += chars[arr[i] % chars.length];
  return out;
}
function genShortCode(){
  const L = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const N = "0123456789";
  let code = "";
  for(let i=0;i<3;i++) code += L[Math.floor(Math.random()*L.length)];
  code += "-";
  for(let i=0;i<3;i++) code += N[Math.floor(Math.random()*N.length)];
  return code;
}
function toast(msg, type){
  const root = document.getElementById("toast-root");
  const t = document.createElement("div");
  t.className = "toast " + (type||"");
  t.textContent = msg;
  root.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),300); }, 3800);
}
function debounce(fn, ms){ let h; return (...a)=>{ clearTimeout(h); h=setTimeout(()=>fn(...a), ms); }; }

/* Bẫy lỗi Firebase → thông báo tiếng Việt dễ hiểu */
function mapError(err){
  const code = (err && (err.code||"")) + "";
  const map = {
    "auth/invalid-email":"Địa chỉ email không hợp lệ.",
    "auth/user-disabled":"Tài khoản đã bị vô hiệu hóa.",
    "auth/user-not-found":"Email hoặc mật khẩu không đúng.",
    "auth/wrong-password":"Email hoặc mật khẩu không đúng.",
    "auth/invalid-credential":"Email hoặc mật khẩu không đúng.",
    "auth/invalid-login-credentials":"Email hoặc mật khẩu không đúng.",
    "auth/email-already-in-use":"Email này đã được đăng ký. Vui lòng đăng nhập.",
    "auth/weak-password":"Mật khẩu quá yếu. Vui lòng dùng ít nhất 6 ký tự.",
    "auth/too-many-requests":"Bạn đã thử quá nhiều lần. Vui lòng thử lại sau ít phút.",
    "auth/network-request-failed":"Mất kết nối mạng. Vui lòng kiểm tra Internet và thử lại.",
    "auth/popup-closed-by-user":"Cửa sổ đăng nhập đã bị đóng.",
    "auth/operation-not-allowed":"Phương thức đăng nhập chưa được bật trong Firebase.",
    "permission-denied":"Bạn không có quyền thực hiện thao tác này.",
    "unavailable":"Không thể kết nối máy chủ. Đang thử kết nối lại…",
    "deadline-exceeded":"Kết nối quá chậm. Vui lòng thử lại.",
    "not-found":"Không tìm thấy dữ liệu yêu cầu.",
    "already-exists":"Dữ liệu đã tồn tại.",
    "resource-exhausted":"Hệ thống đang quá tải. Vui lòng thử lại sau."
  };
  if(map[code]) return map[code];
  if(!navigator.onLine) return "Mất kết nối mạng. Đang thử kết nối lại…";
  return "Đã xảy ra lỗi. Vui lòng thử lại. (" + (code || "unknown") + ")";
}

};
function clearListeners(){ STATE.listeners.forEach(u=>{ try{u();}catch(e){} }); STATE.listeners = []; }
function track(unsub){ STATE.listeners.push(unsub); return unsub; }

/* ---------------- FIX 10: theo dõi trạng thái tài khoản (users/{uid}) theo thời gian thực ---------------- */
// Đây là một listener ĐỘC LẬP với clearListeners()/STATE.listeners ở trên (vốn bị dọn dẹp
// mỗi khi đổi route/tab điều hướng) — nó phải tồn tại xuyên suốt cả phiên làm việc của
// Giảng viên/Admin để phát hiện ngay khi Admin khóa (suspended) tài khoản đang mở Dashboard,
// thay vì chỉ kiểm tra một lần lúc đăng nhập.
let __profileUnsub = null;
function startProfileWatch(uid){
  stopProfileWatch();
  __profileUnsub = onSnapshot(doc(db,"users",uid), (snap)=>{
    if(!snap.exists()) return; // lỗi mạng thoáng qua hoặc tài khoản đang được tạo — giữ nguyên UI
    const prevStatus = STATE.profile ? STATE.profile.status : null;
    const newProfile = snap.data();
    STATE.profile = newProfile;
    if(prevStatus === "active" && newProfile.status !== "active"){
      // Admin vừa đổi trạng thái (suspended/pending/khác) trong khi Dashboard đang mở:
      // dừng NGAY các listener nghiệp vụ khác (lớp/phiên/câu hỏi/phản hồi...) vì từ giờ
      // Firestore Rules sẽ từ chối chúng, rồi khóa màn hình lập tức.
      clearListeners();
      renderInternalApp();
      toast("Tài khoản của bạn vừa bị quản trị viên thay đổi trạng thái.", "warn");
    }
  }, (err)=>{ /* best-effort — bỏ qua lỗi tạm thời, không làm gián đoạn phiên làm việc */ });
}
function stopProfileWatch(){ if(__profileUnsub){ try{ __profileUnsub(); }catch(e){} __profileUnsub = null; } }

/* ---------------- Router ---------------- */
// Bên ngoài (không cần đăng nhập): ?mode=student  ?mode=presentation  ?join=TOKEN
// Bên trong (teacher/admin, sau đăng nhập): dùng hash routing, ví dụ #/classes #/sessions/xxx/live
function getQueryParams(){ return new URLSearchParams(window.location.search); }
function getMode(){
  const q = getQueryParams();
  if(q.has("r")) return "qrRedirect";
  if(q.has("group")) return "groupStudent";
  if(q.has("join")) return "student";
  return q.get("mode");
}
function navigateHash(hash){ window.location.hash = hash; }
window.addEventListener("hashchange", ()=>{
  if(!STATE.profile) return;
  clearListeners();
  if(STATE.profile.role==="admin") adminRoute(STATE.adminNav);
  else if(STATE.profile.role==="teacher") teacherRoute();
});

function openModal(html, large){
  let host = document.getElementById("globalModal");
  if(!host){ host = document.createElement("div"); host.id="globalModal"; document.body.appendChild(host); }
  host.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal ${large?'modal-lg':''}">${html}</div></div>`;
  $("#modalBackdrop").addEventListener("click", (e)=>{ if(e.target.id==="modalBackdrop") closeModal(); });
  return host;
}
function closeModal(){ const h = document.getElementById("globalModal"); if(h) h.innerHTML=""; }

/* ---------------- Khởi động ---------------- */
function boot(){
  const mode = getMode();
  if(mode === "qrRedirect"){
    clearListeners();
    renderQrRedirect();
    return;
  }
  if(mode === "groupStudent"){
    clearListeners();
    renderGroupStudentEntry();
    return;
  }
  if(mode === "student"){
    clearListeners();
    renderStudentEntry();
    return;
  }
  if(mode === "presentation"){
    clearListeners();
    renderPresentationEntry();
    return;
  }
  // Mặc định: màn hình đăng nhập giảng viên/admin
  onAuthStateChanged(auth, async (user) => {
    STATE.authReady = true;
    // Khi đang trong luồng đăng ký thủ công (authFlowLock), luồng đó tự chịu
    // trách nhiệm render để tránh việc onAuthStateChanged "chen ngang" xóa mất
    // form đang thao tác giữa chừng (race condition giữa tạo tài khoản Auth và
    // ghi hồ sơ Firestore users/{uid}).
    if(authFlowLock) return;
    if(!user){ stopProfileWatch(); STATE.user = null; STATE.profile = null; renderAuthScreen(); return; }
    if(user.isAnonymous){
      // Người dùng ẩn danh không thuộc luồng teacher/admin — quay lại màn hình đăng nhập.
      stopProfileWatch(); STATE.user = null; STATE.profile = null; renderAuthScreen(); return;
    }
    await loadProfileAndRenderForUser(user);
  });
}
let authFlowLock = false;
async function loadProfileAndRenderForUser(user){
  STATE.user = user;
  try{
    const snap = await getDoc(doc(db,"users",user.uid));
    STATE.profile = snap.exists() ? snap.data() : null;
  }catch(e){
    toast(mapError(e), "err");
    STATE.profile = null;
  }
  if(!STATE.profile){ stopProfileWatch(); renderNeedsProfileScreen(); return; }
  // cập nhật lastLoginAt (best-effort, không chặn UI)
  updateDoc(doc(db,"users",user.uid), { lastLoginAt: serverTimestamp(), updatedAt: serverTimestamp() }).catch(()=>{});
  // FIX 10: bắt đầu theo dõi trạng thái tài khoản theo thời gian thực, xuyên suốt phiên làm việc.
  startProfileWatch(user.uid);
  renderInternalApp();
}

function renderRegisterForm(){
  $("#authFormWrap").innerHTML = `
    <form id="regForm">
      <div class="field"><label>Họ và tên</label><input type="text" id="regName" required></div>
      <div class="field"><label>Email</label><input type="email" id="regEmail" required autocomplete="username"></div>
      <div class="field"><label>Mật khẩu (tối thiểu 6 ký tự)</label><input type="password" id="regPass" required minlength="6" autocomplete="new-password"></div>
      <div id="regErr" class="error-text hidden"></div>
      <button type="submit" class="btn btn-block btn-lg" id="regBtn">Đăng ký tài khoản giảng viên</button>
      <p class="hint" style="text-align:center;margin-top:10px;">Tài khoản sẽ ở trạng thái <b>chờ cấp phép</b> cho đến khi quản trị viên duyệt.</p>
    </form>`;
  $("#regForm").onsubmit = async (e)=>{
    e.preventDefault();
    const btn = $("#regBtn"); btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> Đang tạo tài khoản…';
    $("#regErr").classList.add("hidden");
    // Đọc toàn bộ giá trị form NGAY TỪ ĐẦU (trước khi có bất kỳ await nào),
    // vì DOM có thể bị vẽ lại giữa chừng nếu onAuthStateChanged kích hoạt.
    const name = $("#regName").value.trim();
    const email = $("#regEmail").value.trim();
    const pass = $("#regPass").value;
    authFlowLock = true; // tạm khóa render tự động từ onAuthStateChanged
    try{
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      await setDoc(doc(db,"users",cred.user.uid), {
        uid: cred.user.uid, email: cred.user.email, displayName: name,
        role: "teacher", status: "pending",
        createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
        approvedAt: null, approvedBy: null, lastLoginAt: serverTimestamp()
      });
      toast("Đăng ký thành công! Vui lòng chờ quản trị viên cấp phép.","ok");
      authFlowLock = false;
      await loadProfileAndRenderForUser(cred.user);
    }catch(err){
      authFlowLock = false;
      if(auth.currentUser){ await loadProfileAndRenderForUser(auth.currentUser); return; }
      if($("#regErr")){ $("#regErr").textContent = mapError(err); $("#regErr").classList.remove("hidden"); }
      if($("#regBtn")){ $("#regBtn").disabled=false; $("#regBtn").textContent = "Đăng ký tài khoản giảng viên"; }
    }
  };
}

/* ---------------- Sau khi có profile: điều hướng theo role/status ---------------- */
function renderInternalApp(){
  const p = STATE.profile;
  if(!p) return renderNeedsProfileScreen();
  if(p.status === "pending"){
    appRoot().innerHTML = pendingSuspendedScreen("⏳","Tài khoản của bạn đang chờ quản trị viên cấp phép.","Vui lòng quay lại sau, hoặc liên hệ quản trị viên hệ thống.");
    $("#btnLogoutX").onclick = ()=>signOut(auth);
    return;
  }
  if(p.status === "suspended"){
    appRoot().innerHTML = pendingSuspendedScreen("🔒","Tài khoản của bạn đã bị tạm khóa.","Vui lòng liên hệ quản trị viên.");
    $("#btnLogoutX").onclick = ()=>signOut(auth);
    return;
  }
  if(p.status !== "active"){
    appRoot().innerHTML = pendingSuspendedScreen("⚠️","Tài khoản không ở trạng thái hoạt động.","Vui lòng liên hệ quản trị viên.");
    $("#btnLogoutX").onclick = ()=>signOut(auth);
    return;
  }
  if(p.role === "admin") return renderAdminShell();
  if(p.role === "teacher") return renderTeacherShell();
  appRoot().innerHTML = pendingSuspendedScreen("⚠️","Vai trò tài khoản không hợp lệ.","Vui lòng liên hệ quản trị viên.");
  $("#btnLogoutX").onclick = ()=>signOut(auth);
}

  if(key==="teachers") return adminTeachers(c);
  if(key==="classes") return adminClassesView(c);
  if(key==="sessions") return adminSessionsView(c);
  if(key==="qrlinks") return qrManager(c, true);
  if(key==="groups") return groupModule(c, true);
  if(key==="library") return adminLibrary(c);
  if(key==="audit") return adminAuditLog(c);
  if(key==="stats") return adminStats(c);
  if(key==="settings") return adminSettings(c);
}

function errorBlock(e, retryFn){

    <button class="btn btn-outline" id="btnRetryErr">THỬ LẠI</button></div></div>`

}

  return `<span class="badge badge-gray">${esc(status)}</span>`;

const GROUP_COLLECTION = "groupActivities";
const GROUP_JOIN_COLLECTION = "groupJoinCodes";
const GROUP_CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function groupRandCode(len=6){
  let s=""; for(let i=0;i<len;i++) s+=GROUP_CODE_CHARS[Math.floor(Math.random()*GROUP_CODE_CHARS.length)];
  return s;
}
function groupJoinLink(code){
  return window.location.origin + window.location.pathname + "?group=" + encodeURIComponent(code);
}
function groupStatusBadge(s){
  const m={draft:["Nháp","badge"],open:["Đang mở","badge badge-green"],closed:["Đã đóng","badge badge-gray"]};
  const x=m[s]||[s||"—","badge"]; return `<span class="${x[1]}">${x[0]}</span>`;
}
async function groupUniqueCode(){
  for(let i=0;i<8;i++){
    const code=groupRandCode(6);
    const snap=await getDoc(doc(db,GROUP_JOIN_COLLECTION,code));
    if(!snap.exists()) return code;
  }
  return groupRandCode(8);
}

    $("#groupHistory").innerHTML=`<table><thead><tr><th>Hoạt động</th>${isAdminView?"<th>Giảng viên</th>":""}<th>Lớp</th><th>Nhóm</th><th>Mã</th><th>Trạng thái</th><th>Ngày tạo</th><th></th></tr></thead><tbody>
      ${arr.map(x=>`<tr>
        <td><b>${esc(x.title||"—")}</b>${x.instructions?`<div class="small mut">${esc(x.instructions).slice(0,100)}</div>`:""}</td>
        ${isAdminView?`<td>${esc(ownerMap[x.ownerId]?.name||"—")}<div class="group-admin-owner">${esc(ownerMap[x.ownerId]?.email||"")}</div></td>`:""}
        <td>${esc(x.className||"—")}</td><td>${x.groupCount||0}</td><td><b>${esc(x.joinCode||"")}</b></td><td>${groupStatusBadge(x.status)}</td>
        <td>${fmtDateShort(x.createdAt)}</td>
        <td><div class="flex gap-8" style="flex-wrap:wrap"><button class="btn btn-sm btn-outline" data-group-open="${x.id}">MỞ</button>
        ${(isAdminView || x.ownerId===STATE.user.uid)?`<button class="btn btn-sm btn-danger" data-group-del="${x.id}" data-title="${esc(x.title||"")}">XÓA</button>`:""}</div></td>
      </tr>`).join("")}</tbody></table>`;
    $$("[data-group-open]").forEach(b=>b.onclick=()=>{window.location.hash="#/group/"+encodeURIComponent(b.dataset.groupOpen);});
    $$("[data-group-del]").forEach(b=>b.onclick=async()=>{
      const id=b.dataset.groupDel;
      if(!confirm(`Xóa hoạt động nhóm “${b.dataset.title}”? Ý kiến, ảnh và tệp đã gửi cũng sẽ bị xóa.`)) return;
      try{await deleteGroupActivityDeep(id);toast("Đã xóa hoạt động nhóm.","ok");}catch(e){toast(mapError(e),"err");}
    });
  };
  if(isAdminView){
    $("#groupSearch").addEventListener("input",render);
    $("#groupSort").addEventListener("change",render);
  }
  const unsub=onSnapshot(q,snap=>{cache=snap.docs.map(d=>({id:d.id,...d.data()}));render();},
    e=>{$("#groupHistory").innerHTML=errorBlock(e,()=>groupModule(c,isAdminView));});
  track(unsub);
}

async function openGroupCreateForm(c){
  let classes=[];
  try{
    const snap=await getDocs(query(collection(db,"classes"),where("ownerId","==",STATE.user.uid)));
    classes=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||"").localeCompare(b.name||"","vi"));
  }catch(e){}
  openModal(`<h3>👥 Tạo hoạt động thảo luận nhóm</h3>
    <div class="field"><label>Tên hoạt động *</label><input id="gTitle" placeholder="Ví dụ: Thảo luận nhóm - Giải pháp nâng cao chất lượng học tập"></div>
    <div class="field"><label>Lớp học</label><select id="gClass"><option value="">— Không gắn lớp —</option>${classes.map(x=>`<option value="${x.id}">${esc(x.name||x.code||x.id)}</option>`).join("")}</select></div>
    <div class="grid grid-2">
      <div class="field"><label>Số nhóm (2-12)</label><input id="gCount" type="number" min="2" max="12" value="6"></div>
      <div class="field"><label>Thời gian thảo luận (phút)</label><input id="gMinutes" type="number" min="1" max="180" value="15"></div>
    </div>
    <div class="field"><label>Nhiệm vụ / hướng dẫn chung</label><textarea id="gInstructions" placeholder="Nội dung yêu cầu học viên thực hiện…"></textarea></div>
    <div class="field"><label>Cho phép học viên gửi</label>
      <div class="flex gap-12" style="flex-wrap:wrap">
        <label><input type="checkbox" id="gAllowText" checked style="width:auto;min-height:auto"> Ý kiến văn bản</label>
        <label><input type="checkbox" id="gAllowPhoto" checked style="width:auto;min-height:auto"> Ảnh</label>
        <label><input type="checkbox" id="gAllowFile" checked style="width:auto;min-height:auto"> File / link</label>
      </div>
    </div>
    <div id="gCreateErr" class="error-text hidden"></div>
    <div class="flex-between mt-14"><button class="btn btn-ghost" id="gCancel">HỦY</button><button class="btn" id="gCreate">TẠO HOẠT ĐỘNG</button></div>`, true);
  $("#gCancel").onclick=closeModal;
  $("#gCreate").onclick=async()=>{
    const title=$("#gTitle").value.trim();
    const count=Math.max(2,Math.min(12,Number($("#gCount").value)||6));
    const minutes=Math.max(1,Math.min(180,Number($("#gMinutes").value)||15));
    if(!title){$("#gCreateErr").textContent="Vui lòng nhập tên hoạt động.";$("#gCreateErr").classList.remove("hidden");return;}
    const classId=$("#gClass").value;
    const cls=classes.find(x=>x.id===classId);
    $("#gCreate").disabled=true;
    try{
      const code=await groupUniqueCode();
      const aRef=doc(collection(db,GROUP_COLLECTION));
      const batch=writeBatch(db);
      batch.set(aRef,{
        ownerId:STATE.user.uid,
        classId:classId||null,className:cls?.name||cls?.code||"",
        title,instructions:$("#gInstructions").value.trim(),groupCount:count,durationSec:Math.round(minutes*60),
        allowText:$("#gAllowText").checked,allowPhoto:$("#gAllowPhoto").checked,allowFile:$("#gAllowFile").checked,
        joinCode:code,status:"draft",startedAt:null,createdAt:serverTimestamp(),updatedAt:serverTimestamp()
      });
      batch.set(doc(db,GROUP_JOIN_COLLECTION,code),{activityId:aRef.id,ownerId:STATE.user.uid,createdAt:serverTimestamp()});
      for(let i=1;i<=count;i++){
        batch.set(doc(db,GROUP_COLLECTION,aRef.id,"topics",String(i)),{group:i,topic:"",updatedAt:serverTimestamp()});
      }
      await batch.commit();
      closeModal(); window.location.hash="#/group/"+encodeURIComponent(aRef.id);
    }catch(e){$("#gCreateErr").textContent=mapError(e);$("#gCreateErr").classList.remove("hidden");}
    finally{$("#gCreate") && ($("#gCreate").disabled=false);}
  };
}

async function deleteGroupActivityDeep(id){
  const aRef=doc(db,GROUP_COLLECTION,id); const s=await getDoc(aRef); if(!s.exists()) return;
  const a=s.data();
  if(!(STATE.profile.role==="admin" || a.ownerId===STATE.user.uid)) throw {code:"permission-denied"};
  for(const sub of ["topics","notes","photos","files"]){
    const snap=await getDocs(collection(db,GROUP_COLLECTION,id,sub));
    await deleteRefsInChunks(snap.docs.map(d=>d.ref));
  }
  if(a.joinCode) await deleteDoc(doc(db,GROUP_JOIN_COLLECTION,a.joinCode)).catch(()=>{});
  await deleteDoc(aRef);
}

  $("#gBack").onclick=()=>{window.location.hash=""; if(isAdminView){STATE.adminNav="groups";adminRoute("groups");}else{STATE.teacherNav="groups";teacherRoute();}};
  $("#gCopy").onclick=e=>copyQrText(join,e.currentTarget);
  $("#gQr").onclick=()=>openQrBig(qrImageFor(join),join);
  $("#groupTimerFloat").onclick=()=>{
    $("#groupTimerPopup").classList.remove("hidden");
    $("#groupTimerFloat").classList.add("hidden");
  };
  $("#groupTimerPopupClose").onclick=()=>{
    $("#groupTimerPopup").classList.add("hidden");
    $("#groupTimerFloat").classList.remove("hidden");
  };
  $("#groupPanelPopupClose").onclick=()=>$("#groupPanelPopup").classList.add("hidden");
  $("#groupPanelPopup").onclick=e=>{if(e.target.id==="groupPanelPopup") $("#groupPanelPopup").classList.add("hidden");};

  $("#gOpen").onclick=()=>{try{$("#groupCountdownSound")?.load();}catch(e){} updateDoc(doc(db,GROUP_COLLECTION,id),{status:"open",startedAt:serverTimestamp(),updatedAt:serverTimestamp()}).catch(e=>toast(mapError(e),"err"));};
  $("#gClose").onclick=()=>updateDoc(doc(db,GROUP_COLLECTION,id),{status:"closed",updatedAt:serverTimestamp()}).catch(e=>toast(mapError(e),"err"));
  $("#gTimerStart").onclick=()=>{try{$("#groupCountdownSound")?.load();}catch(e){} groupWarnedAt10=false; updateDoc(doc(db,GROUP_COLLECTION,id),{startedAt:serverTimestamp(),updatedAt:serverTimestamp()}).catch(e=>toast(mapError(e),"err"));};

  let current=a, notes=[],photos=[],files=[],topics={};
  function renderTopics(){
    $("#gTopics").innerHTML=Array.from({length:current.groupCount||6},(_,k)=>k+1).map(i=>
      `<div class="field" style="margin-bottom:8px"><label>Nhóm ${i}</label><input data-topic="${i}" value="${esc(topics[String(i)]?.topic||"")}" placeholder="Ví dụ: Giải pháp / Nguyên nhân / Kiến nghị…"></div>`).join("");
  }
  $("#gSaveTopics").onclick=async()=>{
    try{
      const batch=writeBatch(db);
      $$("[data-topic]").forEach(inp=>batch.set(doc(db,GROUP_COLLECTION,id,"topics",String(inp.dataset.topic)),{group:Number(inp.dataset.topic),topic:inp.value.trim(),updatedAt:serverTimestamp()},{merge:true}));
      await batch.commit();toast("Đã lưu chủ đề các nhóm.","ok");
    }catch(e){toast(mapError(e),"err");}
  };
  function renderPanels(){
    let total=0;
    $("#gPanels").innerHTML=Array.from({length:current.groupCount||6},(_,k)=>k+1).map(i=>{
      const ns=notes.filter(x=>Number(x.group)===i).sort((x,y)=>qrDateValue(x.createdAt)-qrDateValue(y.createdAt));
      const ps=photos.filter(x=>Number(x.group)===i);
      const fs=files.filter(x=>Number(x.group)===i);
      total+=ns.length+ps.length+fs.length;
      return `<div class="group-panel" data-group-panel="${i}"><h4>Nhóm ${i}</h4>
        ${topics[String(i)]?.topic?`<div class="group-topic">📌 ${esc(topics[String(i)].topic)}</div>`:""}
        <div>${ns.length?ns.map(n=>`<div class="group-note">${esc(n.text||"")}</div>`).join(""):`<div class="mut small">Đang chờ ý kiến…</div>`}</div>
        ${ps.length?`<div class="group-media">${ps.map(p=>`<img src="${p.dataUrl}" data-gphoto="${p.id}" alt="Ảnh nhóm ${i}">`).join("")}</div>`:""}
        ${fs.length?`<div>${fs.map(f=>f.link?`<a class="group-file" href="${esc(f.link)}" target="_blank" rel="noopener">🔗 ${esc(f.name||"Liên kết")}</a>`:`<a class="group-file" href="${f.dataUrl}" download="${esc(f.name||"tep")}">📄 ${esc(f.name||"Tệp")}</a>`).join("")}</div>`:""}
      </div>`;
    }).join("");
    $("#gRespCount").textContent=`${total} nội dung đã gửi`;
    $$("[data-gphoto]").forEach(img=>img.onclick=e=>{e.stopPropagation();const p=photos.find(x=>x.id===img.dataset.gphoto);if(p)openImageViewerSimple(p.dataUrl);});
    $$("[data-group-panel]").forEach(panel=>panel.onclick=()=>{
      const i=Number(panel.dataset.groupPanel);
      const ns=notes.filter(x=>Number(x.group)===i).sort((x,y)=>qrDateValue(x.createdAt)-qrDateValue(y.createdAt));
      const ps=photos.filter(x=>Number(x.group)===i);
      const fs=files.filter(x=>Number(x.group)===i);
      $("#groupPanelPopupInner").innerHTML=`
        <h2>Nhóm ${i}</h2>
        ${topics[String(i)]?.topic?`<div class="group-topic">📌 ${esc(topics[String(i)].topic)}</div>`:""}
        <div class="small mut" style="margin-bottom:12px">${ns.length} ý kiến · ${ps.length} ảnh · ${fs.length} tệp/link</div>
        ${ns.length?ns.map(n=>`<div class="group-note">${esc(n.text||"")}</div>`).join(""):`<div class="mut">Đang chờ ý kiến…</div>`}
        ${ps.length?`<div class="group-media mt-14">${ps.map(p=>`<img src="${p.dataUrl}" data-popup-photo="${p.id}" alt="Ảnh nhóm ${i}">`).join("")}</div>`:""}
        ${fs.length?`<div class="mt-14">${fs.map(f=>f.link?`<a class="group-file" href="${esc(f.link)}" target="_blank" rel="noopener">🔗 ${esc(f.name||"Liên kết")}</a>`:`<a class="group-file" href="${f.dataUrl}" download="${esc(f.name||"tep")}">📄 ${esc(f.name||"Tệp")}</a>`).join("")}</div>`:""}`;
      $("#groupPanelPopup").classList.remove("hidden");
      $$("[data-popup-photo]").forEach(img=>img.onclick=e=>{e.stopPropagation();const p=photos.find(x=>x.id===img.dataset.popupPhoto);if(p)openImageViewerSimple(p.dataUrl);});
    });
  }
  let groupWarnedAt10=false;
  function updateTimer(){
    const el=$("#gTimer"), fl=$("#groupTimerFloatClock"), big=$("#groupTimerBigClock");
    if(!el)return;
    let remain;
    if(!current.startedAt){
      remain=current.durationSec||0;
      groupWarnedAt10=false;
    }else{
      const start=current.startedAt.toMillis?current.startedAt.toMillis():new Date(current.startedAt).getTime();
      remain=Math.max(0,Math.round((start+(current.durationSec||0)*1000-Date.now())/1000));
    }
    const val=fmtDuration(remain);
    el.textContent=val;if(fl)fl.textContent=val;if(big)big.textContent=val;
    const done=remain<=0 && !!current.startedAt;
    el.classList.toggle("done",done);
    $("#groupTimerFloat")?.classList.toggle("done",done);
    $("#groupTimerPopup")?.classList.toggle("done",done);
    if($("#groupTimerBigLabel")) $("#groupTimerBigLabel").textContent=done?"HẾT GIỜ":"THỜI GIAN THẢO LUẬN";

    // Cảnh báo đúng mốc 10 giây cuối, chỉ phát một lần cho mỗi lần bắt đầu đồng hồ.
    if(current.startedAt && remain<=10 && remain>0 && !groupWarnedAt10){
      groupWarnedAt10=true;
      const audio=$("#groupCountdownSound");
      if(audio){ try{audio.currentTime=0; audio.play().catch(()=>{});}catch(e){} }
    }
    if(remain>10) groupWarnedAt10=false;
  }
  const timer=setInterval(updateTimer,250); track(()=>clearInterval(timer));

  const groupKeyHandler=(e)=>{
    if(e.key==="Escape"){
      $("#groupPanelPopup")?.classList.add("hidden");
      if($("#groupTimerPopup") && !$("#groupTimerPopup").classList.contains("hidden")){
        $("#groupTimerPopup").classList.add("hidden");
        $("#groupTimerFloat")?.classList.remove("hidden");
      }
    }
  };
  document.addEventListener("keydown",groupKeyHandler); track(()=>document.removeEventListener("keydown",groupKeyHandler));

  track(onSnapshot(doc(db,GROUP_COLLECTION,id),s=>{if(!s.exists())return;current={id,...s.data()};$("#gStatusBadge").innerHTML=groupStatusBadge(current.status);renderPanels();updateTimer();}));
  track(onSnapshot(collection(db,GROUP_COLLECTION,id,"topics"),s=>{topics={};s.forEach(d=>topics[d.id]=d.data());renderTopics();renderPanels();}));
  track(onSnapshot(collection(db,GROUP_COLLECTION,id,"notes"),s=>{notes=s.docs.map(d=>({id:d.id,...d.data()}));renderPanels();}));
  track(onSnapshot(collection(db,GROUP_COLLECTION,id,"photos"),s=>{photos=s.docs.map(d=>({id:d.id,...d.data()}));renderPanels();}));
  track(onSnapshot(collection(db,GROUP_COLLECTION,id,"files"),s=>{files=s.docs.map(d=>({id:d.id,...d.data()}));renderPanels();}));
  renderTopics();renderPanels();updateTimer();
}

/* ============================================================
   QR VĨNH VIỄN MODULE — dùng chung tài khoản HCMA2
   - Teacher: chỉ thấy / sửa / xóa QR do chính mình tạo.
   - Admin: thấy và quản lý toàn bộ QR.
   - Người quét QR: công khai, không cần đăng nhập.
   ============================================================ */
const QR_COLLECTION = "qrlinks";
const QR_CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
function qrRandCode(len=6){ let s=""; for(let i=0;i<len;i++) s+=QR_CODE_CHARS[Math.floor(Math.random()*QR_CODE_CHARS.length)]; return s; }
function qrSanitizeCode(s){ return String(s||"").trim().replace(/[^A-Za-z0-9_-]/g,"").slice(0,40); }
function qrNormalizeUrl(raw){
  let s=String(raw||"").trim(); if(!s) return null;
  if(!/^https?:\/\//i.test(s)) s="https://"+s;
  try{ const u=new URL(s); if(!/^https?:$/.test(u.protocol)) return null; return u.toString(); }catch(e){ return null; }
}
function qrShortLink(code){ return APP_BASE_URL + "?r=" + encodeURIComponent(code); }
function qrImageFor(link, size=300){ return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(link)}`; }
function qrDateValue(ts){ try{return ts?.toMillis?ts.toMillis():(ts?new Date(ts).getTime():0);}catch(e){return 0;} }
function qrFmtDate(ts){ try{return ts?.toDate?ts.toDate().toLocaleString("vi-VN"):(ts?new Date(ts).toLocaleString("vi-VN"):"");}catch(e){return "";} }
function ensureQrOverlay(){
  let el=document.getElementById("qrBigOverlay"); if(el) return el;
  el=document.createElement("div"); el.id="qrBigOverlay";
  el.innerHTML=`<div class="qr-big-box"><img id="qrBigImg" alt="QR lớn"><div class="qr-big-link" id="qrBigLink"></div><button class="btn btn-outline mt-14" id="qrBigClose" style="background:#fff">Đóng ✕</button></div>`;
  document.body.appendChild(el);
  el.addEventListener("click",e=>{if(e.target===el) el.classList.remove("show")});
  el.querySelector("#qrBigClose").onclick=()=>el.classList.remove("show");
  document.addEventListener("keydown",e=>{if(e.key==="Escape") el.classList.remove("show")});
  return el;
}
function openQrBig(src,link){ const el=ensureQrOverlay(); el.querySelector("#qrBigImg").src=src; el.querySelector("#qrBigLink").textContent=link||""; el.classList.add("show"); }
async function downloadQrImage(src,name){
  try{ const res=await fetch(src,{mode:"cors"}); const blob=await res.blob(); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`qr-${name||"link"}.png`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
  catch(e){ window.open(src,"_blank"); }
}
async function copyQrText(text,btn){
  try{ await navigator.clipboard.writeText(text); const old=btn?.textContent; if(btn){btn.textContent="Đã sao chép ✓";setTimeout(()=>btn.textContent=old,1400);} }
  catch(e){ window.prompt("Sao chép liên kết:",text); }
}

    updateDoc(ref,{clicks:increment(1),lastScanAt:serverTimestamp()}).catch(()=>{});
    window.location.replace(snap.data().target);
  }catch(e){ appRoot().innerHTML=`<div class="center-screen"><h2>Không mở được liên kết</h2><p class="mut">Vui lòng kiểm tra kết nối Internet rồi quét lại.</p></div>`; }

      card.querySelector("[data-qr-download]").onclick=()=>downloadQrImage(img,d.id);
      card.querySelector("[data-qr-save]").onclick=async e=>{const input=card.querySelector("[data-qr-target]"),hint=card.querySelector("[data-qr-hint]"),url=qrNormalizeUrl(input.value);if(!url){hint.className="error-text mt-8";hint.textContent="Liên kết không hợp lệ.";return;} e.currentTarget.disabled=true;try{await updateDoc(doc(db,QR_COLLECTION,d.id),{target:url,updatedAt:serverTimestamp()});hint.className="success-text mt-8";hint.textContent="Đã lưu. QR giữ nguyên, chỉ đổi điểm đến.";}catch(err){hint.className="error-text mt-8";hint.textContent=mapError(err);}finally{e.currentTarget.disabled=false;}};
      card.querySelector("[data-qr-delete]").onclick=async()=>{if(!confirm(`Xóa QR “${d.id}”? Sau khi xóa, mã QR này sẽ không còn mở được liên kết.`))return;try{await deleteDoc(doc(db,QR_COLLECTION,d.id));toast("Đã xóa QR.","ok");}catch(err){toast(mapError(err),"err");}};
    });
  };
  if(isAdminView){
    $("#qrAdminSearch")?.addEventListener("input",renderQrDocs);
    $("#qrAdminSort")?.addEventListener("change",renderQrDocs);
  }
  const unsub=onSnapshot(q,snap=>{
    qrCache=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderQrDocs();
  },e=>{$("#qrList").innerHTML=errorBlock(e,()=>qrManager(c,isAdminView));});
  track(unsub);
}

function teacherRoute(){
  const c = $("#mainContent");

  const hash = window.location.hash || "";

  const type = existing?.type || "single";
  openModal(`
    <h3>${existing?"Sửa câu hỏi thư viện":"Lưu câu hỏi vào thư viện"}</h3>
    <form id="libForm">
      <div class="field"><label>Phân loại</label><select id="libCat">${LIBRARY_CATEGORIES.map(cat=>`<option ${existing&&existing.category===cat?"selected":""}>${esc(cat)}</option>`).join("")}</select></div>

      <div class="field"><label>Nội dung câu hỏi *</label><textarea id="libQ" required>${existing?esc(existing.question):""}</textarea></div>

      <div class="field" id="libOptWrap"></div>
      <div id="libErr" class="error-text hidden"></div>
      <div class="flex-between mt-14">
        <button type="button" class="btn btn-ghost" id="libCancel">Hủy</button>
        <button type="submit" class="btn">${existing?"Lưu thay đổi":"Lưu vào thư viện"}</button>
      </div>
    </form>`, true);
  $("#libCancel").onclick = closeModal;
  function renderOptEditor(){
    const t = $("#libType").value;
    if(t==="truefalse"){
      // Đúng/Sai luôn cố định — không cho sửa, nhưng VẪN được ghi vào Firestore khi lưu.
      $("#libOptWrap").innerHTML = `<label>Phương án</label><p class="hint">Câu hỏi Đúng/Sai luôn có sẵn 2 phương án cố định: <strong>Đúng</strong> và <strong>Sai</strong> (không cần nhập tay).</p>`;
      return;
    }
    if(t==="scale"){
      const mn = Number(existing?.scaleMin ?? 1);
      const mx = Number(existing?.scaleMax ?? 5);
      $("#libOptWrap").innerHTML = `<div class="grid grid-2">
        <div class="field"><label>Giá trị nhỏ nhất</label><input type="number" id="libScaleMin" value="${mn}"></div>
        <div class="field"><label>Giá trị lớn nhất</label><input type="number" id="libScaleMax" value="${mx}"></div>
      </div>`;
      return;
    }
    if(!QUESTION_TYPES[t].needsOptions){ $("#libOptWrap").innerHTML = `<p class="hint">Loại câu hỏi này không cần phương án cố định.</p>`; return; }
    const opts = (existing && existing.type===t && existing.options) ? existing.options : ["",""];
    $("#libOptWrap").innerHTML = `<label>Phương án</label><div id="libOptions">${opts.map((o,i)=>optionRowHtml(o,i)).join("")}</div>
      <button type="button" class="btn btn-sm btn-outline" id="libAddOpt">+ Thêm phương án</button>`;
    $("#libAddOpt").onclick = ()=>{ $("#libOptions").insertAdjacentHTML("beforeend", optionRowHtml("", $("#libOptions").children.length)); wireOptRemove(); };
    wireOptRemove();
  }
  function wireOptRemove(){ $$(".optRemove").forEach(b=>b.onclick=()=>b.closest(".option-row").remove()); }
  $("#libType").onchange = renderOptEditor;
  renderOptEditor();
  $("#libForm").onsubmit = async (e)=>{
    e.preventDefault();
    const t = $("#libType").value, qtext = $("#libQ").value.trim();
    if(!qtext){ $("#libErr").textContent="Nội dung câu hỏi không được để trống."; $("#libErr").classList.remove("hidden"); return; }
    let options = null;
    if(t==="truefalse"){
      // Luôn ghi cố định 2 phương án Đúng/Sai vào Firestore, bất kể trạng thái UI.
      options = QUESTION_TYPES.truefalse.fixedOptions.slice();
    } else if(QUESTION_TYPES[t].needsOptions){
      options = $$("#libOptions .optText").map(i=>i.value.trim()).filter(v=>v);
      if(options.length<2){ $("#libErr").textContent="Cần ít nhất 2 phương án."; $("#libErr").classList.remove("hidden"); return; }
    }
    let scaleMin = null, scaleMax = null;
    if(t==="scale"){
      scaleMin = Number($("#libScaleMin").value);
      scaleMax = Number($("#libScaleMax").value);
      if(!Number.isFinite(scaleMin) || !Number.isFinite(scaleMax) || scaleMin>=scaleMax){
        $("#libErr").textContent="Thang điểm không hợp lệ (giá trị nhỏ nhất phải nhỏ hơn giá trị lớn nhất).";
        $("#libErr").classList.remove("hidden");
        return;
      }
    }
    const data = {
      category: $("#libCat").value, type:t, question:qtext,
      description: $("#libDesc").value.trim(),
      options, scaleMin, scaleMax, updatedAt: serverTimestamp()
    };
    try{
      if(existing){ await updateDoc(doc(db,"library",existing.id), data); toast("Đã lưu thay đổi.","ok"); }
      else{ data.ownerId = STATE.user.uid; data.createdAt = serverTimestamp(); await addDoc(collection(db,"library"), data); toast("Đã lưu vào thư viện.","ok"); }
      closeModal();
    }catch(err){ $("#libErr").textContent = mapError(err); $("#libErr").classList.remove("hidden"); }
  };
}

  return `<div class="option-row"><input type="text" class="optText" value="${esc(val)}" placeholder="Phương án ${idx+1}"><button type="button" class="btn btn-sm btn-ghost optRemove">✕</button></div>`;
}

  else if(q.type==="multiple") body=(q.options||[]).map(o=>`<label class="student-option"><input type="checkbox" disabled> ${esc(o)}</label>`).join("");

  else if(q.type==="scale") body=`<div class="flex gap-8" style="flex-wrap:wrap">${Array.from({length:(q.scaleMax||5)-(q.scaleMin||1)+1},(_,i)=>`<button class="btn btn-outline" disabled>${(q.scaleMin||1)+i}</button>`).join("")}</div>`;
  else body=`<div class="mut">Bản xem trước loại câu hỏi: ${esc(QUESTION_TYPES[q.type]?.label||q.type)}</div>`;
  openModal(`<div style="max-width:520px;margin:auto"><div class="center"><div class="eyebrow">XEM TRƯỚC NHƯ HỌC VIÊN</div><h2>${esc(w.title||"Hoạt động chưa đặt tên")}</h2></div>

    <div class="center mt-14"><button class="btn btn-outline" id="closeStudentPreview">ĐÓNG XEM TRƯỚC</button></div></div>`,true);
  $("#closeStudentPreview").onclick=closeModal;
}

function blankQuestion(){ return {

  saveToLibrary:false, libraryCategory:LIBRARY_CATEGORIES[0], sourceLibraryId:null
}; }

    step:1, title:"", classId:"", classesCache:[], questions:[blankQuestion()], qIndex:0,

function wizardShellHtml(bodyHtml){

  return `<h2>Tạo tương tác mới</h2>
  <div class="wizard-steps">${WIZARD_STEP_LABELS.map((l,i)=>{

}
function renderWizard(c){

  const steps = {
    1: wizStep1, 2: wizStep2, 3: wizStep3, 4: wizStep4, 5: wizStep5, 6: wizStep6, 7: wizStep7, 8: wizStep8

}

function wizardQuestionFromLibrary(item){
  const meta = QUESTION_TYPES[item.type] || QUESTION_TYPES.single;
  let opts = Array.isArray(item.options) ? item.options.map(x=>String(x)) : [];
  if(item.type==="truefalse") opts = QUESTION_TYPES.truefalse.fixedOptions.slice();
  if(meta.needsOptions && opts.length<2){
    if(item.type==="likert") opts=["Hoàn toàn không đồng ý","Không đồng ý","Phân vân","Đồng ý","Hoàn toàn đồng ý"];
    else opts=["",""];
  }
  return {
    question:String(item.question||""),
    description:String(item.description||""),
    type:item.type && QUESTION_TYPES[item.type] ? item.type : "single",
    options:opts,
    required:true,
    chartType:(item.chartType && meta.allowedCharts.includes(item.chartType)) ? item.chartType : meta.defaultChart,
    scaleMin:Number.isFinite(Number(item.scaleMin)) ? Number(item.scaleMin) : 1,
    scaleMax:Number.isFinite(Number(item.scaleMax)) ? Number(item.scaleMax) : 5,
    timeLimit:STATE.wizard?.settings?.timeLimit||0,
    allowChangeAnswer:!!STATE.wizard?.settings?.allowChangeAnswer,
    saveToLibrary:false,
    libraryCategory:item.category||LIBRARY_CATEGORIES[0],
    sourceLibraryId:item.id||null
  };
}
function isWizardBlankQuestion(q){
  return !String(q?.question||"").trim()
    && q?.type==="single"
    && (!Array.isArray(q?.options) || q.options.every(x=>!String(x||"").trim()));
}
async function openWizardLibraryPicker(){
  const w = STATE.wizard;
  openModal(`
    <div class="flex-between">
      <div>
        <h3>📚 Chọn câu hỏi từ Thư viện</h3>
        <p class="hint">Có thể chọn nhiều câu cùng lúc. Câu được thêm vào tương tác là <b>bản sao độc lập</b>, sửa trong phiên sẽ không làm đổi câu gốc trong Thư viện.</p>
      </div>
      <button type="button" class="btn btn-sm btn-ghost" id="libPickClose">✕</button>
    </div>
    <div class="library-picker-toolbar">
      <input type="text" id="libPickSearch" placeholder="🔎 Tìm nội dung câu hỏi…">
      <select id="libPickType"><option value="">Tất cả loại</option>${Object.entries(QUESTION_TYPES).map(([k,v])=>`<option value="${k}">${esc(v.label)}</option>`).join("")}</select>
      <select id="libPickCat"><option value="">Tất cả phân loại</option>${LIBRARY_CATEGORIES.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select>
    </div>
    <div class="flex-between">
      <label class="flex gap-8" style="margin:0;font-weight:600;"><input type="checkbox" id="libPickAll" style="width:auto;min-height:auto;"> Chọn tất cả đang hiển thị</label>
      <span class="small mut" id="libPickCount">0 câu được chọn</span>
    </div>
    <div id="libPickList" class="library-picker-list mt-14"><div class="mut">Đang tải thư viện…</div></div>
    <div id="libPickErr" class="error-text hidden mt-8"></div>
    <div class="flex-between mt-14">
      <button type="button" class="btn btn-ghost" id="libPickCancel">Hủy</button>
      <button type="button" class="btn" id="libPickAdd" disabled>THÊM CÂU ĐÃ CHỌN</button>
    </div>
  `, true);

  $("#libPickClose").onclick = closeModal;
  $("#libPickCancel").onclick = closeModal;

  let cache = [];
  const selected = new Set();
  try{
    const snap = await getDocs(query(collection(db,"library"), where("ownerId","==",STATE.user.uid), orderBy("createdAt","desc")));
    cache = snap.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){
    $("#libPickList").innerHTML = `<div class="empty-state"><div class="ic">⚠️</div>${esc(mapError(e))}</div>`;
    return;
  }

  const filtered = ()=>{
    const kw=($("#libPickSearch").value||"").toLowerCase().trim();
    const t=$("#libPickType").value;
    const cat=$("#libPickCat").value;
    return cache.filter(x=>{
      if(t && x.type!==t) return false;
      if(cat && x.category!==cat) return false;
      if(kw && !(`${x.question||""} ${x.description||""}`.toLowerCase().includes(kw))) return false;
      return true;
    });
  };
  function updatePickCount(){
    $("#libPickCount").textContent = `${selected.size} câu được chọn`;
    $("#libPickAdd").disabled = selected.size===0;
  }
  function render(){
    const list=filtered();
    if(!list.length){
      $("#libPickList").innerHTML=`<div class="empty-state"><div class="ic">📚</div>Không có câu hỏi phù hợp.</div>`;
      $("#libPickAll").checked=false; updatePickCount(); return;
    }
    $("#libPickList").innerHTML=list.map(x=>`
      <label class="library-picker-item">
        <input type="checkbox" data-libpick="${x.id}" ${selected.has(x.id)?"checked":""}>
        <span>
          <span class="library-picker-meta">
            <span class="chip">${esc(x.category||"Chưa phân loại")}</span>
            <span class="chip">${esc(QUESTION_TYPES[x.type]?.label||x.type||"—")}</span>
          </span>
          <span class="library-picker-question">${esc(x.question||"")}</span>
          ${x.description?`<span class="small mut" style="display:block;margin-top:4px;">${esc(x.description)}</span>`:""}
        </span>
      </label>`).join("");
    $$("[data-libpick]").forEach(cb=>cb.onchange=()=>{
      if(cb.checked) selected.add(cb.dataset.libpick); else selected.delete(cb.dataset.libpick);
      updatePickCount();
      const ids=list.map(x=>x.id);
      $("#libPickAll").checked=ids.length>0 && ids.every(id=>selected.has(id));
    });
    const ids=list.map(x=>x.id);
    $("#libPickAll").checked=ids.length>0 && ids.every(id=>selected.has(id));
    updatePickCount();
  }
  ["libPickSearch","libPickType","libPickCat"].forEach(id=>{
    const el=$("#"+id); el.addEventListener(id==="libPickSearch"?"input":"change", render);
  });
  $("#libPickAll").onchange=()=>{
    filtered().forEach(x=>$("#libPickAll").checked?selected.add(x.id):selected.delete(x.id));
    render();
  };
  $("#libPickAdd").onclick=()=>{
    const picked=cache.filter(x=>selected.has(x.id)).map(wizardQuestionFromLibrary);
    if(!picked.length) return;
    let firstIndex;
    const current=w.questions[w.qIndex];
    if(w.questions.length===1 && isWizardBlankQuestion(current)){
      w.questions.splice(0,1,...picked);
      firstIndex=0;
    }else{
      firstIndex=w.questions.length;
      w.questions.push(...picked);
    }
    w.qIndex=firstIndex;
    w.step=3;
    closeModal();
    toast(`Đã thêm ${picked.length} câu hỏi từ Thư viện.`,"ok");
    renderWizard($("#mainContent"));
  };
  render();
}

function wizStep4(c){
  const w = STATE.wizard; const q = w.questions[w.qIndex];
  c.innerHTML = wizardShellHtml(`

    if(q.type==="truefalse") q.options=["Đúng","Sai"];

function wizStep5(c){
  const w = STATE.wizard; const q = w.questions[w.qIndex]; const meta = QUESTION_TYPES[q.type];
  let body = "";
  if(q.type==="truefalse"){
    body = `<p class="hint">Câu Đúng/Sai sử dụng 2 phương án cố định: <b>Đúng</b> và <b>Sai</b>.</p>`;
  } else if(q.type==="scale"){
    body = `<div class="grid grid-2">
      <div class="field"><label>Giá trị nhỏ nhất</label><input type="number" id="wScaleMin" value="${q.scaleMin}"></div>
      <div class="field"><label>Giá trị lớn nhất</label><input type="number" id="wScaleMax" value="${q.scaleMax}"></div>
    </div>`;
  } else if(q.type==="open"){
    body = `<p class="hint">Học viên sẽ nhập câu trả lời dạng văn bản tự do. Không cần thiết lập phương án.</p>`;
  } else {
    body = `<label>${q.type==="ranking"?"Các mục cần xếp hạng":(q.type==="likert"?"Nhãn mức độ (có thể tùy chỉnh)":"Phương án")}</label>

  }
  c.innerHTML = wizardShellHtml(`${body}<div id="wErr" class="error-text hidden"></div>${wizNavHtml(true)}`);
  if($("#wAddOpt")) $("#wAddOpt").onclick = ()=>{ $("#wOptions").insertAdjacentHTML("beforeend", optionRowHtml("", $("#wOptions").children.length)); $$(".optRemove").forEach(b=>b.onclick=()=>b.closest(".option-row").remove()); };
  $$(".optRemove").forEach(b=>b.onclick=()=>b.closest(".option-row").remove());
  wireWizNav(()=>{ w.step=4; renderWizard(c); }, ()=>{
    if(q.type==="truefalse"){
      // Cố định 2 phương án Đúng/Sai — giáo viên không cần (và không thể) nhập tay,

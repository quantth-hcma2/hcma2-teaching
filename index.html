async function finalizeWizard(){
  const w = STATE.wizard; const s = w.settings;
  const batch = writeBatch(db);
  const sessionRef = doc(collection(db,"sessions"));
  const firstQRef = doc(collection(db,"questions"));
  const cls = w.classesCache.find(x=>x.id===w.classId);
  const sessionData = {
    ownerId: STATE.user.uid, classId: w.classId, className: cls?cls.name:"", title: w.title, description: "",
    status: "ready", accessToken: genToken(28), shortCode: genShortCode(),
    showResults: s.showResults, allowMultipleResponses: s.allowMultipleResponses, anonymous: s.anonymous,
    showResponderCount: s.showResponderCount,
    startedAt: null, closedAt: null, createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
    questionCount: w.questions.length, responseCount: 0, activeQuestionId: null,
    activeQuestionStartedAt: null, sessionGroupId: null, roundNumber: 1
  };
  batch.set(sessionRef, sessionData);
  const joinCodeRef = doc(db,"joinCodes",sessionData.shortCode);
  batch.set(joinCodeRef, { sessionId: sessionRef.id, ownerId: STATE.user.uid, createdAt: serverTimestamp() });
  // FIX 8: ánh xạ accessToken -> sessionId, cho phép học viên tra cứu sessionId thật
  // bằng GET-theo-ID (không LIST được) mà không cần nhúng sessionId trực tiếp trong link/QR.
  const tokenRef = doc(db,"sessionTokens",sessionData.accessToken);
  batch.set(tokenRef, { sessionId: sessionRef.id, ownerId: STATE.user.uid, createdAt: serverTimestamp() });
  const qRefs = [];
  w.questions.forEach((q, i)=>{
    const qRef = i===0 ? firstQRef : doc(collection(db,"questions"));
    qRefs.push(qRef);
    const meta = QUESTION_TYPES[q.type];
    batch.set(qRef, {
      sessionId: sessionRef.id, ownerId: STATE.user.uid, order: i, type: q.type,
      question: q.question, description: q.description||"", required: true,
      chartType: q.chartType || meta.defaultChart, timeLimit: q.timeLimit||0,
      allowChangeAnswer: !!q.allowChangeAnswer,
      scaleMin: q.type==="scale"?q.scaleMin:null, scaleMax: q.type==="scale"?q.scaleMax:null,
      createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    });
    if(meta.needsOptions){
      q.options.forEach((optText, oi)=>{
        const optRef = doc(collection(db,"questions",qRef.id,"options"));
        batch.set(optRef, {
          label: String.fromCharCode(65+oi), text: optText, order: oi,
          value: q.type==="likert" ? (oi+1) : (q.type==="ranking" ? null : null),
          isCorrect: null, createdAt: serverTimestamp()
        });
      });
    }
    if(q.saveToLibrary){
      const libRef = doc(collection(db,"library"));
      batch.set(libRef,{
        ownerId:STATE.user.uid,
        category:q.libraryCategory||LIBRARY_CATEGORIES[0],
        type:q.type,
        question:q.question,
        description:q.description||"",
        options:meta.needsOptions?q.options:null,
        scaleMin:q.type==="scale"?q.scaleMin:null,
        scaleMax:q.type==="scale"?q.scaleMax:null,
        chartType:q.chartType||meta.defaultChart,
        createdAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      });
    }
  });
  await batch.commit();
  STATE.wizard = null;
  toast("Đã tạo phiên tương tác thành công!","ok");
  window.location.hash = "#/live/" + encodeURIComponent(sessionRef.id);
}

/* ============================================================
   CHART ENGINE (dùng chung: điều khiển trực tiếp, trình chiếu, báo cáo)
   ============================================================ */
const PALETTE = ["#155e75","#0891b2","#16a34a","#ca8a04","#dc2626","#7c3aed","#db2777","#0d9488","#ea580c","#4338ca"];

function optionIdFromStoredValue(raw, options){
  if(raw==null) return null;
  const s = String(raw);
  const direct = options.find(o=>String(o.id)===s);
  if(direct) return direct.id;
  const byText = options.find(o=>String(o.text??"")===s || String(o.value??"")===s);
  return byText ? byText.id : null;
}
function selectedOptionIds(response, options){
  const raw = Array.isArray(response?.selectedOptions) ? response.selectedOptions : [];
  return raw.map(v=>optionIdFromStoredValue(v, options)).filter(Boolean);
}
function safeScaleBounds(question){
  let min = Number(question.scaleMin), max = Number(question.scaleMax);
  if(!Number.isFinite(min)) min = 1;
  if(!Number.isFinite(max)) max = 10;
  min = Math.round(min); max = Math.round(max);
  if(max<min) [min,max]=[max,min];
  // Giới hạn để tránh DOM/chart bất thường nếu dữ liệu cũ bị sai.
  if(max-min>100) max=min+100;
  return {min,max};
}
function aggregateForChart(question, options, responseDocs){
  const type = question.type;
  if(type==="scale"){
    const {min,max}=safeScaleBounds(question);
    const labels=[]; for(let v=min;v<=max;v++) labels.push(String(v));
    const counts=labels.map(()=>0);
    responseDocs.forEach(r=>{
      const v=Number(r.answer);
      if(Number.isFinite(v) && Number.isInteger(v) && v>=min && v<=max) counts[v-min]++;
    });
    return { labels, datasets:[{
      label:"Số học viên",
      data:counts,
      backgroundColor:labels.map(()=>PALETTE[0]),
      borderRadius:6,
      borderSkipped:false
    }]};
  }
  if(type==="ranking"){
    const n=options.length;
    const scores={}; options.forEach(o=>scores[o.id]=0);
    responseDocs.forEach(r=>{
      const order=selectedOptionIds(r,options);
      const seen=new Set();
      order.forEach((optId,pos)=>{
        if(scores[optId]!=null && !seen.has(optId)){
          scores[optId] += Math.max(1,n-pos);
          seen.add(optId);
        }
      });
    });
    const sorted=[...options].sort((a,b)=>(scores[b.id]||0)-(scores[a.id]||0));
    return { labels:sorted.map(o=>o.text), datasets:[{
      label:"Điểm xếp hạng",
      data:sorted.map(o=>scores[o.id]||0),
      backgroundColor:sorted.map(()=>PALETTE[0]),
      borderRadius:6,
      borderSkipped:false
    }]};
  }
  if(type==="likert"){
    const total=responseDocs.length;
    const counts=options.map(o=>responseDocs.filter(r=>selectedOptionIds(r,options).includes(o.id)).length);
    if(question.chartType==="hbar"){
      return { labels:options.map(o=>o.text), datasets:[{
        label:"Số học viên",
        data:counts,
        backgroundColor:options.map((_,i)=>PALETTE[i%PALETTE.length]),
        borderRadius:6,
        borderSkipped:false
      }]};
    }
    return { labels:["Tỷ lệ"], datasets:options.map((o,i)=>({
      label:o.text,
      data:[total ? Math.round(counts[i]/total*1000)/10 : 0],
      backgroundColor:PALETTE[i%PALETTE.length],
      borderWidth:0
    }))};
  }
  // Một lựa chọn / Nhiều lựa chọn / Đúng-Sai.
  // Luôn giữ cả phương án 0 lượt để biểu đồ phản ánh đầy đủ bộ lựa chọn.
  const counts=options.map(o=>responseDocs.filter(r=>selectedOptionIds(r,options).includes(o.id)).length);
  return { labels:options.map(o=>o.text), datasets:[{
    label:type==="multiple"?"Lượt chọn":"Số học viên",
    data:counts,
    backgroundColor:options.map((_,i)=>PALETTE[i%PALETTE.length]),
    borderRadius:(question.chartType==="bar"||question.chartType==="hbar")?6:0,
    borderSkipped:false
  }]};
}

const percentLabelsPlugin = {
  id:"percentLabels",
  afterDatasetsDraw(chart, args, pluginOpts){
    if(!pluginOpts || pluginOpts.display===false) return;
    const chartType = chart.config.type;
    const isPie = chartType==="pie" || chartType==="doughnut";
    const isStacked = pluginOpts.mode==="stacked";
    const ctx = chart.ctx;
    ctx.save();
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.font=`700 ${pluginOpts.fontSize||12}px ${getComputedStyle(document.body).fontFamily||"Arial"}`;

    if(isPie){
      const ds = chart.data.datasets[0];
      const vals = (ds?.data||[]).map(v=>Number(v)||0);
      const total = vals.reduce((a,b)=>a+b,0);
      if(total>0){
        const meta = chart.getDatasetMeta(0);
        meta.data.forEach((arc,i)=>{
          const val=vals[i], pct=val/total*100;
          if(val<=0 || pct < (pluginOpts.minPercent||5)) return;
          const p=arc.tooltipPosition();
          ctx.fillStyle="#ffffff";
          ctx.fillText(`${Math.round(pct*10)/10}%`,p.x,p.y);
        });
      }
    }else if(isStacked){
      chart.data.datasets.forEach((ds,di)=>{
        const val=Number(ds.data?.[0])||0;
        if(val < (pluginOpts.minPercent||8)) return;
        const el=chart.getDatasetMeta(di).data?.[0];
        if(!el) return;
        const p=el.tooltipPosition();
        ctx.fillStyle="#ffffff";
        ctx.fillText(`${Math.round(val*10)/10}%`,p.x,p.y);
      });
    }
    ctx.restore();
  }
};

function chartOptions(question, chartType, agg, mode){
  const isReport=mode==="report", isPresentation=mode==="presentation";
  const base={
    responsive:true,
    maintainAspectRatio:false,
    animation:isReport?false:{duration:250},
    normalized:true,
    plugins:{
      legend:{
        display:chartType==="stacked"||chartType==="pie"||chartType==="donut",
        position:"bottom",
        labels:{boxWidth:14,padding:14,font:{size:isPresentation?14:12}}
      },
      tooltip:{enabled:true},
      percentLabels:{
        display:chartType==="pie"||chartType==="donut"||chartType==="stacked",
        mode:chartType==="stacked"?"stacked":"pie",
        minPercent:chartType==="stacked"?8:5,
        fontSize:isPresentation?16:(isReport?12:12)
      }
    }
  };

  if(chartType==="pie"||chartType==="donut"){
    base.plugins.tooltip.callbacks={
      label:(ctx)=>{
        const data=ctx.dataset.data||[];
        const total=data.reduce((a,b)=>a+(Number(b)||0),0);
        const val=Number(ctx.raw)||0;
        const pct=total?Math.round(val/total*1000)/10:0;
        return `${ctx.label}: ${val} (${pct}%)`;
      }
    };
    if(chartType==="donut") base.cutout="58%";
    return base;
  }

  if(chartType==="stacked"){
    base.indexAxis="y";
    base.scales={
      x:{stacked:true,beginAtZero:true,min:0,max:100,title:{display:true,text:"Tỷ lệ (%)"},ticks:{callback:v=>v+"%"}},
      y:{stacked:true,grid:{display:false}}
    };
    base.plugins.tooltip.callbacks={label:ctx=>`${ctx.dataset.label}: ${ctx.raw}%`};
    return base;
  }

  if(chartType==="hbar" || question.type==="ranking"){
    base.indexAxis="y";
    base.plugins.legend.display=false;
    base.scales={
      x:{beginAtZero:true,title:{display:true,text:question.type==="ranking"?"Điểm xếp hạng":"Số lượt"},ticks:{precision:0}},
      y:{grid:{display:false},ticks:{autoSkip:false}}
    };
    return base;
  }

  if(chartType==="distribution" || question.type==="scale"){
    const maxCount=Math.max(0,...((agg?.datasets?.[0]?.data)||[]).map(Number));
    base.plugins.legend.display=false;
    base.scales={
      x:{title:{display:true,text:"Điểm"},grid:{display:false},ticks:{autoSkip:false}},
      y:{beginAtZero:true,suggestedMax:Math.max(2,maxCount),title:{display:true,text:"Số học viên"},ticks:{precision:0,stepSize:1}}
    };
    base.plugins.tooltip.callbacks={label:ctx=>`${ctx.raw} học viên chọn điểm ${ctx.label}`};
    return base;
  }

  // Cột đứng mặc định.
  base.plugins.legend.display=false;
  base.scales={
    x:{grid:{display:false},ticks:{
      autoSkip:false,maxRotation:isPresentation?0:35,minRotation:0,
      font:{size:isPresentation?13:11},
      callback:function(value){
        const label=this.getLabelForValue(value);
        if(!isPresentation || typeof label!=="string" || label.length<=22) return label;
        const words=label.split(/\s+/); const lines=[]; let line="";
        words.forEach(w=>{ const next=(line+" "+w).trim(); if(next.length>22 && line){lines.push(line);line=w;}else line=next; });
        if(line) lines.push(line); return lines.slice(0,3);
      }
    }},
    y:{beginAtZero:true,title:{display:true,text:question.type==="multiple"?"Lượt chọn":"Số học viên"},ticks:{precision:0,stepSize:1}}
  };
  return base;
}
function chartSummaryHtml(question, options, responseDocs){
  const type=question.type;
  if(type==="scale"){
    const {min,max}=safeScaleBounds(question);
    const vals=responseDocs.map(r=>Number(r.answer)).filter(v=>Number.isFinite(v)&&v>=min&&v<=max);
    if(!vals.length) return "";
    const sorted=[...vals].sort((a,b)=>a-b);
    const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    const mid=Math.floor(sorted.length/2);
    const med=sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;
    return `<div class="chart-summary">
      <span class="metric"><b>Trung bình:</b> ${avg.toLocaleString("vi-VN",{maximumFractionDigits:2})}/${max}</span>
      <span class="metric"><b>Trung vị:</b> ${med.toLocaleString("vi-VN")}</span>
      <span class="metric"><b>Thấp nhất:</b> ${Math.min(...vals)}</span>
      <span class="metric"><b>Cao nhất:</b> ${Math.max(...vals)}</span>
    </div>`;
  }
  if(type==="ranking"){
    if(!responseDocs.length || !options.length) return "";
    const agg=aggregateForChart(question,options,responseDocs);
    const vals=agg.datasets[0]?.data||[];
    const score=Math.max(0,...vals);
    const winners=agg.labels.filter((_,i)=>Number(vals[i])===Number(score));
    const winnerText=winners.map(x=>esc(x)).join(" · ");
    return `<div class="chart-summary"><span class="metric"><b>Xếp hạng cao nhất:</b> ${winnerText||"—"} (${score} điểm)${winners.length>1?" — Đồng hạng":""}</span><span class="metric"><b>Cách tính:</b> hạng 1 = ${options.length} điểm → hạng ${options.length} = 1 điểm</span></div>`;
  }
  if(type==="likert"){
    if(!responseDocs.length || !options.length) return "";
    const indexById=new Map(options.map((o,i)=>[o.id,i+1]));
    const scores=responseDocs.map(r=>selectedOptionIds(r,options)[0]).map(id=>indexById.get(id)).filter(Number.isFinite);
    if(!scores.length) return "";
    const avg=scores.reduce((a,b)=>a+b,0)/scores.length;
    return `<div class="chart-summary"><span class="metric"><b>Điểm đồng thuận TB:</b> ${avg.toLocaleString("vi-VN",{maximumFractionDigits:2})}/${options.length}</span><span class="metric"><b>Tổng phản hồi:</b> ${responseDocs.length}</span></div>`;
  }
  if(type==="multiple"){
    const totalSelections=responseDocs.reduce((n,r)=>n+selectedOptionIds(r,options).length,0);
    return `<div class="chart-summary"><span class="metric"><b>Người trả lời:</b> ${responseDocs.length}</span><span class="metric"><b>Tổng lượt chọn:</b> ${totalSelections}</span></div>`;
  }
  if(type==="single"||type==="truefalse"){
    if(!responseDocs.length) return "";
    const agg=aggregateForChart(question,options,responseDocs);
    const vals=agg.datasets[0]?.data||[];
    const maxVal=Math.max(0,...vals);
    const winners=agg.labels.filter((_,i)=>Number(vals[i])===Number(maxVal) && maxVal>0);
    const winnerText=winners.map(x=>esc(x)).join(" · ");
    return `<div class="chart-summary"><span class="metric"><b>Người trả lời:</b> ${responseDocs.length}</span>${winners.length?`<span class="metric"><b>Được chọn nhiều nhất:</b> ${winnerText} (${maxVal})${winners.length>1?" — Đồng hạng":""}</span>`:""}</div>`;
  }
  return "";
}
let __chartInstances = {};
function destroyChartByCanvas(canvasEl){
  if(!canvasEl) return;
  const key=canvasEl.id;
  if(key && __chartInstances[key]){ try{__chartInstances[key].destroy();}catch(e){} delete __chartInstances[key]; }
  try{ const existing=Chart.getChart(canvasEl); if(existing) existing.destroy(); }catch(e){}
}
function renderChart(canvasEl, question, options, responseDocs, mode){
  if(!canvasEl) return;
  const chartType=question.chartType || QUESTION_TYPES[question.type].defaultChart;
  if(chartType==="list") return;
  try{
    const agg=aggregateForChart(question,options,responseDocs);
    destroyChartByCanvas(canvasEl);
    let type="bar";
    if(chartType==="pie") type="pie";
    else if(chartType==="donut") type="doughnut";
    const opts=chartOptions(question,chartType,agg,mode||"default");
    const key=canvasEl.id || ("chart_"+Math.random().toString(36).slice(2));
    if(!canvasEl.id) canvasEl.id=key;
    __chartInstances[key]=new Chart(canvasEl,{type,data:agg,options:opts,plugins:[percentLabelsPlugin]});
  }catch(e){
    console.warn("Không thể vẽ biểu đồ:",e);
    if(canvasEl.parentElement && !canvasEl.parentElement.querySelector(".chart-error")){
      canvasEl.parentElement.insertAdjacentHTML("beforeend",`<p class="hint chart-error">Không thể tải biểu đồ. Vui lòng tải lại trang.</p>`);
    }
  }
}
function renderAggregateChart(canvasEl, question, aggData, chartType, mode){
  if(!canvasEl || !aggData) return;
  try{
    destroyChartByCanvas(canvasEl);
    let type="bar";
    if(chartType==="pie") type="pie";
    else if(chartType==="donut") type="doughnut";
    const opts=chartOptions(question,chartType,aggData,mode||"default");
    const key=canvasEl.id || ("chart_"+Math.random().toString(36).slice(2));
    if(!canvasEl.id) canvasEl.id=key;
    __chartInstances[key]=new Chart(canvasEl,{type,data:aggData,options:opts,plugins:[percentLabelsPlugin]});
  }catch(e){ console.warn("Không thể vẽ biểu đồ tổng hợp:",e); }
}

/* ============================================================
   ĐIỀU KHIỂN PHIÊN TRỰC TIẾP (Teacher Live Control)
   ============================================================ */
async function teacherLiveControl(c, sessionId){
  c.innerHTML = `<div class="center-screen" style="min-height:300px;"><span class="spinner"></span></div>`;
  let sessionRef = doc(db,"sessions",sessionId);
  let sessionSnap;
  try{ sessionSnap = await getDoc(sessionRef); }catch(e){ c.innerHTML = errorBlock(e, ()=>teacherLiveControl(c,sessionId)); return; }
  if(!sessionSnap.exists()){ c.innerHTML = `<div class="empty-state"><div class="ic">🚫</div>Không tìm thấy phiên tương tác.</div>`; return; }
  let session = sessionSnap.data();
  if(session.ownerId !== STATE.user.uid){ c.innerHTML = `<div class="empty-state"><div class="ic">⛔</div>Bạn không có quyền truy cập phiên này.</div>`; return; }

  let questions = [];
  try{
    // FIX 11: kèm ownerId để truy vấn LIST questions phù hợp Security Rules
    const qs = await getDocs(query(collection(db,"questions"), where("ownerId","==",STATE.user.uid), where("sessionId","==",sessionId), orderBy("order","asc")));
    questions = qs.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){ c.innerHTML = errorBlock(e, ()=>teacherLiveControl(c,sessionId)); return; }
  if(questions.length===0){ c.innerHTML = `<div class="empty-state"><div class="ic">❓</div>Phiên này chưa có câu hỏi nào.</div>`; return; }

  const liveCounts = {};
  await Promise.all(questions.map(async q=>{
    try{ const cnt = await getCountFromServer(query(collection(db,"sessions",sessionId,"responses"), where("questionId","==",q.id))); liveCounts[q.id] = cnt.data().count; }
    catch(e){ liveCounts[q.id] = 0; }
  }));

  let curIndex = questions.findIndex(q=>q.id===session.activeQuestionId);
  if(curIndex<0) curIndex = 0;

  renderShell();

  function renderShell(){
    c.innerHTML = `
    <div class="flex-between no-print">
      <h2 style="margin:0;">${esc(session.title)}</h2>
      ${sessionStatusBadge(session.status)}
    </div>
    <div class="flex gap-8 mt-8 no-print" style="flex-wrap:wrap;">
      ${session.status==="ready"||session.status==="draft" ? `<button class="btn btn-ok" id="btnOpenSession">MỞ PHIÊN</button>`:""}
      ${session.status==="open" ? `<button class="btn btn-danger" id="btnCloseSession">ĐÓNG BÌNH CHỌN</button>`:""}
      ${session.status==="closed" ? `<button class="btn btn-warn" id="btnReopenSession">MỞ LẠI PHIÊN</button><button class="btn btn-ghost" id="btnArchiveSession">KẾT THÚC PHIÊN</button>`:""}
      <button class="btn btn-outline" id="btnShowQr" ${session.status==="draft"?"disabled":""}>HIỂN THỊ QR</button>
      <button class="btn btn-outline" id="btnPresent" ${session.status==="draft"?"disabled":""}>HIỂN THỊ TRÌNH CHIẾU</button>
      ${session.status!=="archived" ? `<button class="btn btn-outline" id="btnEditTime">⏱ ĐỔI THỜI GIAN</button>` : ""}
      <button class="btn ${session.showResults==='live'?'btn-warn':'btn-outline'}" id="btnToggleResults">${session.showResults==='live'?"ẨN KẾT QUẢ":"HIỂN THỊ KẾT QUẢ"}</button>
      <button class="btn btn-ghost" id="btnBackDash">← Về tổng quan</button>
    </div>
    <div class="live-grid mt-14">
      <div>
        <div class="card">
          <div class="qcount">${questions.map((q,i)=>`<button data-q="${i}" class="${i===curIndex?'active':''}">Câu ${i+1}</button>`).join("")}</div>
          <div class="flex-between no-print">
            <button class="btn btn-sm btn-outline" id="btnPrevQ" ${curIndex===0?"disabled":""}>← CÂU TRƯỚC</button>
            <button class="btn btn-sm btn-outline" id="btnNextQ" ${curIndex===questions.length-1?"disabled":""}>CÂU TIẾP →</button>
          </div>
          <h3 class="mt-14" id="curQText"></h3>
          <div id="curQBody"></div>
        </div>
      </div>
      <div>
        <div class="stat"><div class="num" id="respCount">0</div><div class="lbl">Học viên đã trả lời câu này</div></div>
        <div class="card mt-14"><div class="chart-box"><canvas id="liveChart"></canvas></div><div id="liveChartSummary"></div></div>
      </div>
    </div>`;
    $("#btnBackDash").onclick = ()=>{ window.location.hash=""; STATE.teacherNav="overview"; teacherRoute(); };
    $$(".qcount [data-q]").forEach(b=>b.onclick=()=>switchQuestion(Number(b.dataset.q)));
    if($("#btnPrevQ")) $("#btnPrevQ").onclick = ()=>switchQuestion(curIndex-1);
    if($("#btnNextQ")) $("#btnNextQ").onclick = ()=>switchQuestion(curIndex+1);
    if($("#btnOpenSession")) $("#btnOpenSession").onclick = openSession;
    if($("#btnCloseSession")) $("#btnCloseSession").onclick = closeSession;
    if($("#btnReopenSession")) $("#btnReopenSession").onclick = reopenSession;
    if($("#btnArchiveSession")) $("#btnArchiveSession").onclick = archiveSession;
    if($("#btnShowQr")) $("#btnShowQr").onclick = ()=>showQrModal(session, sessionId);
    if($("#btnPresent")) $("#btnPresent").onclick = ()=>window.open(`${APP_BASE_URL}?mode=presentation&sid=${encodeURIComponent(sessionId)}`, "_blank");
    if($("#btnEditTime")) $("#btnEditTime").onclick = editSessionTime;
    if($("#btnToggleResults")) $("#btnToggleResults").onclick = toggleResults;
    renderCurrentQuestion();
  }

  async function renderCurrentQuestion(){
    const q = questions[curIndex];
    $("#curQText").textContent = `Câu ${curIndex+1}: ${q.question}`;
    let options = [];
    if(QUESTION_TYPES[q.type].needsOptions){
      try{ const os = await getDocs(query(collection(db,"questions",q.id,"options"), orderBy("order","asc"))); options = os.docs.map(d=>({id:d.id,...d.data()})); }catch(e){}
    }
    if(q.type==="open"){
      $("#curQBody").innerHTML = `<div id="openList" class="mt-8"><div class="mut">Đang tải câu trả lời…</div></div>`;
    } else {
      $("#curQBody").innerHTML = `<p class="mut small">Biểu đồ: ${esc(CHART_LABELS[q.chartType])} · Thời gian: ${fmtDuration(q.timeLimit)}</p>`;
    }
    watchResponses(q, options);
  }
  function watchResponses(q, options){
    clearListeners();
    const respQ = query(collection(db,"sessions",sessionId,"responses"), where("questionId","==",q.id));
    track(onSnapshot(respQ, (snap)=>{
      const docs = snap.docs.map(d=>d.data());
      liveCounts[q.id] = docs.length;
      $("#respCount") && ($("#respCount").textContent = docs.length);
      const totalAll = Object.values(liveCounts).reduce((a,b)=>a+b,0);
      // Ghi lại dữ liệu tổng hợp AN TOÀN (không chứa câu trả lời cá nhân) vào session
      // để Presentation View / Student View (đăng nhập ẩn danh) có thể hiển thị
      // số lượt trả lời & biểu đồ mà KHÔNG cần quyền đọc trực tiếp responses.
      const agg = (q.type!=="open") ? aggregateForChart(q, options, docs) : null;
      // Với câu hỏi mở, chỉ đưa NỘI DUNG ẩn danh đã rút gọn sang session để Presentation
      // có thể dựng Opinion Wall. Không đưa participantId hay metadata cá nhân.
      const openAnswers = q.type==="open"
        ? docs
            .map(d=>({text:String(d.answer||"").trim(), ts:d.submittedAt?.toMillis?d.submittedAt.toMillis():0}))
            .filter(x=>x.text)
            .sort((a,b)=>b.ts-a.ts)
            .slice(0,24)
            .map(x=>x.text.slice(0,500))
        : null;
      updateDoc(sessionRef, {
        responseCount: totalAll, updatedAt: serverTimestamp(),
        liveAggregate: {
          questionId: q.id, chartType: q.chartType, agg, respondedCount: docs.length,
          openAnswers, updatedAt: Timestamp.now()
        }
      }).catch(()=>{});
      if(q.type==="open"){
        renderOpenList(docs);
      } else {
        const canvas = $("#liveChart");
        if(canvas) renderChart(canvas, q, options, docs, "live");
        const sm = $("#liveChartSummary");
        if(sm) sm.innerHTML = chartSummaryHtml(q, options, docs);
      }
    }, (err)=>{ toast(mapError(err),"err"); }));
    // vẫn theo dõi thay đổi trạng thái session (đóng/mở từ nơi khác)
    track(onSnapshot(sessionRef, (snap)=>{ if(snap.exists()){ session = snap.data(); } }));
  }
  function renderOpenList(docs){
    const el = $("#openList"); if(!el) return;
    const answers = docs.map(d=>d.answer).filter(Boolean);
    const freq = {};
    answers.join(" ").toLowerCase().replace(/[.,!?;:"'()]/g,"").split(/\s+/).forEach(w=>{ if(w.length>2) freq[w]=(freq[w]||0)+1; });
    const top = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8);
    el.innerHTML = `
      <p class="small mut">${answers.length} câu trả lời</p>
      ${top.length?`<div class="flex gap-8 mt-8" style="flex-wrap:wrap;">${top.map(([w,n])=>`<span class="chip">${esc(w)} × ${n}</span>`).join("")}</div>`:""}
      <div class="mt-14" style="max-height:260px;overflow:auto;">
        ${answers.length?answers.map(a=>`<div class="card" style="padding:10px 14px;margin-bottom:8px;">${esc(a)}</div>`).join(""):`<p class="mut">Chưa có câu trả lời nào.</p>`}
      </div>`;
  }

  function editSessionTime(){
    const currentSeconds = Number(questions[curIndex]?.timeLimit || 0);
    const isPreset = TIMER_PRESETS.some(t=>t.value===currentSeconds);
    openModal(`
      <div class="flex-between">
        <h3>⏱ Thay đổi thời gian trả lời</h3>
        <button type="button" class="btn btn-sm btn-ghost" id="editTimeClose">✕</button>
      </div>
      <p class="hint">Thời gian áp dụng cho <b>tất cả câu hỏi</b> trong phiên này.</p>
      <div class="field mt-14">
        <label>Thời gian trả lời mỗi câu</label>
        <select id="editTimePreset">
          ${TIMER_PRESETS.map(t=>`<option value="${t.value}" ${currentSeconds===t.value?"selected":""}>${esc(t.label)}</option>`).join("")}
          <option value="custom" ${!isPreset?"selected":""}>Tùy chỉnh…</option>
        </select>
      </div>
      <div class="field ${isPreset?"hidden":""}" id="editTimeCustomWrap">
        <label>Số phút tùy chỉnh</label>
        <input type="number" id="editTimeCustom" min="1" step="1" value="${currentSeconds ? Math.max(1, Math.round(currentSeconds/60)) : 10}">
        <p class="hint">Nhập số phút. Hệ thống tự chuyển sang giây để xử lý.</p>
      </div>
      <div class="card" style="padding:12px 14px;background:#f8fafc;box-shadow:none;">
        <p class="small" style="margin:0;"><b>Lưu ý:</b> nếu phiên đang mở, khi bấm Lưu hệ thống sẽ <b>khởi động lại bộ đếm của câu hiện tại từ đầu</b> theo thời gian mới. Học viên không cần quét lại QR.</p>
      </div>
      <div id="editTimeErr" class="error-text hidden mt-8"></div>
      <div class="flex-between mt-14">
        <button type="button" class="btn btn-ghost" id="editTimeCancel">Hủy</button>
        <button type="button" class="btn btn-ok" id="editTimeSave">LƯU THỜI GIAN</button>
      </div>
    `);
    const preset = $("#editTimePreset");
    const customWrap = $("#editTimeCustomWrap");
    preset.onchange = ()=>customWrap.classList.toggle("hidden", preset.value!=="custom");
    $("#editTimeClose").onclick = closeModal;
    $("#editTimeCancel").onclick = closeModal;
    $("#editTimeSave").onclick = async ()=>{
      const btn = $("#editTimeSave");
      const tv = preset.value;
      let seconds;
      if(tv==="custom"){
        const mins = Number($("#editTimeCustom").value);
        if(!Number.isFinite(mins) || mins < 1){
          $("#editTimeErr").textContent = "Vui lòng nhập số phút từ 1 trở lên.";
          $("#editTimeErr").classList.remove("hidden");
          return;
        }
        seconds = Math.round(mins * 60);
      }else{
        seconds = Number(tv);
      }
      btn.disabled = true;
      btn.textContent = "Đang lưu…";
      try{
        const batch = writeBatch(db);
        questions.forEach(q=>{
          batch.update(doc(db,"questions",q.id), {
            timeLimit: seconds,
            updatedAt: serverTimestamp()
          });
        });
        // Nếu phiên đang mở, reset mốc bắt đầu câu hiện tại để thời gian mới có hiệu lực ngay,
        // tránh tình trạng thời gian cũ đã hết khiến học viên vẫn thấy "Hết thời gian".
        if(session.status==="open"){
          batch.update(sessionRef, {
            activeQuestionStartedAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
        }else{
          batch.update(sessionRef, { updatedAt: serverTimestamp() });
        }
        await batch.commit();
        questions.forEach(q=>q.timeLimit = seconds);
        closeModal();
        toast(`Đã cập nhật thời gian: ${fmtDuration(seconds)} mỗi câu.${session.status==="open" ? " Bộ đếm câu hiện tại đã bắt đầu lại." : ""}`,"ok");
        renderShell();
      }catch(e){
        btn.disabled = false;
        btn.textContent = "LƯU THỜI GIAN";
        $("#editTimeErr").textContent = mapError(e);
        $("#editTimeErr").classList.remove("hidden");
      }
    };
  }

  async function switchQuestion(idx){
    if(idx<0 || idx>=questions.length) return;
    curIndex = idx;
    try{ await updateDoc(sessionRef, { activeQuestionId: questions[idx].id, activeQuestionStartedAt: serverTimestamp(), updatedAt: serverTimestamp() }); session.activeQuestionId = questions[idx].id; }
    catch(e){ toast(mapError(e),"err"); }
    renderShell();
  }
  async function openSession(){
    try{
      await updateDoc(sessionRef, { status:"open", startedAt: session.startedAt||serverTimestamp(), activeQuestionId: session.activeQuestionId||questions[0].id, activeQuestionStartedAt: serverTimestamp(), updatedAt: serverTimestamp() });
      session.status="open"; toast("Đã mở phiên. Học viên có thể tham gia ngay bây giờ.","ok"); renderShell();
    }catch(e){ toast(mapError(e),"err"); }
  }
  async function closeSession(){
    if(!confirm("Đóng bình chọn? Học viên sẽ không thể gửi câu trả lời mới.")) return;
    try{ await updateDoc(sessionRef, { status:"closed", closedAt: serverTimestamp(), updatedAt: serverTimestamp() }); session.status="closed"; toast("Đã đóng phiên.","ok"); renderShell(); }
    catch(e){ toast(mapError(e),"err"); }
  }
  async function reopenSession(){
    try{
      await updateDoc(sessionRef, {
        status:"open",
        closedAt:null,
        activeQuestionStartedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      session.status="open";
      toast("Đã mở lại phiên. Bộ đếm câu hiện tại đã bắt đầu lại.","ok");
      renderShell();
    }catch(e){ toast(mapError(e),"err"); }
  }
  async function archiveSession(){
    if(!confirm("Kết thúc và lưu trữ phiên này?")) return;
    try{ await updateDoc(sessionRef, { status:"archived", updatedAt: serverTimestamp() }); session.status="archived"; toast("Đã lưu trữ phiên.","ok"); window.location.hash=""; STATE.teacherNav="history"; teacherRoute(); }
    catch(e){ toast(mapError(e),"err"); }
  }
  async function toggleResults(){
    const next = session.showResults==="live" ? "hidden" : "live";
    try{ await updateDoc(sessionRef, { showResults: next, updatedAt: serverTimestamp() }); session.showResults = next; renderShell(); }
    catch(e){ toast(mapError(e),"err"); }
  }
}

async function loadTeacherClassMap(){
  const snap = await getDocs(query(collection(db,"classes"), where("ownerId","==",STATE.user.uid)));
  const m = {}; snap.docs.forEach(d=>m[d.id]=d.data()); return m;
}

async function deleteRefsInChunks(refs, chunkSize=400){
  for(let i=0;i<refs.length;i+=chunkSize){
    const batch = writeBatch(db);
    refs.slice(i,i+chunkSize).forEach(ref=>batch.delete(ref));
    await batch.commit();
  }
}
async function deleteSessionDeep(sessionId){
  const sRef = doc(db,"sessions",sessionId);
  const sSnap = await getDoc(sRef);
  if(!sSnap.exists()) throw {code:"not-found"};
  const s = sSnap.data();
  if(s.ownerId!==STATE.user.uid) throw {code:"permission-denied"};

  // Tránh xóa nhầm một phiên vẫn đang nhận câu trả lời.
  if(s.status==="open"){
    throw {code:"session-open-delete-blocked"};
  }

  // 1) Responses của phiên.
  const respSnap = await getDocs(collection(db,"sessions",sessionId,"responses"));
  await deleteRefsInChunks(respSnap.docs.map(d=>d.ref));

  // 2) Questions + options của từng question.
  const qSnap = await getDocs(query(
    collection(db,"questions"),
    where("ownerId","==",STATE.user.uid),
    where("sessionId","==",sessionId)
  ));
  for(const qDoc of qSnap.docs){
    const optSnap = await getDocs(collection(db,"questions",qDoc.id,"options"));
    await deleteRefsInChunks(optSnap.docs.map(d=>d.ref));
  }
  await deleteRefsInChunks(qSnap.docs.map(d=>d.ref));

  // 3) Các bản ánh xạ QR / mã tham gia.
  const mappingRefs = [];
  if(s.shortCode) mappingRefs.push(doc(db,"joinCodes",s.shortCode));
  if(s.accessToken) mappingRefs.push(doc(db,"sessionTokens",s.accessToken));
  if(mappingRefs.length) await deleteRefsInChunks(mappingRefs);

  // 4) Cuối cùng mới xóa session.
  await deleteDoc(sRef);
}
async function confirmAndDeleteSession(sessionId, title, afterDelete){
  const name = title ? `\\n\\n“${title}”` : "";
  if(!confirm(
    "XÓA VĨNH VIỄN PHIÊN NÀY?"+name+
    "\\n\\nHệ thống sẽ xóa phiên, câu hỏi, phương án, câu trả lời và mã QR/mã tham gia liên quan."+
    "\\n\\nDữ liệu báo cáo của phiên này sẽ không thể khôi phục."
  )) return;

  try{
    await deleteSessionDeep(sessionId);
    toast("Đã xóa vĩnh viễn phiên và dữ liệu liên quan.","ok");
    afterDelete && afterDelete();
  }catch(e){
    if((e.code||"")==="session-open-delete-blocked"){
      toast("Phiên đang mở. Vui lòng ĐÓNG PHIÊN trước khi xóa.","warn");
      return;
    }
    toast(mapError(e),"err");
    console.error("deleteSessionDeep", e);
  }
}


async function logAudit(action, entityType, entityId, detail={}){
  try{
    await addDoc(collection(db,"auditLogs"),{
      actorId:STATE.user?.uid||null,actorEmail:STATE.profile?.email||STATE.user?.email||"",
      actorName:STATE.profile?.displayName||"",actorRole:STATE.profile?.role||"",
      action,entityType,entityId,detail,createdAt:serverTimestamp()
    });
  }catch(e){ console.warn("audit log",e); }
}
async function moveSessionToTrash(sessionId,title,after){
  if(!confirm(`Chuyển phiên “${title||""}” vào Thùng rác?\n\nDữ liệu chưa bị xóa vĩnh viễn và có thể khôi phục.`)) return;
  try{
    const ref=doc(db,"sessions",sessionId),s=await getDoc(ref);
    if(!s.exists()) return;
    if(s.data().status==="open"){toast("Hãy đóng phiên trước khi chuyển vào Thùng rác.","warn");return;}
    await updateDoc(ref,{deletedAt:serverTimestamp(),deletedBy:STATE.user.uid,updatedAt:serverTimestamp()});
    await logAudit("trash","session",sessionId,{title:title||""});
    toast("Đã chuyển phiên vào Thùng rác.","ok"); after&&after();
  }catch(e){toast(mapError(e),"err");}
}
async function cloneSessionToWizard(sessionId){
  try{
    const sSnap=await getDoc(doc(db,"sessions",sessionId)); if(!sSnap.exists()) return;
    const s=sSnap.data();
    const qSnap=await getDocs(query(collection(db,"questions"),where("ownerId","==",STATE.user.uid),where("sessionId","==",sessionId),orderBy("order","asc")));
    const qs=[];
    for(const qd of qSnap.docs){
      const q=qd.data(); let opts=[];
      if(QUESTION_TYPES[q.type]?.needsOptions){
        const os=await getDocs(query(collection(db,"questions",qd.id,"options"),orderBy("order","asc")));
        opts=os.docs.map(x=>x.data().text);
      }
      qs.push({...blankQuestion(),question:q.question||"",description:q.description||"",type:q.type||"single",
        options:q.type==="truefalse"?QUESTION_TYPES.truefalse.fixedOptions.slice():(opts.length?opts:["",""]),
        chartType:q.chartType||null,scaleMin:q.scaleMin??1,scaleMax:q.scaleMax??5,required:q.required!==false,
        timeLimit:q.timeLimit||0,allowChangeAnswer:!!q.allowChangeAnswer});
    }
    initWizard();
    STATE.wizard.title=(s.title||"Phiên")+" - Bản sao";
    STATE.wizard.classId=s.classId||"";
    STATE.wizard.questions=qs.length?qs:[blankQuestion()];
    STATE.wizard.settings={...STATE.wizard.settings,timeLimit:s.timeLimit||0,showResults:s.showResults||"hidden",
      allowChangeAnswer:!!s.allowChangeAnswer,anonymous:s.anonymous!==false,showResponderCount:s.showResponderCount!==false,
      allowMultipleResponses:!!s.allowMultipleResponses};
    STATE.wizard.step=1;STATE.wizard.qIndex=0;
    await logAudit("clone_to_wizard","session",sessionId,{title:s.title||""});
    window.location.hash="#/wizard";toast("Đã nhân bản vào màn hình Tạo tương tác. Anh có thể đổi tên, lớp và câu hỏi trước khi lưu.","ok");
  }catch(e){toast(mapError(e),"err");console.error(e);}
}

function downloadBlob(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function csvEscape(v){ const s = String(v==null?"":v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportSessionCSV(session, className, questionBlocks){
  const rows = [["Cau hoi","Loai cau hoi","Ma nguoi tham gia","Cau tra loi","Thoi gian gui"]];
  questionBlocks.forEach(b=>{
    b.docs.forEach(d=>{
      let ans = d.answer;
      if(b.options && b.options.length && d.selectedOptions){
        ans = d.selectedOptions.map(oid=>{ const o=b.options.find(x=>x.id===oid); return o?o.text:oid; }).join(" | ");
      }
      rows.push([b.q.question, b.q.type, (d.participantId||"").slice(0,8), ans, d.submittedAt&&d.submittedAt.toDate?d.submittedAt.toDate().toISOString():""]);
    });
  });
  const csv = "﻿" + rows.map(r=>r.map(csvEscape).join(",")).join("\n");
  downloadBlob(`bao-cao-${session.shortCode||"session"}.csv`, csv, "text/csv;charset=utf-8;");
}
function exportSessionJSON(session, className, questionBlocks){
  const out = {
    hoatDong: session.title, lop: className, ngayTao: session.createdAt&&session.createdAt.toDate?session.createdAt.toDate().toISOString():null,
    cauHoi: questionBlocks.map(b=>({
      cauHoi: b.q.question, loai: b.q.type,
      phuongAn: b.options.map(o=>o.text),
      cauTraLoi: b.docs.map(d=>({participantId:d.participantId, answer:d.answer, selectedOptions:d.selectedOptions, submittedAt: d.submittedAt&&d.submittedAt.toDate?d.submittedAt.toDate().toISOString():null}))
    }))
  };
  downloadBlob(`bao-cao-${session.shortCode||"session"}.json`, JSON.stringify(out,null,2), "application/json");
}

function ensureAnonAuth(){
  // QUAN TRỌNG (FIX 7): dùng `publicAuth` (App Firebase thứ hai, độc lập) — KHÔNG BAO GIỜ
  // dùng `auth` (app chính của Giảng viên/Admin) ở đây. Nếu dùng chung `auth`, khi Học viên/
  // Trình chiếu mở trong cùng trình duyệt đang có Giảng viên đăng nhập, `auth.currentUser`
  // có thể chính là giảng viên đó — participantId của học viên sẽ bị trùng với uid giảng viên
  // (rất nguy hiểm). Dùng `publicAuth` tách biệt đảm bảo học viên luôn có một uid ẩn danh
  // riêng, không đụng chạm đến phiên đăng nhập giảng viên ở bất kỳ tab nào.
  return new Promise((resolve, reject)=>{
    const unsub = onAuthStateChanged(publicAuth, (user)=>{
      unsub();
      if(user){ resolve(user); return; }
      signInAnonymously(publicAuth).then(cred=>resolve(cred.user)).catch(reject);
    }, reject);
  });
}

      <div id="codeErr" class="error-text hidden" style="text-align:center;"></div>

    </form>`;
  $("#codeForm").onsubmit = (e)=>{
    e.preventDefault();
    const v = $("#joinCodeInput").value.trim().toUpperCase();
    if(!v){ $("#codeErr").textContent="Vui lòng nhập mã tham gia."; $("#codeErr").classList.remove("hidden"); return; }
    resolveShortCode(v);
  };
}
async function resolveShortCode(code){
  $("#studentBody").innerHTML = `<div class="center-screen" style="min-height:200px;"><span class="spinner"></span></div>`;
  try{
    const snap = await getDoc(doc(publicDb,"joinCodes",code));
    if(!snap.exists()){ studentBodyError("Không tìm thấy mã tham gia. Vui lòng kiểm tra lại.", showCodeEntryForm); return; }
    return enterStudentSession(snap.data().sessionId);
  }catch(e){ studentBodyError(mapError(e), ()=>resolveShortCode(code)); }
}
async function enterStudentSession(sessionId){
  $("#studentBody").innerHTML = `<div class="center-screen" style="min-height:200px;"><span class="spinner"></span></div>`;
  let snap;
  try{ snap = await getDoc(doc(publicDb,"sessions",sessionId)); }
  catch(e){
    if((e.code||"")==="permission-denied"){ studentBodyError("Phiên chưa mở hoặc không tồn tại. Vui lòng thử lại sau.", showCodeEntryForm); }
    else studentBodyError(mapError(e), ()=>enterStudentSession(sessionId));
    return;
  }
  if(!snap.exists()){ studentBodyError("Không tìm thấy phiên tương tác.", showCodeEntryForm); return; }
  STATE.student.sessionId = sessionId;
  watchStudentSession(sessionId);
}
let __studentLastQid = null, __studentTimerHandle = null;
function watchStudentSession(sessionId){
  clearListeners();
  __studentLastQid = null;
  const sref = doc(publicDb,"sessions",sessionId);
  track(onSnapshot(sref, (snap)=>{
    if(!snap.exists()){ studentBodyError("Phiên tương tác đã bị xóa.", showCodeEntryForm); return; }
    const session = snap.data();
    STATE.student.session = session;
    if(session.status==="closed" || session.status==="archived"){ renderStudentEnded(session); return; }
    if(session.status!=="open"){ renderStudentWaiting("Phiên chưa được mở. Vui lòng chờ giảng viên bắt đầu."); return; }
    if(!session.activeQuestionId){ renderStudentWaiting("Giảng viên chưa bắt đầu câu hỏi nào."); return; }
    if(session.activeQuestionId !== __studentLastQid){
      __studentLastQid = session.activeQuestionId;
      loadStudentQuestion(sessionId, session);
    } else {
      updateStudentResultBadge(session);
    }
  }, (err)=>{ studentBodyError(mapError(err), ()=>watchStudentSession(sessionId)); }));
}
function renderStudentWaiting(msg){
  if(__studentTimerHandle) clearInterval(__studentTimerHandle);
  $("#studentBody").innerHTML = `<div class="center-screen" style="min-height:220px;">
    <div style="font-size:40px;">⏳</div><h3>${esc(msg)}</h3>
    <p class="mut small">Màn hình sẽ tự động cập nhật khi giảng viên bắt đầu.</p></div>`;
}
function renderStudentEnded(session){
  if(__studentTimerHandle) clearInterval(__studentTimerHandle);
  $("#studentBody").innerHTML = `<div class="center-screen" style="min-height:220px;">
    <div style="font-size:40px;">🏁</div><h2>PHIÊN ĐÃ KẾT THÚC</h2>
    <p class="mut">Cảm ơn bạn đã tham gia "${esc(session.title)}".</p></div>`;
}
async function loadStudentQuestion(sessionId, session){
  if(__studentTimerHandle) clearInterval(__studentTimerHandle);
  $("#studentBody").innerHTML = `<div class="center-screen" style="min-height:200px;"><span class="spinner"></span></div>`;
  try{
    const qSnap = await getDoc(doc(publicDb,"questions",session.activeQuestionId));
    if(!qSnap.exists()){ studentBodyError("Không tìm thấy câu hỏi hiện tại."); return; }
    const question = { id: qSnap.id, ...qSnap.data() };
    let options = [];
    if(QUESTION_TYPES[question.type].needsOptions){
      const os = await getDocs(query(collection(publicDb,"questions",question.id,"options"), orderBy("order","asc")));
      options = os.docs.map(d=>({id:d.id, ...d.data()}));
    }
    let existing = null;
    try{ const rs = await getDoc(doc(publicDb,"sessions",sessionId,"responses", question.id+"_"+publicAuth.currentUser.uid)); if(rs.exists()) existing = rs.data(); }catch(e){}
    STATE.student.question = question; STATE.student.options = options; STATE.student.myResponse = existing;
    renderStudentQuestion(sessionId, session, question, options, existing);
  }catch(e){ studentBodyError(mapError(e), ()=>loadStudentQuestion(sessionId, session)); }
}
function renderStudentQuestion(sessionId, session, question, options, existing){
  const alreadyLocked = existing && !question.allowChangeAnswer;
  const header = `
    <div class="flex-between">
      ${session.className?`<span class="chip">${esc(session.className)}</span>`:"<span></span>"}
      <span id="timerPill"></span>
    </div>
    <h3 class="mt-8">${esc(question.question)}</h3>
    ${question.description?`<p class="mut small">${esc(question.description)}</p>`:""}`;
  if(alreadyLocked){
    $("#studentBody").innerHTML = header + `
      <div class="center-screen" style="min-height:140px;">
        <div style="font-size:34px;">✓</div><h3>ĐÃ GHI NHẬN</h3>
        <p class="mut">Bạn đã trả lời câu hỏi này.</p>
        <div id="resultBadge"></div>
      </div>`;
    setupTimer(session, question, null);
    updateStudentResultBadge(session);
    return;
  }
  let bodyHtml = `<div id="answerArea"></div><div id="submitErr" class="error-text hidden mt-8"></div>
    <button class="btn btn-block btn-lg mt-14" id="btnSubmitAns">GỬI CÂU TRẢ LỜI</button>`;
  $("#studentBody").innerHTML = header + bodyHtml;
  const answerState = { selected: existing?(existing.selectedOptions||[]):[], scaleVal: existing?existing.answer:null, openText: existing?existing.answer:"", rankOrder: existing&&existing.selectedOptions?existing.selectedOptions.slice():options.map(o=>o.id) };
  renderAnswerInput(question, options, answerState);
  setupTimer(session, question, ()=>{
    // hết giờ
    $("#answerArea").innerHTML = "";
    $("#btnSubmitAns").classList.add("hidden");
    $("#studentBody").insertAdjacentHTML("beforeend", `<div class="center-screen" style="min-height:100px;"><h3>ĐÃ HẾT THỜI GIAN</h3></div>`);
  });
  $("#btnSubmitAns").onclick = async ()=>{
    const err = validateAnswer(question, answerState);
    if(err){ $("#submitErr").textContent = err; $("#submitErr").classList.remove("hidden"); return; }
    const btn = $("#btnSubmitAns"); btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> Đang gửi…';
    try{
      const payload = buildAnswerPayload(question, answerState);
      await setDoc(doc(publicDb,"sessions",sessionId,"responses", question.id+"_"+publicAuth.currentUser.uid), {
        sessionId, questionId: question.id, participantId: publicAuth.currentUser.uid, submittedAt: serverTimestamp(), ...payload
      });
      $("#studentBody").innerHTML = header + `
        <div class="center-screen" style="min-height:140px;">
          <div style="font-size:34px;">✓</div><h3>ĐÃ GHI NHẬN</h3>
          <p class="mut">Câu trả lời của bạn đã được ghi nhận.</p>
          <div id="resultBadge"></div>
        </div>`;
      updateStudentResultBadge(session);
    }catch(err){
      let msg = mapError(err);
      if((err.code||"")==="permission-denied") msg = "Bạn đã trả lời câu hỏi này hoặc phiên đã đóng.";
      $("#submitErr").textContent = msg; $("#submitErr").classList.remove("hidden");
      btn.disabled = false; btn.textContent = "GỬI CÂU TRẢ LỜI";
    }
  };
}
function setupTimer(session, question, onExpire){
  const pill = ()=>$("#timerPill");
  if(!question.timeLimit || !session.activeQuestionStartedAt){ if(pill()) pill().innerHTML=""; return; }
  const deadline = session.activeQuestionStartedAt.toDate().getTime() + question.timeLimit*1000;
  function tick(){
    const remain = Math.max(0, Math.round((deadline - Date.now())/1000));
    if(pill()) pill().innerHTML = `<span class="timer-pill">⏱ ${remain}s</span>`;
    if(remain<=0){ clearInterval(__studentTimerHandle); if(onExpire) onExpire(); }
  }
  tick();
  __studentTimerHandle = setInterval(tick, 1000);
}
function updateStudentResultBadge(session){
  const el = $("#resultBadge"); if(!el) return;
  const agg = session.liveAggregate;
  if(!agg || agg.questionId !== STATE.student.question?.id){ el.innerHTML = ""; return; }
  if(session.showResults === "live" && agg.agg){
    el.innerHTML = `<div class="chart-box chart-box-sm" style="max-width:360px;margin:10px auto 0;"><canvas id="stResultChart"></canvas></div>`;
    const canvas = $("#stResultChart");
    if(canvas){
      try{
        const key = "stResultChart";
        if(__chartInstances[key]){ __chartInstances[key].destroy(); delete __chartInstances[key]; }
        const chartType = agg.chartType;
        renderAggregateChart(canvas, STATE.student.question, agg.agg, chartType, "student");
      }catch(e){ console.warn("Không thể vẽ biểu đồ kết quả:", e); if(session.showResponderCount!==false){ el.insertAdjacentHTML("beforeend", `<p class="mut">${agg.respondedCount} người đã trả lời</p>`); } }
    }
  } else {
    el.innerHTML = session.showResponderCount!==false ? `<p class="mut">${agg.respondedCount} người đã trả lời</p>` : "";
  }
}
function renderAnswerInput(question, options, state){
  const area = $("#answerArea"); if(!area) return;
  const type = question.type;
  if(type==="single" || type==="truefalse" || type==="likert"){
    area.innerHTML = options.map(o=>`<button type="button" class="opt-btn ${state.selected[0]===o.id?'selected':''}" data-opt="${o.id}"><span class="mark">${state.selected[0]===o.id?'✓':''}</span>${esc(o.text)}</button>`).join("");
    $$("#answerArea .opt-btn").forEach(b=>b.onclick=()=>{ state.selected=[b.dataset.opt]; renderAnswerInput(question, options, state); });
  } else if(type==="multiple"){
    area.innerHTML = options.map(o=>`<button type="button" class="opt-btn ${state.selected.includes(o.id)?'selected':''}" data-opt="${o.id}"><span class="mark">${state.selected.includes(o.id)?'✓':''}</span>${esc(o.text)}</button>`).join("");
    $$("#answerArea .opt-btn").forEach(b=>b.onclick=()=>{
      const id=b.dataset.opt; const i=state.selected.indexOf(id);
      if(i>=0) state.selected.splice(i,1); else state.selected.push(id);
      renderAnswerInput(question, options, state);
    });
  } else if(type==="scale"){
    const vals = []; for(let v=question.scaleMin; v<=question.scaleMax; v++) vals.push(v);
    area.innerHTML = `<div class="flex gap-8" style="flex-wrap:wrap;justify-content:center;">
      ${vals.map(v=>`<button type="button" class="opt-btn" style="width:56px;justify-content:center;padding:12px 0;${state.scaleVal===v?'border-color:var(--brand);background:var(--brand-light);':''}" data-v="${v}">${v}</button>`).join("")}
    </div>`;
    $$("#answerArea [data-v]").forEach(b=>b.onclick=()=>{ state.scaleVal = Number(b.dataset.v); renderAnswerInput(question, options, state); });
  } else if(type==="ranking"){
    area.innerHTML = `<p class="hint">Dùng nút ▲▼ để sắp xếp thứ tự ưu tiên (từ cao xuống thấp).</p>` + state.rankOrder.map((id,idx)=>{
      const o = options.find(x=>x.id===id);
      return `<div class="opt-btn" style="cursor:default;"><span class="mark">${idx+1}</span><span style="flex:1;">${esc(o?o.text:"")}</span>
        <button type="button" class="btn btn-sm btn-ghost" data-up="${idx}" ${idx===0?"disabled":""}>▲</button>
        <button type="button" class="btn btn-sm btn-ghost" data-down="${idx}" ${idx===state.rankOrder.length-1?"disabled":""}>▼</button></div>`;
    }).join("");
    $$("#answerArea [data-up]").forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.up); [state.rankOrder[i-1],state.rankOrder[i]]=[state.rankOrder[i],state.rankOrder[i-1]]; renderAnswerInput(question,options,state); });
    $$("#answerArea [data-down]").forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.down); [state.rankOrder[i+1],state.rankOrder[i]]=[state.rankOrder[i],state.rankOrder[i+1]]; renderAnswerInput(question,options,state); });
  } else if(type==="open"){
    area.innerHTML = `<textarea id="openAnswerInput" placeholder="Nhập câu trả lời của bạn…" style="min-height:120px;">${esc(state.openText||"")}</textarea>`;
    $("#openAnswerInput").oninput = (e)=>{ state.openText = e.target.value; };
  }
}
function validateAnswer(question, state){
  const type = question.type;
  if(type==="single"||type==="truefalse"||type==="likert"){ if(state.selected.length!==1) return "Vui lòng chọn một phương án."; }
  else if(type==="multiple"){ if(state.selected.length<1) return "Vui lòng chọn ít nhất một phương án."; }
  else if(type==="scale"){ if(state.scaleVal==null || state.scaleVal<question.scaleMin || state.scaleVal>question.scaleMax) return "Vui lòng chọn một giá trị trên thang điểm."; }
  else if(type==="ranking"){ if(!state.rankOrder || state.rankOrder.length<2) return "Danh sách xếp hạng không hợp lệ."; }
  else if(type==="open"){ if(!state.openText || !state.openText.trim()) return "Vui lòng nhập câu trả lời."; }
  return null;
}
function buildAnswerPayload(question, state){
  const type = question.type;
  if(type==="single"||type==="truefalse"||type==="likert") return { selectedOptions: state.selected, answer: null };
  if(type==="multiple") return { selectedOptions: state.selected, answer: null };
  if(type==="scale") return { selectedOptions: [], answer: state.scaleVal };
  if(type==="ranking") return { selectedOptions: state.rankOrder, answer: null };
  if(type==="open") return { selectedOptions: [], answer: state.openText.trim() };
  return { selectedOptions: [], answer: null };
}

/* ============================================================
   PRESENTATION MODE (màn hình chiếu, 16:9, fullscreen)
   ============================================================ */
function renderPresentationEntry(){
  appRoot().innerHTML = `<div class="pres-shell" id="presRoot"><span class="spinner"></span></div>`;
  presMainFlow();
}
async function presMainFlow(){
  try{ await ensureAnonAuth(); }catch(e){ $("#presRoot").innerHTML = `<div class="qtext">⚠️ ${esc(mapError(e))}</div>`; return; }
  const q = getQueryParams(); const sid = q.get("sid");
  if(!sid){ $("#presRoot").innerHTML = `<div class="qtext">⚠️ Thiếu mã phiên trình chiếu.</div>`; return; }
  watchPresentation(sid);
}
function watchPresentation(sid){
  clearListeners();
  let lastQid = null, questionCache = null, optionsCache = [];
  const sref = doc(publicDb,"sessions",sid);
  track(onSnapshot(sref, async (snap)=>{
    if(!snap.exists()){ $("#presRoot").innerHTML = `<div class="qtext">⚠️ Không tìm thấy phiên.</div>`; return; }
    const session = snap.data();
    if(session.status==="draft" || session.status==="ready"){ renderPresWaiting(session, sid); return; }
    if(session.status==="closed" || session.status==="archived"){ renderPresEnded(session); return; }
    if(!session.activeQuestionId){ renderPresWaiting(session, sid); return; }
    if(session.activeQuestionId !== lastQid){
      lastQid = session.activeQuestionId;
      try{
        const qSnap = await getDoc(doc(publicDb,"questions",session.activeQuestionId));
        questionCache = qSnap.exists() ? { id:qSnap.id, ...qSnap.data() } : null;
        optionsCache = [];
        if(questionCache && QUESTION_TYPES[questionCache.type].needsOptions){
          const os = await getDocs(query(collection(publicDb,"questions",questionCache.id,"options"), orderBy("order","asc")));
          optionsCache = os.docs.map(d=>({id:d.id,...d.data()}));
        }
      }catch(e){ questionCache = null; }
    }
    renderPresQuestion(session, sid, questionCache, optionsCache);
  }, (err)=>{
    if((err.code||"")==="permission-denied"){
      $("#presRoot").innerHTML = `<div class="qtext">Phiên trình chiếu chưa sẵn sàng.</div><div class="meta">Vui lòng mở phiên từ Bảng điều khiển giảng viên trước.</div>`;
    } else { $("#presRoot").innerHTML = `<div class="qtext">⚠️ ${esc(mapError(err))}</div>`; }
  }));
}
function presTopBar(){
  return `<button class="btn btn-sm btn-outline no-print" id="btnPresFs" style="position:fixed;top:14px;right:14px;z-index:10;">⛶ Toàn màn hình</button>`;
}
function wirePresFs(){
  const b = $("#btnPresFs"); if(!b) return;
  b.onclick = ()=>{ if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); } else { document.exitFullscreen?.(); } };
}

function openPresentationQrPopup(session, sid){
  const existing = document.getElementById("presQrPopup");
  if(existing) existing.remove();

  const overlay = document.createElement("div");
  overlay.id = "presQrPopup";
  overlay.className = "pres-qr-popup";
  overlay.setAttribute("role","dialog");
  overlay.setAttribute("aria-modal","true");
  overlay.setAttribute("aria-label","Mã QR tham gia phiên");
  overlay.innerHTML = `
    <div class="pres-qr-popup-card">
      <button type="button" class="pres-qr-popup-close" id="btnClosePresQr" aria-label="Đóng mã QR">✕</button>
      <div class="pres-qr-popup-title">QUÉT MÃ QR ĐỂ THAM GIA</div>
      <div class="pres-qr-popup-sub">Dành cho học viên ở xa màn hình trình chiếu</div>
      <div id="presQrBig"></div>
      ${session.shortCode ? `<div class="pres-qr-popup-code">${esc(session.shortCode)}</div>` : ""}
    </div>`;
  document.body.appendChild(overlay);

  const holder = document.getElementById("presQrBig");
  try{
    new QRCode(holder, {
      text: studentJoinUrl(session, sid),
      width:560,
      height:560,
      colorDark:"#000000",
      colorLight:"#ffffff",
      correctLevel: QRCode.CorrectLevel ? QRCode.CorrectLevel.H : undefined
    });
  }catch(e){
    holder.innerHTML = `<p style="color:#991b1b;">Không thể tạo mã QR. Vui lòng đóng và thử lại.</p>`;
  }

  const closePopup = ()=>{ const el=document.getElementById("presQrPopup"); if(el) el.remove(); };
  $("#btnClosePresQr").onclick = closePopup;
  overlay.addEventListener("click", e=>{ if(e.target===overlay) closePopup(); });
  overlay.addEventListener("keydown", e=>{ if(e.key==="Escape") closePopup(); });
  overlay.tabIndex = -1;
  overlay.focus();
}
function wirePresentationQrPopup(session, sid){
  const wrap = $("#presQrWrap");
  if(!wrap) return;
  wrap.onclick = ()=>openPresentationQrPopup(session, sid);
  wrap.onkeydown = e=>{
    if(e.key==="Enter" || e.key===" "){
      e.preventDefault();
      openPresentationQrPopup(session, sid);
    }
  };
}

function renderPresWaiting(session, sid){
  $("#presRoot").innerHTML = `${presTopBar()}
    <div class="meta">${esc(session.className||"")} · ${esc(session.title)}</div>
    <div class="qtext">Đang chờ giảng viên bắt đầu…</div>
    <div class="pres-qr-wrap clickable" id="presQrWrap" role="button" tabindex="0" aria-label="Phóng to mã QR">
      <div id="presQr"></div>
      <p style="font-weight:800;font-size:20px;margin-top:8px;">${esc(session.shortCode||"")}</p>
      <div class="pres-qr-hint">🔍 Nhấp để phóng to mã QR</div>
    </div>`;
  wirePresFs();
  try{ new QRCode(document.getElementById("presQr"), { text: studentJoinUrl(session, sid), width:180, height:180 }); }catch(e){}
  wirePresentationQrPopup(session, sid);
}
function renderPresEnded(session){
  $("#presRoot").innerHTML = `${presTopBar()}<div class="qtext">PHIÊN ĐÃ KẾT THÚC</div><div class="meta">${esc(session.title)}</div>`;
  wirePresFs();
}
function renderPresQuestion(session, sid, question, options){
  if(!question){ $("#presRoot").innerHTML = `${presTopBar()}<div class="qtext">Đang tải câu hỏi…</div>`; wirePresFs(); return; }
  const agg = session.liveAggregate && session.liveAggregate.questionId===question.id ? session.liveAggregate : null;
  const count = agg ? agg.respondedCount : 0;
  const showChart = session.showResults==="live" && agg && agg.agg && question.chartType!=="list";
  const showOpenWall = question.type==="open" && session.showResults==="live" && agg;
  const openAnswers = showOpenWall && Array.isArray(agg.openAnswers) ? agg.openAnswers : [];
  $("#presRoot").innerHTML = `${presTopBar()}
    <div class="meta">${esc(session.className||"")} · ${esc(session.title)}</div>
    <div class="qtext">${esc(question.question)}</div>
    ${session.showResponderCount!==false?`<div class="mut" style="color:#fff;opacity:.85;margin-bottom:16px;">${count} người đã trả lời</div>`:`<div style="margin-bottom:16px;"></div>`}
    <div class="pres-grid">
      ${showChart?`<div class="pres-chart-wrap"><div class="chart-box chart-box-lg"><canvas id="presChart"></canvas></div></div>`:""}
      ${showOpenWall ? (openAnswers.length
        ? `<div class="pres-open-wall">${openAnswers.map((a,i)=>`<div class="pres-open-card"><div class="num">Ý kiến ${i+1}</div>${esc(a)}</div>`).join("")}</div>`
        : `<div class="pres-open-empty">Đang chờ ý kiến của học viên…</div>`) : ""}
      <div class="pres-qr-wrap clickable" id="presQrWrap" role="button" tabindex="0" aria-label="Phóng to mã QR">
        <div id="presQr"></div>
        <p style="font-weight:800;font-size:20px;margin-top:8px;">${esc(session.shortCode||"")}</p>
        <div class="pres-qr-hint">🔍 Nhấp để phóng to mã QR</div>
      </div>
    </div>`;
  wirePresFs();
  try{ new QRCode(document.getElementById("presQr"), { text: studentJoinUrl(session, sid), width:160, height:160 }); }catch(e){}
  wirePresentationQrPopup(session, sid);
  if(showChart){
    const canvas = $("#presChart");
    if(canvas){
      try{
        const key="presChart";
        if(__chartInstances[key]){ __chartInstances[key].destroy(); delete __chartInstances[key]; }
        const chartType = agg.chartType;
        renderAggregateChart(canvas, question, agg.agg, chartType, "presentation");
      }catch(e){ console.warn("Không thể vẽ biểu đồ trình chiếu:", e); }
    }
  }
}

/* Giữ kích thước biểu đồ ổn định khi trình duyệt chuyển sang chế độ in/PDF. */
window.addEventListener("beforeprint", ()=>{
  Object.values(__chartInstances).forEach(ch=>{ try{ ch.resize(); ch.update("none"); }catch(e){} });
});
window.addEventListener("afterprint", ()=>{
  setTimeout(()=>Object.values(__chartInstances).forEach(ch=>{ try{ ch.resize(); }catch(e){} }),50);
});

boot();

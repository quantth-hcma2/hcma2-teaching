<style>
/* ============================================================
   HCMA2 - TEACHING — Stylesheet
   ============================================================ */
:root{
  --brand:#155e75; --brand-dark:#0e4a5c; --brand-light:#e8f4f7;
  --accent:#0891b2; --ok:#16a34a; --warn:#ca8a04; --danger:#dc2626;
  --bg:#f6f8f9; --card:#ffffff; --text:#1f2937; --text-mute:#6b7280;
  --border:#e5e7eb; --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; line-height:1.5; font-size:15px;
}
#app{min-height:100vh;}
h1,h2,h3,h4{margin:0 0 8px; font-weight:700; line-height:1.3;}
p{margin:0 0 10px;}
a{color:var(--accent);}
button, input, select, textarea{font-family:inherit; font-size:inherit;}
.hidden{display:none !important;}
.container{max-width:1180px; margin:0 auto; padding:0 16px;}
.narrow{max-width:480px;}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 18px; border-radius:10px; border:1px solid transparent;
  background:var(--brand); color:#fff; font-weight:600; cursor:pointer;
  min-height:44px; transition:filter .15s, transform .05s; text-decoration:none;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-sm{padding:7px 12px; min-height:34px; font-size:13px; border-radius:8px;}
.btn-lg{padding:15px 26px; font-size:16px; min-height:52px; border-radius:12px;}
.btn-outline{background:#fff; color:var(--brand); border-color:var(--brand);}
.btn-ghost{background:transparent; color:var(--text); border-color:var(--border);}
.btn-danger{background:var(--danger);}
.btn-warn{background:var(--warn);}
.btn-ok{background:var(--ok);}
.btn-block{width:100%;}
.btn-icon{padding:8px; min-width:40px;}
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:3px solid #93c5fd; outline-offset:2px;
}

/* Cards / layout */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px;}
.card + .card{margin-top:14px;}
.grid{display:grid; gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

/* Forms */
label{display:block; font-weight:600; font-size:13px; margin-bottom:5px; color:#374151;}
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date],
select, textarea{
  width:100%; padding:11px 12px; border:1.5px solid var(--border); border-radius:9px;
  background:#fff; color:var(--text); min-height:44px;
}
textarea{min-height:88px; resize:vertical;}
.field{margin-bottom:14px;}
.hint{font-size:12.5px; color:var(--text-mute); margin-top:4px;}
.error-text{font-size:13px; color:var(--danger); margin-top:6px;}

/* Topbar */
.topbar{
  background:var(--brand); color:#fff; padding:0 16px; height:60px;
  display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:40;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.topbar .brand{font-weight:800; font-size:17px; letter-spacing:.3px; display:flex; align-items:center; gap:8px;}
.topbar .brand small{font-weight:500; opacity:.85; font-size:11px;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.topbar select, .topbar .who{color:#fff;}
.who{font-size:13px; opacity:.9;}
.hamburger{display:none; background:transparent; border:none; color:#fff; font-size:22px; cursor:pointer;}

/* Shell with sidebar */
.shell{display:flex; min-height:calc(100vh - 60px);}
.sidebar{
  width:230px; background:#fff; border-right:1px solid var(--border); padding:14px 10px; flex-shrink:0;
}
.sidebar button.navlink{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none;
  padding:11px 12px; border-radius:9px; cursor:pointer; color:var(--text); font-weight:600; font-size:14px; margin-bottom:2px;
}
.sidebar button.navlink:hover{background:var(--brand-light);}
.sidebar button.navlink.active{background:var(--brand); color:#fff;}
.main{flex:1; padding:20px; min-width:0;}
@media(max-width:820px){
  .sidebar{position:fixed; left:-250px; top:60px; bottom:0; z-index:50; transition:left .2s; box-shadow:2px 0 10px rgba(0,0,0,.15); overflow:auto;}
  .sidebar.open{left:0;}
  .hamburger{display:block;}
  .main{padding:14px;}
}

/* Tables */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th,td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:middle;}
th{color:var(--text-mute); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.4px;}
tr:hover td{background:#fafbfc;}
.table-wrap{overflow-x:auto;}

/* Badges */
.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700;}
.badge-green{background:#dcfce7; color:#166534;}
.badge-yellow{background:#fef9c3; color:#854d0e;}
.badge-red{background:#fee2e2; color:#991b1b;}
.badge-gray{background:#f1f5f9; color:#475569;}
.badge-blue{background:#dbeafe; color:#1e40af;}

/* Stat tiles */
.stat{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
.stat .num{font-size:30px; font-weight:800; color:var(--brand);}
.stat .lbl{font-size:13px; color:var(--text-mute); font-weight:600; margin-top:2px;}

/* Toast */
#toast-root{position:fixed; top:16px; right:16px; z-index:999; display:flex; flex-direction:column; gap:8px; max-width:340px;}
.toast{background:#1f2937; color:#fff; padding:12px 16px; border-radius:10px; box-shadow:0 6px 16px rgba(0,0,0,.25); font-size:13.5px; animation:slidein .18s ease-out;}
.toast.ok{background:#166534;} .toast.err{background:#991b1b;} .toast.warn{background:#92400e;}
@keyframes slidein{from{transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;}}

/* Loading */
.spinner{width:22px; height:22px; border:3px solid rgba(0,0,0,.12); border-top-color:var(--brand); border-radius:50%; animation:spin .7s linear infinite; display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.center-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:24px; text-align:center;}

/* Auth screens */
.auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,var(--brand),#0891b2); padding:20px;}
.auth-card{background:#fff; border-radius:16px; width:100%; max-width:420px; padding:32px 28px; box-shadow:0 20px 50px rgba(0,0,0,.25);}
.auth-logo{text-align:center; margin-bottom:18px;}
.auth-logo .t1{font-size:22px; font-weight:800; color:var(--brand);}
.auth-logo .t2{font-size:12px; color:var(--text-mute); letter-spacing:1px; text-transform:uppercase;}
.tabbar{display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:18px;}
.tabbar button{flex:1; padding:10px; border:none; background:#f8fafc; cursor:pointer; font-weight:700; color:var(--text-mute);}
.tabbar button.active{background:var(--brand); color:#fff;}

/* Wizard */
.wizard-steps{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px;}
.wizard-steps .step{padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700; background:#f1f5f9; color:var(--text-mute);}
.wizard-steps .step.active{background:var(--brand); color:#fff;}
.wizard-steps .step.done{background:var(--ok); color:#fff;}
.wizard-nav{display:flex; justify-content:space-between; margin-top:20px; gap:10px;}
.option-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.option-row input[type=text]{flex:1;}
.type-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.type-card{border:2px solid var(--border); border-radius:12px; padding:14px; cursor:pointer; text-align:center;}
.type-card:hover{border-color:var(--accent);}
.type-card.active{border-color:var(--brand); background:var(--brand-light);}
.type-card .ic{font-size:26px; margin-bottom:6px;}
.type-card .nm{font-weight:700; font-size:13px;}

/* Live control */
.live-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
@media(max-width:900px){.live-grid{grid-template-columns:1fr;}}
.qcount{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0;}
.qcount button{border:1.5px solid var(--border); background:#fff; border-radius:8px; padding:6px 10px; cursor:pointer; font-weight:700; font-size:12.5px;}
.qcount button.active{background:var(--brand); color:#fff; border-color:var(--brand);}
.qcount button.answered::after{content:" ✓";}

/* Student view */
.student-shell{min-height:100vh; background:var(--brand); display:flex; flex-direction:column;}
.student-top{color:#fff; text-align:center; padding:18px 16px 8px;}
.student-top .logo{font-weight:800; font-size:15px; letter-spacing:1px;}
.student-card{background:#fff; border-radius:20px 20px 0 0; flex:1; padding:22px 18px 40px; margin-top:10px;}
.opt-btn{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:15px 16px; margin-bottom:10px;
  border:2px solid var(--border); border-radius:12px; background:#fff; cursor:pointer; font-size:15px; font-weight:600;
}
.opt-btn .mark{width:22px; height:22px; border-radius:50%; border:2px solid #cbd5e1; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;}
.opt-btn.selected{border-color:var(--brand); background:var(--brand-light);}
.opt-btn.selected .mark{background:var(--brand); border-color:var(--brand);}
.opt-btn.correct{border-color:var(--ok); background:#f0fdf4;}
.opt-btn.wrong{border-color:var(--danger); background:#fef2f2;}
.timer-pill{display:inline-flex; align-items:center; gap:6px; background:#fff2; color:#fff; border-radius:999px; padding:6px 14px; font-weight:700; font-size:13px;}

/* Presentation */
.pres-shell{background:#0b2530; color:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center;}
.pres-shell .qtext{font-size:clamp(22px,4vw,40px); font-weight:800; max-width:1000px; margin-bottom:20px;}
.pres-shell .meta{opacity:.75; margin-bottom:26px; font-size:15px;}
.pres-grid{display:flex; gap:40px; align-items:center; flex-wrap:wrap; justify-content:center;}
.pres-chart-wrap{width:min(760px,90vw); background:#fff; border-radius:16px; padding:20px;}
.pres-qr-wrap{background:#fff; border-radius:16px; padding:18px; text-align:center;}

/* Misc */
.flex{display:flex; align-items:center;}
.flex-between{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.gap-8{gap:8px;} .gap-12{gap:12px;}
.mt-8{margin-top:8px;} .mt-14{margin-top:14px;} .mt-20{margin-top:20px;}
.mut{color:var(--text-mute);}
.small{font-size:12.5px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.chip{display:inline-block; padding:4px 10px; border-radius:999px; background:#f1f5f9; font-size:12px; font-weight:700; margin-right:6px;}
.empty-state{text-align:center; padding:50px 20px; color:var(--text-mute);}
.empty-state .ic{font-size:40px; margin-bottom:10px;}
.modal-backdrop{position:fixed; inset:0; background:rgba(15,23,32,.55); display:flex; align-items:center; justify-content:center; z-index:200; padding:16px;}
.modal{background:#fff; border-radius:16px; padding:24px; max-width:520px; width:100%; max-height:90vh; overflow:auto;}
.modal-lg{max-width:820px;}
@media print{
  .no-print{display:none !important;}
  body{background:#fff;}
}
</style>
</head>

function genToken(len){
  len = len || 28;
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  let out = "";
  for(let i=0;i<len;i++) out += chars[arr[i] % chars.length];
  return out;
}
function genShortCode(){
  const L = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const N = "0123456789";
  let code = "";
  for(let i=0;i<3;i++) code += L[Math.floor(Math.random()*L.length)];
  code += "-";
  for(let i=0;i<3;i++) code += N[Math.floor(Math.random()*N.length)];
  return code;
}

  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),300); }, 3800);
}

    "auth/email-already-in-use":"Email này đã được đăng ký. Vui lòng đăng nhập.",
    "auth/weak-password":"Mật khẩu quá yếu. Vui lòng dùng ít nhất 6 ký tự.",
    "auth/too-many-requests":"Bạn đã thử quá nhiều lần. Vui lòng thử lại sau ít phút.",
    "auth/network-request-failed":"Mất kết nối mạng. Vui lòng kiểm tra Internet và thử lại.",
    "auth/popup-closed-by-user":"Cửa sổ đăng nhập đã bị đóng.",
    "auth/operation-not-allowed":"Phương thức đăng nhập chưa được bật trong Firebase.",
    "permission-denied":"Bạn không có quyền thực hiện thao tác này.",
    "unavailable":"Không thể kết nối máy chủ. Đang thử kết nối lại…",
    "deadline-exceeded":"Kết nối quá chậm. Vui lòng thử lại.",
    "not-found":"Không tìm thấy dữ liệu yêu cầu.",
    "already-exists":"Dữ liệu đã tồn tại.",
    "resource-exhausted":"Hệ thống đang quá tải. Vui lòng thử lại sau."
  };
  if(map[code]) return map[code];
  if(!navigator.onLine) return "Mất kết nối mạng. Đang thử kết nối lại…";
  return "Đã xảy ra lỗi. Vui lòng thử lại. (" + (code || "unknown") + ")";
}

/* ---------------- Trạng thái toàn cục ---------------- */
const STATE = {
  user: null,        // firebase auth user (email/password, hoặc anonymous cho student/presentation)
  profile: null,      // users/{uid} doc data (chỉ có với teacher/admin)
  authReady: false,
  listeners: [],       // các onSnapshot đang mở, dọn dẹp khi đổi route
  teacherNav: "overview",
  adminNav: "overview",
  wizard: null,        // trạng thái wizard tạo phiên
  student: { sessionId:null, token:null, session:null, question:null, options:[], myResponse:null },
};
function clearListeners(){ STATE.listeners.forEach(u=>{ try{u();}catch(e){} }); STATE.listeners = []; }
function track(unsub){ STATE.listeners.push(unsub); return unsub; }

/* ---------------- FIX 10: theo dõi trạng thái tài khoản (users/{uid}) theo thời gian thực ---------------- */
// Đây là một listener ĐỘC LẬP với clearListeners()/STATE.listeners ở trên (vốn bị dọn dẹp
// mỗi khi đổi route/tab điều hướng) — nó phải tồn tại xuyên suốt cả phiên làm việc của
// Giảng viên/Admin để phát hiện ngay khi Admin khóa (suspended) tài khoản đang mở Dashboard,
// thay vì chỉ kiểm tra một lần lúc đăng nhập.
let __profileUnsub = null;
function startProfileWatch(uid){
  stopProfileWatch();
  __profileUnsub = onSnapshot(doc(db,"users",uid), (snap)=>{
    if(!snap.exists()) return; // lỗi mạng thoáng qua hoặc tài khoản đang được tạo — giữ nguyên UI
    const prevStatus = STATE.profile ? STATE.profile.status : null;
    const newProfile = snap.data();
    STATE.profile = newProfile;
    if(prevStatus === "active" && newProfile.status !== "active"){
      // Admin vừa đổi trạng thái (suspended/pending/khác) trong khi Dashboard đang mở:
      // dừng NGAY các listener nghiệp vụ khác (lớp/phiên/câu hỏi/phản hồi...) vì từ giờ
      // Firestore Rules sẽ từ chối chúng, rồi khóa màn hình lập tức.
      clearListeners();
      renderInternalApp();
      toast("Tài khoản của bạn vừa bị quản trị viên thay đổi trạng thái.", "warn");
    }
  }, (err)=>{ /* best-effort — bỏ qua lỗi tạm thời, không làm gián đoạn phiên làm việc */ });
}
function stopProfileWatch(){ if(__profileUnsub){ try{ __profileUnsub(); }catch(e){} __profileUnsub = null; } }

/* ---------------- Router ---------------- */
// Bên ngoài (không cần đăng nhập): ?mode=student  ?mode=presentation  ?join=TOKEN
// Bên trong (teacher/admin, sau đăng nhập): dùng hash routing, ví dụ #/classes #/sessions/xxx/live
function getQueryParams(){ return new URLSearchParams(window.location.search); }
function getMode(){
  const q = getQueryParams();
  if(q.has("join")) return "student";
  return q.get("mode");
}
function navigateHash(hash){ window.location.hash = hash; }
window.addEventListener("hashchange", ()=>{
  if(!STATE.profile) return;
  clearListeners();
  if(STATE.profile.role==="admin") adminRoute(STATE.adminNav);
  else if(STATE.profile.role==="teacher") teacherRoute();
});

/* ---------------- Modal / form helpers dùng chung ---------------- */
function openModal(html, large){
  let host = document.getElementById("globalModal");
  if(!host){ host = document.createElement("div"); host.id="globalModal"; document.body.appendChild(host); }
  host.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal ${large?'modal-lg':''}">${html}</div></div>`;
  $("#modalBackdrop").addEventListener("click", (e)=>{ if(e.target.id==="modalBackdrop") closeModal(); });
  return host;
}
function closeModal(){ const h = document.getElementById("globalModal"); if(h) h.innerHTML=""; }

/* ---------------- Khởi động ---------------- */
function boot(){
  const mode = getMode();
  if(mode === "student"){
    clearListeners();
    renderStudentEntry();
    return;
  }
  if(mode === "presentation"){
    clearListeners();
    renderPresentationEntry();
    return;
  }
  // Mặc định: màn hình đăng nhập giảng viên/admin
  onAuthStateChanged(auth, async (user) => {
    STATE.authReady = true;
    // Khi đang trong luồng đăng ký thủ công (authFlowLock), luồng đó tự chịu
    // trách nhiệm render để tránh việc onAuthStateChanged "chen ngang" xóa mất
    // form đang thao tác giữa chừng (race condition giữa tạo tài khoản Auth và
    // ghi hồ sơ Firestore users/{uid}).
    if(authFlowLock) return;
    if(!user){ stopProfileWatch(); STATE.user = null; STATE.profile = null; renderAuthScreen(); return; }
    if(user.isAnonymous){
      // Người dùng ẩn danh không thuộc luồng teacher/admin — quay lại màn hình đăng nhập.
      stopProfileWatch(); STATE.user = null; STATE.profile = null; renderAuthScreen(); return;
    }
    await loadProfileAndRenderForUser(user);
  });
}
let authFlowLock = false;
async function loadProfileAndRenderForUser(user){
  STATE.user = user;
  try{
    const snap = await getDoc(doc(db,"users",user.uid));
    STATE.profile = snap.exists() ? snap.data() : null;
  }catch(e){
    toast(mapError(e), "err");
    STATE.profile = null;
  }
  if(!STATE.profile){ stopProfileWatch(); renderNeedsProfileScreen(); return; }
  // cập nhật lastLoginAt (best-effort, không chặn UI)
  updateDoc(doc(db,"users",user.uid), { lastLoginAt: serverTimestamp(), updatedAt: serverTimestamp() }).catch(()=>{});
  // FIX 10: bắt đầu theo dõi trạng thái tài khoản theo thời gian thực, xuyên suốt phiên làm việc.
  startProfileWatch(user.uid);
  renderInternalApp();
}

function renderRegisterForm(){

  $("#regForm").onsubmit = async (e)=>{

    $("#regErr").classList.add("hidden");
    // Đọc toàn bộ giá trị form NGAY TỪ ĐẦU (trước khi có bất kỳ await nào),
    // vì DOM có thể bị vẽ lại giữa chừng nếu onAuthStateChanged kích hoạt.
    const name = $("#regName").value.trim();
    const email = $("#regEmail").value.trim();
    const pass = $("#regPass").value;
    authFlowLock = true; // tạm khóa render tự động từ onAuthStateChanged

      });

/* ---------------- Sau khi có profile: điều hướng theo role/status ---------------- */
function renderInternalApp(){
  const p = STATE.profile;
  if(!p) return renderNeedsProfileScreen();
  if(p.status === "pending"){
    appRoot().innerHTML = pendingSuspendedScreen("⏳","Tài khoản của bạn đang chờ quản trị viên cấp phép.","Vui lòng quay lại sau, hoặc liên hệ quản trị viên hệ thống.");
    $("#btnLogoutX").onclick = ()=>signOut(auth);
    return;
  }
  if(p.status === "suspended"){
    appRoot().innerHTML = pendingSuspendedScreen("🔒","Tài khoản của bạn đã bị tạm khóa.","Vui lòng liên hệ quản trị viên.");
    $("#btnLogoutX").onclick = ()=>signOut(auth);
    return;
  }
  if(p.status !== "active"){
    appRoot().innerHTML = pendingSuspendedScreen("⚠️","Tài khoản không ở trạng thái hoạt động.","Vui lòng liên hệ quản trị viên.");
    $("#btnLogoutX").onclick = ()=>signOut(auth);
    return;
  }
  if(p.role === "admin") return renderAdminShell();
  if(p.role === "teacher") return renderTeacherShell();
  appRoot().innerHTML = pendingSuspendedScreen("⚠️","Vai trò tài khoản không hợp lệ.","Vui lòng liên hệ quản trị viên.");
  $("#btnLogoutX").onclick = ()=>signOut(auth);

async function adminOverview(c){
  c.innerHTML = `<h2>HCMA2 - TEACHING - SYSTEM OVERVIEW</h2><div class="grid grid-4" id="ovGrid"></div>
    <div class="card mt-20"><h3>Giảng viên chờ cấp phép gần đây</h3><div id="ovPending" class="table-wrap"><div class="mut">Đang tải…</div></div></div>`;
  try{
    const usersCol = collection(db,"users");
    const [total, active, pending, suspended, classesCnt, sessionsCnt] = await Promise.all([
      getCountFromServer(query(usersCol, where("role","==","teacher"))),
      getCountFromServer(query(usersCol, where("role","==","teacher"), where("status","==","active"))),
      getCountFromServer(query(usersCol, where("role","==","teacher"), where("status","==","pending"))),
      getCountFromServer(query(usersCol, where("role","==","teacher"), where("status","==","suspended"))),
      getCountFromServer(collection(db,"classes")),
      getCountFromServer(collection(db,"sessions")),
    ]);
    let respCount = 0;
    try{ const r = await getCountFromServer(collectionGroup(db,"responses")); respCount = r.data().count; }catch(e){ respCount = null; }
    const tiles = [
      [total.data().count, "Tổng giảng viên"],
      [active.data().count, "Đang hoạt động"],
      [pending.data().count, "Chờ cấp phép"],
      [suspended.data().count, "Đã khóa"],
      [classesCnt.data().count, "Tổng lớp"],
      [sessionsCnt.data().count, "Tổng phiên"],
      [respCount==null?"—":respCount, "Tổng lượt trả lời"],
    ];
    $("#ovGrid").innerHTML = tiles.map(([n,l])=>`<div class="stat"><div class="num">${n}</div><div class="lbl">${esc(l)}</div></div>`).join("");
    const pendingQ = query(usersCol, where("role","==","teacher"), where("status","==","pending"), orderBy("createdAt","desc"), limit(10));
    const snap = await getDocs(pendingQ);
    if(snap.empty){ $("#ovPending").innerHTML = `<div class="empty-state"><div class="ic">✅</div>Không có giảng viên nào đang chờ cấp phép.</div>`; }
    else{
      $("#ovPending").innerHTML = `<table><thead><tr><th>Tên</th><th>Email</th><th>Ngày đăng ký</th><th></th></tr></thead><tbody>
        ${snap.docs.map(d=>{ const u=d.data(); return `<tr><td>${esc(u.displayName||"—")}</td><td>${esc(u.email)}</td><td>${fmtDate(u.createdAt)}</td>
          <td><button class="btn btn-sm btn-ok" data-approve="${d.id}">DUYỆT</button></td></tr>`; }).join("")}
      </tbody></table>`;
      $$("[data-approve]").forEach(b=>b.onclick=()=>approveTeacher(b.dataset.approve, ()=>adminOverview(c)));
    }
  }catch(e){
    c.innerHTML = errorBlock(e, ()=>adminOverview(c));
  }
}
function errorBlock(e, retryFn){
  console.error(e);
  return `<div class="card"><div class="empty-state"><div class="ic">⚠️</div><p>${esc(mapError(e))}</p>
    <button class="btn btn-outline" id="btnRetryErr">THỬ LẠI</button></div></div>`
    + (()=>{ setTimeout(()=>{ const b=$("#btnRetryErr"); if(b) b.onclick=retryFn; },0); return ""; })();
}

        <td>${fmtDate(u.lastLoginAt)}</td>

          ${u.status==="active"?`<button class="btn btn-sm btn-danger" data-a="suspend" data-id="${u.id}">KHÓA</button>`:""}
          ${u.status==="suspended"?`<button class="btn btn-sm btn-ok" data-a="reactivate" data-id="${u.id}">MỞ KHÓA</button>`:""}
          <button class="btn btn-sm btn-outline" data-a="detail" data-id="${u.id}">XEM CHI TIẾT</button>
          <button class="btn btn-sm btn-ghost" data-a="reset" data-id="${u.id}">GỬI LINK ĐẶT LẠI MẬT KHẨU</button>
        </td>
      </tr>`).join("")}</tbody></table>`;
    $$("[data-a]").forEach(b=>{
      b.onclick = ()=>{
        const id=b.dataset.id, act=b.dataset.a;
        const u = adminTeacherCache.find(x=>x.id===id);
        if(act==="approve") approveTeacher(id);
        else if(act==="suspend") suspendTeacher(id);
        else if(act==="reactivate") reactivateTeacher(id);
        else if(act==="reset") sendResetLink(u.email);
        else if(act==="detail") showTeacherDetail(u);
      };
    });
  }
}

    }
  }catch(e){ $("#tOvGrid").innerHTML = errorBlock(e, ()=>teacherOverview(c)); }

function openClassForm(existing){
  openModal(`

    <form id="classForm">
      <div class="field"><label>Tên lớp *</label><input type="text" id="clName" required value="${existing?esc(existing.name):""}" placeholder="Ví dụ: K76.A01"></div>

      <div class="field"><label>Khóa học</label><input type="text" id="clYear" value="${existing?esc(existing.academicYear||""):""}" placeholder="Ví dụ: 2025-2026"></div>
      <div class="field"><label>Sĩ số</label><input type="number" id="clCount" min="0" value="${existing&&existing.studentCount!=null?existing.studentCount:""}"></div>
      <div class="field"><label>Mô tả</label><textarea id="clDesc">${existing?esc(existing.description||""):""}</textarea></div>
      <div id="clErr" class="error-text hidden"></div>
      <div class="flex-between mt-14">
        <button type="button" class="btn btn-ghost" id="clCancel">Hủy</button>
        <button type="submit" class="btn" id="clSave">${existing?"Lưu thay đổi":"Tạo lớp"}</button>
      </div>
    </form>`);
  $("#clCancel").onclick = closeModal;
  $("#classForm").onsubmit = async (e)=>{
    e.preventDefault();
    const name = $("#clName").value.trim();
    if(!name){ $("#clErr").textContent="Tên lớp không được để trống."; $("#clErr").classList.remove("hidden"); return; }
    const data = {
      name, code: $("#clCode").value.trim(), academicYear: $("#clYear").value.trim(),
      studentCount: $("#clCount").value? Number($("#clCount").value) : null,
      description: $("#clDesc").value.trim(), status:"active", updatedAt: serverTimestamp()
    };
    const btn = $("#clSave"); btn.disabled = true;
    try{
      if(existing){ await updateDoc(doc(db,"classes",existing.id), data); toast("Đã lưu thay đổi lớp học.","ok"); }
      else{ data.ownerId = STATE.user.uid; data.createdAt = serverTimestamp(); await addDoc(collection(db,"classes"), data); toast("Đã tạo lớp học mới.","ok"); }
      closeModal();
    }catch(err){ $("#clErr").textContent = mapError(err); $("#clErr").classList.remove("hidden"); }
    finally{ btn.disabled=false; }
  };
}

    </div>
    <div class="grid grid-3 mt-14" id="libGrid"><div class="mut">Đang tải…</div></div>`;
  $("#btnNewLib").onclick = ()=>openLibraryForm(null);
  const uid = STATE.user.uid;
  const q = query(collection(db,"library"), where("ownerId","==",uid), orderBy("createdAt","desc"));
  let cache = [];
  track(onSnapshot(q, (snap)=>{
    cache = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderLib("");
  }, (err)=>{ $("#libGrid").innerHTML = errorBlock(err, ()=>teacherLibrary(c)); }));
  $$("#libFilterBar .chip").forEach(b=>b.onclick=()=>{
    $$("#libFilterBar .chip").forEach(x=>x.style.cssText="cursor:pointer;");
    b.style.cssText="cursor:pointer;border:1.5px solid var(--brand);color:var(--brand);";
    renderLib(b.dataset.cat);
  });
  function renderLib(cat){
    const list = cat ? cache.filter(x=>x.category===cat) : cache;
    if(list.length===0){ $("#libGrid").innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="ic">📚</div>Thư viện trống. Hãy lưu câu hỏi để dùng lại sau.</div>`; return; }

        </div>
      </div>`).join("");
    $$("[data-e]").forEach(b=>b.onclick=()=>openLibraryForm(cache.find(x=>x.id===b.dataset.e)));
    $$("[data-cp]").forEach(b=>b.onclick=async ()=>{
      const item = cache.find(x=>x.id===b.dataset.cp);
      const {id, createdAt, updatedAt, ...rest} = item;
      try{ await addDoc(collection(db,"library"), {...rest, question: rest.question+" (bản sao)", createdAt:serverTimestamp(), updatedAt:serverTimestamp()}); toast("Đã sao chép câu hỏi.","ok"); }
      catch(e){ toast(mapError(e),"err"); }
    });
    $$("[data-d]").forEach(b=>b.onclick=async ()=>{
      if(!confirm("Xóa câu hỏi này khỏi thư viện?")) return;
      try{ await deleteDoc(doc(db,"library",b.dataset.d)); toast("Đã xóa.","ok"); }catch(e){ toast(mapError(e),"err"); }
    });
  }
}
function openLibraryForm(existing){
  const type = existing?.type || "single";
  openModal(`
    <h3>${existing?"Sửa câu hỏi thư viện":"Lưu câu hỏi vào thư viện"}</h3>
    <form id="libForm">
      <div class="field"><label>Phân loại</label><select id="libCat">${LIBRARY_CATEGORIES.map(cat=>`<option ${existing&&existing.category===cat?"selected":""}>${esc(cat)}</option>`).join("")}</select></div>
      <div class="field"><label>Loại câu hỏi</label><select id="libType">${Object.entries(QUESTION_TYPES).map(([k,v])=>`<option value="${k}" ${type===k?"selected":""}>${v.icon} ${esc(v.label)}</option>`).join("")}</select></div>
      <div class="field"><label>Nội dung câu hỏi *</label><textarea id="libQ" required>${existing?esc(existing.question):""}</textarea></div>
      <div class="field" id="libOptWrap"></div>
      <div id="libErr" class="error-text hidden"></div>
      <div class="flex-between mt-14">
        <button type="button" class="btn btn-ghost" id="libCancel">Hủy</button>
        <button type="submit" class="btn">${existing?"Lưu thay đổi":"Lưu vào thư viện"}</button>
      </div>
    </form>`, true);
  $("#libCancel").onclick = closeModal;
  function renderOptEditor(){
    const t = $("#libType").value;
    if(t==="truefalse"){
      // Đúng/Sai luôn cố định — không cho sửa, nhưng VẪN được ghi vào Firestore khi lưu.
      $("#libOptWrap").innerHTML = `<label>Phương án</label><p class="hint">Câu hỏi Đúng/Sai luôn có sẵn 2 phương án cố định: <strong>Đúng</strong> và <strong>Sai</strong> (không cần nhập tay).</p>`;
      return;
    }
    if(!QUESTION_TYPES[t].needsOptions){ $("#libOptWrap").innerHTML = `<p class="hint">Loại câu hỏi này không cần phương án cố định.</p>`; return; }
    const opts = (existing && existing.type===t && existing.options) ? existing.options : ["",""];
    $("#libOptWrap").innerHTML = `<label>Phương án</label><div id="libOptions">${opts.map((o,i)=>optionRowHtml(o,i)).join("")}</div>
      <button type="button" class="btn btn-sm btn-outline" id="libAddOpt">+ Thêm phương án</button>`;
    $("#libAddOpt").onclick = ()=>{ $("#libOptions").insertAdjacentHTML("beforeend", optionRowHtml("", $("#libOptions").children.length)); wireOptRemove(); };
    wireOptRemove();
  }
  function wireOptRemove(){ $$(".optRemove").forEach(b=>b.onclick=()=>b.closest(".option-row").remove()); }
  $("#libType").onchange = renderOptEditor;
  renderOptEditor();
  $("#libForm").onsubmit = async (e)=>{
    e.preventDefault();
    const t = $("#libType").value, qtext = $("#libQ").value.trim();
    if(!qtext){ $("#libErr").textContent="Nội dung câu hỏi không được để trống."; $("#libErr").classList.remove("hidden"); return; }
    let options = null;
    if(t==="truefalse"){
      // Luôn ghi cố định 2 phương án Đúng/Sai vào Firestore, bất kể trạng thái UI.
      options = QUESTION_TYPES.truefalse.fixedOptions.slice();
    } else if(QUESTION_TYPES[t].needsOptions){
      options = $$("#libOptions .optText").map(i=>i.value.trim()).filter(v=>v);
      if(options.length<2){ $("#libErr").textContent="Cần ít nhất 2 phương án."; $("#libErr").classList.remove("hidden"); return; }
    }
    const data = { category: $("#libCat").value, type:t, question:qtext, options, updatedAt: serverTimestamp() };
    try{
      if(existing){ await updateDoc(doc(db,"library",existing.id), data); toast("Đã lưu thay đổi.","ok"); }
      else{ data.ownerId = STATE.user.uid; data.createdAt = serverTimestamp(); await addDoc(collection(db,"library"), data); toast("Đã lưu vào thư viện.","ok"); }
      closeModal();
    }catch(err){ $("#libErr").textContent = mapError(err); $("#libErr").classList.remove("hidden"); }
  };
}
function optionRowHtml(val, idx){
  return `<div class="option-row"><input type="text" class="optText" value="${esc(val)}" placeholder="Phương án ${idx+1}"><button type="button" class="btn btn-sm btn-ghost optRemove">✕</button></div>`;
}

/* ============================================================
   WIZARD TẠO PHIÊN TƯƠNG TÁC (9 bước)
   ============================================================ */
const WIZARD_STEP_LABELS = ["Tên hoạt động","Chọn lớp","Câu hỏi","Loại câu hỏi","Phương án","Biểu đồ","Thiết lập","Xem trước","Bắt đầu"];
function blankQuestion(){ return { question:"", description:"", type:"single", options:["",""], required:true, chartType:null, scaleMin:1, scaleMax:5, timeLimit:0, allowChangeAnswer:false }; }
function initWizard(){
  STATE.wizard = {
    step:1, title:"", classId:"", classesCache:[], questions:[blankQuestion()], qIndex:0,
    settings:{ timeLimit:0, showResults:"hidden", allowChangeAnswer:false, anonymous:true, showResponderCount:true, allowMultipleResponses:false }
  };
}
async function teacherWizard(c, ignore){
  if(!STATE.wizard) initWizard();
  if(STATE.wizard.classesCache.length===0){
    try{ const snap = await getDocs(query(collection(db,"classes"), where("ownerId","==",STATE.user.uid), orderBy("createdAt","desc"))); STATE.wizard.classesCache = snap.docs.map(d=>({id:d.id,...d.data()})); }catch(e){}
  }
  renderWizard(c);
}
function wizardShellHtml(bodyHtml){
  const w = STATE.wizard;
  return `<h2>Tạo tương tác mới</h2>
  <div class="wizard-steps">${WIZARD_STEP_LABELS.map((l,i)=>{
    const n=i+1; const cls = n<w.step?"done":(n===w.step?"active":"");
    return `<span class="step ${cls}">${n}. ${esc(l)}</span>`;
  }).join("")}</div>
  <div class="card">${bodyHtml}</div>`;
}
function renderWizard(c){
  const w = STATE.wizard;
  const steps = {
    1: wizStep1, 2: wizStep2, 3: wizStep3, 4: wizStep4, 5: wizStep5, 6: wizStep6, 7: wizStep7, 8: wizStep8
  };
  (steps[w.step] || wizStep1)(c);
}
function wizNavHtml(showBack, nextLabel){
  return `<div class="wizard-nav">
    <button type="button" class="btn btn-ghost" id="wizBack" ${showBack?"":"disabled style='visibility:hidden'"}>← Quay lại</button>
    <div class="flex gap-8">
      <button type="button" class="btn btn-ghost" id="wizCancel">Hủy bỏ</button>
      <button type="button" class="btn" id="wizNext">${esc(nextLabel||"Tiếp tục →")}</button>
    </div>
  </div>`;
}
function wireWizNav(onBack, onNext){
  $("#wizCancel").onclick = ()=>{ if(confirm("Hủy bỏ tạo phiên? Dữ liệu đang nhập sẽ mất.")){ STATE.wizard=null; STATE.teacherNav="overview"; window.location.hash=""; teacherRoute(); } };
  if($("#wizBack")) $("#wizBack").onclick = onBack;
  $("#wizNext").onclick = onNext;
}

function wizStep1(c){
  const w = STATE.wizard;
  c.innerHTML = wizardShellHtml(`
    <div class="field"><label>Tên hoạt động *</label><input type="text" id="wTitle" value="${esc(w.title)}" placeholder="Ví dụ: Khảo sát đầu giờ - Chương 1"></div>
    <div id="wErr" class="error-text hidden"></div>
    ${wizNavHtml(false)}`);
  wireWizNav(null, ()=>{
    const v = $("#wTitle").value.trim();
    if(!v){ $("#wErr").textContent="Vui lòng nhập tên hoạt động."; $("#wErr").classList.remove("hidden"); return; }
    w.title = v; w.step=2; renderWizard($("#mainContent"));
  });
}
function wizStep2(c){
  const w = STATE.wizard;
  c.innerHTML = wizardShellHtml(`
    ${w.classesCache.length===0?`<p class="mut">Bạn chưa có lớp học nào. Vui lòng tạo lớp trước.</p><button class="btn btn-outline" id="wCreateClassQuick">+ Tạo lớp nhanh</button>`:
    `<div class="field"><label>Chọn lớp *</label><select id="wClass">
      <option value="">— Chọn lớp —</option>
      ${w.classesCache.map(cl=>`<option value="${cl.id}" ${w.classId===cl.id?"selected":""}>${esc(cl.name)}</option>`).join("")}
    </select></div>`}
    <div id="wErr" class="error-text hidden"></div>
    ${wizNavHtml(true)}`);
  if(w.classesCache.length===0){
    $("#wCreateClassQuick").onclick = ()=>{
      openClassForm(null);
      const origClose = closeModal;
      const check = setInterval(async ()=>{
        if(!document.getElementById("globalModal") || document.getElementById("globalModal").innerHTML===""){
          clearInterval(check);
          const snap = await getDocs(query(collection(db,"classes"), where("ownerId","==",STATE.user.uid), orderBy("createdAt","desc")));
          w.classesCache = snap.docs.map(d=>({id:d.id,...d.data()}));
          renderWizard($("#mainContent"));
        }
      }, 500);
    };
    wireWizNav(()=>{ w.step=1; renderWizard(c); }, ()=>{ $("#wErr").textContent="Vui lòng tạo lớp trước khi tiếp tục."; $("#wErr").classList.remove("hidden"); });
    return;
  }
  wireWizNav(()=>{ w.step=1; renderWizard(c); }, ()=>{
    const v = $("#wClass").value;
    if(!v){ $("#wErr").textContent="Vui lòng chọn lớp."; $("#wErr").classList.remove("hidden"); return; }
    w.classId = v; w.step=3; renderWizard($("#mainContent"));
  });
}
function wizQuestionListBar(){
  const w = STATE.wizard;
  return `<div class="flex gap-8 mt-8" style="flex-wrap:wrap;">
    ${w.questions.map((q,i)=>`<button type="button" class="btn btn-sm ${i===w.qIndex?'':'btn-outline'}" data-goq="${i}">Câu ${i+1}</button>`).join("")}
  </div>`;
}
function wireQuestionListBar(rerender){
  $$("[data-goq]").forEach(b=>b.onclick=()=>{ STATE.wizard.qIndex = Number(b.dataset.goq); STATE.wizard.step=3; rerender(); });
}
function wizStep3(c){
  const w = STATE.wizard; const q = w.questions[w.qIndex];
  c.innerHTML = wizardShellHtml(`
    ${w.questions.length>1?wizQuestionListBar():""}
    <div class="field mt-14"><label>Nội dung câu hỏi *</label><textarea id="wQ" placeholder="Nhập nội dung câu hỏi…">${esc(q.question)}</textarea></div>
    <div class="field"><label>Mô tả / gợi ý (không bắt buộc)</label><input type="text" id="wQDesc" value="${esc(q.description||"")}"></div>
    <div id="wErr" class="error-text hidden"></div>
    ${wizNavHtml(true)}`);
  wireQuestionListBar(()=>renderWizard(c));
  wireWizNav(()=>{ w.step=2; renderWizard(c); }, ()=>{
    const v = $("#wQ").value.trim();
    if(!v){ $("#wErr").textContent="Vui lòng nhập nội dung câu hỏi."; $("#wErr").classList.remove("hidden"); return; }
    q.question=v; q.description=$("#wQDesc").value.trim(); w.step=4; renderWizard($("#mainContent"));
  });
}
function wizStep4(c){
  const w = STATE.wizard; const q = w.questions[w.qIndex];
  c.innerHTML = wizardShellHtml(`
    <div class="type-grid">
      ${Object.entries(QUESTION_TYPES).map(([k,v])=>`
        <div class="type-card ${q.type===k?'active':''}" data-type="${k}">
          <div class="ic">${v.icon}</div><div class="nm">${esc(v.label)}</div>
        </div>`).join("")}
    </div>
    ${wizNavHtml(true)}`);
  $$(".type-card").forEach(el=>el.onclick=()=>{ $$(".type-card").forEach(x=>x.classList.remove("active")); el.classList.add("active"); q.type = el.dataset.type; });
  wireWizNav(()=>{ w.step=3; renderWizard(c); }, ()=>{
    if(q.type==="truefalse") q.options=["Đúng","Sai"];
    if(q.type==="likert" && (!q.options || q.options.length!==5 || q.options[0]==="")) q.options=["Hoàn toàn không đồng ý","Không đồng ý","Phân vân","Đồng ý","Hoàn toàn đồng ý"];
    if((q.type==="single"||q.type==="multiple"||q.type==="ranking") && (!q.options || q.options.some(o=>false))){ if(!q.options || q.options.length<2) q.options=["",""]; }
    q.chartType = QUESTION_TYPES[q.type].defaultChart;
    w.step=5; renderWizard($("#mainContent"));
  });
}
function wizStep5(c){
  const w = STATE.wizard; const q = w.questions[w.qIndex]; const meta = QUESTION_TYPES[q.type];
  let body = "";
  if(q.type==="truefalse"){
    body = `<p class="hint">Câu Đúng/Sai sử dụng 2 phương án cố định: <b>Đúng</b> và <b>Sai</b>.</p>`;
  } else if(q.type==="scale"){
    body = `<div class="grid grid-2">
      <div class="field"><label>Giá trị nhỏ nhất</label><input type="number" id="wScaleMin" value="${q.scaleMin}"></div>
      <div class="field"><label>Giá trị lớn nhất</label><input type="number" id="wScaleMax" value="${q.scaleMax}"></div>
    </div>`;
  } else if(q.type==="open"){
    body = `<p class="hint">Học viên sẽ nhập câu trả lời dạng văn bản tự do. Không cần thiết lập phương án.</p>`;
  } else {
    body = `<label>${q.type==="ranking"?"Các mục cần xếp hạng":(q.type==="likert"?"Nhãn mức độ (có thể tùy chỉnh)":"Phương án")}</label>
    <div id="wOptions">${q.options.map((o,i)=>optionRowHtml(o,i)).join("")}</div>
    <button type="button" class="btn btn-sm btn-outline mt-8" id="wAddOpt">+ Thêm phương án</button>`;
  }
  c.innerHTML = wizardShellHtml(`${body}<div id="wErr" class="error-text hidden"></div>${wizNavHtml(true)}`);
  if($("#wAddOpt")) $("#wAddOpt").onclick = ()=>{ $("#wOptions").insertAdjacentHTML("beforeend", optionRowHtml("", $("#wOptions").children.length)); $$(".optRemove").forEach(b=>b.onclick=()=>b.closest(".option-row").remove()); };
  $$(".optRemove").forEach(b=>b.onclick=()=>b.closest(".option-row").remove());
  wireWizNav(()=>{ w.step=4; renderWizard(c); }, ()=>{
    if(q.type==="truefalse"){
      // Cố định 2 phương án Đúng/Sai — giáo viên không cần (và không thể) nhập tay,
      // nhưng dữ liệu VẪN được ghi vào Firestore (questions/{id}/options) như mọi loại có phương án khác.
      q.options = QUESTION_TYPES.truefalse.fixedOptions.slice();
    } else if(q.type==="scale"){
      const mn=Number($("#wScaleMin").value), mx=Number($("#wScaleMax").value);
      if(isNaN(mn)||isNaN(mx)||mn>=mx){ $("#wErr").textContent="Thang điểm không hợp lệ (giá trị nhỏ nhất phải nhỏ hơn giá trị lớn nhất)."; $("#wErr").classList.remove("hidden"); return; }
      q.scaleMin=mn; q.scaleMax=mx;
    } else if(meta.needsOptions){
      const vals = $$("#wOptions .optText").map(i=>i.value.trim()).filter(v=>v);
      const uniq = new Set(vals);
      if(vals.length<2){ $("#wErr").textContent="Cần ít nhất 2 phương án."; $("#wErr").classList.remove("hidden"); return; }
      if(q.type==="ranking" && uniq.size!==vals.length){ $("#wErr").textContent="Các mục xếp hạng không được trùng nhau."; $("#wErr").classList.remove("hidden"); return; }
      q.options = vals;
    }
    w.step=6; renderWizard($("#mainContent"));
  });
}
function wizStep6(c){
  const w = STATE.wizard; const q = w.questions[w.qIndex]; const meta = QUESTION_TYPES[q.type];
  if(!q.chartType) q.chartType = meta.defaultChart;
  c.innerHTML = wizardShellHtml(`
    <p class="hint">Biểu đồ phù hợp với loại câu hỏi "<b>${esc(meta.label)}</b>":</p>
    <div class="type-grid">
      ${meta.allowedCharts.map(ct=>`<div class="type-card ${q.chartType===ct?'active':''}" data-chart="${ct}"><div class="ic">📊</div><div class="nm">${esc(CHART_LABELS[ct])}</div></div>`).join("")}
    </div>
    <div class="flex-between mt-20" style="flex-wrap:wrap;gap:10px;">
      <button type="button" class="btn btn-ghost" id="wizBack">← Quay lại</button>
      <div class="flex gap-8">
        <button type="button" class="btn btn-ghost" id="wizCancel">Hủy bỏ</button>
        <button type="button" class="btn btn-outline" id="wizAddQ">+ Thêm câu hỏi khác</button>
        <button type="button" class="btn" id="wizContinue">Tiếp tục thiết lập phiên →</button>
      </div>
    </div>`);
  $$(".type-card").forEach(el=>el.onclick=()=>{ $$(".type-card").forEach(x=>x.classList.remove("active")); el.classList.add("active"); q.chartType = el.dataset.chart; });
  $("#wizCancel").onclick = ()=>{ if(confirm("Hủy bỏ tạo phiên? Dữ liệu đang nhập sẽ mất.")){ STATE.wizard=null; STATE.teacherNav="overview"; window.location.hash=""; teacherRoute(); } };
  $("#wizBack").onclick = ()=>{ w.step=5; renderWizard(c); };
  $("#wizAddQ").onclick = ()=>{ w.questions.push(blankQuestion()); w.qIndex = w.questions.length-1; w.step=3; renderWizard($("#mainContent")); };
  $("#wizContinue").onclick = ()=>{ w.step=7; renderWizard($("#mainContent")); };
}
function wizStep7(c){
  const w = STATE.wizard; const s = w.settings;
  c.innerHTML = wizardShellHtml(`
    <div class="field"><label>Thời gian trả lời mỗi câu</label>
      <select id="wTimer">${TIMER_PRESETS.map(t=>`<option value="${t.value}" ${s.timeLimit===t.value?"selected":""}>${esc(t.label)}</option>`).join("")}
        <option value="custom" ${!TIMER_PRESETS.some(t=>t.value===s.timeLimit)?"selected":""}>Tùy chỉnh…</option>
      </select>
    </div>
    <div class="field hidden" id="wCustomTimerWrap"><label>Số giây tùy chỉnh</label><input type="number" id="wCustomTimer" min="5" value="${s.timeLimit||60}"></div>
    <div class="field"><label>Hiển thị kết quả cho học viên</label>
      <select id="wShowResults"><option value="hidden" ${s.showResults==='hidden'?'selected':''}>Ẩn (chỉ hiện "đã trả lời")</option><option value="live" ${s.showResults==='live'?'selected':''}>Trực tiếp (Live)</option></select>
    </div>
    <label class="flex gap-8 mt-14"><input type="checkbox" id="wAllowChange" ${s.allowChangeAnswer?"checked":""} style="width:auto;min-height:auto;"> Cho phép học viên đổi câu trả lời trước khi phiên đóng</label>
    <label class="flex gap-8 mt-8"><input type="checkbox" id="wShowCount" ${s.showResponderCount?"checked":""} style="width:auto;min-height:auto;"> Hiển thị số người đã trả lời</label>
    <p class="hint mt-8">Học viên luôn trả lời ẩn danh (không có tài khoản) — đây là thiết kế cố định của hệ thống, không thể tắt.</p>
    ${wizNavHtml(true)}`);
  $("#wTimer").onchange = ()=>{ $("#wCustomTimerWrap").classList.toggle("hidden", $("#wTimer").value!=="custom"); };
  if($("#wTimer").value==="custom") $("#wCustomTimerWrap").classList.remove("hidden");
  wireWizNav(()=>{ w.step=6; renderWizard(c); }, ()=>{
    const tv = $("#wTimer").value;
    s.timeLimit = tv==="custom" ? Math.max(5, Number($("#wCustomTimer").value)||60) : Number(tv);
    s.showResults = $("#wShowResults").value;
    s.allowChangeAnswer = $("#wAllowChange").checked;
    s.anonymous = true; // V1: học viên luôn ẩn danh, không có UI để tắt (không có khái niệm tài khoản học viên)
    s.showResponderCount = $("#wShowCount").checked;
    w.questions.forEach(q=>{ q.timeLimit = s.timeLimit; q.allowChangeAnswer = s.allowChangeAnswer; });
    w.step=8; renderWizard($("#mainContent"));
  });
}
function wizStep8(c){
  const w = STATE.wizard; const s = w.settings;
  const cls = w.classesCache.find(x=>x.id===w.classId);
  c.innerHTML = wizardShellHtml(`
    <h3>${esc(w.title)}</h3>
    <p class="mut">Lớp: <b>${esc(cls?cls.name:"—")}</b> · ${w.questions.length} câu hỏi · Thời gian: ${s.timeLimit?s.timeLimit+"s":"Không giới hạn"} · Kết quả: ${s.showResults==="live"?"Trực tiếp":"Ẩn"}</p>
    ${w.questions.map((q,i)=>`
      <div class="card">
        <div class="flex-between"><b>Câu ${i+1}: ${esc(q.question)}</b><span class="chip">${esc(QUESTION_TYPES[q.type].label)}</span></div>
        ${q.type==="scale"?`<p class="small mut mt-8">Thang điểm từ ${q.scaleMin} đến ${q.scaleMax}</p>`:
          (QUESTION_TYPES[q.type].needsOptions?`<ul class="small mut">${q.options.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>`:`<p class="small mut mt-8">Câu hỏi mở — nhập văn bản tự do</p>`)}
        <span class="chip">Biểu đồ: ${esc(CHART_LABELS[q.chartType])}</span>
      </div>`).join("")}
    <div id="wErr" class="error-text hidden mt-14"></div>
    <div class="wizard-nav">
      <button type="button" class="btn btn-ghost" id="wizBack">← Quay lại</button>
      <div class="flex gap-8">
        <button type="button" class="btn btn-ghost" id="wizCancel">Hủy bỏ</button>
        <button type="button" class="btn btn-lg btn-ok" id="wizFinish">BẮT ĐẦU — Tạo phiên</button>
      </div>
    </div>`);
  $("#wizCancel").onclick = ()=>{ if(confirm("Hủy bỏ tạo phiên? Dữ liệu đang nhập sẽ mất.")){ STATE.wizard=null; STATE.teacherNav="overview"; window.location.hash=""; teacherRoute(); } };

async function finalizeWizard(){
  const w = STATE.wizard; const s = w.settings;
  const batch = writeBatch(db);
  const sessionRef = doc(collection(db,"sessions"));
  const firstQRef = doc(collection(db,"questions"));
  const cls = w.classesCache.find(x=>x.id===w.classId);
  const sessionData = {
    ownerId: STATE.user.uid, classId: w.classId, className: cls?cls.name:"", title: w.title, description: "",
    status: "ready", accessToken: genToken(28), shortCode: genShortCode(),
    showResults: s.showResults, allowMultipleResponses: s.allowMultipleResponses, anonymous: s.anonymous,
    showResponderCount: s.showResponderCount,
    startedAt: null, closedAt: null, createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
    questionCount: w.questions.length, responseCount: 0, activeQuestionId: null,
    activeQuestionStartedAt: null, sessionGroupId: null, roundNumber: 1
  };
  batch.set(sessionRef, sessionData);
  const joinCodeRef = doc(db,"joinCodes",sessionData.shortCode);
  batch.set(joinCodeRef, { sessionId: sessionRef.id, ownerId: STATE.user.uid, createdAt: serverTimestamp() });
  // FIX 8: ánh xạ accessToken -> sessionId, cho phép học viên tra cứu sessionId thật
  // bằng GET-theo-ID (không LIST được) mà không cần nhúng sessionId trực tiếp trong link/QR.
  const tokenRef = doc(db,"sessionTokens",sessionData.accessToken);
  batch.set(tokenRef, { sessionId: sessionRef.id, ownerId: STATE.user.uid, createdAt: serverTimestamp() });
  const qRefs = [];
  w.questions.forEach((q, i)=>{
    const qRef = i===0 ? firstQRef : doc(collection(db,"questions"));
    qRefs.push(qRef);
    const meta = QUESTION_TYPES[q.type];
    batch.set(qRef, {
      sessionId: sessionRef.id, ownerId: STATE.user.uid, order: i, type: q.type,
      question: q.question, description: q.description||"", required: true,
      chartType: q.chartType || meta.defaultChart, timeLimit: q.timeLimit||0,
      allowChangeAnswer: !!q.allowChangeAnswer,
      scaleMin: q.type==="scale"?q.scaleMin:null, scaleMax: q.type==="scale"?q.scaleMax:null,
      createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    });
    if(meta.needsOptions){
      q.options.forEach((optText, oi)=>{
        const optRef = doc(collection(db,"questions",qRef.id,"options"));
        batch.set(optRef, {
          label: String.fromCharCode(65+oi), text: optText, order: oi,
          value: q.type==="likert" ? (oi+1) : (q.type==="ranking" ? null : null),
          isCorrect: null, createdAt: serverTimestamp()
        });
      });
    }
  });
  await batch.commit();
  STATE.wizard = null;
  toast("Đã tạo phiên tương tác thành công!","ok");
  window.location.hash = "#/live/" + encodeURIComponent(sessionRef.id);
}

/* ============================================================
   CHART ENGINE (dùng chung: điều khiển trực tiếp, trình chiếu, báo cáo)
   ============================================================ */
const PALETTE = ["#155e75","#0891b2","#16a34a","#ca8a04","#dc2626","#7c3aed","#db2777","#0d9488","#ea580c","#4338ca"];
function aggregateForChart(question, options, responseDocs){
  const type = question.type;
  if(type==="scale"){
    const labels = []; for(let v=question.scaleMin; v<=question.scaleMax; v++) labels.push(String(v));
    const counts = labels.map(()=>0);
    responseDocs.forEach(r=>{ const v = r.answer; const idx = labels.indexOf(String(v)); if(idx>=0) counts[idx]++; });
    return { labels, datasets:[{ data:counts, backgroundColor:PALETTE[0] }] };
  }
  if(type==="ranking"){
    const n = options.length;
    const scores = {}; options.forEach(o=>scores[o.id]=0);
    responseDocs.forEach(r=>{
      const order = r.selectedOptions||[];
      order.forEach((optId, pos)=>{ if(scores[optId]!=null) scores[optId] += (n - pos); });
    });
    const sorted = [...options].sort((a,b)=>scores[b.id]-scores[a.id]);
    return { labels: sorted.map(o=>o.text), datasets:[{ data: sorted.map(o=>scores[o.id]), backgroundColor:PALETTE[0] }] };
  }
  if(type==="likert"){
    const total = responseDocs.length || 1;
    const counts = options.map(o=>responseDocs.filter(r=>(r.selectedOptions||[]).includes(o.id)).length);
    return { labels:["Kết quả"], datasets: options.map((o,i)=>({ label:o.text, data:[Math.round(counts[i]/total*1000)/10], backgroundColor:PALETTE[i%PALETTE.length] })) };
  }
  // single / multiple / truefalse
  const counts = options.map(o=>responseDocs.filter(r=>(r.selectedOptions||[]).includes(o.id)).length);
  return { labels: options.map(o=>o.text), datasets:[{ data:counts, backgroundColor: options.map((_,i)=>PALETTE[i%PALETTE.length]) }] };
}
let __chartInstances = {};
function renderChart(canvasEl, question, options, responseDocs){
  if(!canvasEl) return;
  const chartType = question.chartType || QUESTION_TYPES[question.type].defaultChart;
  if(chartType==="list") return; // câu hỏi mở dùng danh sách, không dùng Chart.js
  try{
    const agg = aggregateForChart(question, options, responseDocs);
    const key = canvasEl.id;
    if(__chartInstances[key]) { __chartInstances[key].destroy(); delete __chartInstances[key]; }
    let type="bar", opts={ responsive:true, plugins:{ legend:{ display:chartType==="stacked" || chartType==="pie" || chartType==="donut" } }, scales:{} };
    if(chartType==="bar"){ type="bar"; }
    else if(chartType==="hbar"){ type="bar"; opts.indexAxis="y"; }
    else if(chartType==="pie"){ type="pie"; }
    else if(chartType==="donut"){ type="doughnut"; }
    else if(chartType==="distribution"){ type="bar"; }
    else if(chartType==="stacked"){
      type="bar"; opts.indexAxis="y"; opts.scales={ x:{ stacked:true, max:100, ticks:{ callback:v=>v+"%" } }, y:{ stacked:true } };
    }
    __chartInstances[key] = new Chart(canvasEl, { type, data: agg, options: opts });
  }catch(e){
    // Không để một lỗi vẽ biểu đồ (VD: thư viện Chart.js chưa tải kịp) làm hỏng
    // toàn bộ màn hình — chỉ hiển thị thông báo thay thế ngay tại vị trí biểu đồ.
    console.warn("Không thể vẽ biểu đồ:", e);
    if(canvasEl.parentElement) canvasEl.parentElement.insertAdjacentHTML("beforeend", `<p class="hint">Không thể tải biểu đồ. Vui lòng tải lại trang.</p>`);
  }
}

/* ============================================================
   ĐIỀU KHIỂN PHIÊN TRỰC TIẾP (Teacher Live Control)
   ============================================================ */
async function teacherLiveControl(c, sessionId){
  c.innerHTML = `<div class="center-screen" style="min-height:300px;"><span class="spinner"></span></div>`;
  let sessionRef = doc(db,"sessions",sessionId);
  let sessionSnap;
  try{ sessionSnap = await getDoc(sessionRef); }catch(e){ c.innerHTML = errorBlock(e, ()=>teacherLiveControl(c,sessionId)); return; }
  if(!sessionSnap.exists()){ c.innerHTML = `<div class="empty-state"><div class="ic">🚫</div>Không tìm thấy phiên tương tác.</div>`; return; }
  let session = sessionSnap.data();
  if(session.ownerId !== STATE.user.uid){ c.innerHTML = `<div class="empty-state"><div class="ic">⛔</div>Bạn không có quyền truy cập phiên này.</div>`; return; }

  let questions = [];
  try{
    // FIX 11: kèm ownerId để truy vấn LIST questions phù hợp Security Rules\n    const qs = await getDocs(query(collection(db,"questions"), where("ownerId","==",STATE.user.uid), where("sessionId","==",sessionId), orderBy("order","asc")));
    questions = qs.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){ c.innerHTML = errorBlock(e, ()=>teacherLiveControl(c,sessionId)); return; }
  if(questions.length===0){ c.innerHTML = `<div class="empty-state"><div class="ic">❓</div>Phiên này chưa có câu hỏi nào.</div>`; return; }

  const liveCounts = {};
  await Promise.all(questions.map(async q=>{
    try{ const cnt = await getCountFromServer(query(collection(db,"sessions",sessionId,"responses"), where("questionId","==",q.id))); liveCounts[q.id] = cnt.data().count; }
    catch(e){ liveCounts[q.id] = 0; }
  }));

  let curIndex = questions.findIndex(q=>q.id===session.activeQuestionId);
  if(curIndex<0) curIndex = 0;

  renderShell();

  function renderShell(){
    c.innerHTML = `
    <div class="flex-between no-print">
      <h2 style="margin:0;">${esc(session.title)}</h2>
      ${sessionStatusBadge(session.status)}
    </div>
    <div class="flex gap-8 mt-8 no-print" style="flex-wrap:wrap;">
      ${session.status==="ready"||session.status==="draft" ? `<button class="btn btn-ok" id="btnOpenSession">MỞ PHIÊN</button>`:""}
      ${session.status==="open" ? `<button class="btn btn-danger" id="btnCloseSession">ĐÓNG BÌNH CHỌN</button>`:""}
      ${session.status==="closed" ? `<button class="btn btn-warn" id="btnReopenSession">MỞ LẠI PHIÊN</button><button class="btn btn-ghost" id="btnArchiveSession">KẾT THÚC PHIÊN</button>`:""}
      <button class="btn btn-outline" id="btnShowQr" ${session.status==="draft"?"disabled":""}>HIỂN THỊ QR</button>
      <button class="btn btn-outline" id="btnPresent" ${session.status==="draft"?"disabled":""}>HIỂN THỊ TRÌNH CHIẾU</button>
      <button class="btn ${session.showResults==='live'?'btn-warn':'btn-outline'}" id="btnToggleResults">${session.showResults==='live'?"ẨN KẾT QUẢ":"HIỂN THỊ KẾT QUẢ"}</button>
      <button class="btn btn-ghost" id="btnBackDash">← Về tổng quan</button>
    </div>
    <div class="live-grid mt-14">
      <div>
        <div class="card">
          <div class="qcount">${questions.map((q,i)=>`<button data-q="${i}" class="${i===curIndex?'active':''}">Câu ${i+1}</button>`).join("")}</div>
          <div class="flex-between no-print">
            <button class="btn btn-sm btn-outline" id="btnPrevQ" ${curIndex===0?"disabled":""}>← CÂU TRƯỚC</button>
            <button class="btn btn-sm btn-outline" id="btnNextQ" ${curIndex===questions.length-1?"disabled":""}>CÂU TIẾP →</button>
          </div>
          <h3 class="mt-14" id="curQText"></h3>
          <div id="curQBody"></div>
        </div>
      </div>
      <div>
        <div class="stat"><div class="num" id="respCount">0</div><div class="lbl">Học viên đã trả lời câu này</div></div>
        <div class="card mt-14"><canvas id="liveChart" height="220"></canvas></div>
      </div>
    </div>`;
    $("#btnBackDash").onclick = ()=>{ window.location.hash=""; STATE.teacherNav="overview"; teacherRoute(); };
    $$(".qcount [data-q]").forEach(b=>b.onclick=()=>switchQuestion(Number(b.dataset.q)));
    if($("#btnPrevQ")) $("#btnPrevQ").onclick = ()=>switchQuestion(curIndex-1);
    if($("#btnNextQ")) $("#btnNextQ").onclick = ()=>switchQuestion(curIndex+1);
    if($("#btnOpenSession")) $("#btnOpenSession").onclick = openSession;
    if($("#btnCloseSession")) $("#btnCloseSession").onclick = closeSession;
    if($("#btnReopenSession")) $("#btnReopenSession").onclick = reopenSession;
    if($("#btnArchiveSession")) $("#btnArchiveSession").onclick = archiveSession;
    if($("#btnShowQr")) $("#btnShowQr").onclick = ()=>showQrModal(session, sessionId);
    if($("#btnPresent")) $("#btnPresent").onclick = ()=>window.open(`${APP_BASE_URL}?mode=presentation&sid=${encodeURIComponent(sessionId)}`, "_blank");
    if($("#btnToggleResults")) $("#btnToggleResults").onclick = toggleResults;
    renderCurrentQuestion();
  }

  async function renderCurrentQuestion(){
    const q = questions[curIndex];
    $("#curQText").textContent = `Câu ${curIndex+1}: ${q.question}`;
    let options = [];
    if(QUESTION_TYPES[q.type].needsOptions){
      try{ const os = await getDocs(query(collection(db,"questions",q.id,"options"), orderBy("order","asc"))); options = os.docs.map(d=>({id:d.id,...d.data()})); }catch(e){}
    }
    if(q.type==="open"){
      $("#curQBody").innerHTML = `<div id="openList" class="mt-8"><div class="mut">Đang tải câu trả lời…</div></div>`;
    } else {
      $("#curQBody").innerHTML = `<p class="mut small">Biểu đồ: ${esc(CHART_LABELS[q.chartType])} · Thời gian: ${q.timeLimit?q.timeLimit+"s":"Không giới hạn"}</p>`;
    }
    watchResponses(q, options);
  }
  function watchResponses(q, options){
    clearListeners();
    const respQ = query(collection(db,"sessions",sessionId,"responses"), where("questionId","==",q.id));
    track(onSnapshot(respQ, (snap)=>{
      const docs = snap.docs.map(d=>d.data());
      liveCounts[q.id] = docs.length;
      $("#respCount") && ($("#respCount").textContent = docs.length);
      const totalAll = Object.values(liveCounts).reduce((a,b)=>a+b,0);
      // Ghi lại dữ liệu tổng hợp AN TOÀN (không chứa câu trả lời cá nhân) vào session
      // để Presentation View / Student View (đăng nhập ẩn danh) có thể hiển thị
      // số lượt trả lời & biểu đồ mà KHÔNG cần quyền đọc trực tiếp responses.
      const agg = (q.type!=="open") ? aggregateForChart(q, options, docs) : null;
      updateDoc(sessionRef, {
        responseCount: totalAll, updatedAt: serverTimestamp(),
        liveAggregate: { questionId: q.id, chartType: q.chartType, agg, respondedCount: docs.length, updatedAt: Timestamp.now() }
      }).catch(()=>{});
      if(q.type==="open"){
        renderOpenList(docs);
      } else {
        const canvas = $("#liveChart");
        if(canvas) renderChart(canvas, q, options, docs);
      }
    }, (err)=>{ toast(mapError(err),"err"); }));
    // vẫn theo dõi thay đổi trạng thái session (đóng/mở từ nơi khác)
    track(onSnapshot(sessionRef, (snap)=>{ if(snap.exists()){ session = snap.data(); } }));
  }
  function renderOpenList(docs){
    const el = $("#openList"); if(!el) return;
    const answers = docs.map(d=>d.answer).filter(Boolean);
    const freq = {};
    answers.join(" ").toLowerCase().replace(/[.,!?;:"'()]/g,"").split(/\s+/).forEach(w=>{ if(w.length>2) freq[w]=(freq[w]||0)+1; });
    const top = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8);
    el.innerHTML = `
      <p class="small mut">${answers.length} câu trả lời</p>
      ${top.length?`<div class="flex gap-8 mt-8" style="flex-wrap:wrap;">${top.map(([w,n])=>`<span class="chip">${esc(w)} × ${n}</span>`).join("")}</div>`:""}
      <div class="mt-14" style="max-height:260px;overflow:auto;">
        ${answers.length?answers.map(a=>`<div class="card" style="padding:10px 14px;margin-bottom:8px;">${esc(a)}</div>`).join(""):`<p class="mut">Chưa có câu trả lời nào.</p>`}
      </div>`;
  }

  async function switchQuestion(idx){
    if(idx<0 || idx>=questions.length) return;
    curIndex = idx;
    try{ await updateDoc(sessionRef, { activeQuestionId: questions[idx].id, activeQuestionStartedAt: serverTimestamp(), updatedAt: serverTimestamp() }); session.activeQuestionId = questions[idx].id; }
    catch(e){ toast(mapError(e),"err"); }
    renderShell();
  }
  async function openSession(){
    try{
      await updateDoc(sessionRef, { status:"open", startedAt: session.startedAt||serverTimestamp(), activeQuestionId: session.activeQuestionId||questions[0].id, activeQuestionStartedAt: serverTimestamp(), updatedAt: serverTimestamp() });
      session.status="open"; toast("Đã mở phiên. Học viên có thể tham gia ngay bây giờ.","ok"); renderShell();
    }catch(e){ toast(mapError(e),"err"); }
  }
  async function closeSession(){
    if(!confirm("Đóng bình chọn? Học viên sẽ không thể gửi câu trả lời mới.")) return;
    try{ await updateDoc(sessionRef, { status:"closed", closedAt: serverTimestamp(), updatedAt: serverTimestamp() }); session.status="closed"; toast("Đã đóng phiên.","ok"); renderShell(); }
    catch(e){ toast(mapError(e),"err"); }
  }
  async function reopenSession(){
    try{ await updateDoc(sessionRef, { status:"open", closedAt:null, updatedAt: serverTimestamp() }); session.status="open"; toast("Đã mở lại phiên.","ok"); renderShell(); }
    catch(e){ toast(mapError(e),"err"); }
  }
  async function archiveSession(){
    if(!confirm("Kết thúc và lưu trữ phiên này?")) return;
    try{ await updateDoc(sessionRef, { status:"archived", updatedAt: serverTimestamp() }); session.status="archived"; toast("Đã lưu trữ phiên.","ok"); window.location.hash=""; STATE.teacherNav="history"; teacherRoute(); }
    catch(e){ toast(mapError(e),"err"); }
  }
  async function toggleResults(){
    const next = session.showResults==="live" ? "hidden" : "live";
    try{ await updateDoc(sessionRef, { showResults: next, updatedAt: serverTimestamp() }); session.showResults = next; renderShell(); }
    catch(e){ toast(mapError(e),"err"); }
  }
}

function downloadBlob(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function csvEscape(v){ const s = String(v==null?"":v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportSessionCSV(session, className, questionBlocks){
  const rows = [["Cau hoi","Loai cau hoi","Ma nguoi tham gia","Cau tra loi","Thoi gian gui"]];
  questionBlocks.forEach(b=>{
    b.docs.forEach(d=>{
      let ans = d.answer;
      if(b.options && b.options.length && d.selectedOptions){
        ans = d.selectedOptions.map(oid=>{ const o=b.options.find(x=>x.id===oid); return o?o.text:oid; }).join(" | ");
      }
      rows.push([b.q.question, b.q.type, (d.participantId||"").slice(0,8), ans, d.submittedAt&&d.submittedAt.toDate?d.submittedAt.toDate().toISOString():""]);
    });
  });
  const csv = "﻿" + rows.map(r=>r.map(csvEscape).join(",")).join("\n");
  downloadBlob(`bao-cao-${session.shortCode||"session"}.csv`, csv, "text/csv;charset=utf-8;");
}
function exportSessionJSON(session, className, questionBlocks){
  const out = {
    hoatDong: session.title, lop: className, ngayTao: session.createdAt&&session.createdAt.toDate?session.createdAt.toDate().toISOString():null,
    cauHoi: questionBlocks.map(b=>({
      cauHoi: b.q.question, loai: b.q.type,
      phuongAn: b.options.map(o=>o.text),
      cauTraLoi: b.docs.map(d=>({participantId:d.participantId, answer:d.answer, selectedOptions:d.selectedOptions, submittedAt: d.submittedAt&&d.submittedAt.toDate?d.submittedAt.toDate().toISOString():null}))
    }))
  };
  downloadBlob(`bao-cao-${session.shortCode||"session"}.json`, JSON.stringify(out,null,2), "application/json");
}

function ensureAnonAuth(){
  // QUAN TRỌNG (FIX 7): dùng `publicAuth` (App Firebase thứ hai, độc lập) — KHÔNG BAO GIỜ
  // dùng `auth` (app chính của Giảng viên/Admin) ở đây. Nếu dùng chung `auth`, khi Học viên/
  // Trình chiếu mở trong cùng trình duyệt đang có Giảng viên đăng nhập, `auth.currentUser`
  // có thể chính là giảng viên đó — participantId của học viên sẽ bị trùng với uid giảng viên
  // (rất nguy hiểm). Dùng `publicAuth` tách biệt đảm bảo học viên luôn có một uid ẩn danh
  // riêng, không đụng chạm đến phiên đăng nhập giảng viên ở bất kỳ tab nào.
  return new Promise((resolve, reject)=>{
    const unsub = onAuthStateChanged(publicAuth, (user)=>{
      unsub();
      if(user){ resolve(user); return; }
      signInAnonymously(publicAuth).then(cred=>resolve(cred.user)).catch(reject);
    }, reject);
  });
}

let __studentLastQid = null, __studentTimerHandle = null;
function watchStudentSession(sessionId){
  clearListeners();
  __studentLastQid = null;
  const sref = doc(publicDb,"sessions",sessionId);
  track(onSnapshot(sref, (snap)=>{
    if(!snap.exists()){ studentBodyError("Phiên tương tác đã bị xóa.", showCodeEntryForm); return; }
    const session = snap.data();
    STATE.student.session = session;
    if(session.status==="closed" || session.status==="archived"){ renderStudentEnded(session); return; }
    if(session.status!=="open"){ renderStudentWaiting("Phiên chưa được mở. Vui lòng chờ giảng viên bắt đầu."); return; }
    if(!session.activeQuestionId){ renderStudentWaiting("Giảng viên chưa bắt đầu câu hỏi nào."); return; }
    if(session.activeQuestionId !== __studentLastQid){
      __studentLastQid = session.activeQuestionId;
      loadStudentQuestion(sessionId, session);
    } else {
      updateStudentResultBadge(session);
    }
  }, (err)=>{ studentBodyError(mapError(err), ()=>watchStudentSession(sessionId)); }));
}

      btn.disabled = false; btn.textContent = "GỬI CÂU TRẢ LỜI";

<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>HCMA2 - TEACHING</title>
<meta name="description" content="Nền tảng hỗ trợ giảng dạy và tương tác với học viên theo thời gian thực." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23155e75%22/><text x=%2250%22 y=%2266%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22>H</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
/* ============================================================
   HCMA2 - TEACHING — Stylesheet
   ============================================================ */
:root{
  --brand:#155e75; --brand-dark:#0e4a5c; --brand-light:#e8f4f7;
  --accent:#0891b2; --ok:#16a34a; --warn:#ca8a04; --danger:#dc2626;
  --bg:#f6f8f9; --card:#ffffff; --text:#1f2937; --text-mute:#6b7280;
  --border:#e5e7eb; --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; line-height:1.5; font-size:15px;
}
#app{min-height:100vh;}
h1,h2,h3,h4{margin:0 0 8px; font-weight:700; line-height:1.3;}
p{margin:0 0 10px;}
a{color:var(--accent);}
button, input, select, textarea{font-family:inherit; font-size:inherit;}
.hidden{display:none !important;}
.container{max-width:1180px; margin:0 auto; padding:0 16px;}
.narrow{max-width:480px;}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 18px; border-radius:10px; border:1px solid transparent;
  background:var(--brand); color:#fff; font-weight:600; cursor:pointer;
  min-height:44px; transition:filter .15s, transform .05s; text-decoration:none;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-sm{padding:7px 12px; min-height:34px; font-size:13px; border-radius:8px;}
.btn-lg{padding:15px 26px; font-size:16px; min-height:52px; border-radius:12px;}
.btn-outline{background:#fff; color:var(--brand); border-color:var(--brand);}
.btn-ghost{background:transparent; color:var(--text); border-color:var(--border);}
.btn-danger{background:var(--danger);}
.btn-warn{background:var(--warn);}
.btn-ok{background:var(--ok);}
.btn-block{width:100%;}
.btn-icon{padding:8px; min-width:40px;}
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:3px solid #93c5fd; outline-offset:2px;
}

/* Cards / layout */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px;}
.card + .card{margin-top:14px;}
.grid{display:grid; gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

/* Forms */
label{display:block; font-weight:600; font-size:13px; margin-bottom:5px; color:#374151;}
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date],
select, textarea{
  width:100%; padding:11px 12px; border:1.5px solid var(--border); border-radius:9px;
  background:#fff; color:var(--text); min-height:44px;
}
textarea{min-height:88px; resize:vertical;}
.field{margin-bottom:14px;}
/* GATE 2B-RT-INTEGRATION: RichTextEditor host — visually consistent with the plain textarea it
   replaces for Group Discussion's common instructions / per-group topic authoring. */
.rt-editor-host{border:1.5px solid var(--border); border-radius:9px; background:#fff; overflow:hidden;}
.rt-editor-host [data-rt-toolbar]{display:flex; gap:6px; flex-wrap:wrap; padding:6px 8px; border-bottom:1px solid var(--border); background:#f9fafb;}
.rt-editor-host [data-rt-toolbar] button{width:auto; min-height:30px; padding:4px 10px; border:1px solid var(--border); border-radius:6px; background:#fff; cursor:pointer;}
.rt-editor-host [data-rt-toolbar] button[aria-pressed="true"]{background:var(--brand); color:#fff; border-color:var(--brand);}
.rt-editor-host [data-rt-toolbar] button[aria-pressed="mixed"]{background:#dbeafe;}
.rt-editor-host [data-rt-toolbar] select{width:auto; min-height:30px; padding:2px 6px;}
.rt-editor-host [data-rt-editable]{min-height:88px; padding:11px 12px; outline:none;}
.rt-editor-host [data-rt-editable]:focus{box-shadow:inset 0 0 0 2px var(--brand);}
.hint{font-size:12.5px; color:var(--text-mute); margin-top:4px;}
.error-text{font-size:13px; color:var(--danger); margin-top:6px;}

/* Topbar */
.topbar{
  background:var(--brand); color:#fff; padding:0 16px; height:60px;
  display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:40;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.topbar .brand{font-weight:800; font-size:17px; letter-spacing:.3px; display:flex; align-items:center; gap:8px;}
.topbar .brand small{font-weight:500; opacity:.85; font-size:11px;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.topbar select, .topbar .who{color:#fff;}
.who{font-size:13px; opacity:.9;}
.hamburger{display:none; background:transparent; border:none; color:#fff; font-size:22px; cursor:pointer;}

/* Shell with sidebar */
.shell{display:flex; min-height:calc(100vh - 60px);}
.sidebar{
  width:230px; background:#fff; border-right:1px solid var(--border); padding:14px 10px; flex-shrink:0;
}
.sidebar button.navlink{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none;
  padding:11px 12px; border-radius:9px; cursor:pointer; color:var(--text); font-weight:600; font-size:14px; margin-bottom:2px;
}
.sidebar button.navlink:hover{background:var(--brand-light);}
.sidebar button.navlink.active{background:var(--brand); color:#fff;}
.main{flex:1; padding:20px; min-width:0;}
@media(max-width:820px){
  .sidebar{position:fixed; left:-250px; top:60px; bottom:0; z-index:50; transition:left .2s; box-shadow:2px 0 10px rgba(0,0,0,.15); overflow:auto;}
  .sidebar.open{left:0;}
  .hamburger{display:block;}
  .main{padding:14px;}
}

/* Tables */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th,td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:middle;}
th{color:var(--text-mute); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.4px;}
tr:hover td{background:#fafbfc;}
.table-wrap{overflow-x:auto;}
/* GATE 4C-B: Knowledge participant Compact card only — vertical scroll cap + sticky header,
   scoped to .kn-pf-compact (applied only to #knPfWrap) so it never affects any other table
   in the app, including the generic .table-wrap rule above (horizontal scroll unchanged). */
.kn-pf-compact .table-wrap{max-height:320px; overflow-y:auto;}
.kn-pf-compact .table-wrap thead th{position:sticky; top:0; background:var(--card); z-index:1;}

/* Badges */
.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700;}
.badge-green{background:#dcfce7; color:#166534;}
.badge-yellow{background:#fef9c3; color:#854d0e;}
.badge-red{background:#fee2e2; color:#991b1b;}
.badge-gray{background:#f1f5f9; color:#475569;}
.badge-blue{background:#dbeafe; color:#1e40af;}

/* Stat tiles */
.stat{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
.stat .num{font-size:30px; font-weight:800; color:var(--brand);}
.stat .lbl{font-size:13px; color:var(--text-mute); font-weight:600; margin-top:2px;}

/* Toast */
#toast-root{position:fixed; top:16px; right:16px; z-index:999; display:flex; flex-direction:column; gap:8px; max-width:340px;}
.toast{background:#1f2937; color:#fff; padding:12px 16px; border-radius:10px; box-shadow:0 6px 16px rgba(0,0,0,.25); font-size:13.5px; animation:slidein .18s ease-out;}
.toast.ok{background:#166534;} .toast.err{background:#991b1b;} .toast.warn{background:#92400e;}
@keyframes slidein{from{transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;}}

/* Loading */
.spinner{width:22px; height:22px; border:3px solid rgba(0,0,0,.12); border-top-color:var(--brand); border-radius:50%; animation:spin .7s linear infinite; display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.center-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:24px; text-align:center;}

/* Auth screens */
.auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,var(--brand),#0891b2); padding:20px;}
.auth-card{background:#fff; border-radius:16px; width:100%; max-width:420px; padding:32px 28px; box-shadow:0 20px 50px rgba(0,0,0,.25);}
.auth-logo{text-align:center; margin-bottom:18px;}
.auth-logo .t1{font-size:22px; font-weight:800; color:var(--brand);}
.auth-logo .t2{font-size:12px; color:var(--text-mute); letter-spacing:1px; text-transform:uppercase;}
.tabbar{display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:18px;}
.tabbar button{flex:1; padding:10px; border:none; background:#f8fafc; cursor:pointer; font-weight:700; color:var(--text-mute);}
.tabbar button.active{background:var(--brand); color:#fff;}

/* Wizard */
.wizard-steps{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px;}
.wizard-steps .step{padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700; background:#f1f5f9; color:var(--text-mute);}
.wizard-steps .step.active{background:var(--brand); color:#fff;}
.wizard-steps .step.done{background:var(--ok); color:#fff;}
.wizard-nav{display:flex; justify-content:space-between; margin-top:20px; gap:10px;}
.option-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.option-row input[type=text]{flex:1;}
.type-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.type-card{border:2px solid var(--border); border-radius:12px; padding:14px; cursor:pointer; text-align:center;}
.type-card:hover{border-color:var(--accent);}
.type-card.active{border-color:var(--brand); background:var(--brand-light);}
.type-card .ic{font-size:26px; margin-bottom:6px;}
.type-card .nm{font-weight:700; font-size:13px;}
.library-source-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.library-picker-toolbar{display:grid;grid-template-columns:1fr 180px 190px;gap:10px;margin:12px 0;}
.library-picker-list{display:grid;gap:10px;max-height:52vh;overflow:auto;padding-right:4px;}
.library-picker-item{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1.5px solid var(--border);border-radius:12px;padding:12px;background:#fff;}
.library-picker-item:hover{border-color:#94a3b8;}
.library-picker-item input{width:20px;height:20px;margin-top:3px;}
.library-picker-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px;}
.library-picker-question{font-weight:700;line-height:1.4;}
.library-save-row{border:1px dashed #cbd5e1;border-radius:10px;padding:10px 12px;background:#f8fafc;}
@media(max-width:700px){.library-picker-toolbar{grid-template-columns:1fr;}}


/* Live control */
.live-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
@media(max-width:900px){.live-grid{grid-template-columns:1fr;}}
.qcount{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0;}
.qcount button{border:1.5px solid var(--border); background:#fff; border-radius:8px; padding:6px 10px; cursor:pointer; font-weight:700; font-size:12.5px;}
.qcount button.active{background:var(--brand); color:#fff; border-color:var(--brand);}
.qcount button.answered::after{content:" ✓";}

/* Student view */
.student-shell{min-height:100vh; background:var(--brand); display:flex; flex-direction:column;}
.student-top{color:#fff; text-align:center; padding:18px 16px 8px;}
.student-top .logo{font-weight:800; font-size:15px; letter-spacing:1px;}
.student-card{background:#fff; border-radius:20px 20px 0 0; flex:1; padding:22px 18px 40px; margin-top:10px;}
.opt-btn{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:15px 16px; margin-bottom:10px;
  border:2px solid var(--border); border-radius:12px; background:#fff; cursor:pointer; font-size:15px; font-weight:600;
}
.opt-btn .mark{width:22px; height:22px; border-radius:50%; border:2px solid #cbd5e1; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;}
.opt-btn.selected{border-color:var(--brand); background:var(--brand-light);}
.opt-btn.selected .mark{background:var(--brand); border-color:var(--brand);}
.opt-btn.correct{border-color:var(--ok); background:#f0fdf4;}
.opt-btn.wrong{border-color:var(--danger); background:#fef2f2;}
.timer-pill{display:inline-flex; align-items:center; gap:6px; background:#fff2; color:#fff; border-radius:999px; padding:6px 14px; font-weight:700; font-size:13px;}

/* Presentation */
.pres-shell{background:#0b2530; color:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center;}
.pres-shell .qtext{font-size:clamp(22px,4vw,40px); font-weight:800; max-width:1000px; margin-bottom:20px;}
.pres-shell .meta{opacity:.75; margin-bottom:26px; font-size:15px;}
.pres-grid{display:flex; gap:40px; align-items:center; flex-wrap:wrap; justify-content:center;}
.pres-chart-wrap{width:min(760px,90vw); background:#fff; border-radius:16px; padding:20px;}
.pres-qr-wrap{background:#fff; border-radius:16px; padding:18px; text-align:center;}
.pres-qr-wrap.clickable{cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;}
.pres-qr-wrap.clickable:hover{transform:translateY(-2px); box-shadow:0 10px 28px rgba(0,0,0,.2);}
.pres-qr-wrap.clickable:focus-visible{outline:3px solid #93c5fd; outline-offset:4px;}
.pres-qr-hint{font-size:12px; color:#64748b; margin-top:8px; font-weight:700;}
.pres-qr-popup{
  position:fixed; inset:0; z-index:9999; background:rgba(2,12,18,.88);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.pres-qr-popup-card{
  width:min(92vw,760px); background:#fff; border-radius:24px; padding:28px;
  text-align:center; box-shadow:0 24px 70px rgba(0,0,0,.45); position:relative;
}
.pres-qr-popup-close{
  position:absolute; top:14px; right:14px; width:48px; height:48px; border-radius:50%;
  border:none; background:#0f172a; color:#fff; font-size:26px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.pres-qr-popup-close:focus-visible{outline:3px solid #93c5fd; outline-offset:3px;}
.pres-qr-popup-title{font-size:clamp(22px,3vw,34px); font-weight:800; color:#0f172a; margin:4px 54px 10px;}
.pres-qr-popup-sub{font-size:16px; color:#475569; margin-bottom:18px;}
#presQrBig{display:flex; justify-content:center; align-items:center;}
#presQrBig img,#presQrBig canvas{width:min(68vw,560px)!important; height:min(68vw,560px)!important; max-width:560px; max-height:560px;}
.pres-qr-popup-code{font-size:clamp(24px,4vw,40px); font-weight:900; color:#0f172a; letter-spacing:2px; margin-top:14px;}
.pres-open-wall{
  width:min(980px,78vw); display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px; align-content:start;
}
.pres-open-card{
  background:#fff; color:#0f172a; border-radius:14px; padding:16px 18px;
  text-align:left; font-size:clamp(16px,1.5vw,22px); line-height:1.45;
  box-shadow:0 4px 14px rgba(0,0,0,.12); overflow-wrap:anywhere;
}
.pres-open-card .num{font-size:12px;color:#64748b;font-weight:800;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.pres-open-empty{
  width:min(820px,76vw); padding:30px; border:1px dashed rgba(255,255,255,.35);
  border-radius:16px; color:rgba(255,255,255,.75); font-size:20px;
}
@media(max-width:900px){
  .pres-open-wall{grid-template-columns:1fr;width:min(760px,88vw);}
}
.report-contact-print{display:none;}

@media(max-width:600px){
  .pres-qr-popup{padding:12px;}
  .pres-qr-popup-card{padding:22px 14px 18px;}
  .pres-qr-popup-close{top:8px;right:8px;width:44px;height:44px;}
  #presQrBig img,#presQrBig canvas{width:min(82vw,440px)!important;height:min(82vw,440px)!important;}
}


/* Misc */
.flex{display:flex; align-items:center;}
.flex-between{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.gap-8{gap:8px;} .gap-12{gap:12px;}
.mt-8{margin-top:8px;} .mt-14{margin-top:14px;} .mt-20{margin-top:20px;}
.mut{color:var(--text-mute);}
.small{font-size:12.5px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.chip{display:inline-block; padding:4px 10px; border-radius:999px; background:#f1f5f9; font-size:12px; font-weight:700; margin-right:6px;}
.empty-state{text-align:center; padding:50px 20px; color:var(--text-mute);}
.empty-state .ic{font-size:40px; margin-bottom:10px;}
.modal-backdrop{position:fixed; inset:0; background:rgba(15,23,32,.55); display:flex; align-items:center; justify-content:center; z-index:200; padding:16px;}
.modal{background:#fff; border-radius:16px; padding:24px; max-width:520px; width:100%; max-height:90vh; overflow:auto;}
.modal-lg{max-width:820px;}
/* Charts / reports */
.chart-box{position:relative; width:100%; height:320px; min-height:240px;}
.chart-box.chart-box-sm{height:240px;}
.chart-box.chart-box-lg{height:380px;}
.chart-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.chart-summary .metric{background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:12.5px;}
.chart-summary .metric b{color:var(--brand);}
.report-question{break-inside:avoid;page-break-inside:avoid;}
.report-chart-wrap{position:relative;width:100%;height:300px;margin-top:10px;}
.report-open-answer{padding:9px 12px;margin:6px 0;border:1px solid var(--border);border-radius:9px;background:#fafbfc;}
@media(max-width:600px){
  .chart-box,.chart-box-lg{height:280px;}
  .report-chart-wrap{height:260px;}
}
@media print{
  @page{size:A4 portrait;margin:12mm;}
  .no-print,.topbar,.sidebar{display:none !important;}
  html,body{background:#fff !important;font-size:11pt;}
  .shell{display:block !important;min-height:0 !important;}
  .main{padding:0 !important;}
  .card{box-shadow:none !important;border:1px solid #d1d5db !important;border-radius:8px !important;padding:12px !important;margin:0 0 10px !important;}
  .report-question{break-inside:avoid !important;page-break-inside:avoid !important;}
  .report-chart-wrap{height:245px !important;max-height:245px !important;}
  .report-chart-wrap canvas{width:100% !important;height:245px !important;max-height:245px !important;}
  .chart-summary{margin-top:6px !important;}
  .chart-summary .metric{padding:4px 7px !important;font-size:9.5pt !important;}
  .report-open-answer{padding:6px 8px !important;margin:4px 0 !important;}
}

/* Footer liên hệ / góp ý */
.site-footer{
  border-top:1px solid var(--border); background:#fff; color:var(--text-mute);
  padding:16px; text-align:center; font-size:13px; line-height:1.55;
}
.site-footer-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;}
.site-footer .zalo-contact{display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--brand); font-weight:700;}
.site-footer .zalo-contact img{width:42px; height:42px; object-fit:contain; border-radius:10px; display:block; cursor:pointer;}
.site-footer .contact-email{color:var(--brand); font-weight:700; text-decoration:none;}
.site-footer a:hover{text-decoration:underline;}
@media(max-width:600px){
  .site-footer{padding:14px 12px; font-size:12.5px;}
  .site-footer-inner{gap:7px;}
  .site-footer .zalo-contact{width:100%; justify-content:center; flex-wrap:wrap;}
}
@media print{
  .site-footer{display:none !important;}
  .report-contact-print{
    display:flex !important; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
    border-top:1px solid #d1d5db; margin-top:8px; padding-top:7px; font-size:9.5pt; color:#4b5563;
    break-inside:avoid; page-break-inside:avoid;
  }
  .report-contact-print a{color:#155e75;text-decoration:none;font-weight:700;}
}


/* ---------------- QR VĨNH VIỄN MODULE ---------------- */
.qr-manager-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.qr-create-grid{display:grid;grid-template-columns:1fr 220px;gap:12px}
.qr-list{display:grid;gap:12px;margin-top:14px}
.qr-item{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:start;border:1px solid var(--border);border-radius:14px;padding:14px;background:#fff}
.qr-thumb{background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px;cursor:pointer;width:86px;height:86px}
.qr-thumb img{width:72px;height:72px;display:block}
.qr-code{font-weight:800;color:var(--brand);letter-spacing:.03em}
.qr-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.qr-target{word-break:break-all;font-size:13px;background:#f8fafc;border:1px solid var(--border);padding:8px 10px;border-radius:8px}
.qr-edit-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.qr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qr-owner{font-size:12px;color:var(--muted)}
.qr-result{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}
.qr-result img{width:160px;height:160px;background:#fff;border-radius:10px;padding:8px;border:1px solid var(--border);cursor:pointer}
#qrBigOverlay{position:fixed;inset:0;background:rgba(2,6,23,.92);z-index:9999;display:none;align-items:center;justify-content:center;padding:24px}
#qrBigOverlay.show{display:flex}
#qrBigOverlay .qr-big-box{text-align:center;color:#fff;max-width:760px}
#qrBigOverlay img{width:min(72vw,620px);height:min(72vw,620px);background:#fff;padding:18px;border-radius:18px}
#qrBigOverlay .qr-big-link{margin-top:12px;word-break:break-all;font-size:13px;color:#e2e8f0}
@media(max-width:700px){.qr-create-grid{grid-template-columns:1fr}.qr-item{grid-template-columns:1fr}.qr-thumb{width:86px}.qr-result{grid-template-columns:1fr}.qr-edit-row{grid-template-columns:1fr}}


/* ================= THẢO LUẬN NHÓM ================= */
.group-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.group-live-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:16px}
.group-panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;min-height:170px;box-shadow:0 3px 12px #0000000a}
.group-panel h4{margin:0 0 4px;font-size:16px}
.group-topic{font-size:13px;color:var(--primary);font-weight:700;margin-bottom:8px}
.group-note{background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:9px 10px;margin:7px 0;white-space:pre-wrap;word-break:break-word}
.group-media{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.group-media img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #e2e8f0;cursor:pointer}
.group-file{display:block;padding:7px 9px;border-radius:8px;background:#f8fafc;border:1px solid #e2e8f0;margin-top:6px;word-break:break-all}
.group-file-unsafe{color:#b91c1c;background:#fef2f2;border-color:#fecaca;cursor:default}
.group-qr-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;display:inline-block;text-align:center}
.group-qr-box img{width:170px;height:170px;display:block;cursor:pointer}
.group-timer{font-size:38px;font-weight:900;letter-spacing:1px}
.group-timer.done{color:#dc2626}
.group-student-wrap{max-width:760px;margin:0 auto;padding:24px 16px}
.group-student-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-top:14px}
.group-upload-preview{max-width:220px;max-height:160px;border-radius:8px;margin-top:8px}
.group-admin-owner{font-size:12px;color:#64748b}
@media(max-width:700px){.group-live-grid{grid-template-columns:1fr}.group-timer{font-size:30px}}
.group-panel{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.group-panel:hover{transform:translateY(-2px);box-shadow:0 8px 24px #00000018}
.group-panel::after{content:"Bấm để phóng to";display:block;text-align:right;font-size:10px;color:#94a3b8;margin-top:8px}
.group-panel-popup{position:fixed;inset:0;background:rgba(2,6,23,.96);z-index:10020;display:flex;align-items:center;justify-content:center;padding:28px}
.group-panel-popup.hidden{display:none!important}
.group-panel-popup-inner{width:min(1100px,94vw);max-height:88vh;overflow:auto;background:#fff;border-radius:18px;padding:30px;box-shadow:0 30px 80px #0008}
.group-panel-popup-inner h2{font-size:34px;margin:0 0 6px}
.group-panel-popup-inner .group-topic{font-size:19px;margin-bottom:18px}
.group-panel-popup-inner .group-note{font-size:22px;line-height:1.55;padding:15px 17px;margin:11px 0}
.group-panel-popup-inner .group-media img{width:150px;height:150px}
.group-panel-popup-inner .group-file{font-size:18px;padding:11px 13px}
.group-popup-close{position:fixed;right:26px;bottom:24px;z-index:10021}
.group-timer-float{position:fixed;top:14px;right:16px;z-index:10010;background:#0f2942;color:#fff;border:2px solid #d9a441;border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 8px 24px #0005;text-align:center;min-width:118px}
.group-timer-float .lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.78;margin-bottom:2px}
.group-timer-float .clock{font-size:28px;font-weight:900;letter-spacing:1px;line-height:1}
.group-timer-float.done{border-color:#ef4444}
.group-timer-float.done .clock{color:#fecaca}
.group-timer-popup{position:fixed;inset:0;background:#081526;z-index:10030;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
.group-timer-popup.hidden{display:none!important}
.group-timer-popup .big-clock{font-size:clamp(64px,16vw,160px);font-weight:900;letter-spacing:3px;line-height:1}
.group-timer-popup .big-label{font-size:clamp(20px,3vw,34px);font-weight:800;margin-top:14px;color:#fbbf24;text-align:center;padding:0 20px}
.group-timer-popup.done .big-clock,.group-timer-popup.done .big-label{color:#ef4444}
.group-timer-popup .close-timer{position:absolute;bottom:28px;right:28px}
@media(max-width:700px){
  .group-timer-float{top:10px;right:10px;min-width:100px;padding:7px 10px}
  .group-timer-float .clock{font-size:23px}
  .group-panel-popup{padding:14px}
  .group-panel-popup-inner{padding:20px}
  .group-panel-popup-inner h2{font-size:28px}
  .group-panel-popup-inner .group-note{font-size:18px}
}



/* V1 FINAL — Connection health */
.net-banner{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:12000;padding:9px 16px;border-radius:999px;background:#991b1b;color:#fff;font-weight:800;box-shadow:0 6px 24px #0003;max-width:92vw;text-align:center}.net-banner.online{background:#166534}.health-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.health-item{border:1px solid var(--border);border-radius:12px;padding:10px;background:#fff}.health-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#16a34a;margin-right:6px}.health-dot.bad{background:#dc2626}.health-dot.warn{background:#ca8a04}@media(max-width:800px){.health-grid{grid-template-columns:1fr 1fr}}

.qset-card .qset-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.qset-list{max-height:54vh;overflow:auto}.qset-row{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px}
/* V2 Phase 1 — Knowledge Space */
.knowledge-hero{background:linear-gradient(135deg,#0f766e,#155e75);color:#fff;border-radius:16px;padding:22px;margin-bottom:16px}
.knowledge-hero .mut{color:#d9f7f2}.knowledge-code{font:800 30px/1 monospace;letter-spacing:4px;color:#0f766e}
.knowledge-stat{padding:18px;text-align:center}.knowledge-stat strong{display:block;font-size:30px;color:var(--brand)}
.knowledge-list{display:grid;gap:10px}.knowledge-item{border:1px solid var(--border);border-radius:10px;padding:12px;background:#fff;overflow-wrap:anywhere}
.knowledge-item .meta{font-size:12px;color:var(--text-mute);margin-bottom:5px}.knowledge-progress{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.knowledge-progress>span{display:block;height:100%;background:linear-gradient(90deg,#14b8a6,#0891b2);transition:width .2s}
.knowledge-join{min-height:100vh;background:linear-gradient(180deg,#ecfeff,#f8fafc);padding:16px}.knowledge-join .student-card{margin:24px auto;max-width:620px}
.ai-status{border-left:4px solid #0891b2}.ai-status.failed{border-left-color:#dc2626}.ai-status.completed{border-left-color:#16a34a}
.ai-topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.ai-topic-card{border:1px solid var(--border);border-radius:12px;padding:13px;background:#f8fafc}
.ai-chips{display:flex;gap:6px;flex-wrap:wrap}.ai-chip{display:inline-block;padding:5px 9px;border-radius:999px;background:#ccfbf1;color:#115e59;font-size:12px;font-weight:700}
.ai-map-row{display:grid;grid-template-columns:minmax(120px,220px) 1fr auto;gap:8px;align-items:center;margin:8px 0}.ai-map-bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}.ai-map-bar span{display:block;height:100%;background:linear-gradient(90deg,#14b8a6,#0284c7)}
@media(max-width:600px){.knowledge-hero{padding:17px}.knowledge-code{font-size:25px}.knowledge-stat strong{font-size:25px}}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(ts){
  try{
    const d = ts && ts.toDate ? ts.toDate() : (ts instanceof Date ? ts : (ts ? new Date(ts) : null));
    if(!d) return "—";
    return d.toLocaleString("vi-VN", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
  }catch(e){ return "—"; }
}
function fmtDateShort(ts){
  try{
    const d = ts && ts.toDate ? ts.toDate() : (ts instanceof Date ? ts : (ts?new Date(ts):null));
    if(!d) return "—";
    return d.toLocaleDateString("vi-VN");
  }catch(e){ return "—"; }
}
function genToken(len){
  len = len || 28;
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  let out = "";
  for(let i=0;i<len;i++) out += chars[arr[i] % chars.length];
  return out;
}
function genShortCode(){
  const L = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const N = "0123456789";
  let code = "";
  for(let i=0;i<3;i++) code += L[Math.floor(Math.random()*L.length)];
  code += "-";
  for(let i=0;i<3;i++) code += N[Math.floor(Math.random()*N.length)];
  return code;
}
function toast(msg, type){
  const root = document.getElementById("toast-root");
  const t = document.createElement("div");
  t.className = "toast " + (type||"");
  t.textContent = msg;
  root.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),300); }, 3800);
}
function debounce(fn, ms){ let h; return (...a)=>{ clearTimeout(h); h=setTimeout(()=>fn(...a), ms); }; }

function mapError(err){
  const code = (err && (err.code||"")) + "";
  const map = {
    "auth/invalid-email":"Địa chỉ email không hợp lệ.",
    "auth/user-disabled":"Tài khoản đã bị vô hiệu hóa.",
    "auth/user-not-found":"Email hoặc mật khẩu không đúng.",
    "auth/wrong-password":"Email hoặc mật khẩu không đúng.",
    "auth/invalid-credential":"Email hoặc mật khẩu không đúng.",
    "auth/invalid-login-credentials":"Email hoặc mật khẩu không đúng.",
    "auth/email-already-in-use":"Email này đã được đăng ký. Vui lòng đăng nhập.",
    "auth/weak-password":"Mật khẩu quá yếu. Vui lòng dùng ít nhất 6 ký tự.",
    "auth/too-many-requests":"Bạn đã thử quá nhiều lần. Vui lòng thử lại sau ít phút.",
    "auth/network-request-failed":"Mất kết nối mạng. Vui lòng kiểm tra Internet và thử lại.",
    "auth/popup-closed-by-user":"Cửa sổ đăng nhập đã bị đóng.",
    "auth/operation-not-allowed":"Phương thức đăng nhập chưa được bật trong Firebase.",
    "permission-denied":"Bạn không có quyền thực hiện thao tác này.",
    "unavailable":"Không thể kết nối máy chủ. Đang thử kết nối lại…",
    "deadline-exceeded":"Kết nối quá chậm. Vui lòng thử lại.",
    "not-found":"Không tìm thấy dữ liệu yêu cầu.",
    "already-exists":"Dữ liệu đã tồn tại.",
    "resource-exhausted":"Hệ thống đang quá tải. Vui lòng thử lại sau.",
    "group-membership-invalid":"Không thể xác định nhóm của bạn. Vui lòng liên hệ giảng viên."
  };
  if(map[code]) return map[code];
  if(!navigator.onLine) return "Mất kết nối mạng. Đang thử kết nối lại…";
  return "Đã xảy ra lỗi. Vui lòng thử lại. (" + (code || "unknown") + ")";
}

let __profileUnsub = null;
function startProfileWatch(uid){
  stopProfileWatch();
  __profileUnsub = onSnapshot(doc(db,"users",uid), (snap)=>{
    if(!snap.exists()) return; // lỗi mạng thoáng qua hoặc tài khoản đang được tạo — giữ nguyên UI
    const prevStatus = STATE.profile ? STATE.profile.status : null;
    const newProfile = snap.data();
    STATE.profile = newProfile;
    if(prevStatus === "active" && newProfile.status !== "active"){
      // Admin vừa đổi trạng thái (suspended/pending/khác) trong khi Dashboard đang mở:
      // dừng NGAY các listener nghiệp vụ khác (lớp/phiên/câu hỏi/phản hồi...) vì từ giờ
      // Firestore Rules sẽ từ chối chúng, rồi khóa màn hình lập tức.
      clearListeners();
      renderInternalApp();
      toast("Tài khoản của bạn vừa bị quản trị viên thay đổi trạng thái.", "warn");
    }
  }, (err)=>{ /* best-effort — bỏ qua lỗi tạm thời, không làm gián đoạn phiên làm việc */ });
}
function stopProfileWatch(){ if(__profileUnsub){ try{ __profileUnsub(); }catch(e){} __profileUnsub = null; } }

// GATE 2B-RT-INTEGRATION: generic modal-close cleanup hook. A caller that mounts stateful
// resources inside a modal (currently: RichTextEditor instances in openSessionInfoEditor) sets
// this to a teardown function; any modal transition — Cancel, backdrop click, or a fresh
// openModal() call that replaces the host's content without an explicit prior closeModal() —
// runs it exactly once. Every other existing modal never sets this, so it is a no-op for them.
let modalCloseCleanup=null;
function runModalCloseCleanup(){ if(modalCloseCleanup){ try{modalCloseCleanup();}catch(e){} modalCloseCleanup=null; } }
function openModal(html, large){
  runModalCloseCleanup();
  let host = document.getElementById("globalModal");
  if(!host){ host = document.createElement("div"); host.id="globalModal"; document.body.appendChild(host); }
  host.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal ${large?'modal-lg':''}">${html}</div></div>`;
  $("#modalBackdrop").addEventListener("click", (e)=>{ if(e.target.id==="modalBackdrop") closeModal(); });
  return host;
}
function closeModal(){ runModalCloseCleanup(); const h = document.getElementById("globalModal"); if(h) h.innerHTML=""; }

// Gate 1A: field-level conflict checks; no lifecycle, identity or collected data writes.
const SESSION_INFO_FIELDS = {
  sessions: ["title", "description"],
  groupActivities: ["title", "instructions"],
  knowledgeSessions: ["title", "targetSubmissions"]
};
function sessionInfoError(message){ return new Error(message); }
function checkSessionInfoAccess(data){
  const p=STATE.profile, uid=STATE.user?.uid;
  if(!uid || !((p?.role==="admin" && p.status==="active") || (p?.role==="teacher" && p.status==="active" && data.ownerId===uid)))
    throw sessionInfoError("Bạn không có quyền sửa phiên này.");
  if(data.deletedAt || data.teacherDeletedAt || data.adminDeletedAt || data.adminDeleting)
    throw sessionInfoError("Phiên đang trong thùng rác hoặc đang xóa. Hãy khôi phục trước khi sửa.");
  // Gate 1B.1: Gate 1A's editor only knows the legacy shape; refuse rather than blind-write
  // onto a session that has moved to the versioned contract (see docs/READER-CONTRACT.md §6).
  try{ assertLegacyWritable(data); }catch(e){ throw sessionInfoError(e.message); }
}
async function loadSessionInfo(kind,id){
  if(!SESSION_INFO_FIELDS[kind]) throw sessionInfoError("Loại phiên không hợp lệ.");
  const ref=doc(db,kind,id), snap=await getDoc(ref);
  if(!snap.exists()) throw sessionInfoError("Phiên không còn tồn tại.");
  const original=snap.data(); checkSessionInfoAccess(original);
  const rows=[{ref,original,fields:SESSION_INFO_FIELDS[kind]}];
  if(kind==="groupActivities"){
    if(!Number.isInteger(original.groupCount) || original.groupCount<2 || original.groupCount>12)
      throw sessionInfoError("Cấu hình số nhóm không hợp lệ; cần kiểm tra trước khi sửa.");
    const topics=await Promise.all(Array.from({length:original.groupCount},async(_,i)=>{
      const ref=doc(db,kind,id,"topics",String(i+1)), s=await getDoc(ref);
      return {ref,original:s.exists()?s.data():null,fields:["topic"],group:i+1};
    }));
    rows.push(...topics);
  }
  return {kind,rows,uid:STATE.user.uid};
}
function validateSessionInfo(kind,values){
  if(typeof values[0]?.title!=="string" || !values[0].title.trim())
    throw sessionInfoError("Vui lòng nhập tên phiên.");
  if(kind==="knowledgeSessions"){
    if(values[0].title.length<3 || values[0].title.length>120)
      throw sessionInfoError("Tên phiên phải có từ 3 đến 120 ký tự.");
    if(!Number.isInteger(values[0].targetSubmissions) || values[0].targetSubmissions<3 || values[0].targetSubmissions>10000)
      throw sessionInfoError("Mục tiêu phải là số nguyên từ 3 đến 10.000.");
  }
}
// `richPatches` (optional): an array parallel to model.rows, each entry either null or
// {richKey,richValue,plainKey,plainValue} — supplied by openSessionInfoEditor's RichTextEditor
// integration for whichever rows' Rich field genuinely changed vs. its load-time baseline (see
// there for why that baseline, not row.original, is what "changed" is measured against). Rich
// fields are deliberately excluded from `row.fields` handling below (see RICH_ROW_KEY) — they are
// written ONLY through this merge, never through the generic scalar diff, so they can carry
// object values through the exact same transaction/conflict-detection machinery unchanged.
async function saveSessionInfo(model,values,richPatches){
  validateSessionInfo(model.kind,values);
  // Missing optional text fields stay missing unless the user actually enters text. A field with
  // no corresponding DOM control this save (Rich-managed fields — see openSessionInfoEditor) has
  // values[i][k]===undefined and is skipped here entirely; it is supplied via richPatches instead.
  const edits=model.rows.map((row,i)=>Object.fromEntries(row.fields
    .filter(k=>values[i][k]!==undefined)
    .filter(k=>!valuesEqualDeep(values[i][k], row.original?.[k] ?? ""))
    .map(k=>[k,values[i][k]])));
  richPatches?.forEach((rp,i)=>{ if(rp){ edits[i][rp.richKey]=rp.richValue; edits[i][rp.plainKey]=rp.plainValue; } });
  if(!edits.some(e=>Object.keys(e).length)) return false;
  await runTransaction(db,async tx=>{
    if(STATE.user?.uid!==model.uid) throw sessionInfoError("Tài khoản đã thay đổi. Hãy mở lại cửa sổ sửa.");
    const snaps=[];
    // All reads precede writes. Firestore retries if a document changes during save.
    for(const row of model.rows) snaps.push(await tx.get(row.ref));
    if(!snaps[0].exists()) throw sessionInfoError("Phiên không còn tồn tại.");
    const current=snaps[0].data(); checkSessionInfoAccess(current);
    if(current.ownerId!==model.rows[0].original.ownerId)
      throw sessionInfoError("Chủ phiên đã thay đổi. Hãy mở lại cửa sổ sửa.");
    if(model.kind==="groupActivities" && current.groupCount!==model.rows[0].original.groupCount)
      throw sessionInfoError("Số nhóm đã thay đổi ở cửa sổ khác. Bản nhập vẫn được giữ; hãy kiểm tra lại phiên.");
    model.rows.forEach((row,i)=>{
      const patch=edits[i], latest=snaps[i].exists()?snaps[i].data():null;
      if(!Object.keys(patch).length) return;
      if(row.original && !latest) throw sessionInfoError("Dữ liệu đã bị xóa ở cửa sổ khác. Bản nhập vẫn được giữ.");
      if(findConflictKey(patch,latest,row.original))
        throw sessionInfoError("Nội dung bạn đang sửa vừa được thay đổi ở cửa sổ khác. Chưa lưu; bản nhập vẫn được giữ. Hãy sao chép bản nhập, hủy và mở lại để đối chiếu.");
      if(latest) tx.update(row.ref,{...patch,updatedAt:serverTimestamp()});
      else tx.set(row.ref,{group:row.group,...patch,updatedAt:serverTimestamp()});
    });
  });
  return true;
}
// GATE 2B-RT-INTEGRATION: which SESSION_INFO_FIELDS keys have a RichText V1 counterpart, and are
// therefore rendered/edited via RichTextEditor instead of a plain textarea — groupActivities only.
const RICH_ROW_KEY={instructions:"instructionsRich",topic:"topicRich"};
async function openSessionInfoEditor(kind,id,onSaved){
  let model;
  try{model=await loadSessionInfo(kind,id);}catch(e){toast(e.message || mapError(e),"err");return;}
  const labels={title:"Tên phiên",description:"Mô tả",instructions:"Hướng dẫn / nhiệm vụ chung",targetSubmissions:"Mục tiêu lượt gửi",topic:"Nhiệm vụ nhóm"};
  const isGroupRich=kind==="groupActivities";
  const host=openModal(`<h3>Sửa phiên</h3><p class="mut">Lưu thông tin trên phiên hiện có.</p>
    ${model.rows.map((row,i)=>row.fields.map(key=>{
      const val=row.original?.[key]??"", inputId=`si-${i}-${key}`;
      if(isGroupRich && RICH_ROW_KEY[key]){
        return `<div class="field"><label>${esc(labels[key])}${row.group?` ${row.group}`:""}</label><div id="${inputId}-rt" class="rt-editor-host"></div></div>`;
      }
      return `<div class="field"><label for="${inputId}">${esc(labels[key])}${row.group?` ${row.group}`:""}</label>${key==="targetSubmissions"?
        `<input id="${inputId}" type="number" min="3" max="10000" step="1" value="${esc(val)}">`:
        key==="title"?`<input type="text" id="${inputId}" value="${esc(val)}" ${kind==="knowledgeSessions"?'maxlength="120"':""}>`:
        `<textarea id="${inputId}" rows="4">${esc(val)}</textarea>`}</div>`;
    }).join("")).join("")}
    <div id="siError" class="error-text" role="alert"></div>
    <div class="flex-between mt-14"><button class="btn btn-ghost" id="siCancel">HỦY</button><button class="btn" id="siSave">LƯU THAY ĐỔI</button></div>`,true);

  // Mount one RichTextEditor per Rich-capable row/field (common instructions + every group's
  // topic). Each loads instructionsRich/topicRich when present AND contract-valid, else falls
  // back to the legacy plain string — never the other way around, and never both at once.
  const richEntries=[];
  if(isGroupRich){
    model.rows.forEach((row,i)=>{
      row.fields.forEach(key=>{
        const richKey=RICH_ROW_KEY[key];
        if(!richKey) return;
        const mount=host.querySelector(`#si-${i}-${key}-rt`);
        const editor=new RichTextEditor({container:mount, ariaLabel:esc(labels[key])});
        const stored=row.original?.[richKey];
        if(stored!==undefined && stored!==null && validateRichTextV1(stored)) editor.setRichText(stored);
        else editor.setPlainText(row.original?.[key] ?? "");
        // Baseline = what THIS editor would export right now, immediately after loading and
        // before any user interaction. Comparing save-time export against this (not against the
        // raw stored string) is what lets a genuine no-op open+save correctly report "no changes"
        // even for legacy content whose line-ending/whitespace convention the editor's own
        // deterministic load->export round trip normalizes.
        const baseline=editor.getRichText();
        richEntries.push({
          rowIndex:i, key, richKey, editor,
          baselineRich: baseline.ok ? baseline.value : null,
          baselinePlain: baseline.ok ? richTextToPlainText(baseline.value) : (row.original?.[key] ?? "")
        });
      });
    });
  }
  modalCloseCleanup=()=>{ richEntries.forEach(en=>{ try{en.editor.destroy();}catch(e){} }); };

  const save=host.querySelector("#siSave"),cancel=host.querySelector("#siCancel"),error=host.querySelector("#siError");
  let busy=false;
  // Do not let a backdrop click discard a draft while a save is pending.
  host.querySelector("#modalBackdrop").addEventListener("click",e=>{if(busy)e.stopImmediatePropagation();},true);
  cancel.onclick=()=>{if(!busy)closeModal();};
  save.onclick=async()=>{
    if(busy)return;
    busy=true; save.disabled=true; cancel.disabled=true; error.textContent="";

    // Trusted export first, for every Rich editor, BEFORE touching Firestore at all. Any single
    // failure blocks the WHOLE save — no partial write, modal stays open, every editor's authored
    // content is left exactly as the lecturer left it (nothing is cleared or reset).
    const richResults=richEntries.map(en=>({en,result:en.editor.getRichText()}));
    const failed=richResults.find(r=>!r.result.ok);
    if(failed){
      const groupSuffix=model.rows[failed.en.rowIndex].group?` ${model.rows[failed.en.rowIndex].group}`:"";
      error.textContent=`Nội dung "${labels[failed.en.key]}${groupSuffix}" vượt quá giới hạn định dạng cho phép (quá dài hoặc quá nhiều đoạn/định dạng). Vui lòng rút gọn nội dung rồi lưu lại.`;
      busy=false; save.disabled=false; cancel.disabled=false;
      return;
    }
    const richPatches=model.rows.map(()=>null);
    richResults.forEach(({en,result})=>{
      const richValue=result.value, plainMirror=richTextToPlainText(richValue);
      const changed=JSON.stringify(richValue)!==JSON.stringify(en.baselineRich) || plainMirror!==en.baselinePlain;
      if(changed) richPatches[en.rowIndex]={richKey:en.richKey, richValue, plainKey:en.key, plainValue:plainMirror};
    });

    const values=model.rows.map((row,i)=>Object.fromEntries(row.fields
      .filter(key=>!(isGroupRich && RICH_ROW_KEY[key]))
      .map(key=>{
        const value=host.querySelector(`#si-${i}-${key}`).value;
        return [key,key==="targetSubmissions"?Number(value):value];
      })));
    host.querySelectorAll("input,textarea").forEach(el=>el.disabled=true);
    try{
      const changed=await saveSessionInfo(model,values,richPatches);closeModal();toast(changed?"Đã lưu thông tin phiên.":"Không có thay đổi cần lưu.","ok");
      if(changed && onSaved) Promise.resolve().then(onSaved).catch(()=>toast("Đã lưu. Hãy tải lại danh sách để xem thông tin mới.","warn"));
    }
    catch(e){error.textContent=e.code?mapError(e):e.message;}
    finally{busy=false;save.disabled=false;cancel.disabled=false;host.querySelectorAll("input,textarea").forEach(el=>el.disabled=false);}
  };
}

      </select>
    </div>
    <div class="field"><label>Thời gian trả lời</label>
      <select data-ce-field="timeLimitPreset" data-ce-idx="${idx}">

      <div class="field"><label>Giá trị nhỏ nhất</label><input type="number" data-ce-field="scaleMin" data-ce-idx="${idx}" value="${q.scaleMin??1}"></div>
      <div class="field"><label>Giá trị lớn nhất</label><input type="number" data-ce-field="scaleMax" data-ce-idx="${idx}" value="${q.scaleMax??5}"></div>
    </div>` : ""}
    ${meta.needsOptions && q.type!=="truefalse" ? `
    <div class="mt-8"><label>Phương án trả lời</label>
      ${q.options.map((o,oi)=>`<div class="flex gap-8 mt-8" style="align-items:center;">
        <input type="text" placeholder="Nhãn (VD: A)" style="max-width:90px;" data-ce-opt-field="label" data-ce-idx="${idx}" data-ce-opt-idx="${oi}" value="${esc(o.label||"")}">
        <input type="text" placeholder="Nội dung phương án" data-ce-opt-field="text" data-ce-idx="${idx}" data-ce-opt-idx="${oi}" value="${esc(o.text||"")}">
        <button type="button" class="btn btn-sm btn-ghost" data-ce-opt-remove="${idx}" data-ce-opt-idx="${oi}" ${q.options.length<=1?"disabled":""}>✕</button>
      </div>`).join("")}
      <button type="button" class="btn btn-sm btn-outline mt-8" data-ce-opt-add="${idx}">+ Thêm phương án</button>
    </div>` : q.type==="truefalse" ? `<p class="small mut mt-8">Phương án cố định: Đúng / Sai.</p>` : ""}
  </div>`;
}

    timeLimit:0, allowChangeAnswer:false, scaleMin:1, scaleMax:5,

}
async function openContractInteractionEditor(sessionId, onSaved){
  // GATE E2 item 6: single choke point for every "SỬA PHIÊN" entry point (live control,
  // overview, history) — the protected production audit fixture never opens this editor,
  // regardless of which list screen the click came from.
  if(isProtectedFixture(sessionId)){ toast("Phiên kiểm thử hợp đồng hệ thống — chỉ đọc, không chỉnh sửa.","warn"); return; }
  const sessionRef = doc(db,"sessions",sessionId);
  let sessionSnap;
  try{ sessionSnap = await getDoc(sessionRef); }catch(e){ toast(mapError(e),"err"); return; }
  if(!sessionSnap.exists()){ toast("Phiên không còn tồn tại.","err"); return; }
  const sessionData = sessionSnap.data();
  if(sessionData.ownerId!==STATE.user.uid && !(STATE.profile?.role==="admin" && STATE.profile.status==="active")){
    toast("Bạn không có quyền sửa phiên này.","err"); return;
  }
  let entryState;
  try{
    const dbFacade = makeFirestoreDbFacade(db, { doc, getDoc, collection, getDocs, query, where });
    entryState = await resolveEditorEntryState(dbFacade, `sessions/${sessionId}`, sessionData, sessionId);
  }catch(e){ toast(mapError(e) || e.message || "Không thể tải cấu hình hợp đồng cho phiên này.", "err"); return; }
  if(entryState.mode==="legacy"){
    // GATE 1B.3-D1 item 1: never auto-activate Contract mode from this entry point — that
    // remains a separate, explicit action elsewhere. Fall back to the unchanged Gate 1A editor.
    openSessionInfoEditor("sessions", sessionId, onSaved);
    return;
  }
  const banner = entryState.mode==="rev0"
    ? `⚠️ Đây sẽ là <b>phiên bản nội dung đầu tiên (rev1)</b> theo cơ chế hợp đồng phiên bản. Nội dung câu hỏi cũ hiện tại được nạp sẵn bên dưới để bạn xác nhận/chỉnh sửa — đây KHÔNG phải một bản chụp chính xác tại thời điểm lưu, mà là nội dung đã được bạn xác nhận trong màn hình sửa này.`
    : `Đang sửa trên <b>phiên bản hiện hành (rev${entryState.expectedRevision})</b>. Lưu sẽ tạo một <b>phiên bản mới</b> (rev${entryState.expectedRevision+1}) — không sửa trực tiếp phiên bản cũ.`;
  const state = {
    title: entryState.editorSeed.title, description: entryState.editorSeed.description,
    allowMultipleResponses: !!entryState.editorSeed.allowMultipleResponses,
    anonymous: !!entryState.editorSeed.anonymous, showResponderCount: !!entryState.editorSeed.showResponderCount,
    questions: entryState.editorSeed.questions.map(q=>({...q, options:(q.options||[]).map(o=>({...o}))}))
  };
  const host = openModal(`
    <div class="flex-between"><h3>Sửa nội dung phiên (hợp đồng phiên bản)</h3><button type="button" class="btn btn-sm btn-ghost" id="ceClose">✕</button></div>
    <p class="hint">${banner}</p>
    <div class="field"><label>Tên phiên</label><input type="text" id="ceTitle" value="${esc(state.title)}"></div>
    <div class="field"><label>Mô tả</label><textarea rows="3" id="ceDescription">${esc(state.description)}</textarea></div>
    <label class="flex gap-8 mt-8" style="align-items:center;"><input type="checkbox" id="ceAllowMultiple" ${state.allowMultipleResponses?"checked":""}> Cho phép trả lời nhiều lần</label>
    <label class="flex gap-8 mt-8" style="align-items:center;"><input type="checkbox" id="ceAnonymous" ${state.anonymous?"checked":""}> Ẩn danh</label>
    <label class="flex gap-8 mt-8" style="align-items:center;"><input type="checkbox" id="ceShowResponderCount" ${state.showResponderCount?"checked":""}> Hiển thị số lượt trả lời</label>
    <div class="flex-between mt-14"><h4 id="ceQCount" style="margin:0;">Câu hỏi (${state.questions.length}/100)</h4><button type="button" class="btn btn-sm btn-outline" id="ceAddQuestion">+ Thêm câu hỏi</button></div>
    <div id="ceQuestions"></div>
    <div id="ceError" class="error-text mt-8" role="alert"></div>
    <div class="flex-between mt-14"><button class="btn btn-ghost" id="ceCancel">HỦY</button><button class="btn" id="ceSave">LƯU PHIÊN BẢN MỚI</button></div>
  `, true);
  function renderQuestions(){
    $("#ceQuestions").innerHTML = state.questions.map((q,i)=>contractEditorQuestionCard(q,i,state.questions.length)).join("") ||
      `<p class="mut small mt-8">Chưa có câu hỏi nào.</p>`;
    if($("#ceQCount")) $("#ceQCount").textContent = `Câu hỏi (${state.questions.length}/100)`;
    $("#ceQuestions").querySelectorAll("[data-ce-field]").forEach(el=>{
      const idx=Number(el.dataset.ceIdx), field=el.dataset.ceField;
      el.onchange=()=>{
        const q=state.questions[idx];
        if(field==="type"){
          q.type=el.value;
          const meta=QUESTION_TYPES[q.type];
          if(!meta.allowedCharts.includes(q.chartType)) q.chartType=meta.defaultChart;
          if(q.type==="truefalse") q.options=QUESTION_TYPES.truefalse.fixedOptions.map((label,i)=>({label,text:label,value:null,isCorrect:null}));
          else if(meta.needsOptions && q.options.length===0) q.options=[{label:"A",text:"",value:null,isCorrect:null},{label:"B",text:"",value:null,isCorrect:null}];
          renderQuestions();
        } else if(field==="timeLimitPreset"){
          if(el.value==="custom"){ renderQuestions(); return; }
          q.timeLimit=Number(el.value); renderQuestions();
        } else if(field==="timeLimitCustomMinutes"){
          q.timeLimit=Math.max(1,Math.round(Number(el.value)||1))*60;
        } else if(field==="required" || field==="allowChangeAnswer"){
          q[field]=el.checked;
        } else if(field==="scaleMin" || field==="scaleMax"){
          q[field]=Number(el.value);
        } else {
          q[field]=el.value;
        }
      };
    });
    $("#ceQuestions").querySelectorAll("[data-ce-opt-field]").forEach(el=>{
      el.onchange=()=>{ state.questions[Number(el.dataset.ceIdx)].options[Number(el.dataset.ceOptIdx)][el.dataset.ceOptField]=el.value; };
    });
    $("#ceQuestions").querySelectorAll("[data-ce-opt-add]").forEach(b=>b.onclick=()=>{
      state.questions[Number(b.dataset.ceOptAdd)].options.push({label:"",text:"",value:null,isCorrect:null}); renderQuestions();
    });
    $("#ceQuestions").querySelectorAll("[data-ce-opt-remove]").forEach(b=>b.onclick=()=>{
      const q=state.questions[Number(b.dataset.ceOptRemove)]; q.options.splice(Number(b.dataset.ceOptIdx),1); renderQuestions();
    });
    $("#ceQuestions").querySelectorAll("[data-ce-remove]").forEach(b=>b.onclick=()=>{ state.questions.splice(Number(b.dataset.ceRemove),1); renderQuestions(); });
    $("#ceQuestions").querySelectorAll("[data-ce-up]").forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.ceUp); if(i>0){[state.questions[i-1],state.questions[i]]=[state.questions[i],state.questions[i-1]]; renderQuestions();} });
    $("#ceQuestions").querySelectorAll("[data-ce-down]").forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.ceDown); if(i<state.questions.length-1){[state.questions[i+1],state.questions[i]]=[state.questions[i],state.questions[i+1]]; renderQuestions();} });
  }
  renderQuestions();
  $("#ceAddQuestion").onclick=()=>{ if(state.questions.length>=100){toast("Đã đạt số câu hỏi tối đa (100) cho một phiên bản.","warn");return;} state.questions.push(newContractQuestionDraft()); renderQuestions(); };
  const closeBtn=host.querySelector("#ceClose"), cancel=host.querySelector("#ceCancel"), save=host.querySelector("#ceSave"), error=host.querySelector("#ceError");
  let busy=false;
  host.querySelector("#modalBackdrop").addEventListener("click",e=>{if(busy)e.stopImmediatePropagation();},true);
  closeBtn.onclick=cancel.onclick=()=>{if(!busy)closeModal();};
  save.onclick=async()=>{
    if(busy)return; busy=true; save.disabled=true; cancel.disabled=true; error.textContent="";
    const candidateChanges = {
      title: $("#ceTitle").value, description: $("#ceDescription").value,
      allowMultipleResponses: $("#ceAllowMultiple").checked, anonymous: $("#ceAnonymous").checked,
      showResponderCount: $("#ceShowResponderCount").checked,
      questions: state.questions.map(q=>({...q}))
    };
    const operationId = crypto.randomUUID?crypto.randomUUID():`${Date.now()}_${Math.random().toString(36).slice(2)}`;
    try{
      const outcome = await saveInteractionRevision({
        db, firestore:{doc,collection,runTransaction,serverTimestamp,getDoc},
        sessionId, actorUid: STATE.user.uid, operationId, mode: entryState.mode,
        expectedRevision: entryState.expectedRevision, editorSeed: entryState.editorSeed,
        candidateChanges, legacyQuestionsForSnapshot: entryState.legacyQuestionsForSnapshot
      });
      closeModal();
      if(outcome.noChange){ toast("Không có thay đổi cần lưu.","ok"); }
      else{
        // GATE 1B.3-D2: runtime consumers (điều khiển trực tiếp, học viên, báo cáo, xuất dữ
        // liệu, nhân bản) now correctly use this new revision — only Presentation remains
        // deliberately unsupported for Contract sessions (see teacherLiveControl's own notice).
        toast(`Đã lưu phiên bản nội dung mới (rev${outcome.result.resultingRevision}). Màn hình HIỂN THỊ TRÌNH CHIẾU vẫn chưa hỗ trợ phiên bản hợp đồng — các màn hình khác đã dùng đúng nội dung mới.`,"ok");
        if(onSaved) Promise.resolve().then(onSaved).catch(()=>{});
      }
    }catch(e){
      // GATE 1B.3-D1 item 8: REVISION_INTEGRITY_VERIFICATION_FAILED must never be presented as
      // "save failed, nothing happened" — e.message already carries the explicit "the write
      // occurred, stays CLOSED, do not reopen" guidance from contract-editor.mjs.
      error.textContent = e.message || mapError(e);
    }finally{ busy=false; save.disabled=false; cancel.disabled=false; }
  };
}

/* ---------------- GATE E2: explicit Contract activation ----------------
   Wires contract-activation.mjs's canShowActivationAction()/activateSessionExplicit() — DOM
   only, no semantic/security logic of its own. See contract-activation.mjs and

async function openActivateContractDialog(sessionId, onActivated){
  const host = openModal(`
    <div class="flex-between"><h3>Kích hoạt chế độ chỉnh sửa nâng cao</h3><button type="button" class="btn btn-sm btn-ghost" id="acClose">✕</button></div>

        <li><b>không thể hoàn tác</b> — một khi đã kích hoạt, phiên không quay lại chế độ cũ;</li>

        <li>sau khi kích hoạt, các lần sửa nội dung (câu hỏi/cài đặt) tiếp theo sẽ tạo ra một <b>phiên bản nội dung mới</b> thay vì ghi đè trực tiếp.</li>
      </ul>
    </div>

    <div class="flex-between mt-14"><button class="btn btn-ghost" id="acCancel">HỦY</button><button class="btn" id="acConfirm">XÁC NHẬN KÍCH HOẠT</button></div>
  `, true);
  const close=host.querySelector("#acClose"), cancel=host.querySelector("#acCancel"), confirm=host.querySelector("#acConfirm"), error=host.querySelector("#acError");
  let busy=false;
  host.querySelector("#modalBackdrop").addEventListener("click",e=>{if(busy)e.stopImmediatePropagation();},true);
  close.onclick=cancel.onclick=()=>{if(!busy)closeModal();}; // Cancel performs zero writes.
  confirm.onclick=async()=>{
    if(busy)return; busy=true; confirm.disabled=true; cancel.disabled=true; error.textContent="";
    const operationId = crypto.randomUUID?crypto.randomUUID():`${Date.now()}_${Math.random().toString(36).slice(2)}`;
    try{
      // GATE E6 hotfix: activateSessionExplicit() calls contract-writer.mjs's activateContract()
      // internally, which needs the full { doc, collection, runTransaction, serverTimestamp }
      // set (plus getDoc for the fresh-state re-read) — a narrower facade here throws a raw,
      // unclassified TypeError before any Firestore write is even attempted (see Gate E5).
      await activateSessionExplicit({ db, firestore:{doc,getDoc,collection,runTransaction,serverTimestamp}, sessionId, actorUid: STATE.user.uid, actorProfile: STATE.profile, operationId });
      closeModal();
      // GATE E2 item 9: never implies a semantic revision was created, never auto-opens the
      // Contract editor — a separate, explicit edit action is required afterward.
      toast("Đã kích hoạt chế độ chỉnh sửa nâng cao. Phiên hiện ở rev0 và chưa thay đổi nội dung.","ok");
      if(onActivated) Promise.resolve().then(onActivated).catch(()=>{});
    }catch(e){
      error.textContent = e instanceof ContractActivationError ? e.message : mapError(e);
    }finally{ busy=false; confirm.disabled=false; cancel.disabled=false; }
  };
}

function boot(){
  const mode = getMode();
  if(mode === "knowledgeStudent"){
    clearListeners();
    renderKnowledgeStudentEntry();
    return;
  }
  if(mode === "qrRedirect"){
    clearListeners();
    renderQrRedirect();
    return;
  }
  if(mode === "groupStudent"){
    clearListeners();
    renderGroupStudentEntry();
    return;
  }
  if(mode === "student"){
    clearListeners();
    renderStudentEntry();
    return;
  }
  if(mode === "presentation"){
    clearListeners();
    renderPresentationEntry();
    return;
  }
  // Mặc định: màn hình đăng nhập giảng viên/admin
  onAuthStateChanged(auth, async (user) => {
    const myGen = ++__authGeneration;
    STATE.authReady = true;
    // Khi đang trong luồng đăng ký thủ công (authFlowLock), luồng đó tự chịu
    // trách nhiệm render để tránh việc onAuthStateChanged "chen ngang" xóa mất
    // form đang thao tác giữa chừng (race condition giữa tạo tài khoản Auth và
    // ghi hồ sơ Firestore users/{uid}).
    if(authFlowLock) return;
    const newUid = user ? user.uid : null;
    const accountChanged = __lastAuthUid !== undefined && __lastAuthUid !== newUid;
    __lastAuthUid = newUid;
    if(accountChanged){
      // Tài khoản active trong tab này vừa đổi (không phải lần load đầu tiên): dọn
      // ngay listener/profile của tài khoản trước, xóa route đang lưu trên hash, đưa
      // điều hướng riêng tư (tab đang xem) về mặc định, và bỏ mọi bản nháp tạo phiên
      // dang dở — để tài khoản mới không kế thừa tab/route/bản nháp riêng tư (vd
      // #/knowledge/..., tab "knowledge" còn sót lại, hay wizard chưa lưu) từ tài
      // khoản trước.
      stopProfileWatch();
      clearListeners();
      STATE.profile = null;
      STATE.teacherNav = "overview";
      STATE.adminNav = "overview";
      STATE.wizard = null;
      if(window.location.hash) window.location.hash = "";
    }
    if(!user){ stopProfileWatch(); STATE.user = null; STATE.profile = null; renderAuthScreen(); return; }
    if(user.isAnonymous){
      // Người dùng ẩn danh không thuộc luồng teacher/admin — quay lại màn hình đăng nhập.
      stopProfileWatch(); STATE.user = null; STATE.profile = null; renderAuthScreen(); return;
    }
    await loadProfileAndRenderForUser(user, myGen);
  });
}
let __authGeneration = 0;
let __lastAuthUid; // undefined cho đến sự kiện auth đầu tiên trong tab này
let authFlowLock = false;
async function loadProfileAndRenderForUser(user, myGen = __authGeneration){
  STATE.user = user;
  try{
    const snap = await getDoc(doc(db,"users",user.uid));
    // Một sự kiện auth mới hơn đã xảy ra trong lúc await ở trên (vd tài khoản vừa
    // đổi lần nữa): bỏ kết quả cũ này, không ghi đè STATE bằng dữ liệu đã lỗi thời.
    if(myGen !== __authGeneration) return;
    STATE.profile = snap.exists() ? snap.data() : null;
  }catch(e){
    if(myGen !== __authGeneration) return;
    toast(mapError(e), "err");
    STATE.profile = null;
  }
  if(myGen !== __authGeneration) return;
  if(!STATE.profile){ stopProfileWatch(); renderNeedsProfileScreen(); return; }
  // cập nhật lastLoginAt (best-effort, không chặn UI)
  updateDoc(doc(db,"users",user.uid), { lastLoginAt: serverTimestamp(), updatedAt: serverTimestamp() }).catch(()=>{});
  // FIX 10: bắt đầu theo dõi trạng thái tài khoản theo thời gian thực, xuyên suốt phiên làm việc.
  startProfileWatch(user.uid);
  renderInternalApp();
}

      });

function renderInternalApp(){

  if(!p) return renderNeedsProfileScreen();
  if(p.status === "pending"){
    appRoot().innerHTML = pendingSuspendedScreen("⏳","Tài khoản của bạn đang chờ quản trị viên cấp phép.","Vui lòng quay lại sau, hoặc liên hệ quản trị viên hệ thống.");
    $("#btnLogoutX").onclick = ()=>signOut(auth);
    return;
  }
  if(p.status === "suspended"){
    appRoot().innerHTML = pendingSuspendedScreen("🔒","Tài khoản của bạn đã bị tạm khóa.","Vui lòng liên hệ quản trị viên.");
    $("#btnLogoutX").onclick = ()=>signOut(auth);
    return;
  }
  if(p.status !== "active"){
    appRoot().innerHTML = pendingSuspendedScreen("⚠️","Tài khoản không ở trạng thái hoạt động.","Vui lòng liên hệ quản trị viên.");
    $("#btnLogoutX").onclick = ()=>signOut(auth);
    return;
  }
  if(p.role === "admin") return renderAdminShell();
  if(p.role === "teacher") return renderTeacherShell();
  appRoot().innerHTML = pendingSuspendedScreen("⚠️","Vai trò tài khoản không hợp lệ.","Vui lòng liên hệ quản trị viên.");

function errorBlock(e, retryFn){

}

function statusBadge(status){
  if(status==="active") return `<span class="badge badge-green">🟢 Hoạt động</span>`;
  if(status==="pending") return `<span class="badge badge-yellow">🟡 Chờ cấp phép</span>`;
  if(status==="suspended") return `<span class="badge badge-red">🔴 Đã khóa</span>`;
  return `<span class="badge badge-gray">${esc(status)}</span>`;
}

      if(fl && u.status!==fl) return false;

      return true;
    });

    $("#teacherTableWrap").innerHTML = `<table><thead><tr><th>Tên</th><th>Email</th><th>Trạng thái</th><th>Ngày đăng ký</th><th>Đăng nhập gần nhất</th><th>Thao tác</th></tr></thead>

          ${u.status==="active"?`<button class="btn btn-sm btn-danger" data-a="suspend" data-id="${u.id}">KHÓA</button>`:""}
          ${u.status==="suspended"?`<button class="btn btn-sm btn-ok" data-a="reactivate" data-id="${u.id}">MỞ KHÓA</button>`:""}
          <button class="btn btn-sm btn-outline" data-a="detail" data-id="${u.id}">XEM CHI TIẾT</button>
          <button class="btn btn-sm btn-ghost" data-a="reset" data-id="${u.id}">GỬI LINK ĐẶT LẠI MẬT KHẨU</button>
        </td>
      </tr>`).join("")}</tbody></table>`;
    $$("[data-a]").forEach(b=>{
      b.onclick = ()=>{
        const id=b.dataset.id, act=b.dataset.a;

const GROUP_COLLECTION = "groupActivities";
const GROUP_JOIN_COLLECTION = "groupJoinCodes";
const GROUP_CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function groupRandCode(len=6){
  let s=""; for(let i=0;i<len;i++) s+=GROUP_CODE_CHARS[Math.floor(Math.random()*GROUP_CODE_CHARS.length)];
  return s;
}
function groupJoinLink(code){
  return window.location.origin + window.location.pathname + "?group=" + encodeURIComponent(code);
}
function groupStatusBadge(s){
  const m={draft:["Nháp","badge"],open:["Đang mở","badge badge-green"],closed:["Đã đóng","badge badge-gray"]};
  const x=m[s]||[s||"—","badge"]; return `<span class="${x[1]}">${x[0]}</span>`;
}
async function groupUniqueCode(){
  for(let i=0;i<8;i++){
    const code=groupRandCode(6);
    const snap=await getDoc(doc(db,GROUP_JOIN_COLLECTION,code));
    if(!snap.exists()) return code;
  }
  return groupRandCode(8);
}

async function deleteGroupActivityDeep(id){
  const aRef=doc(db,GROUP_COLLECTION,id); const s=await getDoc(aRef); if(!s.exists()) return;
  const a=s.data();
  if(!(STATE.profile.role==="admin" || a.ownerId===STATE.user.uid)) throw {code:"permission-denied"};
  // GATE 2A-AUTH-I3-UI-FIX: "members" added — the deep-delete previously left orphaned
  // groupActivities/{id}/members/{uid} docs behind after normal activity deletion. Same chunked
  // batch-delete pattern as every other child collection here, no other change to this function.
  for(const sub of ["topics","notes","photos","files","members"]){
    const snap=await getDocs(collection(db,GROUP_COLLECTION,id,sub));
    await deleteRefsInChunks(snap.docs.map(d=>d.ref));
  }
  if(a.joinCode) await deleteDoc(doc(db,GROUP_JOIN_COLLECTION,a.joinCode)).catch(()=>{});
  await deleteDoc(aRef);
}

// GATE 2A-S: the only place a groupActivities file document is turned into anchor HTML. Every
// render site must call this instead of embedding f.link/f.url in an href template directly —
// safeGroupFileLinkUrl() fails closed (returns null) for anything but http(s), including a
// historical document that bypassed the old, scheme-less Rules check.
function groupFileAnchorHtml(f){
  if(f.link){
    const safeHref=safeGroupFileLinkUrl(f.link);
    return safeHref
      ? `<a class="group-file" href="${esc(safeHref)}" target="_blank" rel="noopener">🔗 ${esc(f.name||"Liên kết")}</a>`
      : `<span class="group-file group-file-unsafe">⚠️ Liên kết không hợp lệ hoặc không an toàn</span>`;
  }
  return `<a class="group-file" href="${f.url||f.dataUrl}" download="${esc(f.name||"tep")}">📄 ${esc(f.name||"Tệp")}</a>`;
}

  // GATE 2B-RT-INTEGRATION: same shared safe renderer for the common instructions card, both at

// GATE 2A-AUTH-I2-CORRECTION: owner/admin-only roster + narrow field-only group correction.
// Reads via the new additive members `list` Rule (owner/admin only — students still get no
// list at all); writes via a single-field updateDoc(), never a full document rewrite, so
// joinCode/joinedAt stay exactly as Rules require regardless of what this UI sends. No PII is
// displayed or stored — the label is derived purely from the opaque uid.
async function openGroupMembersManager(activityId,groupCount){
  const host=openModal(`<h3>Quản lý nhóm học viên</h3><p class="mut">Xem và điều chỉnh nhóm của học viên đã tham gia hoạt động này.</p><div id="gmmList"><div class="mut small">Đang tải…</div></div><div class="flex-between mt-14"><button class="btn btn-ghost" id="gmmClose">ĐÓNG</button></div>`,true);
  host.querySelector("#gmmClose").onclick=closeModal;
  const list=host.querySelector("#gmmList");
  try{
    const snap=await getDocs(collection(db,GROUP_COLLECTION,activityId,"members"));
    if(snap.empty){list.innerHTML=`<div class="mut small">Chưa có học viên nào tham gia.</div>`;return;}
    const rows=snap.docs.map(d=>({uid:d.id,...d.data()})).sort((x,y)=>(x.group||0)-(y.group||0));
    list.innerHTML=rows.map(r=>{
      const label="Học viên "+shortStudentCode(r.uid);
      return `<div class="flex-between mt-8" data-gmm-row="${esc(r.uid)}"><div>${esc(label)}</div><div class="flex gap-8" style="align-items:center"><select data-gmm-select>${Array.from({length:groupCount||6},(_,k)=>`<option value="${k+1}" ${r.group===k+1?"selected":""}>Nhóm ${k+1}</option>`).join("")}</select><button class="btn btn-sm btn-outline" data-gmm-save>LƯU</button></div></div>`;
    }).join("");
    list.querySelectorAll("[data-gmm-row]").forEach(row=>{
      const uid=row.dataset.gmmRow, rec=rows.find(r=>r.uid===uid), saveBtn=row.querySelector("[data-gmm-save]"), sel=row.querySelector("[data-gmm-select]");
      let busy=false;
      saveBtn.onclick=async()=>{
        if(busy)return;
        const newGroup=Number(sel.value)||0;
        if(newGroup===rec.group){toast("Không có thay đổi.","warn");return;}
        if(!confirm(`Chuyển học viên từ Nhóm ${rec.group} sang Nhóm ${newGroup}?`))return;
        busy=true; saveBtn.disabled=true;
        try{
          await updateDoc(doc(db,GROUP_COLLECTION,activityId,"members",uid),{group:newGroup});
          rec.group=newGroup;
          toast("Đã chuyển nhóm học viên.","ok");
        }catch(e){toast(mapError(e),"err");}
        finally{busy=false; saveBtn.disabled=false;}
      };
    });
  }catch(e){
    list.innerHTML=`<div class="mut small">${esc(mapError(e))}</div>`;
  }
}

async function teacherLiveControl(c, sessionId){
  c.innerHTML = `<div class="center-screen" style="min-height:300px;"><span class="spinner"></span></div>`;
  let sessionRef = doc(db,"sessions",sessionId);
  let sessionSnap;
  try{ sessionSnap = await getDoc(sessionRef); }catch(e){ c.innerHTML = errorBlock(e, ()=>teacherLiveControl(c,sessionId)); return; }
  if(!sessionSnap.exists()){ c.innerHTML = `<div class="empty-state"><div class="ic">🚫</div>Không tìm thấy phiên tương tác.</div>`; return; }
  let session = sessionSnap.data();
  if(session.ownerId !== STATE.user.uid){ c.innerHTML = `<div class="empty-state"><div class="ic">⛔</div>Bạn không có quyền truy cập phiên này.</div>`; return; }
  if(session.deletedAt){ c.innerHTML = `<div class="empty-state"><div class="ic">🗑️</div>Phiên này đang ở trong Thùng rác. Hãy khôi phục phiên trước khi điều khiển.</div>`; return; }
  // Gate 1B.2C: an activated contract session now renders the normal lifecycle/runtime screen
  // (every control it wires below writes only the Class A lifecycle/runtime fields the deployed
  // Rules already allow post-activation — see docs/GATE-1B2-AUDIT-PLAN.md). Semantic display
  // values must come from the active versioned manifest, not the (frozen-at-activation) root
  // title/description, so resolve those once up front and fail closed if that resolution itself
  // fails — never silently fall back to the root fields for a contract session.
  let displaySemantics = { title: session.title, description: session.description };
  if(isContractSession(session)){
    try{
      const dbFacade = makeFirestoreDbFacade(db, { doc, getDoc, collection, getDocs, query, where });
      displaySemantics = await resolveSessionSemantics(dbFacade, `sessions/${sessionId}`, session, "interaction");
    }catch(e){
      c.innerHTML = `<div class="empty-state"><div class="ic">⚠️</div>Không thể tải cấu hình hợp đồng hiệu lực cho phiên này. Vui lòng tải lại trang hoặc liên hệ hỗ trợ.</div>`;
      return;
    }
  }

  // GATE 1B.3-D2: single shared resolver for "current ordered questions with embedded options" —
  // for a Contract rev>=1 session this reads SOLELY from the immutable current configVersions
  // document, never the raw top-level questions collection (which still holds every retired
  // revision's own question documents forever — a raw query would have let a prior revision's
  // question resurface as "current"). Legacy/rev0 behavior is byte-identical to before.
  let questions = [];
  let runtimeSettings = { allowMultipleResponses: !!session.allowMultipleResponses, anonymous: session.anonymous!==false, showResponderCount: session.showResponderCount!==false };
  try{
    const dbFacade = makeFirestoreDbFacade(db, { doc, getDoc, collection, getDocs, query, where });
    const runtimeQ = await resolveRuntimeQuestions(dbFacade, `sessions/${sessionId}`, session, sessionId);
    questions = runtimeQ.questions;
    if(isContractSession(session)) runtimeSettings = await resolveRuntimeSettings(dbFacade, `sessions/${sessionId}`, session);
  }catch(e){ c.innerHTML = errorBlock(e, ()=>teacherLiveControl(c,sessionId)); return; }
  if(questions.length===0){ c.innerHTML = `<div class="empty-state"><div class="ic">❓</div>Phiên này chưa có câu hỏi nào.</div>`; return; }

  const liveCounts = {};
  await Promise.all(questions.map(async q=>{
    try{ const cnt = await getCountFromServer(query(collection(db,"sessions",sessionId,"responses"), where("questionId","==",q.id))); liveCounts[q.id] = cnt.data().count; }
    catch(e){ liveCounts[q.id] = 0; }
  }));

  let curIndex = questions.findIndex(q=>q.id===session.activeQuestionId);
  if(curIndex<0) curIndex = 0;

  renderShell();
  let healthLastRealtime=Date.now();
  function updateHealthUI(){
    const online=navigator.onLine;
    const nd=$("#healthNetDot"),rd=$("#healthRtDot");
    if(nd)nd.classList.toggle("bad",!online);
    if($("#healthNet"))$("#healthNet").textContent=online?"Đã kết nối":"Mất kết nối";
    const fresh=online && (Date.now()-healthLastRealtime<15000);
    if(rd){rd.classList.toggle("bad",!online);rd.classList.toggle("warn",online&&!fresh);}
    if($("#healthRt"))$("#healthRt").textContent=!online?"Chờ Internet":fresh?"Hoạt động":"Đang chờ cập nhật…";
    if($("#healthLast"))$("#healthLast").textContent=new Date(healthLastRealtime).toLocaleTimeString("vi-VN");
    const clsSize=Number(session.classSize||session.studentCount||0);
    if($("#healthLargeWarn"))$("#healthLargeWarn").classList.toggle("hidden",clsSize<=300);
  }
  const healthTimer=setInterval(updateHealthUI,2000);track(()=>clearInterval(healthTimer));
  window.addEventListener("online",updateHealthUI);window.addEventListener("offline",updateHealthUI);
  track(()=>{window.removeEventListener("online",updateHealthUI);window.removeEventListener("offline",updateHealthUI);});

  function renderShell(){

      ${session.status!=="archived" && !shouldDisableLegacyTimeEdit(session, sessionId) ? `<button class="btn btn-outline" id="btnEditTime">⏱ ĐỔI THỜI GIAN</button>` : ""}
      <button class="btn ${session.showResults==='live'?'btn-warn':'btn-outline'}" id="btnToggleResults">${session.showResults==='live'?"ẨN KẾT QUẢ":"HIỂN THỊ KẾT QUẢ"}</button>
      ${isProtected

        : `<button class="btn btn-outline" id="btnSessionInfo">SỬA PHIÊN</button>`}
      ${canActivate ? `<button class="btn btn-outline" id="btnActivateContract">KÍCH HOẠT CHẾ ĐỘ CHỈNH SỬA NÂNG CAO</button>` : ""}
      <button class="btn btn-ghost" id="btnBackDash">← Về tổng quan</button>
    </div>
    ${isProtected ? `<p class="small mut no-print mt-8">🔒 Phiên kiểm thử hợp đồng hệ thống — chỉ đọc, không chỉnh sửa.</p>` : ""}

    ${isContract && Number(session.configRevision||0)>=1 ? `<p class="small mut no-print mt-8">ℹ️ Phiên đang dùng nội dung theo cơ chế hợp đồng phiên bản (rev${session.configRevision}). Màn hình HIỂN THỊ TRÌNH CHIẾU chưa hỗ trợ hiển thị nội dung phiên bản này — mọi màn hình khác (điều khiển trực tiếp, học viên, báo cáo, xuất dữ liệu, nhân bản) đã được cập nhật để dùng đúng nội dung hiện hành.</p>` : ""}
    <div class="card mt-14 no-print"><div class="health-grid">
      <div class="health-item"><div><span class="health-dot" id="healthNetDot"></span><b>Internet</b></div><div class="small mut" id="healthNet">Đang kiểm tra…</div></div>
      <div class="health-item"><div><span class="health-dot" id="healthRtDot"></span><b>Firebase Realtime</b></div><div class="small mut" id="healthRt">Đang kết nối…</div></div>
      <div class="health-item"><div><b>👥 Câu hiện tại</b></div><div class="small mut" id="healthParticipants">0 phản hồi</div></div>
      <div class="health-item"><div><b>📡 Cập nhật cuối</b></div><div class="small mut" id="healthLast">—</div></div>
    </div><div class="small mt-8 hidden" id="healthLargeWarn" style="color:#b45309;font-weight:700">⚠️ Lớp trên 300 học viên: nên dùng kết nối Internet ổn định và hạn chế mở nhiều màn hình Live Control cùng lúc.</div></div>
    <div class="live-grid mt-14">

          <div id="curQBody"></div>
        </div>
      </div>
      <div>
        <div class="stat"><div class="num" id="respCount">0</div><div class="lbl">Học viên đã trả lời câu này</div></div>
        <div class="card mt-14"><div class="chart-box"><canvas id="liveChart"></canvas></div><div id="liveChartSummary"></div></div>

    $("#btnSessionInfo").onclick = isProtected
      ? ()=>toast("Phiên kiểm thử hợp đồng hệ thống — chỉ đọc, không chỉnh sửa.","warn")
      : isContract
        ? ()=>openContractInteractionEditor(sessionId, ()=>teacherLiveControl(c,sessionId))
        : ()=>openSessionInfoEditor("sessions",sessionId);

    if($("#btnPrevQ")) $("#btnPrevQ").onclick = ()=>switchQuestion(curIndex-1);

    if($("#btnEditTime")) $("#btnEditTime").onclick = editSessionTime;
    if($("#btnToggleResults")) $("#btnToggleResults").onclick = toggleResults;
    renderCurrentQuestion();
  }

  async function renderCurrentQuestion(){
    const q = questions[curIndex];
    $("#curQText").textContent = `Câu ${curIndex+1}: ${q.question}`;
    // GATE 1B.3-D2: `q.options` is already embedded by resolveRuntimeQuestions() for BOTH
    // legacy and Contract-versioned questions — no separate subcollection query needed (and a
    // Contract question never has one to query: options create is denied by Rules for it).
    const options = q.options || [];
    if(q.type==="open"){
      $("#curQBody").innerHTML = `<div id="openList" class="mt-8"><div class="mut">Đang tải câu trả lời…</div></div>`;
    } else {
      $("#curQBody").innerHTML = `<p class="mut small">Biểu đồ: ${esc(CHART_LABELS[q.chartType])} · Thời gian: ${fmtDuration(q.timeLimit)}</p>`;
    }
    watchResponses(q, options);
  }
  function watchResponses(q, options){
    clearListeners();
    const respQ = query(collection(db,"sessions",sessionId,"responses"), where("questionId","==",q.id));
    track(onSnapshot(respQ, (snap)=>{
      const docs = snap.docs.map(d=>d.data());
      liveCounts[q.id] = docs.length;
      healthLastRealtime=Date.now();updateHealthUI();
      $("#healthParticipants") && ($("#healthParticipants").textContent=`${docs.length} phản hồi`);
      $("#respCount") && ($("#respCount").textContent = docs.length);
      const totalAll = Object.values(liveCounts).reduce((a,b)=>a+b,0);
      // Ghi lại dữ liệu tổng hợp AN TOÀN (không chứa câu trả lời cá nhân) vào session
      // để Presentation View / Student View (đăng nhập ẩn danh) có thể hiển thị
      // số lượt trả lời & biểu đồ mà KHÔNG cần quyền đọc trực tiếp responses.
      const agg = (q.type!=="open") ? aggregateForChart(q, options, docs) : null;
      // Với câu hỏi mở, chỉ đưa NỘI DUNG ẩn danh đã rút gọn sang session để Presentation
      // có thể dựng Opinion Wall. Không đưa participantId hay metadata cá nhân.
      const openAnswers = q.type==="open"
        ? docs
            .map(d=>({text:String(d.answer||"").trim(), ts:d.submittedAt?.toMillis?d.submittedAt.toMillis():0}))
            .filter(x=>x.text)
            .sort((a,b)=>b.ts-a.ts)
            .slice(0,24)
            .map(x=>x.text.slice(0,500))
        : null;
      // Aggregate chuyên dụng: một giảng viên là writer duy nhất, tránh hotspot do hàng trăm học viên cùng increment.
      // Presentation/Student có thể đọc 1 document aggregate thay vì đọc toàn bộ responses.
      // GATE 1B.3-D2R item B: writeLiveAggregate() (contract-runtime.mjs) is the exact real
      // two-write publish the D2R test suite exercises directly — showResponderCount rides on
      // it, resolved fresh from the CURRENT Contract config via resolveRuntimeSettings() above,
      // so an anonymous student sees the correct current value without ever needing to read
      // configVersions (Rules unchanged).
      writeLiveAggregate({
        db, firestore:{doc,setDoc,updateDoc,serverTimestamp,Timestamp}, sessionId, ownerId:STATE.user.uid,
        question:q, chartType:q.chartType, agg, respondedCount:docs.length, openAnswers,
        showResponderCount:runtimeSettings.showResponderCount, totalResponseCount:totalAll
      }).catch(()=>{});
      if(q.type==="open"){
        renderOpenList(docs);
      } else {
        const canvas = $("#liveChart");
        if(canvas) renderChart(canvas, q, options, docs, "live");
        const sm = $("#liveChartSummary");
        if(sm) sm.innerHTML = chartSummaryHtml(q, options, docs);
      }
    }, (err)=>{ toast(mapError(err),"err"); }));
    // vẫn theo dõi thay đổi trạng thái session (đóng/mở từ nơi khác)
    // Gate 1B.2C-P1: a contract session must keep showing the once-resolved effective title
    // (displaySemantics.title) — the root field is frozen-at-activation and must not reappear
    // as a "live" value. A LEGACY session has no such freeze: Gate 1A can still edit its root
    // title while this screen stays open, so it must follow the FRESH snapshot value on every
    // update, exactly as it did before the contract-bridge work. liveTitleForSnapshot() picks
    // between the two without re-resolving the contract config on every snapshot.
    track(onSnapshot(sessionRef, (snap)=>{ if(snap.exists()){ session = snap.data(); if($("#liveSessionTitle"))$("#liveSessionTitle").textContent=liveTitleForSnapshot(isContractSession(session), session.title, displaySemantics.title); } }));
  }
  function renderOpenList(docs){

    const top = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8);

      <p class="small mut">${answers.length} câu trả lời</p>
      ${top.length?`<div class="flex gap-8 mt-8" style="flex-wrap:wrap;">${top.map(([w,n])=>`<span class="chip">${esc(w)} × ${n}</span>`).join("")}</div>`:""}

      </div>
      <div class="card" style="padding:12px 14px;background:#f8fafc;box-shadow:none;">
        <p class="small" style="margin:0;"><b>Lưu ý:</b> nếu phiên đang mở, khi bấm Lưu hệ thống sẽ <b>khởi động lại bộ đếm của câu hiện tại từ đầu</b> theo thời gian mới. Học viên không cần quét lại QR.</p>
      </div>
      <div id="editTimeErr" class="error-text hidden mt-8"></div>
      <div class="flex-between mt-14">
        <button type="button" class="btn btn-ghost" id="editTimeCancel">Hủy</button>
        <button type="button" class="btn btn-ok" id="editTimeSave">LƯU THỜI GIAN</button>
      </div>
    `);
    const preset = $("#editTimePreset");
    const customWrap = $("#editTimeCustomWrap");
    preset.onchange = ()=>customWrap.classList.toggle("hidden", preset.value!=="custom");
    $("#editTimeClose").onclick = closeModal;
    $("#editTimeCancel").onclick = closeModal;
    $("#editTimeSave").onclick = async ()=>{
      const btn = $("#editTimeSave");
      const tv = preset.value;
      let seconds;
      if(tv==="custom"){
        const mins = Number($("#editTimeCustom").value);
        if(!Number.isFinite(mins) || mins < 1){
          $("#editTimeErr").textContent = "Vui lòng nhập số phút từ 1 trở lên.";
          $("#editTimeErr").classList.remove("hidden");
          return;
        }
        seconds = Math.round(mins * 60);
      }else{
        seconds = Number(tv);
      }
      btn.disabled = true;
      btn.textContent = "Đang lưu…";
      try{
        const batch = writeBatch(db);
        questions.forEach(q=>{
          batch.update(doc(db,"questions",q.id), {
            timeLimit: seconds,
            updatedAt: serverTimestamp()
          });
        });
        // Nếu phiên đang mở, reset mốc bắt đầu câu hiện tại để thời gian mới có hiệu lực ngay,
        // tránh tình trạng thời gian cũ đã hết khiến học viên vẫn thấy "Hết thời gian".
        if(session.status==="open"){
          batch.update(sessionRef, {
            activeQuestionStartedAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
        }else{
          batch.update(sessionRef, { updatedAt: serverTimestamp() });

        await batch.commit();
        questions.forEach(q=>q.timeLimit = seconds);

  async function switchQuestion(idx){
    if(idx<0 || idx>=questions.length) return;
    curIndex = idx;
    try{ await updateDoc(sessionRef, { activeQuestionId: questions[idx].id, activeQuestionStartedAt: serverTimestamp(), updatedAt: serverTimestamp() }); session.activeQuestionId = questions[idx].id; }
    catch(e){ toast(mapError(e),"err"); }
    renderShell();
  }
  async function openSession(){
    try{
      await updateDoc(sessionRef, { status:"open", startedAt: session.startedAt||serverTimestamp(), activeQuestionId: session.activeQuestionId||questions[0].id, activeQuestionStartedAt: serverTimestamp(), updatedAt: serverTimestamp() });
      session.status="open"; toast("Đã mở phiên. Học viên có thể tham gia ngay bây giờ.","ok"); renderShell();
    }catch(e){ toast(mapError(e),"err"); }
  }
  async function closeSession(){
    if(!confirm("Đóng bình chọn? Học viên sẽ không thể gửi câu trả lời mới.")) return;
    try{ await updateDoc(sessionRef, { status:"closed", closedAt: serverTimestamp(), updatedAt: serverTimestamp() }); session.status="closed"; toast("Đã đóng phiên.","ok"); renderShell(); }
    catch(e){ toast(mapError(e),"err"); }
  }
  async function reopenSession(){
    // GATE 1B.3-D2 item 3: MANDATORY reopen integrity guard — re-reads the authoritative root
    // and current Contract config fresh (never trusting the in-memory `session` this closure
    // already holds) and re-proves every declared question document before any reopen write is
    // even attempted. A no-op (skipped:true) for legacy/rev0; for Contract rev>=1 this is not
    // advisory — a failure here MUST block the reopen entirely, with no partial/compensating
    // write of any kind.
    try{
      await verifyReopenIntegrity({ db, firestore:{doc,getDoc}, sessionId });
    }catch(e){
      toast(e instanceof ContractRuntimeError ? e.message : mapError(e), "err");
      return;
    }
    try{
      await updateDoc(sessionRef, {
        status:"open",
        closedAt:null,
        activeQuestionStartedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      session.status="open";
      toast("Đã mở lại phiên. Bộ đếm câu hiện tại đã bắt đầu lại.","ok");
      renderShell();
    }catch(e){ toast(mapError(e),"err"); }
  }
  async function archiveSession(){
    if(!confirm("Kết thúc và lưu trữ phiên này?")) return;
    try{ await updateDoc(sessionRef, { status:"archived", updatedAt: serverTimestamp() }); session.status="archived"; toast("Đã lưu trữ phiên.","ok"); window.location.hash=""; STATE.teacherNav="history"; teacherRoute(); }
    catch(e){ toast(mapError(e),"err"); }
  }
  async function toggleResults(){
    const next = session.showResults==="live" ? "hidden" : "live";
    try{ await updateDoc(sessionRef, { showResults: next, updatedAt: serverTimestamp() }); session.showResults = next; renderShell(); }
    catch(e){ toast(mapError(e),"err"); }
  }
}

async function loadTeacherClassMap(){
  const snap = await getDocs(query(collection(db,"classes"), where("ownerId","==",STATE.user.uid)));
  const m = {}; snap.docs.forEach(d=>m[d.id]=d.data()); return m;

async function deleteRefsInChunks(refs, chunkSize=400){
  for(let i=0;i<refs.length;i+=chunkSize){
    const batch = writeBatch(db);
    refs.slice(i,i+chunkSize).forEach(ref=>batch.delete(ref));
    await batch.commit();
  }
}
async function deleteSessionDeep(sessionId){
  const sRef = doc(db,"sessions",sessionId);
  const sSnap = await getDoc(sRef);
  if(!sSnap.exists()) throw {code:"not-found"};
  const s = sSnap.data();
  if(s.ownerId!==STATE.user.uid) throw {code:"permission-denied"};

  // Tránh xóa nhầm một phiên vẫn đang nhận câu trả lời.
  if(s.status==="open"){
    throw {code:"session-open-delete-blocked"};
  }

  // 1) Responses của phiên.
  const respSnap = await getDocs(collection(db,"sessions",sessionId,"responses"));
  await deleteRefsInChunks(respSnap.docs.map(d=>d.ref));

  // 2) Questions + options của từng question.
  const qSnap = await getDocs(query(
    collection(db,"questions"),
    where("ownerId","==",STATE.user.uid),
    where("sessionId","==",sessionId)
  ));
  for(const qDoc of qSnap.docs){
    const optSnap = await getDocs(collection(db,"questions",qDoc.id,"options"));
    await deleteRefsInChunks(optSnap.docs.map(d=>d.ref));
  }
  await deleteRefsInChunks(qSnap.docs.map(d=>d.ref));

  // 3) Các bản ánh xạ QR / mã tham gia.
  const mappingRefs = [];
  if(s.shortCode) mappingRefs.push(doc(db,"joinCodes",s.shortCode));
  if(s.accessToken) mappingRefs.push(doc(db,"sessionTokens",s.accessToken));
  if(mappingRefs.length) await deleteRefsInChunks(mappingRefs);

  // 4) Cuối cùng mới xóa session.
  await deleteDoc(sRef);
}
async function confirmAndDeleteSession(sessionId, title, afterDelete){
  const name = title ? `\\n\\n“${title}”` : "";
  if(!confirm(
    "XÓA VĨNH VIỄN PHIÊN NÀY?"+name+
    "\\n\\nHệ thống sẽ xóa phiên, câu hỏi, phương án, câu trả lời và mã QR/mã tham gia liên quan."+
    "\\n\\nDữ liệu báo cáo của phiên này sẽ không thể khôi phục."
  )) return;

  try{
    await deleteSessionDeep(sessionId);
    toast("Đã xóa vĩnh viễn phiên và dữ liệu liên quan.","ok");
    afterDelete && afterDelete();
  }catch(e){
    if((e.code||"")==="session-open-delete-blocked"){
      toast("Phiên đang mở. Vui lòng ĐÓNG PHIÊN trước khi xóa.","warn");
      return;
    }
    toast(mapError(e),"err");
    console.error("deleteSessionDeep", e);
  }
}

async function cloneSessionToWizard(sessionId){
  try{
    const sSnap=await getDoc(doc(db,"sessions",sessionId)); if(!sSnap.exists()) return;
    const s=sSnap.data();
    // GATE 1B.3-D2 item 9: seed from the single shared runtime resolvers — for a Contract
    // rev>=1 session this reads SOLELY the current immutable config (never a leftover live
    // legacy question, never a stale prior-revision Contract question, never root's frozen-at-
    // activation title/settings). Only semantic CONTENT is cloned — Contract configId/roundId/
    // questionId are never even present on the resolver's shape the wizard reads from below
    // (blankQuestion() below assigns the wizard's own fresh temp identity), so there is nothing
    // for this clone to carry forward as an authoritative Contract identity.
    const dbFacade=makeFirestoreDbFacade(db,{doc,getDoc,collection,getDocs,query,where});
    const [runtimeQ,runtimeSettings]=await Promise.all([
      resolveRuntimeQuestions(dbFacade,`sessions/${sessionId}`,s,sessionId),
      resolveRuntimeSettings(dbFacade,`sessions/${sessionId}`,s)
    ]);
    const qs=runtimeQ.questions.map(q=>({...blankQuestion(),question:q.question||"",description:q.description||"",type:q.type||"single",
      options:q.type==="truefalse"?QUESTION_TYPES.truefalse.fixedOptions.slice():((q.options||[]).map(o=>o.text).length?(q.options||[]).map(o=>o.text):["",""]),
      chartType:q.chartType||null,scaleMin:q.scaleMin??1,scaleMax:q.scaleMax??5,required:q.required!==false,
      timeLimit:q.timeLimit||0,allowChangeAnswer:!!q.allowChangeAnswer}));
    initWizard();
    STATE.wizard.title=(runtimeSettings.title||"Phiên")+" - Bản sao";
    STATE.wizard.classId=s.classId||"";
    STATE.wizard.questions=qs.length?qs:[blankQuestion()];
    STATE.wizard.settings={...STATE.wizard.settings,timeLimit:s.timeLimit||0,showResults:s.showResults||"hidden",
      allowChangeAnswer:!!s.allowChangeAnswer,anonymous:runtimeSettings.anonymous,showResponderCount:runtimeSettings.showResponderCount,
      allowMultipleResponses:runtimeSettings.allowMultipleResponses};
    STATE.wizard.step=1;STATE.wizard.qIndex=0;
    await logAudit("clone_to_wizard","session",sessionId,{title:runtimeSettings.title||""});
    window.location.hash="#/wizard";toast("Đã nhân bản vào màn hình Tạo tương tác. Anh có thể đổi tên, lớp và câu hỏi trước khi lưu.","ok");
  }catch(e){toast(mapError(e),"err");console.error(e);}
}

function downloadBlob(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function csvEscape(v){ const s = String(v==null?"":v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportSessionCSV(session, className, questionBlocks){
  // GATE 1B.3-D2R item A: buildInteractionCsvRows() (session-view.mjs) is the exact same pure
  // row-builder the D2R test suite exercises directly against a real rev1->rev2 report — no row
  // logic is duplicated/re-derived here.
  const rows = buildInteractionCsvRows(questionBlocks);
  const csv = "﻿" + rows.map(r=>r.map(csvEscape).join(",")).join("\n");
  downloadBlob(`bao-cao-${session.shortCode||"session"}.csv`, csv, "text/csv;charset=utf-8;");
}
function exportSessionJSON(session, className, questionBlocks, semanticTitle){
  // Gate 1B.2C-T: semanticTitle is always passed by the one caller (teacherReportView), already
  // resolved via displaySemantics (root title for legacy, active versioned manifest for a
  // contract session) — deliberately no `|| session.title` fallback here, so a contract
  // session can never silently export the frozen root value. Payload construction itself lives
  // in buildInteractionJsonExport() (session-view.mjs), a pure function with no Blob/download
  // side effects, so it is directly unit-testable.
  const out = buildInteractionJsonExport(session, className, questionBlocks, semanticTitle);
  downloadBlob(`bao-cao-${session.shortCode||"session"}.json`, JSON.stringify(out,null,2), "application/json");
}

function ensureAnonAuth(){
  // QUAN TRỌNG (FIX 7): dùng `publicAuth` (App Firebase thứ hai, độc lập) — KHÔNG BAO GIỜ
  // dùng `auth` (app chính của Giảng viên/Admin) ở đây. Nếu dùng chung `auth`, khi Học viên/
  // Trình chiếu mở trong cùng trình duyệt đang có Giảng viên đăng nhập, `auth.currentUser`
  // có thể chính là giảng viên đó — participantId của học viên sẽ bị trùng với uid giảng viên
  // (rất nguy hiểm). Dùng `publicAuth` tách biệt đảm bảo học viên luôn có một uid ẩn danh
  // riêng, không đụng chạm đến phiên đăng nhập giảng viên ở bất kỳ tab nào.
  return new Promise((resolve, reject)=>{
    const unsub = onAuthStateChanged(publicAuth, (user)=>{
      unsub();
      if(user){ resolve(user); return; }
      signInAnonymously(publicAuth).then(cred=>resolve(cred.user)).catch(reject);
    }, reject);
  });
}

let __studentLastQid = null, __studentTimerHandle = null;
function watchStudentSession(sessionId){
  clearListeners();
  __studentLastQid = null;
  const sref = doc(publicDb,"sessions",sessionId);
  track(onSnapshot(sref, (snap)=>{
    if(!snap.exists()){ studentBodyError("Phiên tương tác đã bị xóa.", showCodeEntryForm); return; }
    const session = snap.data();
    STATE.student.session = session;
    if(session.status==="closed" || session.status==="archived"){ renderStudentEnded(session); return; }
    if(session.status!=="open"){ renderStudentWaiting("Phiên chưa được mở. Vui lòng chờ giảng viên bắt đầu."); return; }
    if(!session.activeQuestionId){ renderStudentWaiting("Giảng viên chưa bắt đầu câu hỏi nào."); return; }
    if(session.activeQuestionId !== __studentLastQid){
      __studentLastQid = session.activeQuestionId;
      loadStudentQuestion(sessionId, session);
    } else {
      updateStudentResultBadge(session);
    }
  }, (err)=>{ studentBodyError(mapError(err), ()=>watchStudentSession(sessionId)); }));
}

async function loadStudentQuestion(sessionId, session){
  if(__studentTimerHandle) clearInterval(__studentTimerHandle);
  $("#studentBody").innerHTML = `<div class="center-screen" style="min-height:200px;"><span class="spinner"></span></div>`;
  try{
    const qSnap = await getDoc(doc(publicDb,"questions",session.activeQuestionId));
    if(!qSnap.exists()){ studentBodyError("Không tìm thấy câu hỏi hiện tại."); return; }
    const question = { id: qSnap.id, ...qSnap.data() };
    // GATE 1B.3-D2 item 5: fail closed rather than render historical semantics as current — a
    // Contract-versioned question whose configId no longer matches the session's currentConfigId
    // (a stale/foreign-revision activeQuestionId) must never be shown as the active question.
    // This never needs a configVersions read: `session` already carries currentConfigId as a
    // plain, already-subscribed root field.
    if(!isQuestionCurrentForSession(question, session)){
      studentBodyError("Câu hỏi hiện tại không còn thuộc phiên bản nội dung mới nhất. Vui lòng chờ giảng viên.");
      return;
    }
    // A Contract-versioned question carries its options embedded — never a subcollection (Rules
    // deny creating one for it). Only a legacy question needs the subcollection query.
    let options = [];
    if(isEmbeddedOptionsQuestion(question)){
      options = question.options || [];
    } else if(QUESTION_TYPES[question.type].needsOptions){
      const os = await getDocs(query(collection(publicDb,"questions",question.id,"options"), orderBy("order","asc")));
      options = os.docs.map(d=>({id:d.id, ...d.data()}));
    }
    let existing = null;
    try{ const rs = await getDoc(doc(publicDb,"sessions",sessionId,"responses", question.id+"_"+publicAuth.currentUser.uid)); if(rs.exists()) existing = rs.data(); }catch(e){}
    STATE.student.question = question; STATE.student.options = options; STATE.student.myResponse = existing;
    renderStudentQuestion(sessionId, session, question, options, existing);
  }catch(e){ studentBodyError(mapError(e), ()=>loadStudentQuestion(sessionId, session)); }
}

function setupTimer(session, question, onExpire){
  const pill = ()=>$("#timerPill");
  if(!question.timeLimit || !session.activeQuestionStartedAt){ if(pill()) pill().innerHTML=""; return; }
  const deadline = session.activeQuestionStartedAt.toDate().getTime() + question.timeLimit*1000;
  function tick(){
    const remain = Math.max(0, Math.round((deadline - Date.now())/1000));
    if(pill()) pill().innerHTML = `<span class="timer-pill">⏱ ${remain}s</span>`;
    if(remain<=0){ clearInterval(__studentTimerHandle); if(onExpire) onExpire(); }
  }
  tick();
  __studentTimerHandle = setInterval(tick, 1000);
}
function updateStudentResultBadge(session){
  const el = $("#resultBadge"); if(!el) return;
  const agg = session.liveAggregate;
  if(!agg || agg.questionId !== STATE.student.question?.id){ el.innerHTML = ""; return; }
  // GATE 1B.3-D2R item B: resolveShowResponderCount() (session-view.mjs) is the exact same pure
  // resolution the D2R test suite exercises directly.
  const showCount = resolveShowResponderCount(agg, session);
  if(session.showResults === "live" && agg.agg){
    el.innerHTML = `<div class="chart-box chart-box-sm" style="max-width:360px;margin:10px auto 0;"><canvas id="stResultChart"></canvas></div>`;
    const canvas = $("#stResultChart");
    if(canvas){
      try{
        const key = "stResultChart";
        if(__chartInstances[key]){ __chartInstances[key].destroy(); delete __chartInstances[key]; }
        const chartType = agg.chartType;
        renderAggregateChart(canvas, STATE.student.question, agg.agg, chartType, "student");
      }catch(e){ console.warn("Không thể vẽ biểu đồ kết quả:", e); if(showCount){ el.insertAdjacentHTML("beforeend", `<p class="mut">${agg.respondedCount} người đã trả lời</p>`); } }
    }
  } else {
    el.innerHTML = showCount ? `<p class="mut">${agg.respondedCount} người đã trả lời</p>` : "";
  }
}
function renderAnswerInput(question, options, state){
  const area = $("#answerArea"); if(!area) return;
  const type = question.type;
  if(type==="single" || type==="truefalse" || type==="likert"){
    area.innerHTML = options.map(o=>`<button type="button" class="opt-btn ${state.selected[0]===o.id?'selected':''}" data-opt="${o.id}"><span class="mark">${state.selected[0]===o.id?'✓':''}</span>${esc(o.text)}</button>`).join("");
    $$("#answerArea .opt-btn").forEach(b=>b.onclick=()=>{ state.selected=[b.dataset.opt]; renderAnswerInput(question, options, state); });
  } else if(type==="multiple"){
    area.innerHTML = options.map(o=>`<button type="button" class="opt-btn ${state.selected.includes(o.id)?'selected':''}" data-opt="${o.id}"><span class="mark">${state.selected.includes(o.id)?'✓':''}</span>${esc(o.text)}</button>`).join("");
    $$("#answerArea .opt-btn").forEach(b=>b.onclick=()=>{
      const id=b.dataset.opt; const i=state.selected.indexOf(id);
      if(i>=0) state.selected.splice(i,1); else state.selected.push(id);
      renderAnswerInput(question, options, state);
    });
  } else if(type==="scale"){
    const vals = []; for(let v=question.scaleMin; v<=question.scaleMax; v++) vals.push(v);
    area.innerHTML = `<div class="flex gap-8" style="flex-wrap:wrap;justify-content:center;">
      ${vals.map(v=>`<button type="button" class="opt-btn" style="width:56px;justify-content:center;padding:12px 0;${state.scaleVal===v?'border-color:var(--brand);background:var(--brand-light);':''}" data-v="${v}">${v}</button>`).join("")}
    </div>`;
    $$("#answerArea [data-v]").forEach(b=>b.onclick=()=>{ state.scaleVal = Number(b.dataset.v); renderAnswerInput(question, options, state); });
  } else if(type==="ranking"){
    area.innerHTML = `<p class="hint">Dùng nút ▲▼ để sắp xếp thứ tự ưu tiên (từ cao xuống thấp).</p>` + state.rankOrder.map((id,idx)=>{
      const o = options.find(x=>x.id===id);
      return `<div class="opt-btn" style="cursor:default;"><span class="mark">${idx+1}</span><span style="flex:1;">${esc(o?o.text:"")}</span>
        <button type="button" class="btn btn-sm btn-ghost" data-up="${idx}" ${idx===0?"disabled":""}>▲</button>
        <button type="button" class="btn btn-sm btn-ghost" data-down="${idx}" ${idx===state.rankOrder.length-1?"disabled":""}>▼</button></div>`;
    }).join("");
    $$("#answerArea [data-up]").forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.up); [state.rankOrder[i-1],state.rankOrder[i]]=[state.rankOrder[i],state.rankOrder[i-1]]; renderAnswerInput(question,options,state); });
    $$("#answerArea [data-down]").forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.down); [state.rankOrder[i+1],state.rankOrder[i]]=[state.rankOrder[i],state.rankOrder[i+1]]; renderAnswerInput(question,options,state); });
  } else if(type==="open"){
    area.innerHTML = `<textarea id="openAnswerInput" placeholder="Nhập câu trả lời của bạn…" style="min-height:120px;">${esc(state.openText||"")}</textarea>`;
    $("#openAnswerInput").oninput = (e)=>{ state.openText = e.target.value; };
  }
}
function validateAnswer(question, state){
  const type = question.type;
  if(type==="single"||type==="truefalse"||type==="likert"){ if(state.selected.length!==1) return "Vui lòng chọn một phương án."; }
  else if(type==="multiple"){ if(state.selected.length<1) return "Vui lòng chọn ít nhất một phương án."; }
  else if(type==="scale"){ if(state.scaleVal==null || state.scaleVal<question.scaleMin || state.scaleVal>question.scaleMax) return "Vui lòng chọn một giá trị trên thang điểm."; }
  else if(type==="ranking"){ if(!state.rankOrder || state.rankOrder.length<2) return "Danh sách xếp hạng không hợp lệ."; }
  else if(type==="open"){ if(!state.openText || !state.openText.trim()) return "Vui lòng nhập câu trả lời."; }
  return null;
}
function buildAnswerPayload(question, state){
  const type = question.type;
  if(type==="single"||type==="truefalse"||type==="likert") return { selectedOptions: state.selected, answer: null };
  if(type==="multiple") return { selectedOptions: state.selected, answer: null };
  if(type==="scale") return { selectedOptions: [], answer: state.scaleVal };
  if(type==="ranking") return { selectedOptions: state.rankOrder, answer: null };
  if(type==="open") return { selectedOptions: [], answer: state.openText.trim() };
  return { selectedOptions: [], answer: null };
}

   PRESENTATION MODE (màn hình chiếu, 16:9, fullscreen)
   ============================================================ */
function renderPresentationEntry(){
  appRoot().innerHTML = `<div class="pres-shell" id="presRoot"><span class="spinner"></span></div>`;
  presMainFlow();
}
async function presMainFlow(){
  try{ await ensureAnonAuth(); }catch(e){ $("#presRoot").innerHTML = `<div class="qtext">⚠️ ${esc(mapError(e))}</div>`; return; }
  const q = getQueryParams(); const sid = q.get("sid");
  if(!sid){ $("#presRoot").innerHTML = `<div class="qtext">⚠️ Thiếu mã phiên trình chiếu.</div>`; return; }
  watchPresentation(sid);
}
function watchPresentation(sid){
  clearListeners();
  let lastQid = null, questionCache = null, optionsCache = [];
  const sref = doc(publicDb,"sessions",sid);
  track(onSnapshot(sref, async (snap)=>{
    if(!snap.exists()){ $("#presRoot").innerHTML = `<div class="qtext">⚠️ Không tìm thấy phiên.</div>`; return; }
    const session = snap.data();
    // Gate 1B.2C-T: presentationRenderState() decides the mode BEFORE any status/question
    // branching — for a contract session this is always "contract-unsupported", since this
    // view runs under the anonymous publicAuth identity and cannot legitimately read the
    // active versioned manifest (see session-view.mjs for the full reasoning). This guarantees
    // the stale root title is never shown, and none of the legacy render paths below ever run
    // with contract-session data.
    const renderState = presentationRenderState(session);
    if(renderState.mode==="contract-unsupported"){ renderPresContractUnsupported(); return; }
    if(renderState.mode==="waiting"){ renderPresWaiting(session, sid); return; }
    if(renderState.mode==="ended"){ renderPresEnded(session); return; }
    if(session.activeQuestionId !== lastQid){
      lastQid = session.activeQuestionId;
      try{
        const qSnap = await getDoc(doc(publicDb,"questions",session.activeQuestionId));
        questionCache = qSnap.exists() ? { id:qSnap.id, ...qSnap.data() } : null;
        optionsCache = [];
        if(questionCache && QUESTION_TYPES[questionCache.type].needsOptions){
          const os = await getDocs(query(collection(publicDb,"questions",questionCache.id,"options"), orderBy("order","asc")));
          optionsCache = os.docs.map(d=>({id:d.id,...d.data()}));
        }
      }catch(e){ questionCache = null; }
    }
    renderPresQuestion(session, sid, questionCache, optionsCache);
  }, (err)=>{
    if((err.code||"")==="permission-denied"){
      $("#presRoot").innerHTML = `<div class="qtext">Phiên trình chiếu chưa sẵn sàng.</div><div class="meta">Vui lòng mở phiên từ Bảng điều khiển giảng viên trước.</div>`;
    } else { $("#presRoot").innerHTML = `<div class="qtext">⚠️ ${esc(mapError(err))}</div>`; }
  }));
}

  return `<button class="btn btn-sm btn-outline no-print" id="btnPresFs" style="position:fixed;top:14px;right:14px;z-index:10;">⛶ Toàn màn hình</button>`;
}

function openPresentationQrPopup(session, sid){

      ${session.shortCode ? `<div class="pres-qr-popup-code">${esc(session.shortCode)}</div>` : ""}

  overlay.tabIndex = -1;
  overlay.focus();
}
function wirePresentationQrPopup(session, sid){

function renderPresQuestion(session, sid, question, options){
  if(!question){ $("#presRoot").innerHTML = `${presTopBar()}<div class="qtext">Đang tải câu hỏi…</div>`; wirePresFs(); return; }
  const agg = session.liveAggregate && session.liveAggregate.questionId===question.id ? session.liveAggregate : null;
  const count = agg ? agg.respondedCount : 0;
  const showChart = session.showResults==="live" && agg && agg.agg && question.chartType!=="list";
  const showOpenWall = question.type==="open" && session.showResults==="live" && agg;
  const openAnswers = showOpenWall && Array.isArray(agg.openAnswers) ? agg.openAnswers : [];
  $("#presRoot").innerHTML = `${presTopBar()}
    <div class="meta">${esc(session.className||"")} · ${esc(session.title)}</div>
    <div class="qtext">${esc(question.question)}</div>
    ${session.showResponderCount!==false?`<div class="mut" style="color:#fff;opacity:.85;margin-bottom:16px;">${count} người đã trả lời</div>`:`<div style="margin-bottom:16px;"></div>`}
    <div class="pres-grid">
      ${showChart?`<div class="pres-chart-wrap"><div class="chart-box chart-box-lg"><canvas id="presChart"></canvas></div></div>`:""}
      ${showOpenWall ? (openAnswers.length
        ? `<div class="pres-open-wall">${openAnswers.map((a,i)=>`<div class="pres-open-card"><div class="num">Ý kiến ${i+1}</div>${esc(a)}</div>`).join("")}</div>`
        : `<div class="pres-open-empty">Đang chờ ý kiến của học viên…</div>`) : ""}
      <div class="pres-qr-wrap clickable" id="presQrWrap" role="button" tabindex="0" aria-label="Phóng to mã QR">
        <div id="presQr"></div>
        <p style="font-weight:800;font-size:20px;margin-top:8px;">${esc(session.shortCode||"")}</p>
        <div class="pres-qr-hint">🔍 Nhấp để phóng to mã QR</div>
      </div>
    </div>`;
  wirePresFs();
  try{ new QRCode(document.getElementById("presQr"), { text: studentJoinUrl(session, sid), width:160, height:160 }); }catch(e){}
  wirePresentationQrPopup(session, sid);
  if(showChart){
    const canvas = $("#presChart");
    if(canvas){
      try{
        const key="presChart";
        if(__chartInstances[key]){ __chartInstances[key].destroy(); delete __chartInstances[key]; }
        const chartType = agg.chartType;
        renderAggregateChart(canvas, question, agg.agg, chartType, "presentation");
      }catch(e){ console.warn("Không thể vẽ biểu đồ trình chiếu:", e); }
    }
  }
}

function knowledgeCode(){
  const alphabet="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const bytes=new Uint8Array(6); crypto.getRandomValues(bytes);
  return Array.from(bytes,b=>alphabet[b%alphabet.length]).join("");
}

}

async function knowledgePermanentDelete(sessionId,title){

// GATE 3C: hồ sơ hợp lệ khi mọi field ĐANG BẬT và BẮT BUỘC đều có giá trị, và nếu Lớp
// đang bật thì giá trị Lớp đã lưu phải khớp đúng một trong classOptions hiện tại của
// phiên (cấu hình phiên bất biến sau khi tạo — xem Gate 3B — nên việc này ổn định).
function knowledgeProfileIsValid(profile,participantFields,classOptions){
  if(!profile)return false;
  const pf=participantFields||{};
  for(const f of Object.keys(KN_PARTICIPANT_FIELD_LABELS)){
    const cfg=pf[f];
    if(!cfg||!cfg.enabled)continue;
    const v=profile[f];
    if(cfg.required&&(!v||!String(v).trim()))return false;
  }
  if(pf.className&&pf.className.enabled&&profile.className&&!(classOptions||[]).includes(profile.className))return false;
  return true;
}

  const progressLine=profileOn?`<p class="mut small">Tiến độ: ${mine.size}/${minPer} tình huống</p>`:"";
  host.innerHTML=`<div style="text-align:center"><div style="font-size:42px">🧠</div><h2>${esc(session.title)}</h2><p class="mut">Mã ${esc(code)} · Bạn đã gửi <b>${mine.size}</b> tình huống</p>${progressLine}</div>
    <div class="card" style="box-shadow:none"><label for="knowledgeText">Tình huống / ý kiến số ${next}</label><textarea id="knowledgeText" minlength="10" maxlength="2000" rows="7" placeholder="Mô tả tình huống cụ thể, nguyên văn (10–2.000 ký tự)…"></textarea><div class="flex between mt-8"><span class="hint" id="knChars">0 / 2.000</span><span class="hint">Tối thiểu ${minPer} tình huống/người</span></div><button class="btn btn-lg btn-block mt-14" id="knowledgeSend">GỬI TÌNH HUỐNG ${next}</button></div>
    <p class="small mut" style="text-align:center">Dữ liệu gốc được lưu nguyên văn. Không có AI tham gia ở bước gửi.</p>`;
  const ta=$("#knowledgeText");ta.oninput=()=>{$("#knChars").textContent=ta.value.length+" / 2.000";};
  $("#knowledgeSend").onclick=async()=>{
    const text=ta.value.trim();if(text.length<10||text.length>2000){toast("Nội dung cần từ 10 đến 2.000 ký tự.","warn");return;}
    // GATE 3C phòng thủ nhiều lớp: xác thực lại hồ sơ (đã tải sẵn, không đọc lại) NGAY
    // TRƯỚC khi ghi mỗi tình huống — không tin tưởng tuyệt đối vào cổng đã qua lúc vào trang.
    if(profileOn&&!knowledgeProfileIsValid(profile,session.participantFields||{},session.classOptions||[])){
      toast("Vui lòng hoàn tất thông tin trước khi gửi.","warn");knowledgeStudentFlow();return;
    }
    const btn=$("#knowledgeSend");btn.disabled=true;btn.textContent="ĐANG GỬI…";
    try{await setDoc(doc(publicDb,"knowledgeSessions",sid,"submissions",`${user.uid}_${next}`),{sessionId:sid,participantId:user.uid,text,sequence:next,createdAt:serverTimestamp()});toast("Đã lưu tình huống nguyên văn.","ok");knowledgeStudentFlow();}
    catch(e){toast(mapError(e),"err");btn.disabled=false;btn.textContent=`GỬI TÌNH HUỐNG ${next}`;}
  };
}
async function knowledgeStudentFlow(){
  const host=$("#knowledgeStudent");
  try{
    const user=await ensureAnonAuth(),code=(getQueryParams().get("knowledge")||"").trim().toUpperCase();
    if(!/^[A-Z2-9]{6}$/.test(code))throw new Error("Mã tham gia không hợp lệ.");
    const mapSnap=await getDoc(doc(publicDb,"knowledgeJoinCodes",code));if(!mapSnap.exists())throw new Error("Không tìm thấy Knowledge Session.");
    const sid=mapSnap.data().sessionId,sSnap=await getDoc(doc(publicDb,"knowledgeSessions",sid));if(!sSnap.exists())throw new Error("Phiên không tồn tại.");
    const session={id:sid,...sSnap.data()};
    if(session.status!=="open"||session.teacherDeletedAt||session.adminDeletedAt){host.innerHTML=`<div class="empty-state"><div class="ic">🔒</div><h2>Phiên không hoạt động</h2><p>Giảng viên hiện không nhận thêm tình huống.</p></div>`;return;}
    // GATE 3C: session.collectParticipantProfile !== true (kể cả field hoàn toàn vắng mặt
    // ở các phiên cũ trước Gate 3B) đi thẳng vào luồng gửi tình huống như trước đây —
    // KHÔNG đọc collection participants, KHÔNG render form hồ sơ.
    if(session.collectParticipantProfile===true){
      const pSnap=await getDoc(doc(publicDb,"knowledgeSessions",sid,"participants",user.uid));
      const existingProfile=pSnap.exists()?pSnap.data():null;
      if(!knowledgeProfileIsValid(existingProfile,session.participantFields||{},session.classOptions||[])){
        knowledgeRenderProfileForm(host,session,sid,user,existingProfile,()=>knowledgeStudentFlow());
        return;
      }
      await knowledgeRenderSubmissionUI(host,session,sid,code,user,existingProfile);
    }else{
      await knowledgeRenderSubmissionUI(host,session,sid,code,user,null);
    }
  }catch(e){host.innerHTML=`<div class="empty-state"><div class="ic">⚠️</div><h3>Không thể vào phiên</h3><p>${esc(e.message||mapError(e))}</p><button class="btn btn-outline" id="knRetry">THỬ LẠI</button></div>`;$("#knRetry").onclick=knowledgeStudentFlow;}
}

/* Giữ kích thước biểu đồ ổn định khi trình duyệt chuyển sang chế độ in/PDF. */
window.addEventListener("beforeprint", ()=>{
  Object.values(__chartInstances).forEach(ch=>{ try{ ch.resize(); ch.update("none"); }catch(e){} });
});
window.addEventListener("afterprint", ()=>{
  setTimeout(()=>Object.values(__chartInstances).forEach(ch=>{ try{ ch.resize(); }catch(e){} }),50);
});

   KHỞI CHẠY ỨNG DỤNG
   ============================================================ */
boot();

}

// GATE 2A-AUTH-I2-CORRECTION-FIX: the ONE shared classroom identifier helper — used verbatim on
// both the student screen and the lecturer roster, so a student can read this exact code aloud
// and the lecturer can match it. Display-only, deterministically derived from auth.uid, never
// stored in Firestore; not PII (an opaque Firebase-generated id substring, not a real name).
function shortStudentCode(uid){ return String(uid||"").slice(-6).toUpperCase(); }

/* ---------- Học viên tham gia Thảo luận nhóm ---------- */
// GATE 2A-AUTH-I2 (Stage 2 of 3): validStoredGroup/ensureGroupMembership now live in
// group-membership.mjs (imported above) so they can be unit/emulator-tested directly — this
// is DOM wiring only, no membership semantics of its own. See test/gate2a-auth-i2/ for coverage.
const groupMembershipFirestore = { doc, getDoc, setDoc, serverTimestamp };
async function renderGroupStudentEntry(){
  appRoot().innerHTML=`<div class="group-student-wrap"><div class="center-screen"><span class="spinner"></span><p>Đang mở phòng thảo luận…</p></div></div>`;
  try{
    if(!publicAuth.currentUser) await signInAnonymously(publicAuth);
    const code=(getQueryParams().get("group")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,12);
    const mapSnap=await getDoc(doc(publicDb,GROUP_JOIN_COLLECTION,code));
    if(!mapSnap.exists()) throw {code:"not-found"};
    const id=mapSnap.data().activityId;
    const aSnap=await getDoc(doc(publicDb,GROUP_COLLECTION,id));
    if(!aSnap.exists()) throw {code:"not-found"};
    let a={id,...aSnap.data()};

    // GATE 2A-AUTH-I2-FIX: status is checked BEFORE membership bootstrap and BEFORE any Group
    // content listener is even considered — a non-open activity (draft or closed) must never
    // reach the membership getDoc, never attach notes/topics listeners, and never reveal
    // submission UI, regardless of whether the caller already has a membership record. This is
    // a frontend-only, defense-in-depth alignment with the final Stage-3 policy (owner/admin
    // historical access is untouched — this function only ever governs the student path); the
    // real security boundary is enforced server-side once a later gate tightens Rules.
    if(a.status!=="open"){
      appRoot().innerHTML=`<div class="group-student-wrap"><div class="center-screen"><div class="ic" style="font-size:48px">🔒</div><h2>${esc(a.title||"Thảo luận nhóm")}</h2><p class="mut">${a.status==="closed"?"Phòng đã đóng.":"Phòng chưa mở."}</p></div></div>`;
      return;
    }

    // GATE 2A-AUTH-I2: check for an existing membership BEFORE rendering the interactive
    // selector — a returning student must never be offered a "choose your group" control
    // that could imply their group is still changeable (Gate 2A-AUTH-DESIGN Task D:
    // membership is immutable to the student by design).
    const existingMemberSnap=await getDoc(doc(publicDb,GROUP_COLLECTION,id,"members",publicAuth.currentUser.uid));
    let membershipGroup=null;
    if(existingMemberSnap.exists()) membershipGroup=validStoredGroup(existingMemberSnap.data(),a.groupCount);

    appRoot().innerHTML=`<div class="group-student-wrap">
      <div class="center"><div class="eyebrow">HCMA2 - TEACHING</div><h1 id="gsLiveTitle">👥 ${esc(a.title||"Thảo luận nhóm")}</h1><div class="mut" id="gsLiveInstructions"></div></div>
      <div class="group-student-card"><div class="flex-between"><div><b>Mã phòng: ${esc(code)}</b><div class="small mut" id="gsStatus"></div><div class="small mut mt-8">Mã học viên: <b>${esc(shortStudentCode(publicAuth.currentUser.uid))}</b> — nếu cần đổi nhóm, hãy báo mã này cho giảng viên.</div></div><div class="group-timer" id="gsTimer">--:--</div></div>
        <div class="field mt-14"><label>${membershipGroup?"Nhóm của anh/chị":"Chọn nhóm của anh/chị *"}</label><select id="gsGroup" ${membershipGroup?"disabled":""}><option value="">— Chọn nhóm —</option>${Array.from({length:a.groupCount||6},(_,k)=>`<option value="${k+1}" ${membershipGroup===k+1?"selected":""}>Nhóm ${k+1}</option>`).join("")}</select><div class="small mut mt-8" id="gsJoinMsg">${membershipGroup?"Bạn đã tham gia nhóm này — không thể đổi nhóm.":""}</div></div>
        <div id="gsTopic" class="group-topic hidden"><span id="gsTopicLabel"></span><div id="gsTopicContent"></div></div>
      </div>
      <div class="group-student-card hidden" id="gsSubmitCard">
        ${a.allowText!==false?`<div class="field"><label>Ý kiến thảo luận</label><textarea id="gsText" maxlength="1500" placeholder="Nhập ý kiến của nhóm…"></textarea><div class="small mut" id="gsChar">0/1500</div></div><button class="btn" id="gsSendText">GỬI Ý KIẾN</button><div id="gsTextMsg" class="small mt-8"></div>`:""}
        ${a.allowPhoto!==false?`<hr class="mt-16"><div class="field"><label>Gửi ảnh (tối đa khoảng 650KB)</label><input id="gsPhoto" type="file" accept="image/*"></div><button class="btn btn-outline" id="gsSendPhoto">GỬI ẢNH</button><div id="gsPhotoMsg" class="small mt-8"></div>`:""}
        ${a.allowFile!==false?`<hr class="mt-16"><div class="field"><label>Gửi file nhỏ DOC/DOCX/PPT/PPTX/PDF (tối đa khoảng 650KB)</label><input id="gsFile" type="file" accept=".doc,.docx,.ppt,.pptx,.pdf"></div><button class="btn btn-outline" id="gsSendFile">GỬI FILE</button>
          <div class="field mt-14"><label>Hoặc gửi link Google Drive / OneDrive</label><input id="gsLink" type="url" placeholder="https://..."></div><button class="btn btn-outline" id="gsSendLink">GỬI LINK</button><div id="gsFileMsg" class="small mt-8"></div>`:""}
      </div>
      <div class="group-student-card"><h3>Ý kiến đã gửi của nhóm</h3><div id="gsMyNotes"><div class="mut small">${membershipGroup?"Đang tải…":"Chọn nhóm để xem."}</div></div></div>
    </div>`;
    // GATE 2B-RT-INTEGRATION: same shared safe renderer as the lecturer view, at initial paint
    // and on every live update (see the activity onSnapshot listener below).
    renderRichText($("#gsLiveInstructions"), a.instructionsRich, a.instructions||"");

    let currentTopic=null, notes=[], joinBusy=false, unsubTopic=null, unsubNotes=null, membershipListenerAttached=false, wasOpen=true, contentGeneration=0;

    function updateTopicDisplay(){
      const t=currentTopic?.topic||""; const el=$("#gsTopic");
      el.classList.toggle("hidden",!t);
      if(t){
        $("#gsTopicLabel").textContent=`📌 Chủ đề nhóm ${membershipGroup}: `;
        renderRichText($("#gsTopicContent"), currentTopic?.topicRich, t);
      }
    }
    function renderMyNotes(){
      if(!membershipGroup){$("#gsMyNotes").innerHTML=`<div class="mut small">Chọn nhóm để xem.</div>`;return;}
      const arr=notes.slice().sort((x,y)=>qrDateValue(x.createdAt)-qrDateValue(y.createdAt));
      $("#gsMyNotes").innerHTML=arr.length?arr.map(n=>`<div class="group-note">${esc(n.text||"")}</div>`).join(""):`<div class="mut small">Chưa có ý kiến nào.</div>`;
    }
    function updateStudentState(){
      $("#gsStatus").textContent=a.status==="open"?"Phòng đang mở — có thể gửi kết quả.":a.status==="closed"?"Phòng đã đóng.":"Phòng chưa mở.";
      $("#gsSubmitCard").classList.toggle("hidden",!membershipGroup || a.status!=="open");
    }
    // GATE 2A-AUTH-I2-CORRECTION-FIX: unsubscribe-then-reattach, never additive — calling this a
    // second time (an authorized lecturer reassignment) tears down the PREVIOUS group's
    // listeners and clears their already-rendered content BEFORE the new group's listeners are
    // attached, so old and new group data are never visible concurrently (Task F). Also bumps
    // contentGeneration, which every scoped listener callback checks before applying its update —
    // this is the actual fix for the reported bug: calling a Firestore unsubscribe function is
    // not a hard guarantee that zero further callbacks can ever fire for that listener (an
    // already-in-flight snapshot can still be delivered once more), so without this guard a late
    // callback from the OLD group could land after membershipGroup/the label have already moved
    // to the NEW group, rendering stale old-group data mislabeled as the new group. The guard
    // makes any such stale/superseded delivery a silent no-op regardless of the exact trigger.
    function detachScopedListeners(){
      contentGeneration++;
      if(unsubTopic){unsubTopic();unsubTopic=null;}
      if(unsubNotes){unsubNotes();unsubNotes=null;}
      currentTopic=null; notes=[];
      updateTopicDisplay(); renderMyNotes();
    }
    function attachScopedListeners(group){
      detachScopedListeners();
      const myGen=contentGeneration;
      unsubTopic=onSnapshot(doc(publicDb,GROUP_COLLECTION,id,"topics",String(group)),s=>{
        if(myGen!==contentGeneration)return;
        currentTopic=s.exists()?s.data():null;updateTopicDisplay();
      });
      unsubNotes=onSnapshot(query(collection(publicDb,GROUP_COLLECTION,id,"notes"),where("group","==",group)),s=>{
        if(myGen!==contentGeneration)return;
        notes=s.docs.map(d=>({id:d.id,...d.data()}));renderMyNotes();
      });
    }
    track(()=>{if(unsubTopic)unsubTopic();if(unsubNotes)unsubNotes();});
    // GATE 2A-AUTH-I2-CORRECTION-FIX: required ordering — detach the OLD group's listeners and
    // clear their rendered content FIRST (attachScopedListeners' own first action), and only
    // THEN update the authoritative membershipGroup and the visible group label. The previous
    // version updated membershipGroup before the old content was cleared; reversing this means
    // the clear-render pass inside detachScopedListeners always runs while the UI still reflects
    // the OLD identity, and the NEW identity is only ever shown once paired with cleared content.
    function revealParticipation(group){
      attachScopedListeners(group);
      membershipGroup=group;
      $("#gsGroup").value=String(group); $("#gsGroup").disabled=true;
      updateStudentState(); updateTopicDisplay(); renderMyNotes();
      // GATE 2A-AUTH-I2-CORRECTION: subscribed exactly once (guarded), the first time this
      // student has a confirmed group — reacts to an authorized lecturer/admin reassignment of
      // membership.group by re-running this same function, which naturally tears down the old
      // group's listeners and attaches the new group's (Task E). A malformed/missing record is
      // ignored defensively rather than crashing the live view.
      if(!membershipListenerAttached){
        membershipListenerAttached=true;
        track(onSnapshot(doc(publicDb,GROUP_COLLECTION,id,"members",publicAuth.currentUser.uid),s=>{
          if(!s.exists())return;
          let newGroup;
          try{newGroup=validStoredGroup(s.data(),a.groupCount);}catch(e){return;}
          if(newGroup===membershipGroup)return;
          const msg=$("#gsJoinMsg"); if(msg) msg.textContent=`Giảng viên đã chuyển bạn sang Nhóm ${newGroup}.`;
          revealParticipation(newGroup);
        }));
      }
    }
    // GATE 2A-AUTH-I2-CORRECTION (Task G): a tiny, well-tested extension of the entry-time
    // closed-activity guard (I2-FIX) — if the lecturer closes the room while this student's page
    // is already open, the already-attached notes/topics listeners are now torn down and their
    // content cleared live, matching the same "student must not continue accessing content"
    // intent, without touching Rules or any server-side boundary (still frontend-only; the
    // documented known risk is only that this reacts to the CLIENT's own live activity-doc
    // listener, not a server-enforced guarantee — Stage 3 remains the real boundary).
    const unsubA=onSnapshot(doc(publicDb,GROUP_COLLECTION,id),async s=>{
      if(!s.exists())return;
      a={id,...s.data()};
      $("#gsLiveTitle").textContent="👥 "+(a.title||"Thảo luận nhóm");
      renderRichText($("#gsLiveInstructions"), a.instructionsRich, a.instructions||"");
      if(wasOpen && a.status!=="open"){
        wasOpen=false;detachScopedListeners();
      }else if(!wasOpen && a.status==="open"){
        // GATE 2A-AUTH-I3-UI-FIX: the matching CLOSED -> OPEN half of the transition above —
        // without this branch a student whose page stayed open through a close/reopen cycle
        // never regains live content until a full reload, even though membership and server
        // authorization are already correct again the instant the activity reopens. Re-fetches
        // the caller's OWN membership fresh (never trusts the possibly-stale in-memory value) so
        // a membership removed while closed simply stays in the already-cleared, no-content state
        // set by detachScopedListeners() above — fail-closed, no authorization invented here.
        wasOpen=true;
        const freshSnap=await getDoc(doc(publicDb,GROUP_COLLECTION,id,"members",publicAuth.currentUser.uid));
        if(freshSnap.exists()){
          let freshGroup; try{freshGroup=validStoredGroup(freshSnap.data(),a.groupCount);}catch(e){freshGroup=null;}
          if(freshGroup) revealParticipation(freshGroup);
        }
      }
      updateStudentState();
    });
    track(unsubA);

    if(membershipGroup){
      revealParticipation(membershipGroup);
    }else{
      $("#gsGroup").onchange=async()=>{
        if(joinBusy) return;
        const chosen=Number($("#gsGroup").value)||0; if(!chosen) return;
        joinBusy=true; $("#gsGroup").disabled=true;
        const msg=$("#gsJoinMsg"); if(msg) msg.textContent="Đang tham gia nhóm…";
        try{
          const finalGroup=await ensureGroupMembership({db:publicDb,firestore:groupMembershipFirestore,activityId:id,uid:publicAuth.currentUser.uid,joinCode:code,groupCount:a.groupCount||6,selectedGroup:chosen});
          if(msg) msg.textContent=finalGroup===chosen?"":`Bạn đã được ghi nhận ở Nhóm ${finalGroup} (đã tham gia trước đó).`;
          revealParticipation(finalGroup);
        }catch(e){
          joinBusy=false; $("#gsGroup").disabled=false; $("#gsGroup").value="";
          if(msg) msg.textContent=mapError(e);
        }
      };
    }
    if($("#gsText")) $("#gsText").oninput=()=>$("#gsChar").textContent=`${$("#gsText").value.length}/1500`;
    if($("#gsSendText")) $("#gsSendText").onclick=async()=>{

    };
    if($("#gsSendPhoto")) $("#gsSendPhoto").onclick=async()=>{
      const f=$("#gsPhoto").files[0],msg=$("#gsPhotoMsg"); if(!f){msg.textContent="Vui lòng chọn ảnh.";return;} if(f.size>5*1024*1024){msg.textContent="Ảnh quá lớn. Giới hạn 5MB.";return;} if(!f.type.startsWith("image/")){msg.textContent="Tệp đã chọn không phải ảnh.";return;}
      try{
        msg.textContent="Đang tải ảnh…";
        const uid=publicAuth.currentUser.uid, safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_");
        const path=`groupActivities/${id}/photos/${uid}/${Date.now()}_${safe}`;
        const sr=storageRef(publicStorage,path); await uploadBytes(sr,f,{contentType:f.type}); const url=await getDownloadURL(sr);
        await addDoc(collection(publicDb,GROUP_COLLECTION,id,"photos"),{group:membershipGroup,name:f.name,url,storagePath:path,size:f.size,contentType:f.type,participantId:uid,createdAt:serverTimestamp()});
        $("#gsPhoto").value="";msg.textContent="Đã gửi ảnh ✓";
      }catch(e){msg.textContent=mapError(e);}
    };
    if($("#gsSendFile")) $("#gsSendFile").onclick=async()=>{
      const f=$("#gsFile").files[0],msg=$("#gsFileMsg"); if(!f){msg.textContent="Vui lòng chọn file.";return;} if(f.size>10*1024*1024){msg.textContent="File quá lớn. Giới hạn 10MB; file lớn hơn hãy gửi link Drive/OneDrive.";return;}
      try{
        msg.textContent="Đang tải file…";
        const uid=publicAuth.currentUser.uid,safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_");
        const path=`groupActivities/${id}/files/${uid}/${Date.now()}_${safe}`;
        const sr=storageRef(publicStorage,path);await uploadBytes(sr,f,{contentType:f.type||"application/octet-stream"});const url=await getDownloadURL(sr);
        await addDoc(collection(publicDb,GROUP_COLLECTION,id,"files"),{group:membershipGroup,name:f.name,url,storagePath:path,size:f.size,contentType:f.type||"",link:null,participantId:uid,createdAt:serverTimestamp()});
        $("#gsFile").value="";msg.textContent="Đã gửi file ✓";
      }catch(e){msg.textContent=mapError(e);}
    };
    if($("#gsSendLink")) $("#gsSendLink").onclick=async()=>{
      const raw=$("#gsLink").value.trim(),msg=$("#gsFileMsg"),url=qrNormalizeUrl(raw);if(!url){msg.textContent="Liên kết không hợp lệ.";return;}
      try{await addDoc(collection(publicDb,GROUP_COLLECTION,id,"files"),{group:membershipGroup,name:"Liên kết nhóm",dataUrl:null,link:url,participantId:publicAuth.currentUser.uid,createdAt:serverTimestamp()});$("#gsLink").value="";msg.textContent="Đã gửi link ✓";}catch(e){msg.textContent=mapError(e);}
    };
    const timer=setInterval(()=>{
      const el=$("#gsTimer"); if(!el)return;
      const remain=timerSeconds(a);
      el.textContent=fmtDuration(remain);el.classList.toggle("done",remain<=0);
    },1000); track(()=>clearInterval(timer));
    updateStudentState();
  }catch(e){
    appRoot().innerHTML=`<div class="center-screen"><div class="ic" style="font-size:48px">⚠️</div><h2>Không mở được phòng thảo luận</h2><p class="mut">${esc(mapError(e))}</p></div>`;
  }
}
function groupFileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}


/* ============================================================
   QR VĨNH VIỄN MODULE — dùng chung tài khoản HCMA2
   - Teacher: chỉ thấy / sửa / xóa QR do chính mình tạo.
   - Admin: thấy và quản lý toàn bộ QR.
   - Người quét QR: công khai, không cần đăng nhập.
   ============================================================ */
const QR_COLLECTION = "qrlinks";
const QR_CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
function qrRandCode(len=6){ let s=""; for(let i=0;i<len;i++) s+=QR_CODE_CHARS[Math.floor(Math.random()*QR_CODE_CHARS.length)]; return s; }
function qrSanitizeCode(s){ return String(s||"").trim().replace(/[^A-Za-z0-9_-]/g,"").slice(0,40); }
function qrNormalizeUrl(raw){
  let s=String(raw||"").trim(); if(!s) return null;
  if(!/^https?:\/\//i.test(s)) s="https://"+s;
  try{ const u=new URL(s); if(!/^https?:$/.test(u.protocol)) return null; return u.toString(); }catch(e){ return null; }
}
function qrShortLink(code){ return APP_BASE_URL + "?r=" + encodeURIComponent(code); }
function qrImageFor(link, size=300){ return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(link)}`; }
function qrDateValue(ts){ try{return ts?.toMillis?ts.toMillis():(ts?new Date(ts).getTime():0);}catch(e){return 0;} }
function qrFmtDate(ts){ try{return ts?.toDate?ts.toDate().toLocaleString("vi-VN"):(ts?new Date(ts).toLocaleString("vi-VN"):"");}catch(e){return "";} }
function ensureQrOverlay(){
  let el=document.getElementById("qrBigOverlay"); if(el) return el;
  el=document.createElement("div"); el.id="qrBigOverlay";
  el.innerHTML=`<div class="qr-big-box"><img id="qrBigImg" alt="QR lớn"><div class="qr-big-link" id="qrBigLink"></div><button class="btn btn-outline mt-14" id="qrBigClose" style="background:#fff">Đóng ✕</button></div>`;
  document.body.appendChild(el);
  el.addEventListener("click",e=>{if(e.target===el) el.classList.remove("show")});
  el.querySelector("#qrBigClose").onclick=()=>el.classList.remove("show");
  document.addEventListener("keydown",e=>{if(e.key==="Escape") el.classList.remove("show")});
  return el;
}
function openQrBig(src,link){ const el=ensureQrOverlay(); el.querySelector("#qrBigImg").src=src; el.querySelector("#qrBigLink").textContent=link||""; el.classList.add("show"); }
async function downloadQrImage(src,name){
  try{ const res=await fetch(src,{mode:"cors"}); const blob=await res.blob(); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`qr-${name||"link"}.png`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
  catch(e){ window.open(src,"_blank"); }
}
async function copyQrText(text,btn){
  try{ await navigator.clipboard.writeText(text); const old=btn?.textContent; if(btn){btn.textContent="Đã sao chép ✓";setTimeout(()=>btn.textContent=old,1400);} }
  catch(e){ window.prompt("Sao chép liên kết:",text); }
}
async function renderQrRedirect(){
  const code=qrSanitizeCode(getQueryParams().get("r"));
  appRoot().innerHTML=`<div class="center-screen"><span class="spinner"></span><h2>Đang mở liên kết…</h2><p class="mut">Vui lòng chờ trong giây lát.</p></div>`;
  if(!code){ appRoot().innerHTML=`<div class="center-screen"><h2>Không tìm thấy liên kết</h2><p class="mut">Mã QR không hợp lệ.</p></div>`; return; }
  try{
    const ref=doc(publicDb,QR_COLLECTION,code); const snap=await getDoc(ref);
    if(!snap.exists() || !snap.data().target){ appRoot().innerHTML=`<div class="center-screen"><h2>Không tìm thấy liên kết</h2><p class="mut">Mã QR này không tồn tại hoặc đã bị xóa.</p></div>`; return; }
    updateDoc(ref,{clicks:increment(1),lastScanAt:serverTimestamp()}).catch(()=>{});
    window.location.replace(snap.data().target);
  }catch(e){ appRoot().innerHTML=`<div class="center-screen"><h2>Không mở được liên kết</h2><p class="mut">Vui lòng kiểm tra kết nối Internet rồi quét lại.</p></div>`; }
}
async function qrManager(c,isAdminView){
  clearListeners();
  c.innerHTML=`
    <div class="qr-manager-head"><div><h2>🔗 QR vĩnh viễn</h2><p class="mut">QR không đổi. Sau này chỉ cần sửa liên kết đích, không phải in lại QR.</p></div>${isAdminView?'<span class="chip">Quản trị: xem toàn hệ thống</span>':'<span class="chip">Chỉ hiển thị QR của tài khoản này</span>'}</div>
    <div class="card mt-14">
      <h3>Tạo QR mới</h3>
      <div class="field"><label>Tên / ghi chú QR (không bắt buộc)</label><input id="qrTitle" type="text" placeholder="Ví dụ: Tài liệu bài 3, Link nhóm Zalo…"></div>
      <div class="field"><label>Liên kết cần mở khi quét *</label><input id="qrTarget" type="url" placeholder="https://..."><div class="hint">Có thể dùng link Google Drive, Zalo, website, biểu mẫu, tài liệu…</div></div>
      <div class="field"><label>Mã ngắn (không bắt buộc)</label><input id="qrCustom" type="text" maxlength="40" placeholder="Để trống để hệ thống tự tạo"><div class="hint">Chỉ dùng chữ, số, gạch ngang và gạch dưới.</div></div>
      <button class="btn" id="qrCreateBtn">TẠO QR VĨNH VIỄN</button><div id="qrCreateStatus" class="small mt-8"></div>
    </div>
    <div class="card hidden" id="qrResultCard"></div>
    <div class="flex-between mt-20"><h3 style="margin:0">${isAdminView?"Lịch sử QR toàn hệ thống":"Các QR đã tạo"}</h3><span class="mut small" id="qrCount"></span></div>
    ${isAdminView?`<div class="card mt-12" style="padding:12px">
      <div class="grid grid-2">
        <div class="field" style="margin:0"><label>Tìm theo giảng viên / mã / tên QR</label><input id="qrAdminSearch" type="text" placeholder="Nhập tên, email, mã QR hoặc ghi chú…"></div>
        <div class="field" style="margin:0"><label>Sắp xếp</label><select id="qrAdminSort"><option value="newest">Mới nhất trước</option><option value="oldest">Cũ nhất trước</option><option value="scans">Lượt quét nhiều nhất</option></select></div>
      </div>
    </div>`:""}
    <div class="qr-list" id="qrList"><div class="mut">Đang tải…</div></div>`;

  $("#qrCreateBtn").onclick=async()=>{
    const target=qrNormalizeUrl($("#qrTarget").value); const title=$("#qrTitle").value.trim();
    const st=$("#qrCreateStatus"); let code=qrSanitizeCode($("#qrCustom").value); st.textContent="";
    if(!target){st.className="error-text mt-8";st.textContent="Liên kết không hợp lệ.";return;}
    const btn=$("#qrCreateBtn"); btn.disabled=true; st.className="small mt-8 mut"; st.textContent="Đang tạo…";
    try{
      if(code){ const ex=await getDoc(doc(db,QR_COLLECTION,code)); if(ex.exists()) throw {code:"qr-code-exists"}; }
      else{ let tries=0,exists=true; while(exists && tries<8){code=qrRandCode(6);exists=(await getDoc(doc(db,QR_COLLECTION,code))).exists();tries++;} if(exists) throw {code:"qr-code-exists"}; }
      await setDoc(doc(db,QR_COLLECTION,code),{ownerId:STATE.user.uid,ownerEmail:STATE.profile.email||STATE.user.email||"",ownerName:STATE.profile.displayName||"",title,target,clicks:0,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
      const link=qrShortLink(code), img=qrImageFor(link);
      $("#qrResultCard").classList.remove("hidden");
      $("#qrResultCard").innerHTML=`<h3>Đã tạo thành công</h3><div class="qr-result"><img id="qrResultImg" src="${img}" alt="QR ${esc(code)}"><div><div class="qr-code">${esc(code)}</div><div class="qr-target mt-8">${esc(link)}</div><div class="qr-actions"><button class="btn btn-sm btn-outline" id="qrCopyNew">Sao chép liên kết</button><button class="btn btn-sm btn-outline" id="qrDownloadNew">Tải ảnh QR</button></div></div></div>`;
      $("#qrResultImg").onclick=()=>openQrBig(img,link); $("#qrCopyNew").onclick=e=>copyQrText(link,e.currentTarget); $("#qrDownloadNew").onclick=()=>downloadQrImage(img,code);
      $("#qrTarget").value=""; $("#qrCustom").value=""; $("#qrTitle").value=""; st.className="success-text mt-8"; st.textContent="Đã tạo QR vĩnh viễn thành công.";
    }catch(e){st.className="error-text mt-8";st.textContent=(e.code==="qr-code-exists")?"Mã này đã được dùng. Vui lòng chọn mã khác.":mapError(e);}finally{btn.disabled=false;}
  };

  const q = isAdminView ? query(collection(db,QR_COLLECTION)) : query(collection(db,QR_COLLECTION),where("ownerId","==",STATE.user.uid));
  let qrCache = [];
  const renderQrDocs = ()=>{
    let docs = qrCache.slice();
    if(isAdminView){
      const kw = ($("#qrAdminSearch")?.value||"").trim().toLowerCase();
      const sort = $("#qrAdminSort")?.value||"newest";
      if(kw){
        docs = docs.filter(d => `${d.id} ${d.title||""} ${d.ownerName||""} ${d.ownerEmail||""} ${d.ownerId||""} ${d.target||""}`.toLowerCase().includes(kw));
      }
      if(sort==="oldest") docs.sort((a,b)=>qrDateValue(a.createdAt)-qrDateValue(b.createdAt));
      else if(sort==="scans") docs.sort((a,b)=>Number(b.clicks||0)-Number(a.clicks||0));
      else docs.sort((a,b)=>qrDateValue(b.createdAt)-qrDateValue(a.createdAt));
    }else{
      docs.sort((a,b)=>qrDateValue(b.createdAt)-qrDateValue(a.createdAt));
    }
    $("#qrCount").textContent = isAdminView ? `${docs.length}/${qrCache.length} mã` : `${docs.length} mã`;
    if(!docs.length){$("#qrList").innerHTML=`<div class="empty-state"><div class="ic">🔗</div>${isAdminView&&qrCache.length?"Không có QR phù hợp bộ lọc.":"Chưa có QR nào."}</div>`;return;}
    $("#qrList").innerHTML=docs.map(d=>{const link=qrShortLink(d.id),img=qrImageFor(link);return `
      <div class="qr-item" data-qr="${esc(d.id)}">
        <div class="qr-thumb" data-qr-open="${esc(d.id)}"><img src="${img}" alt="QR ${esc(d.id)}"></div>
        <div><div class="qr-meta"><span class="qr-code">${esc(d.id)}</span><span class="chip">${Number(d.clicks||0)} lượt quét</span>${d.title?`<span class="chip">${esc(d.title)}</span>`:""}</div>
        ${isAdminView?`<div class="qr-owner">Chủ sở hữu: <b>${esc(d.ownerName||d.ownerEmail||d.ownerId||"—")}</b></div>`:""}
        <div class="small mut">Tạo: ${esc(qrFmtDate(d.createdAt)||"—")}</div>
        <div class="qr-edit-row"><input type="text" value="${esc(d.target||"")}" data-qr-target><button class="btn btn-sm btn-outline" data-qr-save="${esc(d.id)}">LƯU LINK MỚI</button></div>
        <div class="small mt-8 hidden" data-qr-hint></div>
        <div class="qr-actions"><button class="btn btn-sm btn-ghost" data-qr-copy="${esc(d.id)}">Sao chép liên kết</button><button class="btn btn-sm btn-ghost" data-qr-download="${esc(d.id)}">Tải ảnh QR</button><button class="btn btn-sm btn-danger" data-qr-delete="${esc(d.id)}">XÓA</button></div></div>
      </div>`}).join("");
    docs.forEach(d=>{const card=document.querySelector(`[data-qr="${CSS.escape(d.id)}"]`); if(!card)return; const link=qrShortLink(d.id),img=qrImageFor(link);
      card.querySelector("[data-qr-open]").onclick=()=>openQrBig(img,link);
      card.querySelector("[data-qr-copy]").onclick=e=>copyQrText(link,e.currentTarget);
      card.querySelector("[data-qr-download]").onclick=()=>downloadQrImage(img,d.id);
      card.querySelector("[data-qr-save]").onclick=async e=>{const input=card.querySelector("[data-qr-target]"),hint=card.querySelector("[data-qr-hint]"),url=qrNormalizeUrl(input.value);if(!url){hint.className="error-text mt-8";hint.textContent="Liên kết không hợp lệ.";return;} e.currentTarget.disabled=true;try{await updateDoc(doc(db,QR_COLLECTION,d.id),{target:url,updatedAt:serverTimestamp()});hint.className="success-text mt-8";hint.textContent="Đã lưu. QR giữ nguyên, chỉ đổi điểm đến.";}catch(err){hint.className="error-text mt-8";hint.textContent=mapError(err);}finally{e.currentTarget.disabled=false;}};
      card.querySelector("[data-qr-delete]").onclick=async()=>{if(!confirm(`Xóa QR “${d.id}”? Sau khi xóa, mã QR này sẽ không còn mở được liên kết.`))return;try{await deleteDoc(doc(db,QR_COLLECTION,d.id));toast("Đã xóa QR.","ok");}catch(err){toast(mapError(err),"err");}};
    });
  };
  if(isAdminView){
    $("#qrAdminSearch")?.addEventListener("input",renderQrDocs);
    $("#qrAdminSort")?.addEventListener("change",renderQrDocs);
  }
  const unsub=onSnapshot(q,snap=>{
    qrCache=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderQrDocs();
  },e=>{$("#qrList").innerHTML=errorBlock(e,()=>qrManager(c,isAdminView));});
  track(unsub);
}

    const classMap = {}; classSnap.docs.forEach(d=>classMap[d.id]=d.data());
    recentSessions.forEach(s=>{
      totalResponses += s.responseCount||0;
      const cls = classMap[s.classId];
      if(cls && cls.studentCount) totalExpected += (cls.studentCount * (s.questionCount||1));
    });
    const rate = totalExpected>0 ? Math.min(100, Math.round(totalResponses/totalExpected*100)) + "%" : "—";
    $("#tOvGrid").innerHTML = [
      [classesCnt.data().count,"Số lớp"], [activeSessions.length,"Số phiên"],
      [totalResponses,"Tổng lượt trả lời (gần đây)"], [rate,"Tỷ lệ tham gia (ước tính)"]
    ].map(([n,l])=>`<div class="stat"><div class="num">${n}</div><div class="lbl">${esc(l)}</div></div>`).join("");
    if(recentSessions.length===0){ $("#tOvRecent").innerHTML = `<div class="empty-state"><div class="ic">🗳️</div>Chưa có phiên tương tác nào. Hãy tạo phiên đầu tiên!</div>`; }
    else{
      $("#tOvRecent").innerHTML = `<table><thead><tr><th>Hoạt động</th><th>Trạng thái</th><th>Câu hỏi</th><th>Lượt trả lời</th><th>Ngày tạo</th><th></th></tr></thead><tbody>
        ${recentSessions.map(s=>{ return `<tr><td>${esc(s.title)}</td><td>${sessionStatusBadge(s.status)}</td><td>${s.questionCount||0}</td><td>${s.responseCount||0}</td><td>${fmtDateShort(s.createdAt)}</td>
          <td><button class="btn btn-sm btn-outline" data-open="${s.id}">MỞ</button><button class="btn btn-sm btn-outline" data-session-info="${s.id}">SỬA PHIÊN</button></td></tr>`; }).join("")}
      </tbody></table>`;
      $$("[data-session-info]").forEach(b=>b.onclick=()=>{
        const s=recentSessions.find(x=>x.id===b.dataset.sessionInfo);
        if(s && isContractSession(s)) openContractInteractionEditor(b.dataset.sessionInfo,()=>teacherOverview(c));
        else openSessionInfoEditor("sessions",b.dataset.sessionInfo,()=>teacherOverview(c));
      });
      $$("[data-open]").forEach(b=>b.onclick=()=>{ window.location.hash = "#/live/"+encodeURIComponent(b.dataset.open); });
    }
  }catch(e){ $("#tOvGrid").innerHTML = errorBlock(e, ()=>teacherOverview(c)); }
}

function openLibraryForm(existing){
  const type = existing?.type || "single";
  openModal(`
    <h3>${existing?"Sửa câu hỏi thư viện":"Lưu câu hỏi vào thư viện"}</h3>
    <form id="libForm">
      <div class="field"><label>Phân loại</label><select id="libCat">${LIBRARY_CATEGORIES.map(cat=>`<option ${existing&&existing.category===cat?"selected":""}>${esc(cat)}</option>`).join("")}</select></div>
      <div class="field"><label>Loại câu hỏi</label><select id="libType">${Object.entries(QUESTION_TYPES).map(([k,v])=>`<option value="${k}" ${type===k?"selected":""}>${v.icon} ${esc(v.label)}</option>`).join("")}</select></div>
      <div class="field"><label>Nội dung câu hỏi *</label><textarea id="libQ" required>${existing?esc(existing.question):""}</textarea></div>
      <div class="field"><label>Mô tả / gợi ý (không bắt buộc)</label><input type="text" id="libDesc" value="${existing?esc(existing.description||""):""}"></div>
      <div class="field" id="libOptWrap"></div>
      <div id="libErr" class="error-text hidden"></div>
      <div class="flex-between mt-14">
        <button type="button" class="btn btn-ghost" id="libCancel">Hủy</button>
        <button type="submit" class="btn">${existing?"Lưu thay đổi":"Lưu vào thư viện"}</button>
      </div>
    </form>`, true);
  $("#libCancel").onclick = closeModal;
  function renderOptEditor(){
    const t = $("#libType").value;
    if(t==="truefalse"){
      // Đúng/Sai luôn cố định — không cho sửa, nhưng VẪN được ghi vào Firestore khi lưu.
      $("#libOptWrap").innerHTML = `<label>Phương án</label><p class="hint">Câu hỏi Đúng/Sai luôn có sẵn 2 phương án cố định: <strong>Đúng</strong> và <strong>Sai</strong> (không cần nhập tay).</p>`;
      return;
    }
    if(t==="scale"){
      const mn = Number(existing?.scaleMin ?? 1);
      const mx = Number(existing?.scaleMax ?? 5);
      $("#libOptWrap").innerHTML = `<div class="grid grid-2">
        <div class="field"><label>Giá trị nhỏ nhất</label><input type="number" id="libScaleMin" value="${mn}"></div>
        <div class="field"><label>Giá trị lớn nhất</label><input type="number" id="libScaleMax" value="${mx}"></div>
      </div>`;
      return;
    }
    if(!QUESTION_TYPES[t].needsOptions){ $("#libOptWrap").innerHTML = `<p class="hint">Loại câu hỏi này không cần phương án cố định.</p>`; return; }
    const opts = (existing && existing.type===t && existing.options) ? existing.options : ["",""];
    $("#libOptWrap").innerHTML = `<label>Phương án</label><div id="libOptions">${opts.map((o,i)=>optionRowHtml(o,i)).join("")}</div>
      <button type="button" class="btn btn-sm btn-outline" id="libAddOpt">+ Thêm phương án</button>`;
    $("#libAddOpt").onclick = ()=>{ $("#libOptions").insertAdjacentHTML("beforeend", optionRowHtml("", $("#libOptions").children.length)); wireOptRemove(); };
    wireOptRemove();
  }
  function wireOptRemove(){ $$(".optRemove").forEach(b=>b.onclick=()=>b.closest(".option-row").remove()); }
  $("#libType").onchange = renderOptEditor;
  renderOptEditor();
  $("#libForm").onsubmit = async (e)=>{
    e.preventDefault();
    const t = $("#libType").value, qtext = $("#libQ").value.trim();
    if(!qtext){ $("#libErr").textContent="Nội dung câu hỏi không được để trống."; $("#libErr").classList.remove("hidden"); return; }
    let options = null;
    if(t==="truefalse"){
      // Luôn ghi cố định 2 phương án Đúng/Sai vào Firestore, bất kể trạng thái UI.
      options = QUESTION_TYPES.truefalse.fixedOptions.slice();
    } else if(QUESTION_TYPES[t].needsOptions){
      options = $$("#libOptions .optText").map(i=>i.value.trim()).filter(v=>v);
      if(options.length<2){ $("#libErr").textContent="Cần ít nhất 2 phương án."; $("#libErr").classList.remove("hidden"); return; }
    }
    let scaleMin = null, scaleMax = null;
    if(t==="scale"){
      scaleMin = Number($("#libScaleMin").value);
      scaleMax = Number($("#libScaleMax").value);
      if(!Number.isFinite(scaleMin) || !Number.isFinite(scaleMax) || scaleMin>=scaleMax){
        $("#libErr").textContent="Thang điểm không hợp lệ (giá trị nhỏ nhất phải nhỏ hơn giá trị lớn nhất).";
        $("#libErr").classList.remove("hidden");
        return;
      }
    }
    const data = {
      category: $("#libCat").value, type:t, question:qtext,
      description: $("#libDesc").value.trim(),
      options, scaleMin, scaleMax, updatedAt: serverTimestamp()
    };
    try{
      if(existing){ await updateDoc(doc(db,"library",existing.id), data); toast("Đã lưu thay đổi.","ok"); }
      else{ data.ownerId = STATE.user.uid; data.createdAt = serverTimestamp(); await addDoc(collection(db,"library"), data); toast("Đã lưu vào thư viện.","ok"); }
      closeModal();
    }catch(err){ $("#libErr").textContent = mapError(err); $("#libErr").classList.remove("hidden"); }
  };
}
function optionRowHtml(val, idx){
  return `<div class="option-row"><input type="text" class="optText" value="${esc(val)}" placeholder="Phương án ${idx+1}"><button type="button" class="btn btn-sm btn-ghost optRemove">✕</button></div>`;
}

function openWizardStudentPreview(){
  const w=STATE.wizard;if(!w)return;
  const q=w.questions[w.qIndex||0]||w.questions[0];if(!q)return;
  let body="";
  if(q.type==="single"||q.type==="truefalse") body=(q.options||[]).map((o,i)=>`<label class="student-option"><input type="radio" disabled> ${esc(o)}</label>`).join("");
  else if(q.type==="multiple") body=(q.options||[]).map(o=>`<label class="student-option"><input type="checkbox" disabled> ${esc(o)}</label>`).join("");
  else if(q.type==="open") body=`<textarea disabled placeholder="Học viên nhập ý kiến tại đây…"></textarea>`;
  else if(q.type==="scale") body=`<div class="flex gap-8" style="flex-wrap:wrap">${Array.from({length:(q.scaleMax||5)-(q.scaleMin||1)+1},(_,i)=>`<button class="btn btn-outline" disabled>${(q.scaleMin||1)+i}</button>`).join("")}</div>`;
  else body=`<div class="mut">Bản xem trước loại câu hỏi: ${esc(QUESTION_TYPES[q.type]?.label||q.type)}</div>`;
  openModal(`<div style="max-width:520px;margin:auto"><div class="center"><div class="eyebrow">XEM TRƯỚC NHƯ HỌC VIÊN</div><h2>${esc(w.title||"Hoạt động chưa đặt tên")}</h2></div>
    <div class="card mt-14"><div class="small mut">Câu ${(w.qIndex||0)+1}/${w.questions.length}</div><h3>${esc(q.question||"Nội dung câu hỏi")}</h3>${q.description?`<p class="mut">${esc(q.description)}</p>`:""}<div class="mt-14">${body}</div><button class="btn mt-16" disabled>GỬI CÂU TRẢ LỜI</button></div>
    <div class="center mt-14"><button class="btn btn-outline" id="closeStudentPreview">ĐÓNG XEM TRƯỚC</button></div></div>`,true);
  $("#closeStudentPreview").onclick=closeModal;
}

const WIZARD_STEP_LABELS = ["Tên hoạt động","Chọn lớp","Câu hỏi","Loại câu hỏi","Phương án","Biểu đồ","Thiết lập","Xem trước","Bắt đầu"];
function blankQuestion(){ return {
  question:"", description:"", type:"single", options:["",""], required:true,
  chartType:null, scaleMin:1, scaleMax:5, timeLimit:0, allowChangeAnswer:false,
  saveToLibrary:false, libraryCategory:LIBRARY_CATEGORIES[0], sourceLibraryId:null
}; }
function initWizard(){
  STATE.wizard = {
    step:1, title:"", classId:"", classesCache:[], questions:[blankQuestion()], qIndex:0,
    settings:{ timeLimit:0, showResults:"hidden", allowChangeAnswer:false, anonymous:true, showResponderCount:true, allowMultipleResponses:false }
  };
}
async function teacherWizard(c, ignore){
  if(!STATE.wizard) initWizard();
  if(STATE.wizard.classesCache.length===0){
    try{ const snap = await getDocs(query(collection(db,"classes"), where("ownerId","==",STATE.user.uid), orderBy("createdAt","desc"))); STATE.wizard.classesCache = snap.docs.map(d=>({id:d.id,...d.data()})); }catch(e){}
  }
  renderWizard(c);
}
function wizardShellHtml(bodyHtml){
  const w = STATE.wizard;
  return `<h2>Tạo tương tác mới</h2>
  <div class="wizard-steps">${WIZARD_STEP_LABELS.map((l,i)=>{
    const n=i+1; const cls = n<w.step?"done":(n===w.step?"active":"");
    return `<span class="step ${cls}">${n}. ${esc(l)}</span>`;
  }).join("")}</div>
  <div class="card">${bodyHtml}</div>`;
}
function renderWizard(c){
  const w = STATE.wizard;
  const steps = {
    1: wizStep1, 2: wizStep2, 3: wizStep3, 4: wizStep4, 5: wizStep5, 6: wizStep6, 7: wizStep7, 8: wizStep8
  };
  (steps[w.step] || wizStep1)(c);
}
function wizNavHtml(showBack, nextLabel){
  return `<div class="wizard-nav">
    <button type="button" class="btn btn-ghost" id="wizBack" ${showBack?"":"disabled style='visibility:hidden'"}>← Quay lại</button>
    <div class="flex gap-8">
      <button type="button" class="btn btn-ghost" id="wizCancel">Hủy bỏ</button>
      <button type="button" class="btn" id="wizNext">${esc(nextLabel||"Tiếp tục →")}</button>
    </div>
  </div>`;
}
function wireWizNav(onBack, onNext){
  $("#wizCancel").onclick = ()=>{ if(confirm("Hủy bỏ tạo phiên? Dữ liệu đang nhập sẽ mất.")){ STATE.wizard=null; STATE.teacherNav="overview"; window.location.hash=""; teacherRoute(); } };
  if($("#wizBack")) $("#wizBack").onclick = onBack;
  $("#wizNext").onclick = onNext;
}

function wizStep1(c){
  const w = STATE.wizard;
  c.innerHTML = wizardShellHtml(`
    <div class="field"><label>Tên hoạt động *</label><input type="text" id="wTitle" value="${esc(w.title)}" placeholder="Ví dụ: Khảo sát đầu giờ - Chương 1"></div>
    <div id="wErr" class="error-text hidden"></div>
    ${wizNavHtml(false)}`);
  wireWizNav(null, ()=>{
    const v = $("#wTitle").value.trim();
    if(!v){ $("#wErr").textContent="Vui lòng nhập tên hoạt động."; $("#wErr").classList.remove("hidden"); return; }
    w.title = v; w.step=2; renderWizard($("#mainContent"));
  });
}
function wizStep2(c){
  const w = STATE.wizard;
  c.innerHTML = wizardShellHtml(`
    ${w.classesCache.length===0?`<p class="mut">Bạn chưa có lớp học nào. Vui lòng tạo lớp trước.</p><button class="btn btn-outline" id="wCreateClassQuick">+ Tạo lớp nhanh</button>`:
    `<div class="field"><label>Chọn lớp *</label><select id="wClass">
      <option value="">— Chọn lớp —</option>
      ${w.classesCache.map(cl=>`<option value="${cl.id}" ${w.classId===cl.id?"selected":""}>${esc(cl.name)}</option>`).join("")}
    </select></div>`}
    <div id="wErr" class="error-text hidden"></div>
    ${wizNavHtml(true)}`);
  if(w.classesCache.length===0){
    $("#wCreateClassQuick").onclick = ()=>{
      openClassForm(null);
      const origClose = closeModal;
      const check = setInterval(async ()=>{
        if(!document.getElementById("globalModal") || document.getElementById("globalModal").innerHTML===""){
          clearInterval(check);
          const snap = await getDocs(query(collection(db,"classes"), where("ownerId","==",STATE.user.uid), orderBy("createdAt","desc")));
          w.classesCache = snap.docs.map(d=>({id:d.id,...d.data()}));
          renderWizard($("#mainContent"));
        }
      }, 500);
    };
    wireWizNav(()=>{ w.step=1; renderWizard(c); }, ()=>{ $("#wErr").textContent="Vui lòng tạo lớp trước khi tiếp tục."; $("#wErr").classList.remove("hidden"); });
    return;
  }
  wireWizNav(()=>{ w.step=1; renderWizard(c); }, ()=>{
    const v = $("#wClass").value;
    if(!v){ $("#wErr").textContent="Vui lòng chọn lớp."; $("#wErr").classList.remove("hidden"); return; }
    w.classId = v; w.step=3; renderWizard($("#mainContent"));
  });
}
function wizQuestionListBar(){
  const w = STATE.wizard;
  return `<div class="flex gap-8 mt-8" style="flex-wrap:wrap;">
    ${w.questions.map((q,i)=>`<button type="button" class="btn btn-sm ${i===w.qIndex?'':'btn-outline'}" data-goq="${i}">Câu ${i+1}</button>`).join("")}
  </div>`;
}
function wireQuestionListBar(rerender){
  $$("[data-goq]").forEach(b=>b.onclick=()=>{ STATE.wizard.qIndex = Number(b.dataset.goq); STATE.wizard.step=3; rerender(); });
}

function wizardQuestionFromLibrary(item){
  const meta = QUESTION_TYPES[item.type] || QUESTION_TYPES.single;
  let opts = Array.isArray(item.options) ? item.options.map(x=>String(x)) : [];
  if(item.type==="truefalse") opts = QUESTION_TYPES.truefalse.fixedOptions.slice();
  if(meta.needsOptions && opts.length<2){
    if(item.type==="likert") opts=["Hoàn toàn không đồng ý","Không đồng ý","Phân vân","Đồng ý","Hoàn toàn đồng ý"];
    else opts=["",""];
  }
  return {
    question:String(item.question||""),
    description:String(item.description||""),
    type:item.type && QUESTION_TYPES[item.type] ? item.type : "single",
    options:opts,
    required:true,
    chartType:(item.chartType && meta.allowedCharts.includes(item.chartType)) ? item.chartType : meta.defaultChart,
    scaleMin:Number.isFinite(Number(item.scaleMin)) ? Number(item.scaleMin) : 1,
    scaleMax:Number.isFinite(Number(item.scaleMax)) ? Number(item.scaleMax) : 5,
    timeLimit:STATE.wizard?.settings?.timeLimit||0,
    allowChangeAnswer:!!STATE.wizard?.settings?.allowChangeAnswer,
    saveToLibrary:false,
    libraryCategory:item.category||LIBRARY_CATEGORIES[0],
    sourceLibraryId:item.id||null
  };
}
function isWizardBlankQuestion(q){
  return !String(q?.question||"").trim()
    && q?.type==="single"
    && (!Array.isArray(q?.options) || q.options.every(x=>!String(x||"").trim()));
}
async function openWizardLibraryPicker(){
  const w = STATE.wizard;
  openModal(`
    <div class="flex-between">
      <div>
        <h3>📚 Chọn câu hỏi từ Thư viện</h3>
        <p class="hint">Có thể chọn nhiều câu cùng lúc. Câu được thêm vào tương tác là <b>bản sao độc lập</b>, sửa trong phiên sẽ không làm đổi câu gốc trong Thư viện.</p>
      </div>
      <button type="button" class="btn btn-sm btn-ghost" id="libPickClose">✕</button>
    </div>
    <div class="library-picker-toolbar">
      <input type="text" id="libPickSearch" placeholder="🔎 Tìm nội dung câu hỏi…">
      <select id="libPickType"><option value="">Tất cả loại</option>${Object.entries(QUESTION_TYPES).map(([k,v])=>`<option value="${k}">${esc(v.label)}</option>`).join("")}</select>
      <select id="libPickCat"><option value="">Tất cả phân loại</option>${LIBRARY_CATEGORIES.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select>
    </div>
    <div class="flex-between">
      <label class="flex gap-8" style="margin:0;font-weight:600;"><input type="checkbox" id="libPickAll" style="width:auto;min-height:auto;"> Chọn tất cả đang hiển thị</label>
      <span class="small mut" id="libPickCount">0 câu được chọn</span>
    </div>
    <div id="libPickList" class="library-picker-list mt-14"><div class="mut">Đang tải thư viện…</div></div>
    <div id="libPickErr" class="error-text hidden mt-8"></div>
    <div class="flex-between mt-14">
      <button type="button" class="btn btn-ghost" id="libPickCancel">Hủy</button>
      <button type="button" class="btn" id="libPickAdd" disabled>THÊM CÂU ĐÃ CHỌN</button>
    </div>
  `, true);

  $("#libPickClose").onclick = closeModal;
  $("#libPickCancel").onclick = closeModal;

  let cache = [];
  const selected = new Set();
  try{
    const snap = await getDocs(query(collection(db,"library"), where("ownerId","==",STATE.user.uid), orderBy("createdAt","desc")));
    cache = snap.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){
    $("#libPickList").innerHTML = `<div class="empty-state"><div class="ic">⚠️</div>${esc(mapError(e))}</div>`;
    return;
  }

  const filtered = ()=>{
    const kw=($("#libPickSearch").value||"").toLowerCase().trim();
    const t=$("#libPickType").value;
    const cat=$("#libPickCat").value;
    return cache.filter(x=>{
      if(t && x.type!==t) return false;
      if(cat && x.category!==cat) return false;
      if(kw && !(`${x.question||""} ${x.description||""}`.toLowerCase().includes(kw))) return false;
      return true;
    });
  };
  function updatePickCount(){
    $("#libPickCount").textContent = `${selected.size} câu được chọn`;
    $("#libPickAdd").disabled = selected.size===0;
  }
  function render(){
    const list=filtered();
    if(!list.length){
      $("#libPickList").innerHTML=`<div class="empty-state"><div class="ic">📚</div>Không có câu hỏi phù hợp.</div>`;
      $("#libPickAll").checked=false; updatePickCount(); return;
    }
    $("#libPickList").innerHTML=list.map(x=>`
      <label class="library-picker-item">
        <input type="checkbox" data-libpick="${x.id}" ${selected.has(x.id)?"checked":""}>
        <span>
          <span class="library-picker-meta">
            <span class="chip">${esc(x.category||"Chưa phân loại")}</span>
            <span class="chip">${esc(QUESTION_TYPES[x.type]?.label||x.type||"—")}</span>
          </span>
          <span class="library-picker-question">${esc(x.question||"")}</span>
          ${x.description?`<span class="small mut" style="display:block;margin-top:4px;">${esc(x.description)}</span>`:""}
        </span>
      </label>`).join("");
    $$("[data-libpick]").forEach(cb=>cb.onchange=()=>{
      if(cb.checked) selected.add(cb.dataset.libpick); else selected.delete(cb.dataset.libpick);
      updatePickCount();
      const ids=list.map(x=>x.id);
      $("#libPickAll").checked=ids.length>0 && ids.every(id=>selected.has(id));
    });
    const ids=list.map(x=>x.id);
    $("#libPickAll").checked=ids.length>0 && ids.every(id=>selected.has(id));
    updatePickCount();
  }
  ["libPickSearch","libPickType","libPickCat"].forEach(id=>{
    const el=$("#"+id); el.addEventListener(id==="libPickSearch"?"input":"change", render);
  });
  $("#libPickAll").onchange=()=>{
    filtered().forEach(x=>$("#libPickAll").checked?selected.add(x.id):selected.delete(x.id));
    render();
  };
  $("#libPickAdd").onclick=()=>{
    const picked=cache.filter(x=>selected.has(x.id)).map(wizardQuestionFromLibrary);
    if(!picked.length) return;
    let firstIndex;
    const current=w.questions[w.qIndex];
    if(w.questions.length===1 && isWizardBlankQuestion(current)){
      w.questions.splice(0,1,...picked);
      firstIndex=0;
    }else{
      firstIndex=w.questions.length;
      w.questions.push(...picked);
    }
    w.qIndex=firstIndex;
    w.step=3;
    closeModal();
    toast(`Đã thêm ${picked.length} câu hỏi từ Thư viện.`,"ok");
    renderWizard($("#mainContent"));
  };
  render();
}

function wizStep3(c){
  const w = STATE.wizard; const q = w.questions[w.qIndex];
  c.innerHTML = wizardShellHtml(`
    ${w.questions.length>1?wizQuestionListBar():""}
    <div class="library-source-actions mt-14">
      <button type="button" class="btn btn-outline" id="wizFromLibrary">📚 CHỌN TỪ THƯ VIỆN</button>
      <span class="hint" style="align-self:center;">Chọn một hoặc nhiều câu đã lưu để đưa thẳng vào tương tác.</span>
    </div>
    <div class="field"><label>Nội dung câu hỏi *</label><textarea id="wQ" placeholder="Nhập nội dung câu hỏi…">${esc(q.question)}</textarea></div>
    <div class="field"><label>Mô tả / gợi ý (không bắt buộc)</label><input type="text" id="wQDesc" value="${esc(q.description||"")}"></div>
    <div class="library-save-row">
      <label class="flex gap-8" style="margin:0;"><input type="checkbox" id="wSaveLib" ${q.saveToLibrary?"checked":""} style="width:auto;min-height:auto;"> Lưu câu hỏi này vào Thư viện khi tạo phiên</label>
      <div class="field ${q.saveToLibrary?"":"hidden"} mt-8" id="wSaveLibCatWrap" style="margin-bottom:0;">
        <label>Phân loại trong Thư viện</label>
        <select id="wSaveLibCat">${LIBRARY_CATEGORIES.map(cat=>`<option ${q.libraryCategory===cat?"selected":""}>${esc(cat)}</option>`).join("")}</select>
      </div>
      ${q.sourceLibraryId?`<p class="hint" style="margin:6px 0 0;">Câu này được sao chép từ Thư viện. Mọi chỉnh sửa chỉ áp dụng cho tương tác hiện tại.</p>`:""}
    </div>
    <div id="wErr" class="error-text hidden"></div>
    ${wizNavHtml(true)}`);
  wireQuestionListBar(()=>renderWizard(c));
  $("#wizFromLibrary").onclick = openWizardLibraryPicker;
  $("#wSaveLib").onchange = ()=>{
    $("#wSaveLibCatWrap").classList.toggle("hidden", !$("#wSaveLib").checked);
  };
  wireWizNav(()=>{ w.step=2; renderWizard(c); }, ()=>{
    const v = $("#wQ").value.trim();
    if(!v){ $("#wErr").textContent="Vui lòng nhập nội dung câu hỏi."; $("#wErr").classList.remove("hidden"); return; }
    q.question=v;
    q.description=$("#wQDesc").value.trim();
    q.saveToLibrary=$("#wSaveLib").checked;
    q.libraryCategory=$("#wSaveLibCat").value;
    w.step=4; renderWizard($("#mainContent"));
  });
}
function wizStep4(c){
  const w = STATE.wizard; const q = w.questions[w.qIndex];
  c.innerHTML = wizardShellHtml(`
    <div class="type-grid">
      ${Object.entries(QUESTION_TYPES).map(([k,v])=>`
        <div class="type-card ${q.type===k?'active':''}" data-type="${k}">
          <div class="ic">${v.icon}</div><div class="nm">${esc(v.label)}</div>
        </div>`).join("")}
    </div>
    ${wizNavHtml(true)}`);
  $$(".type-card").forEach(el=>el.onclick=()=>{ $$(".type-card").forEach(x=>x.classList.remove("active")); el.classList.add("active"); q.type = el.dataset.type; });
  wireWizNav(()=>{ w.step=3; renderWizard(c); }, ()=>{
    if(q.type==="truefalse") q.options=["Đúng","Sai"];
    if(q.type==="likert" && (!q.options || q.options.length!==5 || q.options[0]==="")) q.options=["Hoàn toàn không đồng ý","Không đồng ý","Phân vân","Đồng ý","Hoàn toàn đồng ý"];
    if((q.type==="single"||q.type==="multiple"||q.type==="ranking") && (!q.options || q.options.some(o=>false))){ if(!q.options || q.options.length<2) q.options=["",""]; }
    if(!QUESTION_TYPES[q.type].allowedCharts.includes(q.chartType)){
      q.chartType = QUESTION_TYPES[q.type].defaultChart;
    }
    w.step=5; renderWizard($("#mainContent"));
  });
}
function wizStep5(c){
  const w = STATE.wizard; const q = w.questions[w.qIndex]; const meta = QUESTION_TYPES[q.type];
  let body = "";
  if(q.type==="truefalse"){
    body = `<p class="hint">Câu Đúng/Sai sử dụng 2 phương án cố định: <b>Đúng</b> và <b>Sai</b>.</p>`;
  } else if(q.type==="scale"){
    body = `<div class="grid grid-2">
      <div class="field"><label>Giá trị nhỏ nhất</label><input type="number" id="wScaleMin" value="${q.scaleMin}"></div>
      <div class="field"><label>Giá trị lớn nhất</label><input type="number" id="wScaleMax" value="${q.scaleMax}"></div>
    </div>`;
  } else if(q.type==="open"){
    body = `<p class="hint">Học viên sẽ nhập câu trả lời dạng văn bản tự do. Không cần thiết lập phương án.</p>`;
  } else {
    body = `<label>${q.type==="ranking"?"Các mục cần xếp hạng":(q.type==="likert"?"Nhãn mức độ (có thể tùy chỉnh)":"Phương án")}</label>
    <div id="wOptions">${q.options.map((o,i)=>optionRowHtml(o,i)).join("")}</div>
    <button type="button" class="btn btn-sm btn-outline mt-8" id="wAddOpt">+ Thêm phương án</button>`;
  }
  c.innerHTML = wizardShellHtml(`${body}<div id="wErr" class="error-text hidden"></div>${wizNavHtml(true)}`);
  if($("#wAddOpt")) $("#wAddOpt").onclick = ()=>{ $("#wOptions").insertAdjacentHTML("beforeend", optionRowHtml("", $("#wOptions").children.length)); $$(".optRemove").forEach(b=>b.onclick=()=>b.closest(".option-row").remove()); };
  $$(".optRemove").forEach(b=>b.onclick=()=>b.closest(".option-row").remove());
  wireWizNav(()=>{ w.step=4; renderWizard(c); }, ()=>{
    if(q.type==="truefalse"){
      // Cố định 2 phương án Đúng/Sai — giáo viên không cần (và không thể) nhập tay,
      // nhưng dữ liệu VẪN được ghi vào Firestore (questions/{id}/options) như mọi loại có phương án khác.
      q.options = QUESTION_TYPES.truefalse.fixedOptions.slice();
    } else if(q.type==="scale"){
      const mn=Number($("#wScaleMin").value), mx=Number($("#wScaleMax").value);
      if(isNaN(mn)||isNaN(mx)||mn>=mx){ $("#wErr").textContent="Thang điểm không hợp lệ (giá trị nhỏ nhất phải nhỏ hơn giá trị lớn nhất)."; $("#wErr").classList.remove("hidden"); return; }
      q.scaleMin=mn; q.scaleMax=mx;
    } else if(meta.needsOptions){
      const vals = $$("#wOptions .optText").map(i=>i.value.trim()).filter(v=>v);
      const uniq = new Set(vals);
      if(vals.length<2){ $("#wErr").textContent="Cần ít nhất 2 phương án."; $("#wErr").classList.remove("hidden"); return; }
      if(q.type==="ranking" && uniq.size!==vals.length){ $("#wErr").textContent="Các mục xếp hạng không được trùng nhau."; $("#wErr").classList.remove("hidden"); return; }
      q.options = vals;
    }
    w.step=6; renderWizard($("#mainContent"));
  });
}
function wizStep6(c){
  const w = STATE.wizard; const q = w.questions[w.qIndex]; const meta = QUESTION_TYPES[q.type];
  if(!q.chartType) q.chartType = meta.defaultChart;
  c.innerHTML = wizardShellHtml(`
    <p class="hint">Biểu đồ phù hợp với loại câu hỏi "<b>${esc(meta.label)}</b>":</p>
    <div class="type-grid">
      ${meta.allowedCharts.map(ct=>`<div class="type-card ${q.chartType===ct?'active':''}" data-chart="${ct}"><div class="ic">📊</div><div class="nm">${esc(CHART_LABELS[ct])}</div></div>`).join("")}
    </div>
    <div class="flex-between mt-20" style="flex-wrap:wrap;gap:10px;">
      <button type="button" class="btn btn-ghost" id="wizBack">← Quay lại</button>
      <div class="flex gap-8">

async function finalizeWizard(){
  const w = STATE.wizard; const s = w.settings;
  const batch = writeBatch(db);
  const sessionRef = doc(collection(db,"sessions"));
  const firstQRef = doc(collection(db,"questions"));
  const cls = w.classesCache.find(x=>x.id===w.classId);
  const sessionData = {
    ownerId: STATE.user.uid, classId: w.classId, className: cls?cls.name:"", title: w.title, description: "",
    status: "ready", accessToken: genToken(28), shortCode: genShortCode(),
    showResults: s.showResults, allowMultipleResponses: s.allowMultipleResponses, anonymous: s.anonymous,
    showResponderCount: s.showResponderCount,
    startedAt: null, closedAt: null, createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
    questionCount: w.questions.length, responseCount: 0, activeQuestionId: null,
    activeQuestionStartedAt: null, sessionGroupId: null, roundNumber: 1
  };
  batch.set(sessionRef, sessionData);
  const joinCodeRef = doc(db,"joinCodes",sessionData.shortCode);
  batch.set(joinCodeRef, { sessionId: sessionRef.id, ownerId: STATE.user.uid, createdAt: serverTimestamp() });
  // FIX 8: ánh xạ accessToken -> sessionId, cho phép học viên tra cứu sessionId thật
  // bằng GET-theo-ID (không LIST được) mà không cần nhúng sessionId trực tiếp trong link/QR.
  const tokenRef = doc(db,"sessionTokens",sessionData.accessToken);
  batch.set(tokenRef, { sessionId: sessionRef.id, ownerId: STATE.user.uid, createdAt: serverTimestamp() });
  const qRefs = [];
  w.questions.forEach((q, i)=>{
    const qRef = i===0 ? firstQRef : doc(collection(db,"questions"));
    qRefs.push(qRef);
    const meta = QUESTION_TYPES[q.type];
    batch.set(qRef, {
      sessionId: sessionRef.id, ownerId: STATE.user.uid, order: i, type: q.type,
      question: q.question, description: q.description||"", required: true,
      chartType: q.chartType || meta.defaultChart, timeLimit: q.timeLimit||0,
      allowChangeAnswer: !!q.allowChangeAnswer,
      scaleMin: q.type==="scale"?q.scaleMin:null, scaleMax: q.type==="scale"?q.scaleMax:null,
      createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    });
    if(meta.needsOptions){
      q.options.forEach((optText, oi)=>{
        const optRef = doc(collection(db,"questions",qRef.id,"options"));
        batch.set(optRef, {
          label: String.fromCharCode(65+oi), text: optText, order: oi,
          value: q.type==="likert" ? (oi+1) : (q.type==="ranking" ? null : null),
          isCorrect: null, createdAt: serverTimestamp()
        });
      });
    }
    if(q.saveToLibrary){
      const libRef = doc(collection(db,"library"));
      batch.set(libRef,{
        ownerId:STATE.user.uid,
        category:q.libraryCategory||LIBRARY_CATEGORIES[0],
        type:q.type,
        question:q.question,
        description:q.description||"",
        options:meta.needsOptions?q.options:null,
        scaleMin:q.type==="scale"?q.scaleMin:null,
        scaleMax:q.type==="scale"?q.scaleMax:null,
        chartType:q.chartType||meta.defaultChart,
        createdAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      });
    }
  });
  await batch.commit();
  STATE.wizard = null;
  toast("Đã tạo phiên tương tác thành công!","ok");
  window.location.hash = "#/live/" + encodeURIComponent(sessionRef.id);
}

/* ============================================================
   CHART ENGINE (dùng chung: điều khiển trực tiếp, trình chiếu, báo cáo)
   ============================================================ */
const PALETTE = ["#155e75","#0891b2","#16a34a","#ca8a04","#dc2626","#7c3aed","#db2777","#0d9488","#ea580c","#4338ca"];

function optionIdFromStoredValue(raw, options){
  if(raw==null) return null;
  const s = String(raw);
  const direct = options.find(o=>String(o.id)===s);
  if(direct) return direct.id;
  const byText = options.find(o=>String(o.text??"")===s || String(o.value??"")===s);
  return byText ? byText.id : null;
}
function selectedOptionIds(response, options){
  const raw = Array.isArray(response?.selectedOptions) ? response.selectedOptions : [];
  return raw.map(v=>optionIdFromStoredValue(v, options)).filter(Boolean);
}
function safeScaleBounds(question){
  let min = Number(question.scaleMin), max = Number(question.scaleMax);
  if(!Number.isFinite(min)) min = 1;
  if(!Number.isFinite(max)) max = 10;
  min = Math.round(min); max = Math.round(max);
  if(max<min) [min,max]=[max,min];
  // Giới hạn để tránh DOM/chart bất thường nếu dữ liệu cũ bị sai.
  if(max-min>100) max=min+100;
  return {min,max};
}
function aggregateForChart(question, options, responseDocs){
  const type = question.type;
  if(type==="scale"){
    const {min,max}=safeScaleBounds(question);
    const labels=[]; for(let v=min;v<=max;v++) labels.push(String(v));
    const counts=labels.map(()=>0);
    responseDocs.forEach(r=>{
      const v=Number(r.answer);
      if(Number.isFinite(v) && Number.isInteger(v) && v>=min && v<=max) counts[v-min]++;
    });
    return { labels, datasets:[{
      label:"Số học viên",
      data:counts,
      backgroundColor:labels.map(()=>PALETTE[0]),
      borderRadius:6,
      borderSkipped:false
    }]};
  }
  if(type==="ranking"){
    const n=options.length;
    const scores={}; options.forEach(o=>scores[o.id]=0);
    responseDocs.forEach(r=>{
      const order=selectedOptionIds(r,options);
      const seen=new Set();
      order.forEach((optId,pos)=>{
        if(scores[optId]!=null && !seen.has(optId)){
          scores[optId] += Math.max(1,n-pos);
          seen.add(optId);
        }
      });
    });
    const sorted=[...options].sort((a,b)=>(scores[b.id]||0)-(scores[a.id]||0));
    return { labels:sorted.map(o=>o.text), datasets:[{
      label:"Điểm xếp hạng",
      data:sorted.map(o=>scores[o.id]||0),
      backgroundColor:sorted.map(()=>PALETTE[0]),
      borderRadius:6,
      borderSkipped:false
    }]};
  }
  if(type==="likert"){
    const total=responseDocs.length;
    const counts=options.map(o=>responseDocs.filter(r=>selectedOptionIds(r,options).includes(o.id)).length);
    if(question.chartType==="hbar"){
      return { labels:options.map(o=>o.text), datasets:[{
        label:"Số học viên",
        data:counts,
        backgroundColor:options.map((_,i)=>PALETTE[i%PALETTE.length]),
        borderRadius:6,
        borderSkipped:false
      }]};
    }
    return { labels:["Tỷ lệ"], datasets:options.map((o,i)=>({
      label:o.text,
      data:[total ? Math.round(counts[i]/total*1000)/10 : 0],
      backgroundColor:PALETTE[i%PALETTE.length],
      borderWidth:0
    }))};
  }
  // Một lựa chọn / Nhiều lựa chọn / Đúng-Sai.
  // Luôn giữ cả phương án 0 lượt để biểu đồ phản ánh đầy đủ bộ lựa chọn.
  const counts=options.map(o=>responseDocs.filter(r=>selectedOptionIds(r,options).includes(o.id)).length);
  return { labels:options.map(o=>o.text), datasets:[{
    label:type==="multiple"?"Lượt chọn":"Số học viên",
    data:counts,
    backgroundColor:options.map((_,i)=>PALETTE[i%PALETTE.length]),
    borderRadius:(question.chartType==="bar"||question.chartType==="hbar")?6:0,
    borderSkipped:false
  }]};
}

const percentLabelsPlugin = {
  id:"percentLabels",
  afterDatasetsDraw(chart, args, pluginOpts){
    if(!pluginOpts || pluginOpts.display===false) return;
    const chartType = chart.config.type;
    const isPie = chartType==="pie" || chartType==="doughnut";
    const isStacked = pluginOpts.mode==="stacked";
    const ctx = chart.ctx;
    ctx.save();
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.font=`700 ${pluginOpts.fontSize||12}px ${getComputedStyle(document.body).fontFamily||"Arial"}`;

    if(isPie){
      const ds = chart.data.datasets[0];
      const vals = (ds?.data||[]).map(v=>Number(v)||0);
      const total = vals.reduce((a,b)=>a+b,0);
      if(total>0){
        const meta = chart.getDatasetMeta(0);
        meta.data.forEach((arc,i)=>{
          const val=vals[i], pct=val/total*100;
          if(val<=0 || pct < (pluginOpts.minPercent||5)) return;
          const p=arc.tooltipPosition();
          ctx.fillStyle="#ffffff";
          ctx.fillText(`${Math.round(pct*10)/10}%`,p.x,p.y);
        });
      }
    }else if(isStacked){
      chart.data.datasets.forEach((ds,di)=>{
        const val=Number(ds.data?.[0])||0;
        if(val < (pluginOpts.minPercent||8)) return;
        const el=chart.getDatasetMeta(di).data?.[0];
        if(!el) return;
        const p=el.tooltipPosition();
        ctx.fillStyle="#ffffff";
        ctx.fillText(`${Math.round(val*10)/10}%`,p.x,p.y);
      });
    }
    ctx.restore();
  }
};


function chartLabelText(value){
  if(Array.isArray(value)) return value.join(" ");
  return value==null?"":String(value);
}
function chartShortText(value,maxChars){
  const text=chartLabelText(value).replace(/\s+/g," ").trim();
  if(text.length<=maxChars) return text;
  return text.slice(0,Math.max(1,maxChars-1)).trimEnd()+"…";
}
function chartWrapText(value,maxChars,maxLines){
  const text=chartLabelText(value).replace(/\s+/g," ").trim();
  if(!text) return "";
  const words=text.split(" "), lines=[]; let line="";
  for(const word of words){
    const next=(line+" "+word).trim();
    if(next.length<=maxChars){ line=next; continue; }
    if(line) lines.push(line);
    line=word.length>maxChars?chartShortText(word,maxChars):word;
    if(lines.length===maxLines-1) break;
  }
  if(line && lines.length<maxLines) lines.push(line);
  const shown=lines.join(" ");
  if(shown.length<text.length && lines.length){
    const last=lines[lines.length-1].replace(/…$/,"");
    lines[lines.length-1]=(last.length>=maxChars?last.slice(0,maxChars-1).trimEnd():last)+"…";
  }
  return lines;
}
function chartFullLabel(ctx){
  const item=Array.isArray(ctx)?ctx[0]:ctx;
  if(!item) return "";
  const labels=item.chart?.data?.labels||[];
  return chartLabelText(labels[item.dataIndex]??item.label);
}
function chartLegendLabels(chart,maxChars){
  const items=Chart.defaults.plugins.legend.labels.generateLabels(chart);
  return items.map(item=>({...item,text:chartShortText(item.text,maxChars)}));
}

function chartOptions(question, chartType, agg, mode){
  const isReport=mode==="report", isPresentation=mode==="presentation";
  const labelCount=Math.max(0,(agg?.labels||[]).length);
  const verticalChars=isPresentation?24:(isReport?20:18);
  const horizontalChars=isPresentation?34:(isReport?29:26);
  const legendChars=isPresentation?38:(isReport?32:28);
  const base={
    responsive:true,
    maintainAspectRatio:false,
    animation:isReport?false:{duration:250},
    normalized:true,
    plugins:{
      legend:{
        display:chartType==="stacked"||chartType==="pie"||chartType==="donut",
        position:"bottom",
        labels:{
          boxWidth:14,padding:isReport?10:14,font:{size:isPresentation?14:(isReport?11:12)},
          generateLabels:chart=>chartLegendLabels(chart,legendChars)
        }
      },
      tooltip:{enabled:true,callbacks:{title:items=>chartFullLabel(items)}},
      percentLabels:{
        display:chartType==="pie"||chartType==="donut"||chartType==="stacked",
        mode:chartType==="stacked"?"stacked":"pie",
        minPercent:chartType==="stacked"?8:5,
        fontSize:isPresentation?16:(isReport?12:12)
      }
    }
  };

  if(chartType==="pie"||chartType==="donut"){
    base.plugins.tooltip.callbacks={
      title:items=>chartFullLabel(items),
      label:(ctx)=>{
        const data=ctx.dataset.data||[];
        const total=data.reduce((a,b)=>a+(Number(b)||0),0);
        const val=Number(ctx.raw)||0;
        const pct=total?Math.round(val/total*1000)/10:0;
        return `${ctx.label}: ${val} (${pct}%)`;
      }
    };
    if(chartType==="donut") base.cutout="58%";
    return base;
  }

  if(chartType==="stacked"){
    base.indexAxis="y";
    base.scales={
      x:{stacked:true,beginAtZero:true,min:0,max:100,title:{display:true,text:"Tỷ lệ (%)"},ticks:{callback:v=>v+"%"}},
      y:{stacked:true,grid:{display:false},ticks:{callback:function(value){return chartWrapText(this.getLabelForValue(value),horizontalChars,3);}}}
    };
    base.plugins.tooltip.callbacks={title:items=>chartFullLabel(items),label:ctx=>`${chartLabelText(ctx.dataset.label)}: ${ctx.raw}%`};
    return base;
  }

  if(chartType==="hbar" || question.type==="ranking"){
    base.indexAxis="y";
    base.plugins.legend.display=false;
    base.scales={
      x:{beginAtZero:true,title:{display:true,text:question.type==="ranking"?"Điểm xếp hạng":"Số lượt"},ticks:{precision:0}},
      y:{grid:{display:false},ticks:{autoSkip:false,font:{size:isPresentation?13:(isReport?10:11)},callback:function(value){return chartWrapText(this.getLabelForValue(value),horizontalChars,isReport?2:3);}}}
    };
    base.plugins.tooltip.callbacks={title:items=>chartFullLabel(items),label:ctx=>`${ctx.raw} ${question.type==="ranking"?"điểm":"lượt"}`};
    return base;
  }

  if(chartType==="distribution" || question.type==="scale"){
    const maxCount=Math.max(0,...((agg?.datasets?.[0]?.data)||[]).map(Number));
    base.plugins.legend.display=false;
    base.scales={
      x:{title:{display:true,text:"Điểm"},grid:{display:false},ticks:{autoSkip:false}},
      y:{beginAtZero:true,suggestedMax:Math.max(2,maxCount),title:{display:true,text:"Số học viên"},ticks:{precision:0,stepSize:1}}
    };
    base.plugins.tooltip.callbacks={title:items=>chartFullLabel(items),label:ctx=>`${ctx.raw} học viên chọn điểm ${chartFullLabel(ctx)}`};
    return base;
  }

  // Cột đứng mặc định.
  base.plugins.legend.display=false;
  base.scales={
    x:{grid:{display:false},ticks:{
      autoSkip:labelCount>(isPresentation?10:8),maxTicksLimit:isPresentation?10:8,maxRotation:0,minRotation:0,
      font:{size:isPresentation?13:(isReport?10:11)},
      callback:function(value){
        const label=this.getLabelForValue(value);
        return chartWrapText(label,verticalChars,isReport?2:3);
      }
    }},
    y:{beginAtZero:true,title:{display:true,text:question.type==="multiple"?"Lượt chọn":"Số học viên"},ticks:{precision:0,stepSize:1}}
  };
  base.plugins.tooltip.callbacks={title:items=>chartFullLabel(items),label:ctx=>`${ctx.raw} ${question.type==="multiple"?"lượt chọn":"học viên"}`};
  return base;
}

function chartSummaryHtml(question, options, responseDocs){
  const type=question.type;
  if(type==="scale"){
    const {min,max}=safeScaleBounds(question);
    const vals=responseDocs.map(r=>Number(r.answer)).filter(v=>Number.isFinite(v)&&v>=min&&v<=max);
    if(!vals.length) return "";
    const sorted=[...vals].sort((a,b)=>a-b);
    const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    const mid=Math.floor(sorted.length/2);
    const med=sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;
    return `<div class="chart-summary">
      <span class="metric"><b>Trung bình:</b> ${avg.toLocaleString("vi-VN",{maximumFractionDigits:2})}/${max}</span>
      <span class="metric"><b>Trung vị:</b> ${med.toLocaleString("vi-VN")}</span>
      <span class="metric"><b>Thấp nhất:</b> ${Math.min(...vals)}</span>
      <span class="metric"><b>Cao nhất:</b> ${Math.max(...vals)}</span>
    </div>`;
  }
  if(type==="ranking"){
    if(!responseDocs.length || !options.length) return "";
    const agg=aggregateForChart(question,options,responseDocs);
    const vals=agg.datasets[0]?.data||[];
    const score=Math.max(0,...vals);
    const winners=agg.labels.filter((_,i)=>Number(vals[i])===Number(score));
    const winnerText=winners.map(x=>esc(x)).join(" · ");
    return `<div class="chart-summary"><span class="metric"><b>Xếp hạng cao nhất:</b> ${winnerText||"—"} (${score} điểm)${winners.length>1?" — Đồng hạng":""}</span><span class="metric"><b>Cách tính:</b> hạng 1 = ${options.length} điểm → hạng ${options.length} = 1 điểm</span></div>`;
  }
  if(type==="likert"){
    if(!responseDocs.length || !options.length) return "";
    const indexById=new Map(options.map((o,i)=>[o.id,i+1]));
    const scores=responseDocs.map(r=>selectedOptionIds(r,options)[0]).map(id=>indexById.get(id)).filter(Number.isFinite);
    if(!scores.length) return "";
    const avg=scores.reduce((a,b)=>a+b,0)/scores.length;
    return `<div class="chart-summary"><span class="metric"><b>Điểm đồng thuận TB:</b> ${avg.toLocaleString("vi-VN",{maximumFractionDigits:2})}/${options.length}</span><span class="metric"><b>Tổng phản hồi:</b> ${responseDocs.length}</span></div>`;
  }
  if(type==="multiple"){
    const totalSelections=responseDocs.reduce((n,r)=>n+selectedOptionIds(r,options).length,0);
    return `<div class="chart-summary"><span class="metric"><b>Người trả lời:</b> ${responseDocs.length}</span><span class="metric"><b>Tổng lượt chọn:</b> ${totalSelections}</span></div>`;
  }
  if(type==="single"||type==="truefalse"){
    if(!responseDocs.length) return "";
    const agg=aggregateForChart(question,options,responseDocs);
    const vals=agg.datasets[0]?.data||[];
    const maxVal=Math.max(0,...vals);
    const winners=agg.labels.filter((_,i)=>Number(vals[i])===Number(maxVal) && maxVal>0);
    const winnerText=winners.map(x=>esc(x)).join(" · ");
    return `<div class="chart-summary"><span class="metric"><b>Người trả lời:</b> ${responseDocs.length}</span>${winners.length?`<span class="metric"><b>Được chọn nhiều nhất:</b> ${winnerText} (${maxVal})${winners.length>1?" — Đồng hạng":""}</span>`:""}</div>`;
  }
  return "";
}
let __chartInstances = {};
function destroyChartByCanvas(canvasEl){
  if(!canvasEl) return;
  const key=canvasEl.id;
  if(key && __chartInstances[key]){ try{__chartInstances[key].destroy();}catch(e){} delete __chartInstances[key]; }
  try{ const existing=Chart.getChart(canvasEl); if(existing) existing.destroy(); }catch(e){}
}
function renderChart(canvasEl, question, options, responseDocs, mode){
  if(!canvasEl) return;
  const chartType=question.chartType || QUESTION_TYPES[question.type].defaultChart;
  if(chartType==="list") return;
  try{
    const agg=aggregateForChart(question,options,responseDocs);
    destroyChartByCanvas(canvasEl);
    let type="bar";
    if(chartType==="pie") type="pie";
    else if(chartType==="donut") type="doughnut";
    const opts=chartOptions(question,chartType,agg,mode||"default");
    const key=canvasEl.id || ("chart_"+Math.random().toString(36).slice(2));
    if(!canvasEl.id) canvasEl.id=key;
    __chartInstances[key]=new Chart(canvasEl,{type,data:agg,options:opts,plugins:[percentLabelsPlugin]});
  }catch(e){
    console.warn("Không thể vẽ biểu đồ:",e);
    if(canvasEl.parentElement && !canvasEl.parentElement.querySelector(".chart-error")){
      canvasEl.parentElement.insertAdjacentHTML("beforeend",`<p class="hint chart-error">Không thể tải biểu đồ. Vui lòng tải lại trang.</p>`);
    }
  }
}
function renderAggregateChart(canvasEl, question, aggData, chartType, mode){
  if(!canvasEl || !aggData) return;
  try{
    destroyChartByCanvas(canvasEl);
    let type="bar";
    if(chartType==="pie") type="pie";
    else if(chartType==="donut") type="doughnut";
    const opts=chartOptions(question,chartType,aggData,mode||"default");
    const key=canvasEl.id || ("chart_"+Math.random().toString(36).slice(2));
    if(!canvasEl.id) canvasEl.id=key;
    __chartInstances[key]=new Chart(canvasEl,{type,data:aggData,options:opts,plugins:[percentLabelsPlugin]});
  }catch(e){ console.warn("Không thể vẽ biểu đồ tổng hợp:",e); }
}

/* ============================================================

function studentJoinUrl(session, sessionId){
  // FIX 8: liên kết QR chỉ chứa accessToken (chuỗi ngẫu nhiên mật mã học, 28 ký tự) —
  // KHÔNG nhúng sessionId trực tiếp. Trình duyệt học viên phải GET đúng
  // sessionTokens/{token} (không được LIST) mới suy ra được sessionId thật.
  return `${APP_BASE_URL}?mode=student&t=${encodeURIComponent(session.accessToken)}`;
}
function showQrModal(session, sessionId, displayTitle){
  // Gate 1B.2C-T: displayTitle is always caller-resolved (teacherLiveControl already resolved
  // displaySemantics before this is reachable) — never read session.title directly here, or a
  // contract session's QR modal would silently show the frozen root title again.
  const url = studentJoinUrl(session, sessionId);
  const vm = qrModalViewModel(session, displayTitle);
  openModal(`
    <h3>Mã QR tham gia</h3>

    <div class="field"><input type="text" id="qrLinkText" readonly value="${esc(url)}"></div>
    <div class="flex gap-8" style="justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-outline" id="btnCopyLink">Copy liên kết</button>
      <button class="btn btn-outline" id="btnDownloadQr">Tải PNG</button>
      <button class="btn btn-ghost" id="btnCloseQr">Đóng</button>
    </div>`, true);
  new QRCode(document.getElementById("qrHolder"), { text:url, width:220, height:220, colorDark:"#0b2530", colorLight:"#ffffff" });
  $("#btnCloseQr").onclick = closeModal;
  $("#btnCopyLink").onclick = async ()=>{ try{ await navigator.clipboard.writeText(url); toast("Đã copy liên kết tham gia.","ok"); }catch(e){ $("#qrLinkText").select(); document.execCommand("copy"); toast("Đã copy liên kết.","ok"); } };
  $("#btnDownloadQr").onclick = ()=>{
    setTimeout(()=>{

      if(canvas){ a.href = canvas.toDataURL("image/png"); }
      else{ const img = holder.querySelector("img"); a.href = img.src; }
      a.download = "QR-"+(session.shortCode||"session")+".png";
      a.click();
    }, 100);
  };
}

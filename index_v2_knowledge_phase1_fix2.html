<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="10;url=/">
<meta name="robots" content="noindex, nofollow">
<title>Trang đã ngừng sử dụng — HCMA2 Teaching</title>
<style>
  :root{ --brand:#1a4d8f; --text:#1f2937; --mut:#6b7280; --border:#e2e8f0; --bg:#f8fafc; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .card{
    max-width:480px; width:100%; background:#fff; border:1px solid var(--border); border-radius:16px;
    padding:32px 28px; text-align:center; box-shadow:0 8px 30px rgba(15,23,42,.08);
  }
  .ic{font-size:40px; margin-bottom:8px;}
  h1{font-size:19px; margin:0 0 10px;}
  p{font-size:14.5px; line-height:1.6; color:var(--mut); margin:0 0 20px;}
  a.btn{
    display:inline-block; background:var(--brand); color:#fff; text-decoration:none;
    font-weight:600; font-size:14.5px; padding:12px 26px; border-radius:10px;
  }
  a.btn:hover{opacity:.92;}
  .note{margin-top:16px; font-size:12.5px; color:#94a3b8;}
</style>
</head>
<body>
  <div class="card">
    <div class="ic">🗂️</div>
    <h1>Phiên bản trang này đã ngừng sử dụng</h1>
    <p>Trang này thuộc một phiên bản cũ của HCMA2 Teaching và không còn được duy trì. Vui lòng chuyển sang trang chính để tiếp tục sử dụng.</p>
    <a class="btn" href="/">VỀ TRANG CHÍNH HCMA2 TEACHING</a>
    <p class="note" id="countdownNote">Tự động chuyển sau <span id="countdownSec">10</span> giây…</p>
  </div>
  <script>
    (function(){
      var el = document.getElementById("countdownSec");
      var n = 10;
      var t = setInterval(function(){
        n -= 1;
        if (n <= 0) { clearInterval(t); return; }
        if (el) el.textContent = String(n);
      }, 1000);
    })();
  </script>
</body>
</html>
